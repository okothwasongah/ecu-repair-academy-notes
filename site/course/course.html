mmunication appears to work.</p>", "quiz": [{"q": "With the battery disconnected, a measurement across CAN-H and CAN-L of a high-speed powertrain bus reads 120 Ω. This indicates:", "options": [{"k": "A", "t": "The bus is healthy"}, {"k": "B", "t": "CAN-H is shorted to CAN-L"}, {"k": "C", "t": "One terminating resistor is missing or the backbone is open between the two terminators"}, {"k": "D", "t": "An additional terminator has been fitted"}], "answer": "C", "why": "Two 120 Ω terminators in parallel give 60 Ω. Reading 120 Ω means the meter sees only one of them — either the other terminator has gone open, or the backbone between them is broken."}, {"q": "At idle on a healthy high-speed CAN bus, CAN-H and CAN-L should read approximately:", "options": [{"k": "A", "t": "0 V and 5 V"}, {"k": "B", "t": "2.5 V and 2.5 V"}, {"k": "C", "t": "3.5 V and 1.5 V"}, {"k": "D", "t": "12 V and 0 V"}], "answer": "B", "why": "In the recessive/idle state both lines sit at approximately 2.5 V, giving near-zero differential. 3.5 V / 1.5 V is the dominant state, not idle."}, {"q": "A module has entered bus-off. This means:", "options": [{"k": "A", "t": "The module has failed and must be replaced"}, {"k": "B", "t": "The module's error counter exceeded its limit and it stopped transmitting to protect the bus; it may be entirely healthy"}, {"k": "C", "t": "The module has lost its ground"}, {"k": "D", "t": "The module has been coded out of the vehicle"}], "answer": "B", "why": "Bus-off is a protective state entered when the transmit error counter exceeds its threshold. The module is often perfectly healthy and returns after the wiring fault is repaired and power is cycled. Replacing it without repairing the wiring means the new module also goes bus-off."}, {"q": "In CAN arbitration, when two nodes transmit simultaneously:", "options": [{"k": "A", "t": "Both messages are destroyed and retransmitted"}, {"k": "B", "t": "The node with the higher identifier value wins"}, {"k": "C", "t": "The node with the lower identifier value wins and transmits without interruption"}, {"k": "D", "t": "The gateway decides which message proceeds"}], "answer": "C", "why": "CAN uses non-destructive bitwise arbitration. Dominant bits override recessive ones, so the lower identifier wins and its transmission continues uninterrupted. The loser backs off and retries."}, {"q": "A LIN bus scope capture shows the master's break and sync fields but no slave response. The most likely conclusion is:", "options": [{"k": "A", "t": "The master module has failed"}, {"k": "B", "t": "The bus wire is shorted to ground"}, {"k": "C", "t": "The addressed slave did not answer — check its supply, ground, and the slave itself"}, {"k": "D", "t": "The LIN bus has lost its termination resistor"}], "answer": "C", "why": "LIN is master–slave with no arbitration. The presence of a correct break and sync field proves the master is functioning and the wire is capable of carrying the master's signal. A missing response points at the addressed slave, its supply or its ground. LIN has no bus terminator in the CAN sense."}], "search": " Module 3 — Automotive Multiplexing & Communication Networks Hours: 60 (24 lecture / 36 workshop) Prerequisite: Modules 1 and 2 practicals signed off. 1. Module overview & learning objectives A modern vehicle has 20–120 control modules sharing sensor data over a handful of twisted pairs. When that sharing breaks, the fault presentation is spectacular and misleading: dozens of codes, multiple warning lamps, and no single component at fault. This module trains the student to treat the network as a measurable circuit rather than a mystery. By the end of the module the student can: 3.1 Explain the physical and data-link behaviour of CAN, LIN, FlexRay, MOST and automotive Ethernet. 3.2 Draw a vehicle's network topology from the OEM diagram, identifying every gateway, terminator and sub-bus. 3.3 Measure bus health: termination resistance, idle voltages, signal levels and waveform quality. 3.4 Distinguish short-to-ground, short-to-power, wire-to-wire short, open circuit and a single node babbling. 3.5 Decode a CAN frame from a scope capture by hand, and identify a transmitting node by elimination. 2. Comprehensive theory & lecture notes 2.1 Why multiplexing exists A 1985 vehicle with 40 loads needed 40+ wires from the dash. A modern one carries engine speed once on the bus and every module that needs it reads it there. The result: less copper, less weight, fewer connections — but a single point of failure that affects everything. Key consequence for diagnosis: on a multiplexed vehicle, the number of codes is not proportional to the number of faults. A single shorted CAN wire can produce 60 codes across 15 modules. The technician's job is to find the one physical fault, not to investigate 60 codes. 2.2 CAN — Controller Area Network Fundamentals: - Differential signalling over a twisted pair, CAN-H and CAN-L . - Multi-master, message-based. There are no addresses in the classical sense — each frame carries an identifier describing the content , and every node decides whether it cares. - Non-destructive bitwise arbitration: if two nodes transmit at once, the one sending the lower identifier value wins and continues without corruption. The loser retries. Lower ID = higher priority. - Dominant/recessive logic: a dominant bit (logical 0) always overrides a recessive bit (logical 1). This is why arbitration works and why a node stuck sending dominant bits (\"babbling idiot\") kills the whole bus. Voltage levels — high-speed CAN (ISO 11898-2): State CAN-H CAN-L Differential Recessive (idle, logical 1) 2.5 V 2.5 V ~0 V Dominant (logical 0) 3.5 V 1.5 V ~2 V Bit rate: typically 500 kbit/s for powertrain, 250 kbit/s on some commercial/J1939, up to 1 Mbit/s. Voltage levels — low-speed / fault-tolerant CAN (ISO 11898-3): State CAN-H CAN-L Recessive 0 V 5 V Dominant 3.6 V 1.4 V Bit rate up to 125 kbit/s. Used for comfort/body networks. Fault-tolerant means it deliberately continues operating single-wire if one line fails — so the vehicle still works and the customer's only clue is a warning lamp. This is why measuring a comfort bus that \"seems to work\" still finds faults. Single-wire CAN (GMLAN, SAE J2411): one wire, ground return, 33.3 kbit/s normal and 83.3 kbit/s in high-speed wake mode. Idle 0 V, dominant approximately 4 V (up to ~12 V in wake mode). Used extensively on GM body electronics. CAN FD — Flexible Data-rate. Same physical layer concept, but the data phase switches to a higher bit rate (2–8 Mbit/s) and the payload grows from 8 to 64 bytes . Increasingly standard on vehicles from about 2019 onward. A classic CAN tool on a CAN FD bus may see nothing or may see errors — check tool capability before condemning a vehicle's bus. Termination: each end of a high-speed CAN backbone carries a 120 Ω resistor. Two in parallel measure 60 Ω across CAN-H and CAN-L with the ignition off and battery disconnected. This is the single most useful number in the module. Measured resistance Interpretation ~60 Ω Both terminators present — bus wiring likely intact ~120 Ω One terminator missing or open circuit in the backbone between them ~40 Ω An extra terminator present — often an incorrectly retrofitted or wrongly-specified module <1 Ω CAN-H shorted to CAN-L Open / very high Break in the backbone at the measurement point, or measuring an unterminated sub-bus Note carefully: low-speed/fault-tolerant CAN is not terminated at 60 Ω. Each node carries its own termination (typically 1–10 kΩ), and the measured value depends on how many nodes are connected. Applying the 60 Ω rule to a comfort bus produces a false diagnosis. Always establish which bus you are on first. CAN frame structure (standard 11-bit): Field Bits Purpose SOF 1 Start of frame, dominant Identifier 11 (or 29 extended) Message ID and priority RTR 1 Remote transmission request IDE 1 Standard or extended identifier r0 1 Reserved DLC 4 Data length code, 0–8 bytes Data 0–64 Payload CRC 15 + delimiter Error checking ACK 2 Acknowledge slot and delimiter EOF 7 End of frame, recessive IFS 3 Inter-frame space Bit stuffing: after five identical consecutive bits, the transmitter inserts one opposite bit to maintain synchronisation. When decoding a capture by hand, students must remove stuffed bits — forgetting this is the usual reason a hand-decode fails. Error handling and bus-off: each node keeps transmit and receive error counters. At an error count of 128 the node goes error passive ; at 256 it goes bus-off and stops transmitting entirely. This is important in the workshop: a node that has taken itself off the bus is silent, appears dead, and may be perfectly healthy — it has protected itself from a wiring fault. Repair the wiring, clear the counters by cycling power, and the \"dead\" module returns. Replacing it changes nothing. 2.3 LIN — Local Interconnect Network (ISO 17987) Single wire , ground return, 12 V logic. Recessive ≈ battery voltage, dominant ≈ 0 V. 1–20 kbit/s , typically 9,600 or 19,200 bit/s. Master–slave with no arbitration. One master polls; slaves answer only when addressed. Up to 16 slaves typically. Used for cheap, slow devices: mirrors, seat modules, rain/light sensors, HVAC flap motors, alternator regulators, some smart fan controllers, trailer modules. A LIN sub-bus normally hangs off a module that is itself a CAN node — so a LIN fault appears as a CAN-visible code from the master module. Diagnostic reality: most LIN faults are supply, ground, or the slave itself. Scope the single wire — you should see the master's break/sync field followed by the slave's response. A response frame that is missing tells you the slave did not answer ; a frame present but with implausible data tells you the slave answered wrongly. These are different faults. 2.4 FlexRay Time-triggered, deterministic — every message has a guaranteed slot in a repeating cycle. Unlike CAN, timing is not priority-dependent. Up to 10 Mbit/s per channel , typically dual-channel for redundancy. Used for chassis-critical systems: active suspension, active steering, some brake and driver-assist systems, primarily on premium German platforms. Levels are differential around a 2.5 V idle, but the signalling is faster and lower-amplitude than CAN — a standard CAN decode setting will not read it. Practical teaching point: FlexRay nodes are time-synchronised. Replacing a node usually requires coding and network re-synchronisation, and the network will not simply \"start working\" after a swap. Follow the OEM procedure. 2.5 MOST — Media Oriented Systems Transport Ring topology , historically plastic optical fibre (MOST25/50), later coax (MOST150). Carries infotainment audio/video: head unit, amplifier, changer, telephone, navigation. Critical property: a ring. One broken link stops the entire ring. One failed amplifier, one disconnected fibre, or one module that fails to wake and the whole infotainment system is dead with no obvious culprit. Diagnosis: OEM tools provide a ring break diagnosis that reports which node last passed light. Manually, the fibre can be checked with an optical test — but never look into the end of a fibre, and never bend a plastic fibre beyond its minimum radius (typically 25 mm), because a kinked fibre attenuates and produces an intermittent that returns after refitting trim. Common real cause: a module removed for another repair and refitted with the fibre connector's two halves reversed, or a fibre pinched under a seat rail. 2.6 Automotive Ethernet 100BASE-T1 / 1000BASE-T1 — a single unshielded twisted pair, full duplex, differential. Used for camera systems, ADAS, high-bandwidth backbones and DoIP (ISO 13400) diagnostics. OBD pins 3 and 11 are commonly used for DoIP on vehicles that support it. Cannot be measured meaningfully with a DMM or an ordinary scope decode; requires a media converter or the OEM tool. Practical point for the workshop: on a DoIP vehicle, a generic OBD tool that only speaks CAN may reach the gateway but be unable to reach modules that sit behind an Ethernet backbone. The vehicle is not faulty; the tool is inadequate. 2.7 Gateways and topology A gateway module joins networks running at different speeds and protocols, translating and filtering traffic. It is typically the busiest and most heat-stressed module in the vehicle and it usually also hosts the diagnostic connection. Consequences for diagnosis: - If the gateway fails, no module is reachable through the OBD port, and the vehicle appears to have lost every module simultaneously. Before condemning a gateway, verify its supply, its grounds, and its wake input. - A gateway can be reachable while a sub-bus behind it is dead. The tool reports \"no communication with module X\" while all other modules answer — that pattern points at the sub-bus, not at X. - Many vehicles have a security gateway (SGW) that blocks bidirectional functions from unauthorised tools. Not a fault. It requires registered tool credentials. Topology mapping exercise — every student must do this on a real vehicle: 1. Obtain the OEM network diagram. 2. Draw each bus as a line, with its speed and type labelled. 3. Place every module on its bus. 4. Mark both terminating resistors on each high-speed bus and note which modules physically contain them. 5. Mark the gateway(s) and which OBD pins reach which bus. 6. Mark connector and splice locations physically on the vehicle. Once this drawing exists, \"which modules are missing from the scan report\" becomes a map-reading exercise, and the fault location is usually obvious. 2.8 Bus fault types and their signatures Fault CAN-H idle CAN-L idle Termination reading Communication Healthy 2.5 V 2.5 V 60 Ω Normal CAN-H short to ground 0 V 2.5 V (or 0 V) Varies Total loss on HS-CAN CAN-L short to ground 2.5 V 0 V Varies May limp on some transceivers CAN-H short to battery 12 V 2.5 V Varies Total loss; risk of transceiver damage CAN-H shorted to CAN-L ~2.5 V both, no separation <1 Ω Total loss One terminator open 2.5 V 2.5 V 120 Ω Often works, with reflections and intermittent errors Break in backbone Normal one side Normal one side 120 Ω each side Modules on one side missing Babbling node Waveform continuously dominant or malformed 60 Ω Total loss; bus busy with garbage Node bus-off Normal Normal 60 Ω Only that node missing The reflection point matters. An open terminator often produces a bus that works most of the time and throws intermittent communication errors under temperature or vibration. On the scope, look for ringing on the edges — overshoot and oscillation after each transition. A properly terminated bus has clean, damped edges. 3. Tools & equipment needed 4-channel oscilloscope with CAN and LIN serial decode Breakout box for the OBD-II connector, with individual pin access DMM for termination resistance and idle voltages CAN logging interface (PCAN-USB, Kvaser, Komodo) with logging software OEM wiring and topology diagrams Bus fault simulator trainer board (switchable short-to-ground, short-to-power, open, missing terminator, babbling node) 120 Ω precision resistor and test leads for substitution testing LIN-capable scope leads and a known-good LIN slave for comparison 4. Step-by-step practical lab exercise Lab 3.1 — Locate a CAN backbone fault by halving Scenario: Multiple warning lamps illuminated. Scan tool reports no communication with four modules; six others respond. Dozens of U-codes stored. Do not clear the codes. The pattern of which modules are missing is the primary evidence. Draw the topology from the OEM diagram and mark the four missing modules on it. Ask: do they share a bus? Do they sit on the same side of a splice or connector? This alone frequently identifies the section. Measure termination resistance at the OBD connector, ignition off, battery disconnected (an energised bus gives a meaningless reading and can damage the meter). Pins 6 (CAN-H) and 14 (CAN-L) on a standard J1962 connector. - 60 Ω → both terminators present; suspect an open in a branch, not the backbone. - 120 Ω → open backbone between terminators, or one terminator lost. - <1 Ω → wire-to-wire short. Reconnect the battery, ignition on, scope both lines referenced to battery negative. - Confirm idle levels (2.5 V / 2.5 V) and dominant excursion (3.5 V / 1.5 V). - Look at edge quality. Ringing indicates a termination or stub-length problem. - A line pinned at 0 V or 12 V identifies the fault type immediately. Halve the network. Disconnect the connector nearest the physical midpoint of the suspect section. Re-measure termination on each half. - The half that now reads 120 Ω contains a terminator and is intact to it. - The half reading open contains the break. Repeat halving within the failing half until you are between two adjacent connectors, then inspect that harness section physically — flex points, chafe against brackets, water at bulkhead grommets, and rodent damage are the four common findings. If resistance is correct but a module is still missing: disconnect that module and re-measure. If the bus recovers fully and other modules return, that node was pulling the bus down. If nothing changes, the module's own supply, ground and wake line are the next checks (Module 5 territory). Verify. With the repair made, confirm 60 Ω, confirm clean waveform edges, confirm all modules present, clear codes, and re-scan after a full sleep/wake cycle. Codes that return after a sleep cycle indicate the fault is not fully resolved. Lab 3.2 — Hand-decode a CAN frame from a scope capture Scope CAN-H, single-shot trigger on the falling edge, timebase set so one frame fills the screen. Capture a frame at a known 500 kbit/s. Confirm bit time: 1 / 500,000 = 2 µs per bit . Using cursors, mark each 2 µs interval across the frame and write the bit sequence. Identify the SOF — the first dominant bit after idle. Read the next 11 bits as the identifier, MSB first. Convert to hex. Read RTR, IDE, r0 , then the 4-bit DLC . Convert DLC to the number of data bytes. Read that number of bytes of data. Remove stuffed bits — after any five consecutive identical bits, discard the following bit before continuing to interpret. Students who skip this get a corrupted DLC and give up. Cross-check the decoded identifier against the scope's automatic serial decode. They must agree. If they do not, find your error — the exercise is complete only when the hand-decode matches. Identify the transmitting node by elimination: with a logger running and filtering on that identifier, disconnect modules one at a time. The identifier that disappears when module X is unplugged is transmitted by module X. Record it. Over time the class builds a per-vehicle identifier map, which is real diagnostic capital. 5. Common failure modes & troubleshooting trees Tree A — No communication with any module Tool cannot reach anything ├─ Is the OBD connector itself powered? Pin 16 = battery +, pins 4 and 5 = grounds │ ├─ No power → check the OBD connector fuse. Extremely common and often │ │ caused by an aftermarket accessory or tracker on that circuit. │ └─ Power good → continue ├─ Termination resistance across pins 6 and 14, battery disconnected │ ├─ <1 Ω → CAN-H/CAN-L short. Halve the harness. │ ├─ Open → backbone break near the connector, or this vehicle │ │ does not route CAN to those pins (check the protocol — │ │ could be K-line, J1850, or DoIP on pins 3/11) │ ├─ 120 Ω → one terminator or one section lost │ └─ 60 Ω → wiring likely fine; suspect gateway ├─ Gateway module supply, grounds and wake input verified? │ ├─ Any fault → repair and retest before condemning │ └─ All good, still nothing → gateway failure is now a supported conclusion └─ Does another tool reach it? A DoIP or CAN-FD vehicle with a legacy tool is a tool limitation, not a vehicle fault. Confirm before further work. Tree B — Some modules missing, others present Partial communication loss ├─ Plot the missing modules on the topology drawing FIRST ├─ Are all missing modules on one sub-bus? │ ├─ YES → the sub-bus or its gateway branch is the fault. │ │ Measure that bus directly at a module connector, not at OBD. │ └─ NO → continue ├─ Are all missing modules downstream of one connector or splice? │ ├─ YES → inspect that connector. Water and corrosion are the usual finding. │ └─ NO → continue ├─ Is only ONE module missing? │ ├─ Check its power feeds and grounds (there are usually several) │ ├─ Check its wake/ignition input │ ├─ Measure the CAN pair at ITS connector — signal present? │ │ ├─ Signal present, module silent → module bus-off or failed. │ │ │ Cycle power to reset error counters before condemning. │ │ └─ No signal at the module → branch wiring open └─ Do missing modules return after a sleep/wake cycle? → intermittent; suspect marginal termination, reflection, or a partially broken conductor Tree C — Intermittent communication errors, no permanent loss Intermittent U-codes ├─ Termination reading exactly 60 Ω? → if 120 Ω, a terminator has been lost │ and the bus is running on reflections. This is THE classic cause. ├─ Scope edge quality → ringing/overshoot = termination or excessive stub length ├─ Charging system AC ripple > 0.5 V? → alternator diode failure upsets │ every transceiver on the vehicle ├─ Aftermarket device fitted? → trackers, alarms, dashcams and │ parking sensors spliced into CAN are a leading cause. Remove and retest. ├─ Correlates with temperature or vibration? → partially broken conductor │ or a cracked solder joint at a module's bus connector └─ Correlates with one function being used? → the node performing that function is likely the disturber. Log the bus during the trigger event. Frequently seen real-world failures Failure Symptom Confirming measurement Aftermarket tracker/alarm spliced into CAN Random U-codes after \"an install\" Remove device, retest; inspect for T-taps Water in a bulkhead or door connector Multiple modules missing, worse in rain Visual + termination halving Lost terminator Intermittent comms, works most of the time 120 Ω instead of 60 Ω; ringing edges Module bus-off after a wiring fault One module dead, tests fine on the bench Recovers after wiring repair + power cycle MOST fibre pinched or reversed Total infotainment loss after trim removal Ring break diagnosis; visual fibre inspection Gateway supply fuse blown No comms at all, vehicle otherwise runs Power at gateway feed Tool cannot speak CAN FD / DoIP \"No communication\" on a healthy vehicle Try a second, current tool before diagnosing 6. Student knowledge check Practical scenario challenges Scenario 1 — Sixty codes, one fault. A vehicle arrives with the ABS, traction control, airbag and power steering lamps illuminated. The scan tool reports no communication with the ABS module, the steering angle sensor and the electric power steering module, and stores 63 U-codes across the modules that do respond. The customer says a tracking device was fitted by an insurance company two weeks ago. Task: State the order of your first four actions and justify each. Explain why clearing the codes at the start would be a mistake, and explain the significance of exactly which three modules are missing. Scenario 2 — The intermittent that returns after a road test. A vehicle throws intermittent communication faults. All modules are present at the time of inspection. Termination resistance measures 120 Ω. The previous garage found no fault because \"everything communicates\". Task: Explain what the 120 Ω reading means and why the vehicle still communicates despite it. Describe how you would locate the missing terminator, and explain what you would expect to see on the oscilloscope that confirms the diagnosis. 7. Answer key Scenario 1 model answer. Action 1 — Record and preserve the fault pattern. Save a full system scan report listing precisely which modules respond and which do not, before touching anything. The pattern is the primary diagnostic evidence and it is destroyed by clearing. Action 2 — Plot the three missing modules on the vehicle's topology drawing. ABS, steering angle sensor and EPS are chassis-domain modules. If all three share one sub-bus or all three sit beyond one splice or connector, the physical fault location is already narrowed to a single harness section. If they are spread across different buses, the answer is a gateway or a power/ground distribution shared by all three. Action 3 — Inspect the tracker installation. A device fitted two weeks before the fault appeared, spliced into a vehicle harness, is the highest-probability cause on the vehicle. Look specifically for T-taps or scotchlok connectors on CAN pairs, for a power tap into a chassis-domain feed, and for the harness being pinched or rerouted during the install. Disconnect the device entirely and retest. Action 4 — Measure termination resistance and scope the bus at a module connector in the affected domain, battery disconnected for the resistance measurement. This tells you whether the fault is a short, an open, or a node problem, and separates a wiring fault from a module fault. Why clearing codes first is a mistake: the U-code set and the freeze-frame timestamps show which modules lost which partners and when. Clearing throws away the map of the fault. It also produces a false sense of resolution if the fault is intermittent — the lamps go out and the vehicle is returned to the customer unrepaired. Significance of those three modules: they are functionally related and almost certainly share a chassis sub-bus or a common feed. Three related modules missing while ten unrelated ones respond points to a single physical fault on one branch — not to three failed modules. The airbag and traction lamps are consequences: those systems illuminate because they have lost the data they depend on, not because they are faulty. Scenario 2 model answer. What 120 Ω means: the meter is seeing one terminating resistor instead of two in parallel. Either one terminator has gone open circuit, or the backbone is broken between the two terminators so only one is reachable from the measuring point. Why the vehicle still communicates: termination exists to absorb the signal at the ends of the line. With one terminator, the differential signalling still produces valid dominant and recessive levels most of the time, so frames are usually decoded correctly. The bus is running on marginal signal integrity — it works until temperature, vibration or heavy bus load pushes a marginal frame past the error threshold, at which point nodes log errors and, occasionally, go bus-off. That is exactly the \"intermittent with nothing found\" presentation. How to locate the missing terminator: 1. From the OEM diagram, identify which two modules physically contain the terminating resistors — on most vehicles these are named, commonly the ECM at one end and a body or gateway module at the other. 2. Measure resistance across the CAN pair at each of those two modules' own connectors, module unplugged . A healthy terminator reads 120 Ω across the module's own CAN pins. The one that reads open has failed internally. 3. If both terminators read 120 Ω individually but the bus reads 120 Ω overall, the backbone between them is open. Halve the harness between the two terminating modules, re-measuring from one end, until the break is between two adjacent connectors. 4. Substitution test: temporarily fit a known 120 Ω resistor across the pair at the far end. If the bus reading returns to 60 Ω and the errors stop, the diagnosis is confirmed — but this is a test, not a repair. What the scope confirms it: an under-terminated bus shows reflections — overshoot and ringing after each dominant-to-recessive transition, with the edges failing to settle cleanly before the next bit. Compare against a known-good capture: a correctly terminated bus at 500 kbit/s shows square, damped transitions with flat tops. The ringing is the physical evidence that the signal is bouncing off an unterminated end, and it is present even while communication appears to work. ", "words": 4135}, {"id": "module-4-obd-ii-oem-diagnostics", "label": "Module 4", "title": "OBD-II & OEM diagnostics", "colour": "#E8B33A", "html": "<h1>Module 4 — Advanced On-Board Computer Diagnostics (OBD-II &amp; OEM)</h1>\n<p><strong>Hours:</strong> 60 (24 lecture / 36 workshop)\n<strong>Prerequisite:</strong> Modules 1–3 practicals signed off.</p>\n<hr />\n<h2>1. Module overview &amp; learning objectives</h2>\n<p>This is the module where most technicians in the trade stop learning, and it is the module where the difference between a code reader operator and a diagnostician is made. The core teaching is that <strong>a DTC is a report of a rejected input, not a diagnosis of a component.</strong></p>\n<p>By the end of the module the student can:</p>\n<ul>\n<li><strong>4.1</strong> Explain the OBD-II legislated scope and where it ends, and what OEM-level access adds.</li>\n<li><strong>4.2</strong> Decode any DTC structurally without a lookup table.</li>\n<li><strong>4.3</strong> Read freeze frame and reconstruct the operating conditions at the moment of failure.</li>\n<li><strong>4.4</strong> Interpret readiness monitors and explain why a monitor has not run.</li>\n<li><strong>4.5</strong> Select and defend a diagnostic strategy — code-led, symptom-led or data-led — for a given complaint.</li>\n<li><strong>4.6</strong> Use serial data critically, knowing its refresh limits and which parameters are calculated rather than measured.</li>\n</ul>\n<hr />\n<h2>2. Comprehensive theory &amp; lecture notes</h2>\n<h3>2.1 What OBD-II is and is not</h3>\n<p>OBD-II is <strong>emissions legislation</strong>, not a diagnostic system. Its purpose is to make the vehicle detect and report faults that would raise emissions beyond a threshold, and to make that report readable by any tool through a standard connector.</p>\n<p>Consequences that students must internalise:\n- OBD-II covers powertrain and emissions. It does <strong>not</strong> cover ABS, SRS, body, HVAC, transmission internals (beyond emissions relevance), or comfort systems. Those need OEM-level or enhanced access.\n- Generic OBD-II gives a <strong>subset</strong> of the ECU's own data. The ECU may have 400 parameters; generic mode 1 exposes perhaps 60.\n- Manufacturers implement well beyond the legislated minimum. <strong>The same physical fault produces a different code on different brands</strong>, which is why brand-specific documentation matters.</p>\n<p><strong>J1962 connector pinout (standard 16-pin):</strong></p>\n<table>\n<thead>\n<tr>\n<th>Pin</th>\n<th>Function</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2</td>\n<td>J1850 PWM/VPW bus +</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Manufacturer discretionary / DoIP Ethernet TX+</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Chassis ground</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Signal ground</td>\n</tr>\n<tr>\n<td>6</td>\n<td><strong>CAN-H (ISO 15765-4)</strong></td>\n</tr>\n<tr>\n<td>7</td>\n<td>K-line (ISO 9141-2 / KWP2000)</td>\n</tr>\n<tr>\n<td>10</td>\n<td>J1850 PWM bus −</td>\n</tr>\n<tr>\n<td>11</td>\n<td>Manufacturer discretionary / DoIP Ethernet TX−</td>\n</tr>\n<tr>\n<td>14</td>\n<td><strong>CAN-L (ISO 15765-4)</strong></td>\n</tr>\n<tr>\n<td>15</td>\n<td>L-line (ISO 9141-2)</td>\n</tr>\n<tr>\n<td>16</td>\n<td>Battery positive, permanent</td>\n</tr>\n</tbody>\n</table>\n<p>Practical use: which pins are populated tells you which protocols the vehicle supports before you plug anything in.</p>\n<h3>2.2 OBD-II service modes (SAE J1979)</h3>\n<table>\n<thead>\n<tr>\n<th>Mode</th>\n<th>Function</th>\n<th>Workshop value</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>01</td>\n<td>Current powertrain data (PIDs)</td>\n<td>Live data</td>\n</tr>\n<tr>\n<td>02</td>\n<td>Freeze frame data</td>\n<td>Conditions at the moment the code set</td>\n</tr>\n<tr>\n<td>03</td>\n<td>Stored (confirmed) DTCs</td>\n<td>The codes</td>\n</tr>\n<tr>\n<td>04</td>\n<td>Clear DTCs and reset monitors</td>\n<td>Use last, never first</td>\n</tr>\n<tr>\n<td>05</td>\n<td>Oxygen sensor monitoring test results</td>\n<td>Legacy, non-CAN</td>\n</tr>\n<tr>\n<td>06</td>\n<td>On-board monitoring test results</td>\n<td><strong>The most under-used mode in the trade</strong></td>\n</tr>\n<tr>\n<td>07</td>\n<td>Pending DTCs</td>\n<td>Faults seen once, not yet confirmed</td>\n</tr>\n<tr>\n<td>08</td>\n<td>On-board component control</td>\n<td>Limited actuator control</td>\n</tr>\n<tr>\n<td>09</td>\n<td>Vehicle information (VIN, calibration IDs, CVN)</td>\n<td>Confirms software level</td>\n</tr>\n<tr>\n<td>0A</td>\n<td>Permanent DTCs</td>\n<td>Cannot be cleared by tool; clear only when the monitor passes</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Mode 06 deserves particular attention.</strong> It exposes the raw test results, limits and pass/fail margins the ECU used to decide whether to set a code. A misfire monitor that is passing at 95% of its failure limit tells you a fault is developing before any lamp illuminates. Mode 06 catches the fault the customer has not yet complained about, and it is how you prove a repair actually restored margin rather than merely clearing a lamp.</p>\n<p><strong>Mode 0A — permanent codes</strong> exist specifically to prevent clearing codes before an inspection. They stay until the ECU itself runs the relevant monitor and passes it. A vehicle presented for inspection with permanent codes will fail regardless of what the tool shows.</p>\n<h3>2.3 DTC structure (SAE J2012 / ISO 15031-6)</h3>\n<p>A five-character code: <strong>one letter, four digits.</strong></p>\n<p><strong>Character 1 — system:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Letter</th>\n<th>System</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>P</strong></td>\n<td>Powertrain — engine, transmission, emissions</td>\n</tr>\n<tr>\n<td><strong>C</strong></td>\n<td>Chassis — ABS, steering, suspension</td>\n</tr>\n<tr>\n<td><strong>B</strong></td>\n<td>Body — airbag, HVAC, lighting, comfort</td>\n</tr>\n<tr>\n<td><strong>U</strong></td>\n<td>Network / communication</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Character 2 — code ownership:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Digit</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0</td>\n<td>Generic / SAE-defined, common to all manufacturers</td>\n</tr>\n<tr>\n<td>1</td>\n<td>Manufacturer-specific</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Manufacturer-specific (or SAE, depending on system letter)</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Manufacturer-specific / jointly defined</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Character 3 — subsystem (for P codes):</strong></p>\n<table>\n<thead>\n<tr>\n<th>Digit</th>\n<th>Subsystem</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Fuel and air metering</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Fuel and air metering — injector circuits</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Ignition system and misfire</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Auxiliary emission controls (EGR, EVAP, catalyst, secondary air)</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Vehicle speed, idle control, auxiliary inputs</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Computer output circuits and module communication</td>\n</tr>\n<tr>\n<td>7, 8, 9</td>\n<td>Transmission</td>\n</tr>\n<tr>\n<td>A, B, C</td>\n<td>Hybrid propulsion</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Characters 4–5</strong> — the specific fault within that subsystem.</p>\n<p>Worked decode without a book: <strong>P0301</strong> = Powertrain, SAE generic, ignition/misfire subsystem, fault 01 = misfire detected in cylinder 1. <strong>P2237</strong> = Powertrain, manufacturer-defined area, fault 237 — O2 sensor positive current control circuit open, bank 1 sensor 1.</p>\n<p><strong>Fault type suffixes</strong> (increasingly common, mainly on European vehicles using UDS): a code may be reported as e.g. <code>P0301-08</code>, where the two-digit suffix describes the failure type — 00 no sub-type, 11 short to ground, 12 short to battery, 13 open circuit, 1C voltage too high, 21 signal amplitude too low, 29 signal invalid, 62 signal compared with reference implausible. <strong>This suffix is often more useful than the code itself</strong>, because it tells you the electrical nature of the failure.</p>\n<h3>2.4 Status bits — the part everyone ignores</h3>\n<p>Every DTC carries status information the tool may or may not display:</p>\n<ul>\n<li><strong>Pending</strong> — the fault has been seen in one drive cycle but not confirmed. No MIL yet.</li>\n<li><strong>Confirmed / stored</strong> — seen in two consecutive drive cycles (typical) and the MIL is on.</li>\n<li><strong>Current / active</strong> — the fault condition is present right now.</li>\n<li><strong>History / passive / intermittent</strong> — the fault condition is not present now.</li>\n<li><strong>Test not completed this cycle</strong> — the ECU has not yet been able to run the relevant test.</li>\n</ul>\n<p><strong>Diagnostic consequence:</strong> an <em>active</em> code can be chased with a meter right now. A <em>history</em> code cannot, and attempting to means chasing something that is not happening. Students who ignore status bits waste hours measuring a healthy circuit.</p>\n<h3>2.5 Freeze frame</h3>\n<p>When a code sets, the ECU stores a snapshot of operating conditions. Typically: engine speed, load, coolant temperature, fuel trims, vehicle speed, fuel system status, MAP/MAF, and often more on OEM tools.</p>\n<p><strong>How to actually use it:</strong>\n- <strong>Coolant temperature at 21 °C</strong> with the fault → a cold-start-only fault. Do not attempt to reproduce it on a warm engine.\n- <strong>Vehicle speed 0, engine speed 780</strong> → an idle fault. Road testing is pointless.\n- <strong>Load 85%, speed 110 km/h</strong> → a high-load fault. It will never appear in the workshop.\n- <strong>Fuel trims already at +25% when the code set</strong> → the code is a consequence of a pre-existing lean condition, not an independent fault. Fix the lean condition.\n- <strong>Battery voltage 10.8 V in freeze frame</strong> → every code in the vehicle may be a consequence of a cranking or charging fault.</p>\n<p>Freeze frame is the closest thing to a witness statement. Teach students to read it <strong>before</strong> reading the code definition, so the conditions shape the investigation rather than the code definition shaping it.</p>\n<h3>2.6 Readiness monitors</h3>\n<p>Monitors are the ECU's self-tests. Each is either <strong>complete</strong> (has run this cycle) or <strong>incomplete</strong>.</p>\n<p><strong>Continuous monitors</strong> (run constantly): misfire, fuel system, comprehensive components.\n<strong>Non-continuous monitors</strong> (run only under specific conditions): catalyst, heated catalyst, evaporative system, secondary air, oxygen sensor, oxygen sensor heater, EGR/VVT.</p>\n<p>Why a monitor stays incomplete:\n1. Codes were recently cleared and the drive cycle has not been completed.\n2. The enabling conditions have not been met — ambient temperature, fuel level (EVAP monitors typically need the tank between 15% and 85%), altitude, steady-speed cruise, cold soak duration.\n3. A <strong>pending fault</strong> is preventing the monitor from running.\n4. The battery was disconnected.</p>\n<p><strong>Critical inspection point:</strong> a vehicle presented for emissions testing with incomplete monitors fails, regardless of having no codes. Most jurisdictions permit one or two incomplete monitors on OBD-II vehicles; the exact allowance varies. Clearing codes immediately before an inspection guarantees failure — a lesson every workshop learns once, expensively.</p>\n<h3>2.7 Live data — its power and its limits</h3>\n<p>Serial data is the ECU's own view of the world. That is both its value and its trap.</p>\n<p><strong>What students must know:</strong></p>\n<ol>\n<li><strong>Refresh rate is limited.</strong> A tool typically updates 5–20 parameters per second, shared across everything selected. Selecting 20 PIDs slows every one of them. Transient events lasting milliseconds simply do not appear. This is why Module 2's scope work exists.</li>\n<li><strong>Some parameters are calculated, not measured.</strong> Calculated load, engine torque, and some temperature values are derived from other inputs. If an input is wrong, every derived value is wrong, and none of them is a measurement of anything.</li>\n<li><strong>A value can be plausible and still be wrong.</strong> A MAF reading 3.2 g/s at idle looks fine. Whether it is correct depends on engine displacement and speed, and must be checked against a calculated expectation, not against \"looks about right\".</li>\n<li><strong>Fuel trims are the most informative data on the vehicle.</strong>\n   - Short-term fuel trim (STFT): immediate closed-loop correction, swings continuously.\n   - Long-term fuel trim (LTFT): learned correction. <strong>This is the ECU telling you what it has been forced to compensate for.</strong>\n   - Combined trim beyond <strong>±10%</strong> deserves investigation; beyond ±25% the ECU is near its authority limit.\n   - <strong>Trim behaviour by condition is the diagnosis:</strong></li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>Trim pattern</th>\n<th>Likely cause</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Positive (lean) at idle, normal at speed</td>\n<td>Vacuum leak — its effect is proportionally larger at low airflow</td>\n</tr>\n<tr>\n<td>Positive at high load, normal at idle</td>\n<td>Fuel delivery restriction — pump, filter, injectors, pressure regulator</td>\n</tr>\n<tr>\n<td>Positive across all conditions</td>\n<td>MAF under-reading, or a large unmetered air source</td>\n</tr>\n<tr>\n<td>Negative (rich) across all conditions</td>\n<td>MAF over-reading, high fuel pressure, leaking injector</td>\n</tr>\n<tr>\n<td>Positive on one bank only</td>\n<td>Bank-specific: that bank's O2 sensor, an intake leak on that bank, or an exhaust leak upstream of that sensor</td>\n</tr>\n<tr>\n<td>Both banks equal and positive</td>\n<td>Something common to both: MAF, fuel supply, or a large intake leak</td>\n</tr>\n</tbody>\n</table>\n<p>An <strong>exhaust leak upstream of the O2 sensor</strong> draws air in during exhaust pulse reversals, the sensor reads lean, the ECU adds fuel, and trims go positive with no vacuum leak present. This is a favourite examination trap and a common real-world misdiagnosis.</p>\n<h3>2.8 OEM-level access</h3>\n<p><strong>J2534 pass-thru (SAE J2534-1/-2)</strong> is a standardised hardware API. The pass-thru box speaks the vehicle protocols; the manufacturer's own software runs on the PC and does the thinking. It exists because legislation requires manufacturers to make reprogramming available to independents.</p>\n<p>What J2534 gives you, with an OEM subscription:\n- Module reprogramming and calibration updates\n- Full-system diagnostics beyond the generic subset\n- Bidirectional actuator control\n- Coding, adaptation and variant configuration\n- Guided diagnostics on some brands</p>\n<p>What it does not give you:\n- Security-gated functions on vehicles with a security gateway, without registered credentials\n- Immobiliser and key functions on most brands without separate certification (see Module 6)\n- Anything the manufacturer has not published</p>\n<p><strong>Dealer tools</strong> (ISTA, XENTRY/DAS, ODIS, Techstream, IDS/FDRS, GDS2) add guided test plans, wiring integration, measured-value comparison and test-step documentation. Their real advantage is not access — it is the <strong>documented test plan</strong>, which is worth more than the extra data.</p>\n<p><strong>Security gateways</strong> (FCA SGW, and equivalents from other manufacturers) block bidirectional functions and clearing from unregistered tools. This is not a fault and it is not bypassed — it is registered against. Teach students to check gateway requirements before quoting a job.</p>\n<h3>2.9 Diagnostic strategy — the heart of the module</h3>\n<p>Three approaches, and the skill is choosing correctly.</p>\n<p><strong>Code-led</strong> — start from the DTC.\n- <em>Use when:</em> a single code with a clear circuit description, active status, and a symptom that matches.\n- <em>Fails when:</em> multiple codes, a history code, or a symptom that does not match the code.</p>\n<p><strong>Symptom-led</strong> — start from what the vehicle is doing.\n- <em>Use when:</em> there are no codes, or the codes do not match the complaint, or there are so many codes that the pattern is meaningless.\n- <em>Method:</em> define the symptom precisely (when, what conditions, how often), then work through the systems capable of producing it, eliminating by measurement.</p>\n<p><strong>Data-led</strong> — start from serial data and mode 06.\n- <em>Use when:</em> the fault is a performance complaint rather than a failure — poor economy, lack of power, hesitation.\n- <em>Method:</em> compare measured values against calculated expectations, and look at monitor margins rather than pass/fail.</p>\n<p><strong>The five-step structure taught here, applied to every job:</strong></p>\n<ol>\n<li><strong>Verify the complaint.</strong> Drive the vehicle. A complaint you cannot reproduce is a complaint you cannot confirm fixed. Record the exact conditions.</li>\n<li><strong>Gather without changing.</strong> Full system scan, all codes with status, all freeze frames, monitor status, calibration IDs. Save the report. <strong>Do not clear anything.</strong></li>\n<li><strong>Analyse before touching.</strong> Which codes are active and which are history? Do the freeze frames share a timestamp or a condition? Does any code explain the complaint, or are they all consequences of one upstream fault? Plot network faults on the topology drawing.</li>\n<li><strong>Test to confirm, at the point of failure.</strong> Choose a measurement that distinguishes between the remaining possibilities. Predict the reading, then take it. This is where Modules 1–3 are used.</li>\n<li><strong>Repair, then verify by re-running the ECU's own test.</strong> Clear codes, complete a drive cycle, confirm the monitor runs and passes, and confirm mode 06 margins have recovered. A cleared lamp is not a verified repair.</li>\n</ol>\n<p><strong>Rules the programme enforces:</strong>\n- Never replace a part to see what happens. If the test cannot be afforded, tell the customer that, do not guess with their money.\n- Never clear codes before recording them.\n- Check for <strong>technical service bulletins and known software updates</strong> before deep diagnosis. Many hours have been spent diagnosing a fault the manufacturer fixed with a calibration.\n- Check for <strong>aftermarket accessories</strong> on any vehicle with strange electrical or network behaviour.\n- Verify battery and charging health <strong>first</strong> on any vehicle with multi-system codes. Low or noisy supply produces codes across every module and mimics dozens of faults.</p>\n<hr />\n<h2>3. Tools &amp; equipment needed</h2>\n<ul>\n<li>Generic OBD-II scan tool (mode 06 and mode 0A capable)</li>\n<li>Enhanced multi-brand platform (Autel MaxiSys, Launch X431, Snap-on or equivalent)</li>\n<li><strong>J2534-2 pass-thru interface</strong> plus at least one OEM software subscription for teaching</li>\n<li>One brand-native dealer tool where the institution can obtain it</li>\n<li>4-channel oscilloscope (from Module 2 — data must always be checkable against measurement)</li>\n<li>Smoke machine for intake and EVAP leak testing</li>\n<li>Fuel pressure gauge and low-pressure/high-pressure test kit</li>\n<li>Battery and charging system tester</li>\n<li>Vehicle fleet with reproducible inserted faults, including at least one vacuum leak, one exhaust leak upstream of an O2 sensor, and one contaminated MAF</li>\n</ul>\n<hr />\n<h2>4. Step-by-step practical lab exercise</h2>\n<h3>Lab 4.1 — Diagnose a lean condition using trims, freeze frame and measurement</h3>\n<p><strong>Scenario:</strong> MIL on. Stored: <strong>P0171 System Too Lean, Bank 1</strong>. Customer reports a slight idle roughness and normal driving otherwise.</p>\n<ol>\n<li><strong>Verify</strong> — start the engine, confirm the roughness, and note the conditions under which it occurs.</li>\n<li><strong>Scan and record</strong> without clearing. Note whether P0171 is active or history, whether there are pending codes, and whether bank 2 also has a lean code (a single-bank code is a strong directional clue on a V engine).</li>\n<li><strong>Read freeze frame.</strong> Record engine speed, load, coolant temperature, vehicle speed and both trims at the moment of setting. Ask immediately: <em>did this set at idle or under load?</em> The answer determines the whole investigation.</li>\n<li><strong>Observe live trims</strong> at idle, at 2,500 rpm no load, and under road load. Record all three.\n   - High positive at idle, falling at 2,500 rpm → <strong>vacuum leak</strong>. Proceed to step 5.\n   - Normal at idle, rising under load → <strong>fuel delivery</strong>. Skip to step 7.\n   - Positive across all conditions → <strong>MAF or a large leak</strong>. Do both step 5 and step 6.</li>\n<li><strong>Smoke test the intake</strong> from the throttle body back, with the intake sealed. Look at the PCV system, brake booster hose, purge valve, dipstick tube seal, intake manifold gasket and any post-MAF ducting. Confirm any leak found by measuring the trim change after it is sealed.</li>\n<li><strong>Check the MAF against calculation.</strong> At idle, compare reported g/s against expectation for the engine's displacement and speed; at wide-open throttle in gear, compare peak g/s against the rule of thumb of roughly <strong>0.8 g/s per horsepower</strong> for a naturally aspirated engine. A MAF reading substantially low across the range with a clean intake is contaminated or failing. Cross-check against MAP if fitted — a MAF/MAP disagreement is definitive.</li>\n<li><strong>Check fuel delivery under load.</strong> Measure fuel pressure while driving under the conditions from freeze frame, not at idle in the workshop. A restricted filter or a weakening pump holds pressure perfectly at idle and drops it at load — which is precisely why freeze frame conditions matter.</li>\n<li><strong>Rule out an upstream exhaust leak.</strong> Inspect the manifold and the section before the bank 1 upstream sensor. A leak here makes the sensor read lean with no intake fault present. Confirm by observing whether the lean indication varies with exhaust pulse conditions, and by pressurising or smoke-testing the exhaust where facilities allow.</li>\n<li><strong>Repair the confirmed cause.</strong></li>\n<li><strong>Verify properly.</strong> Clear codes, reset trims where the tool supports it, complete a drive cycle, then confirm: trims within ±10%, the fuel system monitor has run and passed, mode 06 margins restored, and no pending codes. Report before/after trim figures to the customer.</li>\n</ol>\n<h3>Lab 4.2 — Build and apply a freeze-frame-led strategy</h3>\n<ol>\n<li>The instructor sets a fault that only occurs under one specific condition (cold start, or high load, or at idle only).</li>\n<li>Students scan, record all data, and are <strong>forbidden from opening the bonnet</strong> until step 5.</li>\n<li>From freeze frame alone, each student writes: the conditions at failure, whether the fault is reproducible in the workshop, and what three faults could produce that code under those specific conditions.</li>\n<li>Each student writes a <strong>test plan</strong>: which single measurement would distinguish between their three candidates, and what result would point to which.</li>\n<li>Students execute the test plan and record whether their prediction held.</li>\n<li>Marking: a student who reaches the right answer by inspection rather than by their written plan is marked down. A student whose plan was sound but whose candidate list missed the actual fault is marked up if their test would have revealed it anyway. <strong>The method is the assessment.</strong></li>\n</ol>\n<hr />\n<h2>5. Common failure modes &amp; troubleshooting trees</h2>\n<h3>Tree A — MIL on, single powertrain code</h3>\n<pre><code>Single P-code\n├─ Read status: active or history?\n│   ├─ HISTORY → do not chase with a meter. Read freeze frame, identify\n│   │             the conditions, and attempt to reproduce them.\n│   │             If not reproducible, fit a data logger and return the car.\n│   └─ ACTIVE → measurable now, proceed\n├─ Does the code describe a CIRCUIT (&quot;circuit open&quot;, &quot;circuit low&quot;) or a\n│   PERFORMANCE (&quot;system too lean&quot;, &quot;insufficient flow&quot;)?\n│   ├─ CIRCUIT → electrical fault. Use Module 1 and 2 methods:\n│   │             supply, ground, signal, at the component connector.\n│   │             Check the fault-type suffix if present.\n│   └─ PERFORMANCE → the circuit is intact and the ECU is unhappy with\n│                    the RESULT. The cause is usually mechanical,\n│                    fuelling or airflow, not the named component.\n├─ Check TSBs and calibration level (mode 09 CVN) before deep diagnosis\n└─ Verify battery/charging health before accepting any code as genuine\n</code></pre>\n<h3>Tree B — Many codes across many systems</h3>\n<pre><code>Multiple codes, multiple systems\n├─ Do the freeze frames share a timestamp? → single event, not many faults\n├─ Is battery voltage low in any freeze frame? → charging/battery first\n├─ Are there U-codes? → go to Module 3. Network fault produces\n│                       consequential codes in every module.\n├─ Was the vehicle recently worked on, or an accessory fitted?\n│   → inspect that work before diagnosing anything else\n├─ Do all codes trace back to one shared supply, ground or 5 V reference?\n└─ Only after all the above: treat the codes as independent faults\n</code></pre>\n<h3>Tree C — Customer complaint but no codes</h3>\n<pre><code>Symptom present, no DTCs\n├─ Define the symptom precisely: when, what speed, what temperature,\n│   how often, what makes it better or worse. Road test with the customer\n│   if the description is vague.\n├─ Check PENDING codes (mode 07) and MODE 06 margins — the fault may be\n│   detected but not yet confirmed\n├─ Check fuel trims across idle / cruise / load\n├─ Is the symptom within any monitored system at all?\n│   ├─ NO (e.g. a mechanical noise, a fuelling issue below threshold)\n│   │    → the ECU cannot see it. Measure directly with the scope,\n│   │      pressure transducer and current clamp.\n│   └─ YES → the monitor's threshold has not been crossed. Mode 06\n│            shows how close it is.\n└─ If intermittent and unreproducible → fit a logger, capture the event,\n   do not guess\n</code></pre>\n<h3>Frequently seen real-world failures</h3>\n<table>\n<thead>\n<tr>\n<th>Situation</th>\n<th>Trap</th>\n<th>Correct handling</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>P0420 catalyst efficiency</td>\n<td>Fitting a catalyst</td>\n<td>Verify O2 sensors, exhaust leaks and fuelling first — the catalyst is usually a victim</td>\n</tr>\n<tr>\n<td>P0300 random misfire</td>\n<td>Fitting plugs and coils</td>\n<td>Check trims, vacuum, compression and cam timing; random misfire is rarely ignition</td>\n</tr>\n<tr>\n<td>Lean codes on one bank</td>\n<td>Chasing the O2 sensor</td>\n<td>Check for an exhaust leak upstream of that sensor</td>\n</tr>\n<tr>\n<td>Codes return after clearing</td>\n<td>Assuming the repair failed</td>\n<td>Check whether they are permanent codes (mode 0A) awaiting a monitor pass</td>\n</tr>\n<tr>\n<td>Vehicle fails inspection, no codes</td>\n<td>Confusion</td>\n<td>Incomplete readiness monitors after a recent clear</td>\n</tr>\n<tr>\n<td>Codes across every module</td>\n<td>Assuming module failures</td>\n<td>Battery, charging ripple, or a network fault</td>\n</tr>\n<tr>\n<td>No communication on a new vehicle</td>\n<td>Assuming gateway failure</td>\n<td>Tool may lack CAN FD or DoIP support</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>6. Student knowledge check</h2>\n<h3>Practical scenario challenges</h3>\n<p><strong>Scenario 1 — The third catalyst.</strong>\nA vehicle has had two catalytic converters fitted in eight months by two different garages. P0420 returns each time within a few weeks. There are no other codes. The customer is understandably angry.\n<em>Task:</em> Explain why P0420 is being set, list the four checks that should have been done before the first catalyst was fitted, and describe how you would prove the actual root cause using data rather than parts.</p>\n<p><strong>Scenario 2 — The intermittent that only happens on the motorway.</strong>\nA vehicle stores P0301 (cylinder 1 misfire) with history status. The customer reports a brief loss of power roughly once per long journey, never in town. Nothing is reproducible in the workshop. Freeze frame shows: engine speed 2,850 rpm, calculated load 78%, coolant 92 °C, vehicle speed 118 km/h, LTFT +3%.\n<em>Task:</em> Explain what freeze frame tells you and what it rules out. State your diagnostic plan, including what you would measure, where, and how you would capture an event that will not occur on the ramp.</p>\n<hr />\n<h2>7. Answer key</h2>\n<p><strong>Scenario 1 model answer.</strong></p>\n<p><strong>Why P0420 sets:</strong> the ECU compares the rear (post-catalyst) oxygen sensor's switching activity against the front sensor's. A healthy catalyst stores and releases oxygen, so the rear sensor should sit relatively steady while the front switches rapidly. When the rear sensor begins to mirror the front, the ECU concludes the catalyst has lost storage capacity. <strong>The code is a comparison of two sensors, not a measurement of the catalyst.</strong> Anything that makes the rear sensor behave like the front — or that damages the catalyst — will set it.</p>\n<p><strong>Four checks that should have preceded the first catalyst:</strong>\n1. <strong>Both oxygen sensors' behaviour on the scope or in high-rate serial data.</strong> A lazy or slow front sensor, or a rear sensor that has become over-responsive or is reading through a leak, sets the code with a perfect catalyst. Check the front sensor's switch rate and the rear sensor's steadiness under a forced rich/lean transition.\n2. <strong>Exhaust leaks anywhere upstream of the rear sensor</strong>, especially at the manifold, flexi and any joint before the rear sensor bung. Air entering there falsifies the rear sensor reading directly.\n3. <strong>Fuel trims across idle, cruise and load.</strong> A vehicle running persistently rich destroys catalysts by overheating them. If trims are heavily negative or the vehicle has a misfire, the catalyst is being consumed by an upstream fault and every replacement will die the same way.\n4. <strong>Misfire and oil consumption history.</strong> Raw fuel or oil reaching the catalyst is the most common cause of repeat catalyst failure. Mode 06 misfire counters and a compression or leak-down check establish this.</p>\n<p><strong>Proving root cause with data:</strong>\n- Capture both O2 sensors simultaneously on the scope during a forced deceleration (fuel cut) and a snap throttle. The front sensor should swing full range rapidly; the rear should respond slowly and with reduced amplitude. If the rear tracks the front closely on a <strong>new</strong> catalyst, either the rear sensor or a leak is at fault, not the catalyst.\n- Read <strong>mode 06 catalyst monitor</strong> test values and limits before and after any change, so the margin is documented rather than guessed.\n- Record fuel trims at idle, 2,500 rpm and road load, and misfire counts per cylinder, and present these to the customer as the evidence for whatever is actually replaced next.\n- If the vehicle also consumes oil or coolant, resolve that before the third catalyst is fitted, or it will fail too.</p>\n<p><strong>Scenario 2 model answer.</strong></p>\n<p><strong>What freeze frame tells you:</strong> the misfire occurred at <strong>2,850 rpm, 78% load, 118 km/h, fully warm, with normal fuel trims</strong>. This is a sustained high-load, high-speed, hot condition.</p>\n<p><strong>What it rules out:</strong>\n- <strong>Cold-start-related faults</strong> — coolant was at 92 °C.\n- <strong>A fuelling or air-metering fault of any significance</strong> — LTFT at +3% means the ECU was not compensating for anything at the time.\n- <strong>An idle-only fault</strong> — vacuum leaks, idle control and low-speed issues are not consistent with 78% load.\n- <strong>Any workshop-reproducible condition</strong> — the fault occurs at a load and duration that a stationary engine on a ramp cannot reach.</p>\n<p><strong>Diagnostic plan:</strong></p>\n<ol>\n<li><strong>Establish whether the misfire is ignition, fuel or mechanical</strong>, since all three fail preferentially under high load. High cylinder pressure at load is exactly the condition that exposes a marginal ignition component or a weak sealing surface, all of which behave perfectly at idle.</li>\n<li><strong>Check history and mode 06</strong> for misfire counts by cylinder — whether cylinder 1 is uniquely affected or simply the worst of several. Also check for any pending codes and the number of failed drive cycles.</li>\n<li><strong>Perform a relative compression test</strong> with a current clamp on the starter (Module 2 method) and, if cylinder 1 is low, follow with a leak-down test. A valve or ring fault that seals at cranking pressure may not seal at full load.</li>\n<li><strong>Scope the ignition secondary on cylinder 1 and one healthy cylinder for comparison</strong>, ideally under load on a dynamometer or during a loaded road test. Look for a rising firing voltage and shortening burn time on cylinder 1 as load rises — the signature of a marginal ignition path or an excessive plug gap that only breaks down under pressure.</li>\n<li><strong>Check the injector on cylinder 1 by current ramp</strong> and compare against the other injectors, since a marginally restricted injector shows up under load first.</li>\n</ol>\n<p><strong>Capturing an event that will not occur on the ramp:</strong>\n- Load the engine properly: a dynamometer run reaching 78% load at 2,850 rpm, or a road test on a long uphill gradient in a high gear, with the scope recording continuously in the vehicle.\n- Configure the scope for <strong>long-duration recording with glitch capture</strong>, on ignition primary or secondary for cylinder 1, plus the crank signal so the misfiring event can be located by crank position.\n- If a single road test does not reproduce it, fit a <strong>data logger</strong> recording misfire counters, ignition parameters, load and speed, and return the vehicle to the customer for a normal long journey. Analyse the log against the moment the customer reports the power loss.\n- Do not fit parts speculatively between attempts. If the customer cannot fund a dynamometer session or a logging period, say so plainly rather than guessing with their money — and note that the freeze frame already proves the fault cannot be found any other way.</p>", "quiz": [{"q": "Decode <strong>P0442</strong> structurally. It is:", "options": [{"k": "A", "t": "A manufacturer-specific chassis code"}, {"k": "B", "t": "A generic powertrain code in the auxiliary emission controls subsystem"}, {"k": "C", "t": "A generic body code for lighting"}, {"k": "D", "t": "A network communication code"}], "answer": "B", "why": "P = powertrain; 0 = generic/SAE-defined; 4 = auxiliary emission controls; 42 = the specific fault (EVAP system leak detected, gross leak). No lookup table required to reach the system and subsystem."}, {"q": "A code is stored with \"history\" status and the fault condition is not currently present. The correct next action is:", "options": [{"k": "A", "t": "Measure the named circuit immediately with a DMM"}, {"k": "B", "t": "Replace the named component"}, {"k": "C", "t": "Read freeze frame to establish the conditions at failure and attempt to reproduce them"}, {"k": "D", "t": "Clear the code and return the vehicle"}], "answer": "C", "why": "A history code means the condition is absent now. Measuring the circuit now measures a healthy circuit and proves nothing. Freeze frame establishes the conditions under which the fault occurred, which is the only route to reproducing and confirming it."}, {"q": "Long-term fuel trim is +22% at idle and +4% at 2,500 rpm. This pattern most strongly indicates:", "options": [{"k": "A", "t": "A failing fuel pump"}, {"k": "B", "t": "A vacuum leak"}, {"k": "C", "t": "An over-reading MAF sensor"}, {"k": "D", "t": "A leaking injector"}], "answer": "B", "why": "A vacuum leak admits a roughly constant volume of unmetered air. At idle, total airflow is small, so that leak is a large proportion and the ECU must add substantial fuel. At 2,500 rpm total airflow is much greater and the same leak is proportionally trivial. A fuel delivery fault behaves the opposite way; a MAF over-reading gives negative trims."}, {"q": "A vehicle has no stored codes but fails an emissions inspection. The most likely reason is:", "options": [{"k": "A", "t": "The MIL bulb is faulty"}, {"k": "B", "t": "Readiness monitors are incomplete following a recent code clear or battery disconnection"}, {"k": "C", "t": "The ECU has been reprogrammed"}, {"k": "D", "t": "The catalyst is new"}], "answer": "B", "why": "Incomplete readiness monitors cause an inspection failure independently of DTCs. Clearing codes or disconnecting the battery resets monitors, and non-continuous monitors need specific drive conditions to complete."}, {"q": "Which OBD-II mode reveals how close a monitored system is to its failure threshold?", "options": [{"k": "A", "t": "Mode 03"}, {"k": "B", "t": "Mode 04"}, {"k": "C", "t": "Mode 06"}, {"k": "D", "t": "Mode 09"}], "answer": "C", "why": "Mode 06 reports on-board monitoring test results with values and limits, showing margin rather than a bare pass/fail. Mode 03 returns stored codes, mode 04 clears, mode 09 returns vehicle information."}], "search": " Module 4 — Advanced On-Board Computer Diagnostics (OBD-II & OEM) Hours: 60 (24 lecture / 36 workshop) Prerequisite: Modules 1–3 practicals signed off. 1. Module overview & learning objectives This is the module where most technicians in the trade stop learning, and it is the module where the difference between a code reader operator and a diagnostician is made. The core teaching is that a DTC is a report of a rejected input, not a diagnosis of a component. By the end of the module the student can: 4.1 Explain the OBD-II legislated scope and where it ends, and what OEM-level access adds. 4.2 Decode any DTC structurally without a lookup table. 4.3 Read freeze frame and reconstruct the operating conditions at the moment of failure. 4.4 Interpret readiness monitors and explain why a monitor has not run. 4.5 Select and defend a diagnostic strategy — code-led, symptom-led or data-led — for a given complaint. 4.6 Use serial data critically, knowing its refresh limits and which parameters are calculated rather than measured. 2. Comprehensive theory & lecture notes 2.1 What OBD-II is and is not OBD-II is emissions legislation , not a diagnostic system. Its purpose is to make the vehicle detect and report faults that would raise emissions beyond a threshold, and to make that report readable by any tool through a standard connector. Consequences that students must internalise: - OBD-II covers powertrain and emissions. It does not cover ABS, SRS, body, HVAC, transmission internals (beyond emissions relevance), or comfort systems. Those need OEM-level or enhanced access. - Generic OBD-II gives a subset of the ECU's own data. The ECU may have 400 parameters; generic mode 1 exposes perhaps 60. - Manufacturers implement well beyond the legislated minimum. The same physical fault produces a different code on different brands , which is why brand-specific documentation matters. J1962 connector pinout (standard 16-pin): Pin Function 2 J1850 PWM/VPW bus + 3 Manufacturer discretionary / DoIP Ethernet TX+ 4 Chassis ground 5 Signal ground 6 CAN-H (ISO 15765-4) 7 K-line (ISO 9141-2 / KWP2000) 10 J1850 PWM bus − 11 Manufacturer discretionary / DoIP Ethernet TX− 14 CAN-L (ISO 15765-4) 15 L-line (ISO 9141-2) 16 Battery positive, permanent Practical use: which pins are populated tells you which protocols the vehicle supports before you plug anything in. 2.2 OBD-II service modes (SAE J1979) Mode Function Workshop value 01 Current powertrain data (PIDs) Live data 02 Freeze frame data Conditions at the moment the code set 03 Stored (confirmed) DTCs The codes 04 Clear DTCs and reset monitors Use last, never first 05 Oxygen sensor monitoring test results Legacy, non-CAN 06 On-board monitoring test results The most under-used mode in the trade 07 Pending DTCs Faults seen once, not yet confirmed 08 On-board component control Limited actuator control 09 Vehicle information (VIN, calibration IDs, CVN) Confirms software level 0A Permanent DTCs Cannot be cleared by tool; clear only when the monitor passes Mode 06 deserves particular attention. It exposes the raw test results, limits and pass/fail margins the ECU used to decide whether to set a code. A misfire monitor that is passing at 95% of its failure limit tells you a fault is developing before any lamp illuminates. Mode 06 catches the fault the customer has not yet complained about, and it is how you prove a repair actually restored margin rather than merely clearing a lamp. Mode 0A — permanent codes exist specifically to prevent clearing codes before an inspection. They stay until the ECU itself runs the relevant monitor and passes it. A vehicle presented for inspection with permanent codes will fail regardless of what the tool shows. 2.3 DTC structure (SAE J2012 / ISO 15031-6) A five-character code: one letter, four digits. Character 1 — system: Letter System P Powertrain — engine, transmission, emissions C Chassis — ABS, steering, suspension B Body — airbag, HVAC, lighting, comfort U Network / communication Character 2 — code ownership: Digit Meaning 0 Generic / SAE-defined, common to all manufacturers 1 Manufacturer-specific 2 Manufacturer-specific (or SAE, depending on system letter) 3 Manufacturer-specific / jointly defined Character 3 — subsystem (for P codes): Digit Subsystem 1 Fuel and air metering 2 Fuel and air metering — injector circuits 3 Ignition system and misfire 4 Auxiliary emission controls (EGR, EVAP, catalyst, secondary air) 5 Vehicle speed, idle control, auxiliary inputs 6 Computer output circuits and module communication 7, 8, 9 Transmission A, B, C Hybrid propulsion Characters 4–5 — the specific fault within that subsystem. Worked decode without a book: P0301 = Powertrain, SAE generic, ignition/misfire subsystem, fault 01 = misfire detected in cylinder 1. P2237 = Powertrain, manufacturer-defined area, fault 237 — O2 sensor positive current control circuit open, bank 1 sensor 1. Fault type suffixes (increasingly common, mainly on European vehicles using UDS): a code may be reported as e.g. P0301-08 , where the two-digit suffix describes the failure type — 00 no sub-type, 11 short to ground, 12 short to battery, 13 open circuit, 1C voltage too high, 21 signal amplitude too low, 29 signal invalid, 62 signal compared with reference implausible. This suffix is often more useful than the code itself , because it tells you the electrical nature of the failure. 2.4 Status bits — the part everyone ignores Every DTC carries status information the tool may or may not display: Pending — the fault has been seen in one drive cycle but not confirmed. No MIL yet. Confirmed / stored — seen in two consecutive drive cycles (typical) and the MIL is on. Current / active — the fault condition is present right now. History / passive / intermittent — the fault condition is not present now. Test not completed this cycle — the ECU has not yet been able to run the relevant test. Diagnostic consequence: an active code can be chased with a meter right now. A history code cannot, and attempting to means chasing something that is not happening. Students who ignore status bits waste hours measuring a healthy circuit. 2.5 Freeze frame When a code sets, the ECU stores a snapshot of operating conditions. Typically: engine speed, load, coolant temperature, fuel trims, vehicle speed, fuel system status, MAP/MAF, and often more on OEM tools. How to actually use it: - Coolant temperature at 21 °C with the fault → a cold-start-only fault. Do not attempt to reproduce it on a warm engine. - Vehicle speed 0, engine speed 780 → an idle fault. Road testing is pointless. - Load 85%, speed 110 km/h → a high-load fault. It will never appear in the workshop. - Fuel trims already at +25% when the code set → the code is a consequence of a pre-existing lean condition, not an independent fault. Fix the lean condition. - Battery voltage 10.8 V in freeze frame → every code in the vehicle may be a consequence of a cranking or charging fault. Freeze frame is the closest thing to a witness statement. Teach students to read it before reading the code definition, so the conditions shape the investigation rather than the code definition shaping it. 2.6 Readiness monitors Monitors are the ECU's self-tests. Each is either complete (has run this cycle) or incomplete . Continuous monitors (run constantly): misfire, fuel system, comprehensive components. Non-continuous monitors (run only under specific conditions): catalyst, heated catalyst, evaporative system, secondary air, oxygen sensor, oxygen sensor heater, EGR/VVT. Why a monitor stays incomplete: 1. Codes were recently cleared and the drive cycle has not been completed. 2. The enabling conditions have not been met — ambient temperature, fuel level (EVAP monitors typically need the tank between 15% and 85%), altitude, steady-speed cruise, cold soak duration. 3. A pending fault is preventing the monitor from running. 4. The battery was disconnected. Critical inspection point: a vehicle presented for emissions testing with incomplete monitors fails, regardless of having no codes. Most jurisdictions permit one or two incomplete monitors on OBD-II vehicles; the exact allowance varies. Clearing codes immediately before an inspection guarantees failure — a lesson every workshop learns once, expensively. 2.7 Live data — its power and its limits Serial data is the ECU's own view of the world. That is both its value and its trap. What students must know: Refresh rate is limited. A tool typically updates 5–20 parameters per second, shared across everything selected. Selecting 20 PIDs slows every one of them. Transient events lasting milliseconds simply do not appear. This is why Module 2's scope work exists. Some parameters are calculated, not measured. Calculated load, engine torque, and some temperature values are derived from other inputs. If an input is wrong, every derived value is wrong, and none of them is a measurement of anything. A value can be plausible and still be wrong. A MAF reading 3.2 g/s at idle looks fine. Whether it is correct depends on engine displacement and speed, and must be checked against a calculated expectation, not against \"looks about right\". Fuel trims are the most informative data on the vehicle. - Short-term fuel trim (STFT): immediate closed-loop correction, swings continuously. - Long-term fuel trim (LTFT): learned correction. This is the ECU telling you what it has been forced to compensate for. - Combined trim beyond ±10% deserves investigation; beyond ±25% the ECU is near its authority limit. - Trim behaviour by condition is the diagnosis: Trim pattern Likely cause Positive (lean) at idle, normal at speed Vacuum leak — its effect is proportionally larger at low airflow Positive at high load, normal at idle Fuel delivery restriction — pump, filter, injectors, pressure regulator Positive across all conditions MAF under-reading, or a large unmetered air source Negative (rich) across all conditions MAF over-reading, high fuel pressure, leaking injector Positive on one bank only Bank-specific: that bank's O2 sensor, an intake leak on that bank, or an exhaust leak upstream of that sensor Both banks equal and positive Something common to both: MAF, fuel supply, or a large intake leak An exhaust leak upstream of the O2 sensor draws air in during exhaust pulse reversals, the sensor reads lean, the ECU adds fuel, and trims go positive with no vacuum leak present. This is a favourite examination trap and a common real-world misdiagnosis. 2.8 OEM-level access J2534 pass-thru (SAE J2534-1/-2) is a standardised hardware API. The pass-thru box speaks the vehicle protocols; the manufacturer's own software runs on the PC and does the thinking. It exists because legislation requires manufacturers to make reprogramming available to independents. What J2534 gives you, with an OEM subscription: - Module reprogramming and calibration updates - Full-system diagnostics beyond the generic subset - Bidirectional actuator control - Coding, adaptation and variant configuration - Guided diagnostics on some brands What it does not give you: - Security-gated functions on vehicles with a security gateway, without registered credentials - Immobiliser and key functions on most brands without separate certification (see Module 6) - Anything the manufacturer has not published Dealer tools (ISTA, XENTRY/DAS, ODIS, Techstream, IDS/FDRS, GDS2) add guided test plans, wiring integration, measured-value comparison and test-step documentation. Their real advantage is not access — it is the documented test plan , which is worth more than the extra data. Security gateways (FCA SGW, and equivalents from other manufacturers) block bidirectional functions and clearing from unregistered tools. This is not a fault and it is not bypassed — it is registered against. Teach students to check gateway requirements before quoting a job. 2.9 Diagnostic strategy — the heart of the module Three approaches, and the skill is choosing correctly. Code-led — start from the DTC. - Use when: a single code with a clear circuit description, active status, and a symptom that matches. - Fails when: multiple codes, a history code, or a symptom that does not match the code. Symptom-led — start from what the vehicle is doing. - Use when: there are no codes, or the codes do not match the complaint, or there are so many codes that the pattern is meaningless. - Method: define the symptom precisely (when, what conditions, how often), then work through the systems capable of producing it, eliminating by measurement. Data-led — start from serial data and mode 06. - Use when: the fault is a performance complaint rather than a failure — poor economy, lack of power, hesitation. - Method: compare measured values against calculated expectations, and look at monitor margins rather than pass/fail. The five-step structure taught here, applied to every job: Verify the complaint. Drive the vehicle. A complaint you cannot reproduce is a complaint you cannot confirm fixed. Record the exact conditions. Gather without changing. Full system scan, all codes with status, all freeze frames, monitor status, calibration IDs. Save the report. Do not clear anything. Analyse before touching. Which codes are active and which are history? Do the freeze frames share a timestamp or a condition? Does any code explain the complaint, or are they all consequences of one upstream fault? Plot network faults on the topology drawing. Test to confirm, at the point of failure. Choose a measurement that distinguishes between the remaining possibilities. Predict the reading, then take it. This is where Modules 1–3 are used. Repair, then verify by re-running the ECU's own test. Clear codes, complete a drive cycle, confirm the monitor runs and passes, and confirm mode 06 margins have recovered. A cleared lamp is not a verified repair. Rules the programme enforces: - Never replace a part to see what happens. If the test cannot be affo
