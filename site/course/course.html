rong> — to establish whether the current filter is genuinely ash-loaded or simply soot-loaded again, and to check whether wrong-specification oil has contributed.\n3. <strong>Oil level and condition</strong> — fuel dilution is near-certain after three aborted regeneration campaigns, and may be the more urgent problem.\n4. <strong>Differential pressure sensor zero and tracking</strong>, plus line patency — to be sure the loading readings are real.\n5. <strong>Root-cause checks anyway</strong> — injector back-leak, turbo shaft play and oil in the intake, EGR flow response, boost actual vs target, glow operation, and the oil specification in the service record. Duty cycle is the likely answer but it must not be assumed while a leaking injector goes unfound.</p>\n<p><strong>What I would repair:</strong> whatever the checks find — and if the oil is diluted, change it immediately regardless. If the current filter is ash-loaded, professional cleaning rather than a third replacement.</p>\n<p><strong>What I would say to the operator, honestly:</strong></p>\n<p>That the vehicle is not broken; it is the wrong vehicle for the work it is doing. A modern diesel with a DPF needs sustained running to survive, and 4 km city journeys are the exact condition it cannot cope with. Three more filters will go the same way.</p>\n<p>The realistic options, in order:\n1. <strong>Change the vehicle</strong> to a petrol, hybrid or electric taxi for this duty cycle. For a city taxi doing 60 km/day in short hops, this is the answer, and it will cost less over three years than the filter cycle they are on.\n2. <strong>Change the duty cycle</strong> — if the operator has other vehicles and routes, move this one to longer runs and put a petrol or hybrid on the city work.\n3. <strong>If the vehicle must stay</strong>, put it on a <strong>scheduled service regeneration</strong> every few weeks as a planned, priced workshop visit, plus more frequent oil changes because of dilution. This works, but it is a running cost and must be quoted as one.\n4. <strong>Deleting the filter is not on the list</strong> — it fails the next inspection, and it does not address the fuel dilution that is the more immediate threat to the engine.</p>\n<p>Say it as a straight commercial calculation. An operator who is told the truth with the numbers will usually change the vehicle, and they will come back for the rest of the fleet.</p>\n<p><strong>Scenario 2 model answer.</strong></p>\n<p>Something along these lines, said plainly and without a lecture:</p>\n<p>\"I'm not going to do it, and I'd rather tell you why than just refuse.</p>\n<p><strong>On economy</strong> — a delete does not make an engine more efficient. The DPF costs you almost nothing in normal running; a healthy filter's back-pressure is small. What actually costs fuel is the regenerations, and those are frequent because something is causing the filter to load. Fix that and the regenerations become rare, which gets you the same fuel saving without the rest of it. If your EGR is stuck open you're losing economy right now, and that is a repair, not a delete.</p>\n<p><strong>On reliability</strong> — this is the part that matters. If your DPF keeps loading, something is producing the soot: an injector, a turbo seal, an EGR valve, a duty cycle. Deleting the filter does not stop any of those. It removes the warning. The turbo carries on leaking oil until it fails properly, and it will cost far more then, without any warning light to see it coming.</p>\n<p><strong>And the practical problem</strong> — it fails the next inspection. It has to be declared to your insurer. If you sell the vehicle, the buyer's check finds it. And my name is on the work.</p>\n<p><strong>Here is what I'll do instead.</strong> Give me the vehicle for a proper diagnostic. I'll read the loading and ash figures, the regeneration history and the differential pressure, test the injectors for back-leak, check the turbo and the EGR flow, and tell you exactly w 8 — Exhaust Emissions Systems: Diagnostics, Regeneration & Repair Hours: 40 (16 lecture / 24 workshop) Prerequisite: Modules 1–4 signed off. 1. Module overview & learning objectives After-treatment is the highest-volume diagnostic work in most commercial workshops, and the most badly handled. The default trade response to a DPF light is to remove the filter or delete it in software. This module teaches the opposite discipline: a loaded DPF is a symptom, and the cause is almost always findable and fixable. A workshop that can find the cause has repeat fleet business; one that deletes has a one-off cash job and a vehicle that fails its next inspection. By the end of the module the student can: 8.1 Describe DPF, SCR, EGR and GPF/OPF architecture and control strategy. 8.2 Interpret soot and ash loading, differential pressure and regeneration counters. 8.3 Perform static and dynamic forced regeneration safely, and know when not to. 8.4 Diagnose the underlying cause of repeat loading rather than treating the filter. 8.5 Test differential pressure sensors, EGT sensors, NOx sensors, EGR valves and SCR dosing systems. 8.6 Advise a customer or fleet correctly on repair options, cost and legal position. Scope boundary This module covers diagnosis, regeneration, hardware repair, filter cleaning and restoration to correct OEM function. It does not cover writing EGR/DPF/AdBlue/lambda delete logic into ECU software or suppressing the resulting DTCs. That is defeat-device work — an offence under US Clean Air Act §203(a)(3), EU Regulation 715/2007 Art. 5(2), UK Construction & Use and MOT rules, and caught by NEMA and equivalent inspection regimes. A training centre that certified it would carry the liability for every vehicle its graduates modified. See §2.9 for the commercial case, which is the argument that actually persuades workshop owners. 2. Comprehensive theory & lecture notes 2.1 What comes out of an engine, and why Emission Formed by Controlled by CO Incomplete combustion, rich mixture Fuelling control, oxidation catalyst HC Unburnt fuel Fuelling, oxidation catalyst NOx High combustion temperature and available oxygen EGR (prevention), SCR / LNT (after-treatment) PM / soot Locally rich zones in diffusion combustion Injection strategy, DPF CO₂ Complete combustion — unavoidable Efficiency only The central tension: NOx and PM trade off. Lowering combustion temperature (more EGR) cuts NOx but raises soot. Raising temperature cuts soot but raises NOx. Every diesel calibration lives on this curve, which is why EGR and DPF exist together and why removing one destabilises the other. 2.2 Diesel after-treatment chain Typical modern layout, in order: Engine ─► DOC ─► DPF ─► SCR mixer + DEF injector ─► SCR catalyst ─► ASC ─► Tailpipe │ │ │ │ │ oxidises traps injects urea converts NOx cleans up CO/HC, soot (AdBlue/DEF) to N2 + H2O excess NH3 raises and ash NO→NO2 Some layouts combine DPF and SCR coating (SDPF/SCRF). Some older vehicles use a Lean NOx Trap (LNT) instead of SCR, which stores NOx and periodically purges it with a rich event. DOC — Diesel Oxidation Catalyst. Oxidises CO and HC, and converts NO to NO₂, which is what enables passive regeneration of the DPF at moderate temperatures. A failed DOC means passive regeneration stops working and the DPF loads faster — a very commonly missed root cause. DPF — Diesel Particulate Filter. A wall-flow monolith, usually cordierite or silicon carbide, with alternate channels plugged so exhaust must pass through the porous walls. Traps 85–99% of particulates. Two kinds of loading, and students must never confuse them: Soot Ash Source Incomplete combustion Oil additives (calcium, zinc), engine wear, fuel additives Removable by regeneration Yes — burns to CO₂ No — it is incombustible mineral residue Accumulates Cyclically Permanently, over the filter's life Remedy Regeneration Filter cleaning or replacement A filter at high ash loading cannot be fixed by regeneration. Forcing repeated regenerations on an ash-loaded filter overheats and cracks it. Read the ECU's ash loading value, not just soot, before deciding. 2.3 Regeneration strategies Type Trigger Temperature Mechanism Passive Normal driving at sustained load 250–500 °C NO₂ from the DOC oxidises soot continuously; driver never notices Active ECU-initiated at a soot threshold 550–650 °C Post-injection raises exhaust temperature to burn soot Forced/service Technician-initiated with a tool 550–650 °C Same as active, commanded manually Manual/parked Some commercial vehicles have a dash switch 550–650 °C Driver-initiated while stationary How an active regeneration is achieved: the ECU uses late post-injection, throttling on the intake, EGR closure, and turbo vane position to raise exhaust temperature. Some vehicles use a fuel dosing injector in the exhaust upstream of the DOC (common on PSA, Ford and some commercial applications) — a separate component with its own faults. Consequence of interrupted regenerations: post-injection fuel that does not fully burn washes past the rings into the sump. Oil level rising on a diesel with a DPF is a classic and dangerous sign — fuel dilution reduces viscosity, and in the worst case a diesel can run away on its own diluted sump oil. Always check oil level and condition on a vehicle with regeneration complaints, and tell the customer why. When NOT to force a regeneration: - Soot loading is extremely high (typically above the manufacturer's stated limit — often around 100% or a stated gram figure). The burn becomes uncontrolled and cracks or melts the substrate. - Ash loading is at or near the filter's life limit. - Oil level is above maximum or oil is fuel-diluted. - There is an unresolved fault causing the loading — the regeneration will succeed and the vehicle will return in a week. - Coolant, oil or fuel is entering the exhaust (failed turbo seal, injector, head gasket) — you will burn the evidence and possibly the filter. - Any active engine fault code that could compromise combustion during a high-temperature event. 2.4 Differential pressure and how the ECU estimates loading The ECU determines soot loading two ways and cross-checks them: Differential pressure model. A sensor measures pressure drop across the filter. Loading correlates with restriction, corrected for exhaust volume flow and temperature. Soot accumulation model. A calculation based on engine operating history — fuelling, load, rpm, temperature — estimating how much soot should have been produced. When the two disagree, a plausibility code sets. This is diagnostically valuable: a differential pressure reading that says \"clean\" while the model says \"loaded\" points at the sensor or its lines, not at the filter. Differential pressure sensor testing: - With the engine off, both lines disconnected and open to atmosphere, the sensor must read approximately 0 kPa / 0 mbar . An offset here invalidates every subsequent reading. - At idle, expect a small value — typically 5–15 mbar on a healthy system. - At 3,000 rpm free revving, expect a significant rise. A loaded filter shows markedly higher; the manufacturer's figure governs. - The lines fail more often than the sensor. They are small-bore steel or rubber, run hot, and block with soot or split. Remove and check both are clear by blowing through them. A blocked line makes a clean filter read blocked, or vice versa. - Apply a hand vacuum/pressure pump to the sensor ports and confirm the reported value tracks the applied pressure. This is the definitive test. 2.5 EGR — Exhaust Gas Recirculation Recirculates inert exhaust gas into the intake, lowering peak combustion temperature and cutting NOx formation at source. Types: - High-pressure EGR — taken before the turbine, fed after the compressor. Fast-acting, dirtier. - Low-pressure EGR — taken after the DPF, fed before the compressor. Cleaner gas, slower response, common on modern Euro 6. - Cooled EGR — with a heat exchanger, standard on modern engines. Failure modes: | Failur tem flushing and often component replacement. - Legislation requires an escalating inducement strategy : warnings, then torque reduction, then a speed limit (commonly 20 km/h), then a no-restart condition. This is deliberate, is required by regulation, and cannot be resolved by clearing codes. Common faults: | Fault | Cause | |---|---| | Dosing injector blocked | Crystallisation | | Quality sensor fault | Degraded, diluted or contaminated DEF | | Pump pressure low | Filter blocked, pump wear, line restriction | | Line frozen / heater fault | Heater circuit, relay or coolant valve fault in cold conditions | | NOx sensor fault | Sensor failure (they are consumables), or a genuine conversion failure | | Conversion efficiency below threshold | Aged catalyst, insufficient dosing, upstream engine fault, or a NOx sensor reading wrongly | Key teaching point: a conversion-efficiency code compares two NOx sensors. Either sensor reading wrongly produces the code with a perfectly good catalyst. Verify both sensors before condemning an SCR catalyst — the same logic as P0420 and the catalytic converter in Module 4. 2.7 GPF / OPF — petrol particulate filters Direct-injection petrol engines produce measurable particulates, so Euro 6d and equivalent standards brought filters to petrol vehicles. Differences from a DPF: - Petrol exhaust runs much hotter, so regeneration is largely passive and happens during normal driving, particularly on overrun where oxygen is available. - Loading problems appear on vehicles that only do short, cold, low-load journeys. - Oil consumption is a significant ash source, so an engine consuming oil loads its GPF permanently. - Diagnosis follows the same differential-pressure logic as a DPF. 2.8 Root cause analysis — the actual skill A DPF does not load without a reason. Before any regeneration, establish which of these applies: Root cause Evidence Duty cycle — short, cold, urban journeys Regeneration history: many aborted or interrupted regenerations; low average speed in the ECU's data Leaking or worn injector Fuel trims/correction values, injector back-leak test, black smoke, fuel in oil Turbo seal failure Oil consumption, blue smoke, oil in intercooler and intake pipework EGR stuck open Position feedback vs command, MAF response test Failed DOC Regeneration cannot reach temperature; EGT sensors show insufficient rise Failed glow system Extended cold-start smoke, especially in cold climates Boost leak / low boost Poor combustion, smoke, boost actual vs target Air filter blocked / MAF fault Airflow low against calculated expectation Wrong oil specification Non low-SAPS oil in a DPF vehicle produces ash rapidly — check the service record Aborted regenerations Driver switching off mid-regen; check regeneration counters and distance-since-last The three data points to read first on any DPF vehicle: 1. Soot loading and ash loading (separately). 2. Distance since last successful regeneration , and the count of aborted regenerations. 3. Differential pressure at idle and at raised rpm , plus the sensor's zero offset. These three tell you whether you are dealing with a driving pattern, a sensor, a mechanical fault or an end-of-life filter — before anything is removed. 2.9 The commercial case against delete work Workshop owners are persuaded by numbers, not by lectures. The honest comparison: Delete Diagnose and repair Revenue per job One payment Diagnostic + repair + follow-up Repeat business None — the customer has no further need Servicing, cleaning, fleet contract Liability Workshop named on unlawful modification None Fleet and contract work Excluded — operators cannot use you Available Payment processing At risk if the provider notices Unaffected Vehicle outcome Fails its next inspection Passes Skill built None transferable Diagnostic reputation Add to this the practical point: the underlying fault is still there. A turbo leaking oil into the exhaust does not stop leaking because the filter was removed; it carries on until it fails completely. The delete converted a repairable fault into a bigger one and removed the warning. The workshop's line to a customer asking for a delete: \"I can't do that — it's illegal and it'll fail your next inspection. What I can do is find out why it's loading, because something is causing it, and that's usually fixable for less than you think.\" Deliver that with the diagnostic data on screen and the majority of customers proceed. 3. Tools & equipment needed OEM-level or enhanced scan tool with forced regeneration capability and access to soot/ash loading, regeneration counters and dosing system tests Hand vacuum/pressure pump for differential pressure sensor testing Infrared thermometer and thermocouple set for EGT verification across the after-treatment Exhaust back-pressure gauge with an adapter for the pre-DPF port or an O2 sensor bung Extraction, or an outdoor regeneration bay — surface temperatures exceed 600 °C Fire extinguisher rated for the bay, and a clear floor Smoke machine for intake and EGR leak testing Injector back-leak test kit DEF refractometer or quality tester Filter cleaning equipment, or a relationship with a professional cleaning service Borescope for filter inspection PPE: heat-resistant gloves, eye protection, respirator for handling soot and ash — DPF ash is a respiratory hazard and must be handled wet or with extraction 4. Step-by-step practical lab exercise Lab 8.1 — Full DPF diagnosis and forced regeneration Scenario: DPF warning illuminated, vehicle in reduced power. Customer wants it \"sorted today\". Read and record before anything else: soot loading, ash loading, distance since last successful regeneration, count of aborted regenerations, differential pressure at idle, and all DTCs across all systems. Check oil level and condition. Above maximum, or smelling of fuel, means diluted oil from interrupted regenerations. If the oil is over-full with fuel dilution, change the oil before any regeneration and explain to the customer why — a runaway on diluted sump oil destroys the engine. Assess whether regeneration is safe. Against the manufacturer's stated limits: is soot loading below the maximum permitted for a service regeneration? Is ash loading within life? Any active fault that would compromise combustion? If any answer fails, do not regenerate — proceed to root cause and repair, or to filter removal and cleaning. Test the differential pressure sensor before trusting its data. Engine off, lines disconnected, confirm the zero reading. Then apply pressure with the hand pump and confirm the reported value tracks. Check both lines are clear. Verify the EGT sensors by comparing their readings at a cold start — all should read close to ambient. Any sensor significantly offset invalidates the regeneration temperature control. Hunt the root cause before regenerating. Working through §2.8: injector back-leak, turbo shaft play and oil in the intake, EGR position vs command with the MAF response test, boost actual vs target, glow system operation, air filter condition, and the service record for correct oil specification. Repair whatever is found. This step is the job. The regeneration is the finishing touch. Prepare for regeneration: outdoors or on extraction, clear floor, nothing combustible within range, fuel level above the manufacturer's minimum (usually a quarter tank), coolant level correct, extinguisher present. Run the forced regeneration following the tool's procedure. Monitor throughout: EGT before and after the DPF, engine speed, soot loading, and coolant temperature. Do not leave the vehicle. Abort immediately if EGT exceeds the manufacturer's limit, if coolant temperature rises abnormally, or if any new fault appears. On completion , confirm soot loading has fallen to near zero and the regeneration counter has incremented as a success. Road test to confirm the vehicle completes a passive or active regeneration in normal use, then rescan. Advise the customer honestly: what caused the loading, what was repaired, and — where the cause is duty cycle — what driving pattern the vehicle needs. A vehicle doing 5 km school runs will load again regardless of what the workshop does, and the customer needs to hear that as a vehicle-choice conversation, not as a repair. Lab 8.2 — SCR/AdBlue system diagnosis Record all DTCs in the engine and after-treatment systems, plus the inducement status and remaining distance/time before the next escalation step. Inspect the DEF physically. Level, colour, clarity, and smell. Test with a refractometer — it must be 32.5% urea . Check the fill date if known; DEF older than about 18 months is suspect. Inspect the tank for contamination. Any sign of diesel, oil or debris means the system requires full flushing, and the customer must be told before further work. Test the dosing injector. Command a dosing test with the tool and observe: does the pump build pressure, does the injector deliver, does pressure hold? Remove the injector and inspect for crystallisation — the most common single fault. Clean with warm water only. Check the pump module — pressure build, pressure hold, filter condition, and the reversion/purge cycle at shutdown that prevents freezing damage. Check the heating circuits. Tank heater, line heaters, coolant valve. In cold climates this is a leading cause of winter-only faults. Test both NOx sensors. Compare their readings at cold start — both should read close to zero, and close to each other. Then compare their behaviour under load. A sensor that is offset or slow explains a conversion-efficiency code with a healthy catalyst. Check the mixer for crystalline deposits — a partially blocked mixer prevents proper distribution and causes low conversion with everything else testing correct. Only after all of the above consider the SCR catalyst itself. It is the most expensive component and the least frequent fault. After repair , reset the inducement through the correct procedure, verify dosing occurs, and road test until conversion efficiency is confirmed. Lab 8.3 — EGR flow verification At warm idle, log MAF, EGR position command and EGR position feedback. Command the EGR valve closed. Record MAF. Command it progressively open in steps. MAF should fall measurably at each step as recirculated gas displaces fresh air. No MAF change with commanded movement = no flow , regardless of what the position feedback reports. The valve, cooler or passages are blocked. Feedback not tracking command = valve seized or position sensor faulty. Scope the feedback signal directly to separate the two. Remove and inspect. Photograph the carbon condition for the customer's record. If the cooler is suspect, pressure-test it off the vehicle for internal coolant leakage — a common cause of unexplained coolant loss and white smoke. Refit, repeat the MAF response test, and confirm normal behaviour. 5. Common failure modes & troubleshooting trees Tree A — DPF loading repeatedly Repeat DPF loading ├─ Read ash loading FIRST │ ├─ At or near life limit → filter needs cleaning or replacement. │ │ Regeneration cannot remove ash. Stop regenerating. │ └─ Within life → continue ├─ Regeneration history: many aborted regenerations? │ ├─ YES → why? Driver switching off mid-cycle, short journeys, │ │ or a fault aborting the cycle. Check the abort reason. │ └─ NO → continue ├─ Is excess soot actually being produced? │ ├─ Injector back-leak / leaking injector → test and quantify │ ├─ Turbo seal leaking oil → check intake and intercooler for oil │ ├─ EGR stuck open → MAF response test │ ├─ Boost low / boost leak → actual vs target, smoke test │ ├─ Glow system faulty → cold start smoke, glow circuit test │ └─ Wrong oil specification → check service record for low-SAPS ├─ Is regeneration failing to reach temperature? │ ├─ Failed DOC → EGT rise across the DOC insufficient │ ├─ Fuel dosing injector blocked (where fitted) │ └─ EGT sensor offset → compare all at cold start └─ None of the above → duty cycle. This is a vehicle-choice conversation with the customer, not a repair. Tree B — Differential pressure implausible DP plausibility code ├─ Zero-offset check: engine off, lines off, reads ~0? │ ├─ NO → sensor faulty │ └─ YES → continue ├─ Are both lines clear and intact? (Blow through each.) │ → blocked or split lines are more common than sensor failure ├─ Apply known pressure with a hand pump — does the reported │ value track correctly? │ ├─ NO → sensor faulty │ └─ YES → sensor and lines good; the reading is real └─ Reading real but disagrees with the soot model → the model's inputs are wrong (fuelling, EGT, airflow), or there is a physical restriction downstream of the DPF Tree C — AdBlue inducement active SCR inducement ├─ Record the inducement stage and remaining allowance BEFORE │ attempting anything — the escalation continues while you work ├─ DEF quality: refractometer test, contamination check │ ├─ Fail → drain, flush, refill with fresh certified DEF │ └─ Pass → continue ├─ Dosing test: pump pressure builds and holds? Injector delivers? │ ├─ Fail → crystallisation (clean with warm water), blocked filter, │ │ or pump failure │ └─ Pass → continue ├─ Heating circuits functional? (Critical in cold climates.) ├─ Both NOx sensors: cold-start agreement, load behaviour │ ├─ Disagreement → sensor fault, not catalyst failure │ └─ Agreement → continue ├─ Mixer inspection for crystalline blockage └─ Only now consider the SCR catalyst itself Frequently seen real-world failures Failure Symptom Confirming test DP sensor lines blocked with soot Implausible DP, false loading Blow through lines; hand pump test DEF crystallisation at injector Dosing fault, inducement Remove and inspect; clean with warm water EGR cooler leaking internally Coolant loss, white smoke, pressurised tank Off-vehicle pressure test Turbo seal leaking oil Rapid soot loading, oil in intercooler Shaft play, intake inspection Failed DOC Regeneration never completes EGT rise across DOC insufficient Oil over-full with fuel dilution Interrupted regenerations Oil level and smell; change before regenerating Wrong (non low-SAPS) oil High ash at low mileage Service record; ash loading vs mileage NOx sensor drift SCR efficiency code, good catalyst Cold-start comparison of both sensors Ash-loaded filter Regeneration completes, loading returns fast Ash loading value; filter cleaning or replacement 6. Student knowledge check Practical scenario challenges Scenario 1 — The fourth DPF. A taxi operating in a city has had two DPFs replaced and three forced regenerations in fourteen months. It is back with the warning on again. The previous workshop's advice was to have the filter removed. The vehicle does around 60 km per day in journeys averaging 4 km, mostly stop-start. Task: Explain what is actually happening, what you would measure to confirm it, what you would repair if anything, and exactly what you would say to the operator — including whether repair is the right answer at all. Scenario 2 — The customer who has already decided. A customer arrives and asks directly for a DPF and EGR delete. They have been quoted for it by another workshop, they have researched it, and they say it will improve economy and reliability. They are a good long-standing customer and they are getting irritated at being told no. Task: Write out what you would actually say. Address their economy and reliability claims technically, set out what you can do instead, and explain how you would keep the customer. 7. Answer key Scenario 1 model answer. What is actually happening: the vehicle's duty cycle makes DPF operation impossible. Journeys averaging 4 km in stop-start traffic mean the exhaust rarely reaches the 250–500 °C needed for passive regeneration, and an active regeneration takes 15–25 minutes of sustained driving to complete. The ECU keeps starting regenerations and the vehicle keeps being switched off before they finish. Each aborted cycle adds unburnt post-injection fuel to the sump and leaves the soot behind. Two replacement filters have been consumed by a driving pattern, not by a component fault. What I would measure to confirm it: 1. Regeneration history — count of successful versus aborted regenerations, and distance since the last success. A high abort count with short distances is the confirmation. 2. Ash loading versus mileage — to establish whether the current filter is genuinely ash-loaded or simply soot-loaded again, and to check whether wrong-specification oil has contributed. 3. Oil level and condition — fuel dilution is near-certain after three aborted regeneration campaigns, and may be the more urgent problem. 4. Differential pressure sensor zero and tracking , plus line patency — to be sure the loading readings are real. 5. Root-cause checks anyway — injector back-leak, turbo shaft play and oil in the intake, EGR flow response, boost actual vs target, glow operation, and the oil specification in the service record. Duty cycle is the likely answer but it must not be assumed while a leaking injector goes unfound. What I would repair: whatever the checks find — and if the oil is diluted, change it immediately regardless. If the current filter is ash-loaded, professional cleaning rather than a third replacement. What I would say to the operator, honestly: That the vehicle is not broken; it is the wrong vehicle for the work it is doing. A modern diesel with a DPF needs sustained running to survive, and 4 km city journeys are the exact condition it cannot cope with. Three more filters will go the same way. The realistic options, in order: 1. Change the vehicle to a petrol, hybrid or electric taxi for this duty cycle. For a city taxi doing 60 km/day in short hops, this is the answer, and it will cost less over three years than the filter cycle they are on. 2. Change the duty cycle — if the operator has other vehicles and routes, move this one to longer runs and put a petrol or hybrid on the city work. 3. If the vehicle must stay , put it on a scheduled service regeneration every few weeks as a planned, priced workshop visit, plus more frequent oil changes because of dilution. This works, but it is a running cost and must be quoted as one. 4. Deleting the filter is not on the list — it fails the next inspection, and it does not address the fuel dilution that is the more immediate threat to the engine. Say it as a straight commercial calculation. An operator who is told the truth with the numbers will usually change the vehicle, and they will come back for the rest of the fleet. Scenario 2 model answer. Something along these lines, said plainly and without a lecture: \"I'm not going to do it, and I'd rather tell you why than just refuse. On economy — a delete does not make an engine more efficient. The DPF costs you almost nothing in normal running; a healthy filter's back-pressure is small. What actually costs fuel is the regenerations, and those are frequent because something is causing the filter to load. Fix that and the regenerations become rare, which gets you the same fuel saving without the rest of it. If your EGR is stuck open you're losing economy right now, and that is a repair, not a delete. On reliability — this is the part that matters. If your DPF keeps loading, something is producing the soot: an injector, a turbo seal, an EGR valve, a duty cycle. Deleting the filter does not stop any of those. It removes the warning. The turbo carries on leaking oil until it fails properly, and it will cost far more then, without any warning light to see it coming. And the practical problem — it fails the next inspection. It has to be declared to your insurer. If you sell the vehicle, the buyer's check finds it. And my name is on the work. Here is what I'll do instead. Give me the vehicle for a proper diagnostic. I'll read the loading and ash figures, the regeneration history and the differential pressure, test the injectors for back-leak, check the turbo and the EGR flow, and tell you exactly what is causing it. That's a fixed price, and you get the answer whether or not you have me do the repair. In my experience it is usually one component, and it is usually cheaper than the delete you have been quoted. If it turns out the filter is genuinely at the end of its ash life, I'll get it professionally cleaned rather than replaced, which is a fraction of the cost. If you still want the delete afterwards, someone will do it — but not here, and I'd rather keep you as a customer for the next ten years than take one job I can't stand behind.\" Why this keeps the customer: it takes their concerns seriously and answers them technically rather than dismissing them; it offers something concrete and priced instead of just a refusal; and it puts the workshop's reason in terms of protecting them rather than protecting itself. Most customers asking for a delete are asking for an end to the problem, not for the delete specifically. Offer them the end of the problem. ", "words": 5049}];
const PASS_MARK = 0.8;
const STORE = 'mcaeed.v1';

/* ---------- state ---------- */
let state = {};
try { state = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch(e){ state = {}; }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }

/* ---------- nav ---------- */
function passed(m){ return (state.scores||{})[m.id] >= PASS_MARK; }
function assessable(m){ return m.quiz.length > 0; }

function renderNav(active){
  const ul = document.getElementById('nav');
  ul.innerHTML = DATA.map(m => `
    <li><a href="#${m.id}" class="${m.id===active?'on':''}">
      <span class="wire" style="background:${m.colour}"></span>
      <span><span class="lab">${m.label}</span><br><span class="ttl">${m.title}</span></span>
      <span class="tick ${passed(m)?'done':''}">${assessable(m) ? (passed(m)?'PASS':'—') : ''}</span>
    </a></li>`).join('');

  const total = DATA.filter(assessable).length;
  const done = DATA.filter(m => assessable(m) && passed(m)).length;
  document.getElementById('progress').textContent = `${done} / ${total} modules passed`;
  document.getElementById('railfill').style.height = (done/total*100) + '%';
}

/* ---------- module view ---------- */
function renderModule(m){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="meta">${m.label} · ${m.words.toLocaleString()} words${assessable(m)?` · ${m.quiz.length}-question assessment`:''}</div>
    <article>${m.html}</article>
    ${assessable(m) ? quizHTML(m) : certHTML()}`;
  main.querySelectorAll('table').forEach(t => {
    const w = document.createElement('div'); w.className = 'tablescroll';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  if(assessable(m)) wireQuiz(m);
  window.scrollTo(0,0);
}

function quizHTML(m){
  const prev = (state.scores||{})[m.id];
  return `<section class="assess" id="assess">
    <header>
      <h2>Knowledge check — ${m.label}</h2>
      <span class="thresh">Pass mark ${Math.round(PASS_MARK*100)}% · ${m.quiz.length} questions</span>
    </header>
    ${m.quiz.map((q,i) => `
      <div class="qcard" data-i="${i}">
        <div class="n">Question ${i+1}</div>
        <div class="stem">${q.q}</div>
        ${q.options.map(o => `
          <label class="opt"><input type="radio" name="q${i}" value="${o.k}">
          <span><b>${o.k})</b> ${o.t}</span></label>`).join('')}
        <div class="why"></div>
      </div>`).join('')}
    <footer>
      <button id="mark">Mark my answers</button>
      <button class="ghost" id="reset">Clear</button>
      <span class="score ${prev>=PASS_MARK?'pass':''}" id="score">${
        prev===undefined ? '' : `Last attempt: ${Math.round(prev*100)}% — ${prev>=PASS_MARK?'PASS':'below pass mark'}`}</span>
    </footer>
  </section>`;
}

function wireQuiz(m){
  const root = document.getElementById('assess');
  document.getElementById('mark').onclick = () => {
    let right = 0, answered = 0;
    m.quiz.forEach((q,i) => {
      const card = root.querySelector(`.qcard[data-i="${i}"]`);
      const sel = card.querySelector('input:checked');
      card.querySelectorAll('.opt').forEach(o => o.classList.remove('correct','wrong'));
      if(sel){
        answered++;
        const label = sel.closest('.opt');
        if(sel.value === q.answer){ label.classList.add('correct'); right++; }
        else{
          label.classList.add('wrong');
          card.querySelector(`input[value="${q.answer}"]`).closest('.opt').classList.add('correct');
        }
      }
      const why = card.querySelector('.why');
      why.innerHTML = `<b>${q.answer} —</b> ${q.why}`;
      why.classList.add('show');
    });
    if(answered < m.quiz.length){
      document.getElementById('score').textContent = `Answer all ${m.quiz.length} questions to record a score.`;
      return;
    }
    const pct = right / m.quiz.length;
    state.scores = state.scores || {};
    if(!(state.scores[m.id] >= pct)) state.scores[m.id] = pct;
    save();
    const el = document.getElementById('score');
    el.className = 'score ' + (pct>=PASS_MARK ? 'pass' : 'fail');
    el.textContent = `${right} / ${m.quiz.length} — ${Math.round(pct*100)}% — ${pct>=PASS_MARK?'PASS':'below pass mark, review and retry'}`;
    renderNav(m.id);
  };
  document.getElementById('reset').onclick = () => {
    root.querySelectorAll('input').forEach(i => i.checked = false);
    root.querySelectorAll('.opt').forEach(o => o.classList.remove('correct','wrong'));
    root.querySelectorAll('.why').forEach(w => w.classList.remove('show'));
    document.getElementById('score').textContent = '';
  };
}

/* ---------- certificate ---------- */
function certHTML(){
  const total = DATA.filter(assessable).length;
  const done = DATA.filter(m => assessable(m) && passed(m)).length;
  const ok = done === total;
  const name = state.name || '';
  return `<section class="cert ${ok?'':'locked'}">
    <div class="eyebrow">Certificate of completion</div>
    <h2>Master Certification in Automotive Electronics, ECU Engineering &amp; Advanced Diagnostics</h2>
    <p>${ok ? 'Awarded to' : `Complete all ${total} module assessments to unlock. ${done} of ${total} passed.`}</p>
    ${ok ? `<div class="name" contenteditable id="cname">${name || 'Type your name here'}</div>
      <p>All eight module assessments passed at ${Math.round(PASS_MARK*100)}% or above.</p>
      <div class="ref">Ref MCAEED-${certRef()} · Issued ${new Date().toISOString().slice(0,10)}</div>
      <p style="margin-top:22px"><button onclick="saveName();window.print()">Print certificate</button></p>` : ''}
  </section>`;
}
function certRef(){
  if(!state.ref){
    state.ref = Math.random().toString(36).slice(2, 8).toUpperCase();
    save();
  }
  return state.ref;
}
function saveName(){
  const el = document.getElementById('cname');
  if(el){ state.name = el.textContent.trim(); save(); }
}

/* ---------- search ---------- */
function search(term){
  const t = term.trim().toLowerCase();
  if(t.length < 3){ route(); return; }
  const words = t.split(/\s+/);
  const hits = [];
  DATA.forEach(m => {
    const hay = m.search.toLowerCase();
    if(!words.every(w => hay.includes(w))) return;
    const at = hay.indexOf(words[0]);
    let snip = m.search.slice(Math.max(0,at-90), at+190);
    words.forEach(w => {
      snip = snip.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','ig'), '<mark>$1</mark>');
    });
    hits.push({m, snip});
  });
  document.getElementById('main').innerHTML = `
    <div class="meta">Search · ${hits.length} module${hits.length===1?'':'s'} matched “${term}”</div>
    <ul class="hits">${hits.map(h => `
      <li><span class="lab">${h.m.label}</span><br>
      <a href="#${h.m.id}">${h.m.title}</a>
      <div class="snip">…${h.snip}…</div></li>`).join('') ||
      '<li>Nothing matched. Try a component name, a code, or a measurement.</li>'}</ul>`;
}

/* ---------- routing ---------- */
function route(){
  const id = location.hash.slice(1) || DATA[0].id;
  const m = DATA.find(x => x.id === id) || DATA[0];
  renderNav(m.id);
  renderModule(m);
}
function boot(){
  document.getElementById('q').addEventListener('input', e => search(e.target.value));
  window.addEventListener('hashchange', () => { document.getElementById('q').value=''; route(); });
  route();
}
boot();
</script>
</body>
</html>
