rded, tell the customer that, do not guess with their money. - Never clear codes before recording them. - Check for technical service bulletins and known software updates before deep diagnosis. Many hours have been spent diagnosing a fault the manufacturer fixed with a calibration. - Check for aftermarket accessories on any vehicle with strange electrical or network behaviour. - Verify battery and charging health first on any vehicle with multi-system codes. Low or noisy supply produces codes across every module and mimics dozens of faults. 3. Tools & equipment needed Generic OBD-II scan tool (mode 06 and mode 0A capable) Enhanced multi-brand platform (Autel MaxiSys, Launch X431, Snap-on or equivalent) J2534-2 pass-thru interface plus at least one OEM software subscription for teaching One brand-native dealer tool where the institution can obtain it 4-channel oscilloscope (from Module 2 — data must always be checkable against measurement) Smoke machine for intake and EVAP leak testing Fuel pressure gauge and low-pressure/high-pressure test kit Battery and charging system tester Vehicle fleet with reproducible inserted faults, including at least one vacuum leak, one exhaust leak upstream of an O2 sensor, and one contaminated MAF 4. Step-by-step practical lab exercise Lab 4.1 — Diagnose a lean condition using trims, freeze frame and measurement Scenario: MIL on. Stored: P0171 System Too Lean, Bank 1 . Customer reports a slight idle roughness and normal driving otherwise. Verify — start the engine, confirm the roughness, and note the conditions under which it occurs. Scan and record without clearing. Note whether P0171 is active or history, whether there are pending codes, and whether bank 2 also has a lean code (a single-bank code is a strong directional clue on a V engine). Read freeze frame. Record engine speed, load, coolant temperature, vehicle speed and both trims at the moment of setting. Ask immediately: did this set at idle or under load? The answer determines the whole investigation. Observe live trims at idle, at 2,500 rpm no load, and under road load. Record all three. - High positive at idle, falling at 2,500 rpm → vacuum leak . Proceed to step 5. - Normal at idle, rising under load → fuel delivery . Skip to step 7. - Positive across all conditions → MAF or a large leak . Do both step 5 and step 6. Smoke test the intake from the throttle body back, with the intake sealed. Look at the PCV system, brake booster hose, purge valve, dipstick tube seal, intake manifold gasket and any post-MAF ducting. Confirm any leak found by measuring the trim change after it is sealed. Check the MAF against calculation. At idle, compare reported g/s against expectation for the engine's displacement and speed; at wide-open throttle in gear, compare peak g/s against the rule of thumb of roughly 0.8 g/s per horsepower for a naturally aspirated engine. A MAF reading substantially low across the range with a clean intake is contaminated or failing. Cross-check against MAP if fitted — a MAF/MAP disagreement is definitive. Check fuel delivery under load. Measure fuel pressure while driving under the conditions from freeze frame, not at idle in the workshop. A restricted filter or a weakening pump holds pressure perfectly at idle and drops it at load — which is precisely why freeze frame conditions matter. Rule out an upstream exhaust leak. Inspect the manifold and the section before the bank 1 upstream sensor. A leak here makes the sensor read lean with no intake fault present. Confirm by observing whether the lean indication varies with exhaust pulse conditions, and by pressurising or smoke-testing the exhaust where facilities allow. Repair the confirmed cause. Verify properly. Clear codes, reset trims where the tool supports it, complete a drive cycle, then confirm: trims within ±10%, the fuel system monitor has run and passed, mode 06 margins restored, and no pending codes. Report before/after trim figures to the customer. Lab 4.2 — Build and apply a freeze-frame-led strategy The instructor sets a fault that only occurs under one specific condition (cold start, or high load, or at idle only). Students scan, record all data, and are forbidden from opening the bonnet until step 5. From freeze frame alone, each student writes: the conditions at failure, whether the fault is reproducible in the workshop, and what three faults could produce that code under those specific conditions. Each student writes a test plan : which single measurement would distinguish between their three candidates, and what result would point to which. Students execute the test plan and record whether their prediction held. Marking: a student who reaches the right answer by inspection rather than by their written plan is marked down. A student whose plan was sound but whose candidate list missed the actual fault is marked up if their test would have revealed it anyway. The method is the assessment. 5. Common failure modes & troubleshooting trees Tree A — MIL on, single powertrain code Single P-code ├─ Read status: active or history? │ ├─ HISTORY → do not chase with a meter. Read freeze frame, identify │ │ the conditions, and attempt to reproduce them. │ │ If not reproducible, fit a data logger and return the car. │ └─ ACTIVE → measurable now, proceed ├─ Does the code describe a CIRCUIT (\"circuit open\", \"circuit low\") or a │ PERFORMANCE (\"system too lean\", \"insufficient flow\")? │ ├─ CIRCUIT → electrical fault. Use Module 1 and 2 methods: │ │ supply, ground, signal, at the component connector. │ │ Check the fault-type suffix if present. │ └─ PERFORMANCE → the circuit is intact and the ECU is unhappy with │ the RESULT. The cause is usually mechanical, │ fuelling or airflow, not the named component. ├─ Check TSBs and calibration level (mode 09 CVN) before deep diagnosis └─ Verify battery/charging health before accepting any code as genuine Tree B — Many codes across many systems Multiple codes, multiple systems ├─ Do the freeze frames share a timestamp? → single event, not many faults ├─ Is battery voltage low in any freeze frame? → charging/battery first ├─ Are there U-codes? → go to Module 3. Network fault produces │ consequential codes in every module. ├─ Was the vehicle recently worked on, or an accessory fitted? │ → inspect that work before diagnosing anything else ├─ Do all codes trace back to one shared supply, ground or 5 V reference? └─ Only after all the above: treat the codes as independent faults Tree C — Customer complaint but no codes Symptom present, no DTCs ├─ Define the symptom precisely: when, what speed, what temperature, │ how often, what makes it better or worse. Road test with the customer │ if the description is vague. ├─ Check PENDING codes (mode 07) and MODE 06 margins — the fault may be │ detected but not yet confirmed ├─ Check fuel trims across idle / cruise / load ├─ Is the symptom within any monitored system at all? │ ├─ NO (e.g. a mechanical noise, a fuelling issue below threshold) │ │ → the ECU cannot see it. Measure directly with the scope, │ │ pressure transducer and current clamp. │ └─ YES → the monitor's threshold has not been crossed. Mode 06 │ shows how close it is. └─ If intermittent and unreproducible → fit a logger, capture the event, do not guess Frequently seen real-world failures Situation Trap Correct handling P0420 catalyst efficiency Fitting a catalyst Verify O2 sensors, exhaust leaks and fuelling first — the catalyst is usually a victim P0300 random misfire Fitting plugs and coils Check trims, vacuum, compression and cam timing; random misfire is rarely ignition Lean codes on one bank Chasing the O2 sensor Check for an exhaust leak upstream of that sensor Codes return after clearing Assuming the repair failed Check whether they are permanent codes (mode 0A) awaiting a monitor pass Vehicle fails inspection, no codes Confusion Incomplete readiness monitors after a recent clear Codes across every module Assuming module failures Battery, charging ripple, or a network fault No communication on a new vehicle Assuming gateway failure Tool may lack CAN FD or DoIP support 6. Student knowledge check Practical scenario challenges Scenario 1 — The third catalyst. A vehicle has had two catalytic converters fitted in eight months by two different garages. P0420 returns each time within a few weeks. There are no other codes. The customer is understandably angry. Task: Explain why P0420 is being set, list the four checks that should have been done before the first catalyst was fitted, and describe how you would prove the actual root cause using data rather than parts. Scenario 2 — The intermittent that only happens on the motorway. A vehicle stores P0301 (cylinder 1 misfire) with history status. The customer reports a brief loss of power roughly once per long journey, never in town. Nothing is reproducible in the workshop. Freeze frame shows: engine speed 2,850 rpm, calculated load 78%, coolant 92 °C, vehicle speed 118 km/h, LTFT +3%. Task: Explain what freeze frame tells you and what it rules out. State your diagnostic plan, including what you would measure, where, and how you would capture an event that will not occur on the ramp. 7. Answer key Scenario 1 model answer. Why P0420 sets: the ECU compares the rear (post-catalyst) oxygen sensor's switching activity against the front sensor's. A healthy catalyst stores and releases oxygen, so the rear sensor should sit relatively steady while the front switches rapidly. When the rear sensor begins to mirror the front, the ECU concludes the catalyst has lost storage capacity. The code is a comparison of two sensors, not a measurement of the catalyst. Anything that makes the rear sensor behave like the front — or that damages the catalyst — will set it. Four checks that should have preceded the first catalyst: 1. Both oxygen sensors' behaviour on the scope or in high-rate serial data. A lazy or slow front sensor, or a rear sensor that has become over-responsive or is reading through a leak, sets the code with a perfect catalyst. Check the front sensor's switch rate and the rear sensor's steadiness under a forced rich/lean transition. 2. Exhaust leaks anywhere upstream of the rear sensor , especially at the manifold, flexi and any joint before the rear sensor bung. Air entering there falsifies the rear sensor reading directly. 3. Fuel trims across idle, cruise and load. A vehicle running persistently rich destroys catalysts by overheating them. If trims are heavily negative or the vehicle has a misfire, the catalyst is being consumed by an upstream fault and every replacement will die the same way. 4. Misfire and oil consumption history. Raw fuel or oil reaching the catalyst is the most common cause of repeat catalyst failure. Mode 06 misfire counters and a compression or leak-down check establish this. Proving root cause with data: - Capture both O2 sensors simultaneously on the scope during a forced deceleration (fuel cut) and a snap throttle. The front sensor should swing full range rapidly; the rear should respond slowly and with reduced amplitude. If the rear tracks the front closely on a new catalyst, either the rear sensor or a leak is at fault, not the catalyst. - Read mode 06 catalyst monitor test values and limits before and after any change, so the margin is documented rather than guessed. - Record fuel trims at idle, 2,500 rpm and road load, and misfire counts per cylinder, and present these to the customer as the evidence for whatever is actually replaced next. - If the vehicle also consumes oil or coolant, resolve that before the third catalyst is fitted, or it will fail too. Scenario 2 model answer. What freeze frame tells you: the misfire occurred at 2,850 rpm, 78% load, 118 km/h, fully warm, with normal fuel trims . This is a sustained high-load, high-speed, hot condition. What it rules out: - Cold-start-related faults — coolant was at 92 °C. - A fuelling or air-metering fault of any significance — LTFT at +3% means the ECU was not compensating for anything at the time. - An idle-only fault — vacuum leaks, idle control and low-speed issues are not consistent with 78% load. - Any workshop-reproducible condition — the fault occurs at a load and duration that a stationary engine on a ramp cannot reach. Diagnostic plan: Establish whether the misfire is ignition, fuel or mechanical , since all three fail preferentially under high load. High cylinder pressure at load is exactly the condition that exposes a marginal ignition component or a weak sealing surface, all of which behave perfectly at idle. Check history and mode 06 for misfire counts by cylinder — whether cylinder 1 is uniquely affected or simply the worst of several. Also check for any pending codes and the number of failed drive cycles. Perform a relative compression test with a current clamp on the starter (Module 2 method) and, if cylinder 1 is low, follow with a leak-down test. A valve or ring fault that seals at cranking pressure may not seal at full load. Scope the ignition secondary on cylinder 1 and one healthy cylinder for comparison , ideally under load on a dynamometer or during a loaded road test. Look for a rising firing voltage and shortening burn time on cylinder 1 as load rises — the signature of a marginal ignition path or an excessive plug gap that only breaks down under pressure. Check the injector on cylinder 1 by current ramp and compare against the other injectors, since a marginally restricted injector shows up under load first. Capturing an event that will not occur on the ramp: - Load the engine properly: a dynamometer run reaching 78% load at 2,850 rpm, or a road test on a long uphill gradient in a high gear, with the scope recording continuously in the vehicle. - Configure the scope for long-duration recording with glitch capture , on ignition primary or secondary for cylinder 1, plus the crank signal so the misfiring event can be located by crank position. - If a single road test does not reproduce it, fit a data logger recording misfire counters, ignition parameters, load and speed, and return the vehicle to the customer for a normal long journey. Analyse the log against the moment the customer reports the power loss. - Do not fit parts speculatively between attempts. If the customer cannot fund a dynamometer session or a logging period, say so plainly rather than guessing with their money — and note that the freeze frame already proves the fault cannot be found any other way. ", "words": 4693}, {"id": "module-5-ecu-architecture-bench", "label": "Module 5", "title": "ECU architecture & bench", "colour": "#2E7D5B", "html": "<h1>Module 5 — Vehicle Computer Architecture, Micro-Soldering &amp; Bench Repair</h1>\n<p><strong>Hours:</strong> 70 (26 lecture / 44 bench)\n<strong>Prerequisite:</strong> Modules 1–4 signed off. <strong>Gated module</strong> — no student opens a module casing before this point.</p>\n<hr />\n<h2>1. Module overview &amp; learning objectives</h2>\n<p>Most technicians treat a control module as a sealed black box: it either works or it is replaced at £600–£2,400 plus coding. This module opens the box. The commercial argument is straightforward — a large proportion of \"failed\" modules have one failed component, usually a power supply capacitor, a driver IC, or a cracked solder joint on a connector pin.</p>\n<p>By the end of the module the student can:</p>\n<ul>\n<li><strong>5.1</strong> Describe the internal block architecture of an ECU, TCU and BCM and identify each stage on a real board.</li>\n<li><strong>5.2</strong> Open a module without destroying it, and reseal it to an equivalent ingress standard.</li>\n<li><strong>5.3</strong> Bench-power a module on a current-limited supply and interpret its current draw as a diagnostic signal.</li>\n<li><strong>5.4</strong> Identify power supply stages, driver ICs, EEPROM, flash and MCU by package and marking.</li>\n<li><strong>5.5</strong> Perform SMD rework: remove and replace 0402–1206 passives, SOIC/TSSOP ICs, and reflow BGA joints.</li>\n<li><strong>5.6</strong> Read and write serial EEPROM in-circuit and off-board, and manage the data integrity risks.</li>\n<li><strong>5.7</strong> Establish BDM/JTAG/boot connections on a bench and understand what each grants access to.</li>\n</ul>\n<hr />\n<h2>2. Comprehensive theory &amp; lecture notes</h2>\n<h3>2.1 The universal ECU block diagram</h3>\n<p>Every module, from a £30 door unit to a £3,000 engine controller, follows the same skeleton:</p>\n<pre><code>Battery feed ──► Reverse-polarity + transient protection\n                 (series diode, TVS, choke)\n                        │\n                        ▼\n                 Pre-regulator (buck / linear)  ──► 5 V logic rail\n                        │                       ──► 5 V sensor supply (protected)\n                        │                       ──► 3.3 V / 1.8 V core rails\n                        ▼\n                 Reset / watchdog supervisor\n                        │\n                        ▼\n      ┌──────────► Microcontroller (MCU) ◄──────────┐\n      │             │        │        │             │\n  Input             │        │        │          Comms\n  conditioning      │        │        │          transceivers\n  (dividers,        │        │        │          (CAN, LIN,\n   filters,         ▼        ▼        ▼           FlexRay)\n   op-amps,     Internal   External  EEPROM\n   comparators)  flash     flash     (adaptations,\n                                      immobiliser,\n                                      VIN, mileage)\n                        │\n                        ▼\n                 Output driver stage\n                 (smart high/low-side drivers,\n                  H-bridges, injector drivers,\n                  ignition drivers)\n                        │\n                        ▼\n                 Connector / harness\n</code></pre>\n<p>Students must be able to point at each stage on an unfamiliar board within ten minutes. Once you can do that, an unknown ECU stops being unknown.</p>\n<h3>2.2 Power supply stages — where most failures live</h3>\n<p>The input stage sees the worst environment on the vehicle: load dump transients to 60–120 V, reverse polarity from jump-starting, and cranking dips to 6 V.</p>\n<table>\n<thead>\n<tr>\n<th>Component</th>\n<th>Function</th>\n<th>Failure signature</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Series/reverse diode</td>\n<td>Blocks reverse polarity</td>\n<td>Shorted → module dead, feeds pull down; open → module dead, no rail</td>\n</tr>\n<tr>\n<td>TVS / transient suppressor</td>\n<td>Clamps load dump</td>\n<td>Shorted → blows the module fuse repeatedly</td>\n</tr>\n<tr>\n<td>Input electrolytic</td>\n<td>Bulk energy store</td>\n<td>High ESR → rail ripple → random resets</td>\n</tr>\n<tr>\n<td>Buck regulator IC</td>\n<td>12 V → 5 V efficiently</td>\n<td>Dead → no rails; unstable → resets under load</td>\n</tr>\n<tr>\n<td>LDO regulators</td>\n<td>Clean 3.3 V / 1.8 V core</td>\n<td>Dead → MCU never starts</td>\n</tr>\n<tr>\n<td>Watchdog/supervisor</td>\n<td>Holds MCU in reset until rails stable</td>\n<td>Faulty → continuous reset loop, module \"boots and dies\"</td>\n</tr>\n<tr>\n<td>Sensor 5 V supply</td>\n<td>Feeds external sensors, current-limited</td>\n<td>Shorted externally → protection trips → multiple sensor codes</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Teaching point:</strong> a module that \"boots and dies\" repeatedly is almost never a failed MCU. It is a rail that sags under load or a watchdog holding reset. Scope each rail at power-up and watch for the sequence: input, pre-regulator, core, then reset release.</p>\n<p><strong>Rail values to expect:</strong> 5.00 V ±2% logic, 5.00 V ±1% sensor reference (tighter, because sensor accuracy depends on it), 3.30 V ±3% core on modern MCUs, 1.8 V or 1.2 V on high-performance cores. Ripple on any logic rail should be under <strong>50 mV p-p</strong>.</p>\n<h3>2.3 Microcontrollers</h3>\n<p>The families a technician meets:</p>\n<table>\n<thead>\n<tr>\n<th>Family</th>\n<th>Typical use</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Infineon TriCore (TC17xx, TC2xx, AURIX TC3xx)</td>\n<td>Bosch EDC17/MED17/MD1/MG1</td>\n<td>Dominant in modern European powertrain</td>\n</tr>\n<tr>\n<td>NXP/Freescale MPC5xxx (Power Architecture)</td>\n<td>Continental/Siemens, Delphi</td>\n<td>Common in SIMOS, SID, DCM</td>\n</tr>\n<tr>\n<td>Infineon C167 / ST10</td>\n<td>Bosch EDC15/16, ME7</td>\n<td>Older generation, 16-bit</td>\n</tr>\n<tr>\n<td>Renesas SH / RH850</td>\n<td>Japanese OEMs, Denso</td>\n<td>Widespread on Toyota/Honda/Nissan</td>\n</tr>\n<tr>\n<td>Motorola HC08/HC12</td>\n<td>Older BCM, TCU, immobiliser</td>\n<td>Simple, often EEPROM-adjacent</td>\n</tr>\n<tr>\n<td>ARM Cortex-M / R</td>\n<td>Modern body, gateway, ADAS</td>\n<td>Increasingly universal</td>\n</tr>\n</tbody>\n</table>\n<p>The MCU contains internal flash (program + calibration), internal RAM, and often an internal EEPROM emulation area. <strong>The MCU is rarely the failed part.</strong> It is protected, low-power and thermally stable. Students who conclude \"the processor has failed\" have usually not measured the rails.</p>\n<h3>2.4 Memory devices — what lives where</h3>\n<table>\n<thead>\n<tr>\n<th>Device</th>\n<th>Typical package</th>\n<th>Contents</th>\n<th>Consequence of loss</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Internal MCU flash</td>\n<td>Inside MCU</td>\n<td>Operating software + calibration</td>\n<td>Module non-functional; needs reflash</td>\n</tr>\n<tr>\n<td>External flash (NOR)</td>\n<td>TSOP48, SOP44, BGA</td>\n<td>Program/calibration on split architectures</td>\n<td>Same</td>\n</tr>\n<tr>\n<td>Serial EEPROM (93Cxx, 24Cxx, 95xxx/SPI)</td>\n<td>SOIC8, TSSOP8</td>\n<td><strong>Adaptations, VIN, immobiliser data, mileage, coding</strong></td>\n<td>Module works but is \"not this car\"</td>\n</tr>\n<tr>\n<td>FRAM / EERAM</td>\n<td>SOIC8</td>\n<td>Fast-write adaptation store</td>\n<td>As EEPROM</td>\n</tr>\n<tr>\n<td>Flash on a separate BGA</td>\n<td>BGA</td>\n<td>Large calibration/map data</td>\n<td>Requires reball to replace</td>\n</tr>\n</tbody>\n</table>\n<p><strong>The single most important distinction in this module:</strong> program/calibration data is <em>generic to the model</em>; EEPROM data is <em>unique to this vehicle</em>. Replace an ECU and you can flash the software — but the EEPROM content (immobiliser sync, VIN, learned adaptations, component protection) is what makes it belong to the car. This is why \"used ECU from the scrapyard\" jobs succeed or fail.</p>\n<p><strong>Serial EEPROM identification by marking:</strong>\n- <code>24Cxx</code> — I²C, 2-wire. 24C02 = 2 kbit, 24C16 = 16 kbit, 24C64 = 64 kbit.\n- <code>93Cxx</code> — Microwire, 3-wire. 93C46 = 1 kbit, 93C56/66 = 2/4 kbit. Note the <strong>ORG pin</strong> selects 8-bit or 16-bit organisation — reading with the wrong organisation gives byte-swapped nonsense that looks almost right.\n- <code>95xxx / 25xxx</code> — SPI. 95040, 95160, 95320, 95640 etc., the number indicating kbit.</p>\n<h3>2.5 Output driver stages</h3>\n<p>Modern modules use <strong>smart driver ICs</strong> rather than bare transistors. Common families: Bosch CJ/CY series, Infineon Profet and TLE, ST VNQ/VN5 series, NXP MC33xxx.</p>\n<p>They integrate:\n- The MOSFET output\n- Current sensing and limiting\n- Over-temperature shutdown with automatic retry\n- Open-load detection (a small sense current when off)\n- Short-to-battery and short-to-ground detection\n- A diagnostic feedback line to the MCU</p>\n<p>Consequences for repair:\n- A \"circuit open\" DTC is generated by the <strong>driver's own diagnostic</strong>, usually with the output off, and can be triggered by a load whose resistance is out of the expected window as well as by an actual break.\n- <strong>A driver killed by an external short is the most common repairable ECU fault.</strong> The harness shorted, the driver died protecting itself, and the module is otherwise perfect. Replace the driver IC and <strong>repair the harness fault first</strong>, or the new driver dies in seconds.\n- Driver ICs are usually available; they are standard automotive parts. Identify by top marking, cross-reference the datasheet, and confirm the pinout matches before ordering.</p>\n<h3>2.6 Micro-soldering — theory before practice</h3>\n<p><strong>Alloy behaviour:</strong>\n- Leaded Sn63/Pb37 — eutectic, melts sharply at <strong>183 °C</strong>. Easiest to work.\n- Lead-free SAC305 — melts <strong>217–220 °C</strong>, pastier transition, more heat needed, more prone to dull joints that look cold but are not.\n- Low-melt alloy (bismuth-based, ~138 °C) — used to <em>lower</em> the melting point of an existing joint for removal of multi-pin parts. It contaminates the joint and must be fully removed before resoldering.</p>\n<p><strong>Flux is not optional.</strong> Flux removes oxide and improves thermal transfer. No-clean flux still leaves residue that can be hygroscopic on an automotive board — clean with IPA and a brush after any rework, then inspect under the microscope.</p>\n<p><strong>Temperature discipline:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Task</th>\n<th>Iron tip temperature</th>\n<th>Hot air</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Leaded rework</td>\n<td>320–350 °C</td>\n<td>300–340 °C</td>\n</tr>\n<tr>\n<td>Lead-free rework</td>\n<td>350–380 °C</td>\n<td>340–380 °C</td>\n</tr>\n<tr>\n<td>Ground plane / large pad</td>\n<td>+20–30 °C and a bigger tip, not longer dwell</td>\n<td>Preheat board to 120–150 °C</td>\n</tr>\n<tr>\n<td>Sensitive small IC</td>\n<td>300–320 °C, fast</td>\n<td>Low airflow, shielded neighbours</td>\n</tr>\n</tbody>\n</table>\n<p><strong>The rule that saves boards:</strong> use a <em>larger tip and a shorter dwell</em>, never a smaller tip and a longer dwell. Heat delivered slowly lifts pads; heat delivered quickly does not. A lifted pad turns a 20-minute repair into a scrap board.</p>\n<p><strong>Preheating</strong> is mandatory for anything above SOIC size on an automotive board. Automotive PCBs have heavy ground planes and often 4–6 layers; without a preheater at 120–150 °C, the hot air station cannot reach reflow at the joint without cooking the package.</p>\n<p><strong>ESD:</strong> wrist strap to a common grounding point, ESD mat, grounded iron tip. Measure your bench: tip-to-ground should be under 2 Ω, and the mat should present 10⁶–10⁹ Ω to ground — a mat that is a dead short is itself a hazard.</p>\n<h3>2.7 Conformal coating</h3>\n<p>Automotive boards are coated in acrylic, silicone or polyurethane. You cannot solder through it.</p>\n<ul>\n<li><strong>Acrylic</strong> — softens with IPA or a dedicated stripper. Most common, easiest.</li>\n<li><strong>Silicone</strong> — will not dissolve; must be mechanically scraped or removed with a specific silicone remover.</li>\n<li><strong>Polyurethane / parylene</strong> — hardest; mechanical removal under the microscope, carefully.</li>\n</ul>\n<p>After repair, <strong>recoat</strong>. An uncoated automotive board in an engine bay corrodes within a season. This is the step students skip and the reason repaired modules come back.</p>\n<h3>2.8 Bench setup and bench testing</h3>\n<p>A bench setup means powering the module outside the vehicle with only the pins it needs.</p>\n<p><strong>Minimum pins for most ECUs:</strong>\n1. Battery permanent (30)\n2. Ignition/switched (15)\n3. Power grounds — usually several, all must be connected\n4. Signal/sensor ground\n5. CAN-H and CAN-L, with a <strong>120 Ω resistor</strong> fitted across them (the ECU normally has a partner terminator on the vehicle — without it, the bus will not communicate)\n6. Sometimes a wake or enable line, and sometimes a crank signal for the ECU to leave standby</p>\n<p><strong>Current draw as a diagnostic:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Current at 12 V</th>\n<th>Interpretation</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0 mA</td>\n<td>No feed reaching the board, or open input protection</td>\n</tr>\n<tr>\n<td>A few mA, stable</td>\n<td>Module in standby — normal before ignition</td>\n</tr>\n<tr>\n<td>100–500 mA on ignition</td>\n<td>Normal awake draw for most ECUs</td>\n</tr>\n<tr>\n<td>Rising then cutting out repeatedly</td>\n<td>Watchdog reset loop, or rail collapsing under load</td>\n</tr>\n<tr>\n<td>Immediate current limit at supply maximum</td>\n<td>Shorted input stage, shorted driver, or reversed supply</td>\n</tr>\n<tr>\n<td>Very low, never rises with ignition</td>\n<td>MCU not starting — check core rails and reset line</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Always use a current-limited bench supply set to about 2 A.</strong> A module with a shorted driver connected to a vehicle battery destroys the board and any evidence of what failed.</p>\n<h3>2.9 BDM, JTAG and boot mode</h3>\n<p>These are the debug and programming interfaces built into the MCU.</p>\n<ul>\n<li><strong>BDM (Background Debug Mode)</strong> — Motorola/NXP debug interface, accessed via specific pads on the board. Used to read and write internal flash on ECUs that cannot be read through OBD.</li>\n<li><strong>JTAG (IEEE 1149.1)</strong> — general debug/boundary-scan interface. Present on many MCUs, often with pads unpopulated.</li>\n<li><strong>Boot mode</strong> — pulling a specific MCU pin to a defined level at power-up causes the MCU to start a factory bootloader instead of the application, exposing a serial or CAN programming channel.</li>\n</ul>\n<p><strong>What each grants:</strong> direct access to the MCU's memory, bypassing the application software's security layer. This is how a bricked module is recovered, how a checksum-corrupted flash is repaired, and how a read is obtained from an ECU whose OBD protocol is locked.</p>\n<p><strong>Risks students must understand before touching:</strong>\n1. Boot pins are usually held with a <strong>fine wire or a probe on a bare pad</strong>. Slip, and you short an adjacent line and destroy the MCU.\n2. Writing to the wrong memory region bricks the module in a way that may not be recoverable.\n3. <strong>Read before you write. Always. Twice.</strong> Two independent reads must be byte-identical before any write is attempted. A single read may be corrupt and you will not know until you have overwritten the original.\n4. Some MCUs have a <strong>read-protect fuse</strong>. Attempting to defeat it can permanently lock the device.\n5. Voltage matters — many boot connections require a precise voltage on a specific pin (e.g. 5 V or 12 V to a test point). Guessing damages the MCU.</p>\n<p><strong>Legitimacy boundary for this module:</strong> BDM/boot access is taught for <strong>recovery, repair, and calibration work on vehicles the workshop has been authorised to work on</strong>. Reading and writing modules to defeat theft protection is covered — and bounded — in Module 6.</p>\n<hr />\n<h2>3. Tools &amp; equipment needed</h2>\n<ul>\n<li>Stereo microscope, 7–45× zoom, with ring light and adequate working distance</li>\n<li>Temperature-controlled soldering station with micro tips (0.2 mm conical, 1.6 mm chisel, mini-wave)</li>\n<li>Hot air rework station with 3–8 mm nozzles</li>\n<li><strong>PCB preheater</strong>, 120–200 °C, IR or hotplate — not optional for automotive boards</li>\n<li>Bench power supply 0–30 V / 0–5 A with adjustable current limit and a readable current display</li>\n<li>Oscilloscope (from Module 2) for rail and reset-line analysis</li>\n<li>ESR meter</li>\n<li>Hot tweezers for passives</li>\n<li>Solder: Sn63/Pb37 0.3 mm and SAC305 0.3 mm; low-melt removal alloy</li>\n<li>Flux: no-clean gel and rosin liquid; solder wick 1.5 mm and 2.5 mm</li>\n<li>IPA 99%, brushes, ultrasonic bath, lint-free wipes</li>\n<li>Conformal coating (acrylic) and applicator</li>\n<li>Kapton tape, ESD mat, wrist strap, ionised air where budget allows</li>\n<li>EEPROM programmer (XPROG, UPA-USB, TL866 class) with SOIC8 clip and adapters</li>\n<li>BDM/boot tooling (Module 6 hardware doubles here)</li>\n<li>Practice boards — scrap ECUs, at least three per student, plus SMD practice kits</li>\n</ul>\n<hr />\n<h2>4. Step-by-step practical lab exercise</h2>\n<h3>Lab 5.1 — Recover a \"dead\" ECU on the bench</h3>\n<p><strong>Scenario:</strong> An engine ECU is reported as no-communication and the vehicle will not start. The vehicle-side wiring has already been proven good (Modules 1 and 3 methods) and the ECU's supplies and grounds at the connector are correct.</p>\n<ol>\n<li><strong>Record everything before removal.</strong> Photograph connectors, note the part number, hardware number and software number from the label. Record the VIN.</li>\n<li><strong>Remove and inspect externally.</strong> Water staining, corrosion at the connector, a swollen case, or a burnt smell each redirect the investigation immediately.</li>\n<li><strong>Open the casing.</strong> Most are a pressed metal lid with a bead of sealant, some are riveted, some are ultrasonically welded. Use the correct method — cut the sealant bead, drill out rivets, or split the weld line with a thin blade — and expect to remake the seal at reassembly.</li>\n<li><strong>Inspect the board under the microscope before applying power.</strong> Look for: corrosion tracks, burnt components, bulged electrolytics, cracked solder at connector pins (the highest-vibration joints on the board), and any evidence of previous repair.</li>\n<li><strong>Bench-power with current limit set to 2 A.</strong> Apply permanent feed and grounds only. Record standby current.</li>\n<li><strong>Measure the rails in order:</strong> input after the protection diode, pre-regulator output, 5 V logic, 5 V sensor supply, 3.3 V core. Any rail absent or low locates the failed stage immediately.</li>\n<li><strong>Scope the reset line at power-up.</strong> It should assert low, then release cleanly once rails are stable and stay high. A reset line pulsing continuously means the watchdog is not being serviced — either a rail is marginal or the MCU is not running.</li>\n<li><strong>Apply ignition feed.</strong> Current should rise to normal awake draw. If the supply current-limits, remove ignition and look for a shorted driver: measure each output pin to ground with the board unpowered. A driver that reads near 0 Ω to ground is shorted.</li>\n<li><strong>Attempt communication.</strong> Fit the <strong>120 Ω terminator</strong> across CAN-H and CAN-L, connect the tool, and attempt a read. Communication on the bench with the vehicle absent proves the module is alive and points the whole investigation back to the vehicle.</li>\n<li><strong>Repair the identified fault.</strong> Typical findings in order of frequency: high-ESR electrolytic, cracked connector-pin solder joint, failed smart driver IC, corroded via under a water track, failed regulator.</li>\n<li><strong>Retest all rails and the awake current</strong> after repair.</li>\n<li><strong>Clean, recoat, reseal, refit.</strong> Verify on the vehicle, and confirm any adaptation resets required.</li>\n</ol>\n<h3>Lab 5.2 — Read, verify and restore a serial EEPROM</h3>\n<ol>\n<li><strong>Identify the device</strong> under the microscope. Read the top marking; confirm the family (24Cxx / 93Cxx / 95xxx) and capacity.</li>\n<li><strong>Confirm the pinout from the datasheet</strong>, not from memory. Pin 1 is marked by a dot or a notch — orientation errors destroy the chip.</li>\n<li><strong>Decide in-circuit or off-board.</strong> In-circuit with a SOIC clip is faster but fails when other devices on the same bus hold lines, or when the board's regulator back-feeds. If the read is inconsistent, go off-board.</li>\n<li><strong>For 93Cxx devices, establish the ORG pin state</strong> on the board. Reading in the wrong organisation produces a file that looks plausible and is wrong.</li>\n<li><strong>Read the device. Then read it again.</strong> Save both files with distinct names.</li>\n<li><strong>Compare the two files byte for byte.</strong> They must be identical. If they differ, the read is unreliable — improve the connection, lower the read speed, or remove the chip. <strong>Do not proceed on a single read.</strong></li>\n<li><strong>Archive the verified original</strong> with the vehicle's VIN, date, part number and technician name in the filename, to a location that is backed up. This archive is the workshop's insurance policy and, in a dispute, its evidence.</li>\n<li><strong>Only now</strong> make the intended change.</li>\n<li><strong>Write, then read back and verify</strong> against the intended file, not against the original.</li>\n<li><strong>Refit, power on the bench, confirm the module boots</strong> and the change took effect before returning it to the vehicle.</li>\n</ol>\n<h3>Lab 5.3 — SMD rework progression</h3>\n<p>Students complete these in order, each signed off before moving on:</p>\n<ol>\n<li>Remove and refit ten 0805 resistors on a practice board. Assess: pad condition, joint shape, no bridging.</li>\n<li>Repeat at 0603, then 0402, using hot tweezers.</li>\n<li>Remove and refit a SOIC8 EEPROM using hot air with neighbours shielded by Kapton. Assess: no lifted pads, correct orientation, clean pins.</li>\n<li>Remove and refit a TSSOP20 driver IC. Drag-solder the pins, then wick the bridges. Assess under microscope at 30×.</li>\n<li>Repair a deliberately lifted pad with a jumper wire from the nearest via, secured with epoxy. Assess: mechanical strength and correct routing.</li>\n<li>Reflow a BGA joint on a scrap board with preheat, then inspect for shorts by resistance measurement.</li>\n<li>Clean and recoat the practice board to a standard the instructor accepts.</li>\n</ol>\n<hr />\n<h2>5. Common failure modes &amp; troubleshooting trees</h2>\n<h3>Tree A — Module dead on the bench</h3>\n<pre><code>No response on bench\n├─ Standby current 0 mA?\n│   ├─ YES → check input protection diode, fuse resistor, connector pin\n│   │        continuity to board. Often a corroded pin or a cracked joint.\n│   └─ NO → continue\n├─ Measure rails in sequence\n│   ├─ Pre-regulator output missing → regulator IC or its input capacitor\n│   ├─ 5 V logic missing → LDO or short downstream. Isolate by lifting\n│   │   the rail's decoupling or by thermal imaging for the hot spot.\n│   ├─ Core rail missing → core regulator, or MCU shorted internally\n│   └─ All rails present → continue\n├─ Reset line behaviour at power-up\n│   ├─ Held low permanently → supervisor IC or a rail below its threshold\n│   ├─ Pulsing → watchdog not serviced. MCU not executing, or a marginal rail.\n│   └─ Releases and stays high → MCU is running. Fault is comms or software.\n└─ MCU running but no communication\n    ├─ 120 Ω terminator fitted on the bench? (Most common bench mistake.)\n    ├─ CAN transceiver output levels correct? Scope both pins.\n    └─ Transceiver dead → replaceable IC, usually killed by a bus short\n       to battery. Repair the vehicle wiring or it dies again.\n</code></pre>\n<h3>Tree B — Module works but a single function is dead</h3>\n<pre><code>One output not working\n├─ Measure that output pin to ground, board unpowered\n│   ├─ Near 0 Ω → driver shorted. Identify the driver IC serving that pin.\n│   └─ Normal/high → continue\n├─ Bench-command the output and scope the pin\n│   ├─ No switching → driver failed open, or MCU not commanding\n│   │   (check enabling conditions — many outputs need engine data)\n│   └─ Switching correct → the fault is external to the module\n├─ BEFORE replacing the driver: establish WHY it failed.\n│   A shorted harness, a failed actuator or a water-filled connector\n│   will kill the replacement within seconds of refitting.\n└─ After replacement: bench-test the output under a representative load,\n   not open-circuit\n</code></pre>\n<h3>Tree C — Repaired module misbehaves after refitting</h3>\n<pre><code>Repaired module refitted, new problems\n├─ Were adaptations lost? → run the required relearn procedures\n│   (throttle, idle, transmission, steering angle, DPF/regen counters)\n├─ Was EEPROM data altered or corrupted during rework?\n│   → compare current EEPROM against the archived original\n├─ Is the module now reporting a different VIN or failing component\n│   protection? → EEPROM or coding data mismatch\n├─ Did conformal coating removal leave residue bridging fine pitch?\n│   → clean thoroughly under microscope, re-inspect at 30×\n└─ Did the reseal fail? → water ingress recurs within weeks;\n   check the seal integrity and drainage path\n</code></pre>\n<h3>Frequently seen real-world failures</h3>\n<table>\n<thead>\n<tr>\n<th>Failure</th>\n<th>Symptom</th>\n<th>Confirming test</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>High-ESR electrolytic</td>\n<td>Random resets, intermittent no-start</td>\n<td>ESR meter; rail ripple &gt; 50 mV</td>\n</tr>\n<tr>\n<td>Cracked connector-pin solder</td>\n<td>Intermittent, vibration-related</td>\n<td>Microscope inspection; flex test while powered</td>\n</tr>\n<tr>\n<td>Failed smart driver IC</td>\n<td>One circuit dead, driver code stored</td>\n<td>Output pin near 0 Ω to ground</td>\n</tr>\n<tr>\n<td>CAN transceiver killed by bus short</td>\n<td>Module alive, silent</td>\n<td>Bench comms with terminator; scope transceiver pins</td>\n</tr>\n<tr>\n<td>Water ingress / corroded vias</td>\n<td>Progressive multi-fault deterioration</td>\n<td>Visual; green corrosion; resistance between adjacent pins</td>\n</tr>\n<tr>\n<td>Lifted pad from previous repair</td>\n<td>Fault returns after \"repair\"</td>\n<td>Microscope; continuity from pad to via</td>\n</tr>\n<tr>\n<td>Silicone coating not removed</td>\n<td>Cold joints on rework</td>\n<td>Joint refuses to wet; residue visible under flux</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>6. Student knowledge check</h2>\n<h3>Practical scenario challenges</h3>\n<p><strong>Scenario 1 — The module that works on the bench.</strong>\nAn ECU is removed from a vehicle with an intermittent no-start. On the bench it powers up, all rails are correct, it communicates, and every output tests correctly. It has been on the bench for two days without fault. The customer has already paid for a \"tested good\" report from another workshop.\n<em>Task:</em> Explain why the bench test may be misleading, name three specific faults that pass a bench test and fail in the vehicle, and describe the tests that would find each.</p>\n<p><strong>Scenario 2 — The scrapyard ECU.</strong>\nA customer supplies a used ECU from a matching vehicle, and asks the workshop to fit it. It is the same part number and the same software version.\n<em>Task:</em> Explain what will and will not work, what data determines whether the vehicle starts, what your options are, and what you would tell the customer before starting the job.</p>\n<hr />\n<h2>7. Answer key</h2>\n<p><strong>Scenario 1 model answer.</strong></p>\n<p><strong>Why the bench test misleads:</strong> a bench test applies clean, stable power at room temperature with no vibration, no harness, and no load. It exercises the module in the one environment it will never experience in service. It proves the module can work; it does not prove the module works in the vehicle.</p>\n<p><strong>Three faults that pass a bench test and fail in the car:</strong></p>\n<ol>\n<li>\n<p><strong>A cracked solder joint at a connector pin.</strong> On the bench, the module lies flat and undisturbed with light test leads. In the vehicle it is bolted to a bracket, carrying a heavy harness, at engine-bay temperature and under constant vibration. <em>Test:</em> inspect every connector pin joint under the microscope at 30×; then power the module on the bench and apply controlled flex and gentle tapping to the connector body while monitoring rails and communication for dropouts. A thermal cycle between a freeze spray and a heat gun while monitoring will often reproduce it.</p>\n</li>\n<li>\n<p><strong>A marginal power supply component that only fails hot, or only at cranking voltage.</strong> The bench supply delivers a steady 13.8 V; the vehicle drops to 8–9 V during cranking and the engine bay reaches 90 °C+. A regulator or electrolytic that is marginal will hold at 13.8 V and 22 °C and fail at 9 V and 90 °C. <em>Test:</em> repeat the rail measurements with the bench supply stepped down to 9 V and again to 7 V, and with the board at 80 °C under a heat gun. Measure rail ripple with the scope at each condition, not just DC voltage.</p>\n</li>\n<li>\n<p><strong>A driver stage or transceiver that fails only under real load or real bus traffic.</strong> Bench actuator tests drive open circuits or small test loads; the vehicle drives a solenoid with real inductance and inrush. A CAN transceiver may work with one terminator on a quiet bench and fail on a busy bus. <em>Test:</em> bench-test outputs into representative loads (an actual injector, an actual solenoid) with a current clamp, and connect the module to a live bus simulator with realistic traffic rather than a bare terminator.</p>\n</li>\n</ol>\n<p><strong>What to tell the customer:</strong> the previous \"tested good\" report is not wrong, it is incomplete. State plainly that the module has passed a static bench test and that the remaining work is to test it under vehicle conditions, and quote for that specifically.</p>\n<p><strong>Scenario 2 model answer.</strong></p>\n<p><strong>What will work:</strong> the hardware and the operating software are correct for the vehicle, so the module will power up and communicate. Sensor inputs and output drivers will function.</p>\n<p><strong>What will not work, and why:</strong> the used module carries the <strong>donor vehicle's EEPROM data</strong> — its immobiliser synchronisation, its VIN, its component protection status, its learned adaptations, and on some platforms its coding/variant configuration. The vehicle's immobiliser will present a challenge the module cannot answer correctly, and the engine will crank and not start, or start and cut out after a few seconds. On brands with component protection, the module will additionally refuse most functions and log a protection code.</p>\n<p><strong>What determines whether it starts:</strong> the match between the immobiliser data held in the ECU's EEPROM (or in a dedicated security chip) and the data held by the vehicle's immobiliser module and key transponders. This is EEPROM territory, not flash territory — the software version being identical is irrelevant to it.</p>\n<p><strong>Options, in order of preference:</strong>\n1. <strong>Repair the customer's original module.</strong> If the fault is a driver, a capacitor or a joint, this is the cleanest outcome: adaptations, immobiliser data and VIN are all preserved and no synchronisation work is needed.\n2. <strong>Transfer the original module's EEPROM data into the donor</strong>, where the architecture supports it and the original board's memory is readable. This is Module 5 and Module 6 work combined and requires verified reads and archives.\n3. <strong>Have the donor module synchronised to the vehicle</strong> through the manufacturer's own procedure, which on most brands requires OEM online access and proof of ownership. This is the correct route and often the only lawful one on modern vehicles.\n4. <strong>Virgin/new module</strong> flashed and coded to the vehicle through the OEM process — most expensive, always works, no legal ambiguity.</p>\n<p><strong>What to tell the customer before starting:</strong>\n- Fitting the used module alone will almost certainly not start the vehicle, and the labour to find that out is chargeable.\n- Immobiliser synchronisation requires proof that they own the vehicle — logbook and identification — and the workshop will require it before any security-related work begins. This is not bureaucracy; it is the line between a repair business and handling stolen vehicles.\n- Give a firm estimate for the synchronisation route, and be clear that a used module with an unknown history may itself be faulty, in which case the diagnostic time is not recoverable.\n- If the original module is repairable, recommend that route and explain why it is cheaper and cleaner overall.</p>", "quiz": [{"q": "A module on the bench draws 30 mA in standby, then on ignition the current rises briefly and the supply repeatedly current-limits and recovers. The most likely cause is:", "options": [{"k": "A", "t": "A failed microcontroller"}, {"k": "B", "t": "A watchdog reset loop caused by a rail collapsing under load, or a shorted driver"}, {"k": "C", "t": "A corrupt EEPROM"}, {"k": "D", "t": "A missing 120 Ω terminator"}], "answer": "B", "why": "Repeated current rise and collapse is the signature of the module attempting to boot and being reset. Either a rail sags once the load is applied, or a shorted output draws the supply into limit. A failed MCU produces a static low current, not a cycling one."}, {"q": "Before writing to a serial EEPROM, the mandatory step is:", "options": [{"k": "A", "t": "Clear the DTCs on the vehicle"}, {"k": "B", "t": "Take two independent reads and confirm they are byte-identical, then archive the original"}, {"k": "C", "t": "Erase the device first"}, {"k": "D", "t": "Remove the conformal coating from the whole board"}], "answer": "B", "why": "A single read may be corrupt, and once the device is overwritten the original is gone. Two identical reads plus an archived copy is the only defensible practice, and the archive is the workshop's evidence if the vehicle is later disputed."}, {"q": "When removing a component on a heavy automotive ground plane, the correct approach is:", "options": [{"k": "A", "t": "A smaller tip held on the joint for longer"}, {"k": "B", "t": "A larger tip with a shorter dwell, plus board preheat"}, {"k": "C", "t": "Higher airflow on the hot air station"}, {"k": "D", "t": "Low-melt alloy applied without flux"}], "answer": "B", "why": "Heat delivered slowly conducts into the plane and lifts pads. A larger tip transfers heat faster; preheat reduces the differential the joint has to bridge. Longer dwell with a small tip is the classic pad-destroying mistake."}, {"q": "A 93C56 EEPROM is read in-circuit and the resulting file looks structured but the data is not recognised by the tool. The most likely cause is:", "options": [{"k": "A", "t": "The chip is faulty"}, {"k": "B", "t": "The ORG pin organisation (8-bit vs 16-bit) was set wrongly for the read"}, {"k": "C", "t": "The board voltage was too low"}, {"k": "D", "t": "The device was written by another manufacturer"}], "answer": "B", "why": "93Cxx devices can be organised 8-bit or 16-bit depending on the ORG pin state. Reading in the wrong organisation byte-swaps the data — the file has the right size and looks structured, but nothing parses."}, {"q": "A driver IC is found shorted and replaced. The module is refitted and the new driver fails immediately. The omitted step was:", "options": [{"k": "A", "t": "Recoating the board"}, {"k": "B", "t": "Clearing the DTCs"}, {"k": "C", "t": "Finding and repairing the external short that killed the original driver"}, {"k": "D", "t": "Reflashing the module"}], "answer": "C", "why": "The driver was destroyed by an external condition. Replacing the driver without finding the shorted harness, the failed actuator or the water-filled connector guarantees the replacement dies. Establishing <em>why</em> a component failed is part of the repair, not an optional extra."}], "search": " Module 5 — Vehicle Computer Architecture, Micro-Soldering & Bench Repair Hours: 70 (26 lecture / 44 bench) Prerequisite: Modules 1–4 signed off. Gated module — no student opens a module casing before this point. 1. Module overview & learning objectives Most technicians treat a control module as a sealed black box: it either works or it is replaced at £600–£2,400 plus coding. This module opens the box. The commercial argument is straightforward — a large proportion of \"failed\" modules have one failed component, usually a power supply capacitor, a driver IC, or a cracked solder joint on a connector pin. By the end of the module the student can: 5.1 Describe the internal block architecture of an ECU, TCU and BCM and identify each stage on a real board. 5.2 Open a module without destroying it, and reseal it to an equivalent ingress standard. 5.3 Bench-power a module on a current-limited supply and interpret its current draw as a diagnostic signal. 5.4 Identify power supply stages, driver ICs, EEPROM, flash and MCU by package and marking. 5.5 Perform SMD rework: remove and replace 0402–1206 passives, SOIC/TSSOP ICs, and reflow BGA joints. 5.6 Read and write serial EEPROM in-circuit and off-board, and manage the data integrity risks. 5.7 Establish BDM/JTAG/boot connections on a bench and understand what each grants access to. 2. Comprehensive theory & lecture notes 2.1 The universal ECU block diagram Every module, from a £30 door unit to a £3,000 engine controller, follows the same skeleton: Battery feed ──► Reverse-polarity + transient protection (series diode, TVS, choke) │ ▼ Pre-regulator (buck / linear) ──► 5 V logic rail │ ──► 5 V sensor supply (protected) │ ──► 3.3 V / 1.8 V core rails ▼ Reset / watchdog supervisor │ ▼ ┌──────────► Microcontroller (MCU) ◄──────────┐ │ │ │ │ │ Input │ │ │ Comms conditioning │ │ │ transceivers (dividers, │ │ │ (CAN, LIN, filters, ▼ ▼ ▼ FlexRay) op-amps, Internal External EEPROM comparators) flash flash (adaptations, immobiliser, VIN, mileage) │ ▼ Output driver stage (smart high/low-side drivers, H-bridges, injector drivers, ignition drivers) │ ▼ Connector / harness Students must be able to point at each stage on an unfamiliar board within ten minutes. Once you can do that, an unknown ECU stops being unknown. 2.2 Power supply stages — where most failures live The input stage sees the worst environment on the vehicle: load dump transients to 60–120 V, reverse polarity from jump-starting, and cranking dips to 6 V. Component Function Failure signature Series/reverse diode Blocks reverse polarity Shorted → module dead, feeds pull down; open → module dead, no rail TVS / transient suppressor Clamps load dump Shorted → blows the module fuse repeatedly Input electrolytic Bulk energy store High ESR → rail ripple → random resets Buck regulator IC 12 V → 5 V efficiently Dead → no rails; unstable → resets under load LDO regulators Clean 3.3 V / 1.8 V core Dead → MCU never starts Watchdog/supervisor Holds MCU in reset until rails stable Faulty → continuous reset loop, module \"boots and dies\" Sensor 5 V supply Feeds external sensors, current-limited Shorted externally → protection trips → multiple sensor codes Teaching point: a module that \"boots and dies\" repeatedly is almost never a failed MCU. It is a rail that sags under load or a watchdog holding reset. Scope each rail at power-up and watch for the sequence: input, pre-regulator, core, then reset release. Rail values to expect: 5.00 V ±2% logic, 5.00 V ±1% sensor reference (tighter, because sensor accuracy depends on it), 3.30 V ±3% core on modern MCUs, 1.8 V or 1.2 V on high-performance cores. Ripple on any logic rail should be under 50 mV p-p . 2.3 Microcontrollers The families a technician meets: Family Typical use Notes Infineon TriCore (TC17xx, TC2xx, AURIX TC3xx) Bosch EDC17/MED17/MD1/MG1 Dominant in modern European powertrain NXP/Freescale MPC5xxx (Power Architecture) Continental/Siemens, Delphi Common in SIMOS, SID, DCM Infineon C167 / ST10 Bosch EDC15/16, ME7 Older generation, 16-bit Renesas SH / RH850 Japanese OEMs, Denso Widespread on Toyota/Honda/Nissan Motorola HC08/HC12 Older BCM, TCU, immobiliser Simple, often EEPROM-adjacent ARM Cortex-M / R Modern body, gateway, ADAS Increasingly universal The MCU contains internal flash (program + calibration), internal RAM, and often an internal EEPROM emulation area. The MCU is rarely the failed part. It is protected, low-power and thermally stable. Students who conclude \"the processor has failed\" have usually not measured the rails. 2.4 Memory devices — what lives where Device Typical package Contents Consequence of loss Internal MCU flash Inside MCU Operating software + calibration Module non-functional; needs reflash External flash (NOR) TSOP48, SOP44, BGA Program/calibration on split architectures Same Serial EEPROM (93Cxx, 24Cxx, 95xxx/SPI) SOIC8, TSSOP8 Adaptations, VIN, immobiliser data, mileage, coding Module works but is \"not this car\" FRAM / EERAM SOIC8 Fast-write adaptation store As EEPROM Flash on a separate BGA BGA Large calibration/map data Requires reball to replace The single most important distinction in this module: program/calibration data is generic to the model ; EEPROM data is unique to this vehicle . Replace an ECU and you can flash the software — but the EEPROM content (immobiliser sync, VIN, learned adaptations, component protection) is what makes it belong to the car. This is why \"used ECU from the scrapyard\" jobs succeed or fail. Serial EEPROM identification by marking: - 24Cxx — I²C, 2-wire. 24C02 = 2 kbit, 24C16 = 16 kbit, 24C64 = 64 kbit. - 93Cxx — Microwire, 3-wire. 93C46 = 1 kbit, 93C56/66 = 2/4 kbit. Note the ORG pin selects 8-bit or 16-bit organisation — reading with the wrong organisation gives byte-swapped nonsense that looks almost right. - 95xxx / 25xxx — SPI. 95040, 95160, 95320, 95640 etc., the number indicating kbit. 2.5 Output driver stages Modern modules use smart driver ICs rather than bare transistors. Common families: Bosch CJ/CY series, Infineon Profet and TLE, ST VNQ/VN5 series, NXP MC33xxx. They integrate: - The MOSFET output - Current sensing and limiting - Over-temperature shutdown with automatic retry - Open-load detection (a small sense current when off) - Short-to-battery and short-to-ground detection - A diagnostic feedback line to the MCU Consequences for repair: - A \"circuit open\" DTC is generated by the driver's own diagnostic , usually with the output off, and can be triggered by a load whose resistance is out of the expected window as well as by an actual break. - A driver killed by an external short is the most common repairable ECU fault. The harness shorted, the driver died protecting itself, and the module is otherwise perfect. Replace the driver IC and repair the harness fault first , or the new driver dies in seconds. - Driver ICs are usually available; they are standard automotive parts. Identify by top marking, cross-reference the datasheet, and confirm the pinout matches before ordering. 2.6 Micro-soldering — theory before practice Alloy behaviour: - Leaded Sn63/Pb37 — eutectic, melts sharply at 183 °C . Easiest to work. - Lead-free SAC305 — melts 217–220 °C , pastier transition, more heat needed, more prone to dull joints that look cold but are not. - Low-melt alloy (bismuth-based, ~138 °C) — used to lower the melting point of an existing joint for removal of multi-pin parts. It contaminates the joint and must be fully removed before resoldering. Flux is not optional. Flux removes oxide and improves thermal transfer. No-clean flux still leaves residue that can be hygroscopic on an automotive board — clean with IPA and a brush after any rework, then inspect under the microscope. Temperature discipline: Task Iron tip temperature Hot air Leaded rework 320–350 °C 300–340 °C Lead-free rework 350–380 °C 340–380 °C Ground plane / large pad +20–30 °C and a bigger tip, not longer dwell Preheat board to 120–150 °C Sensitive small IC 300–320 °C, fast Low airflow, shielded neighbours The rule that saves boards: use a larger tip and a shorter dwell , never a smaller tip and a longer dwell. Heat delivered slowly lifts pads; heat delivered quickly does not. A lifted pad turns a 20-minute repair into a scrap board. Preheating is mandatory for anything above SOIC size on an automotive board. Automotive PCBs have heavy ground planes and often 4–6 layers; without a preheater at 120–150 °C, the hot air station cannot reach reflow at the joint without cooking the package. ESD: wrist strap to a common grounding point, ESD mat, grounded iron tip. Measure your bench: tip-to-ground should be under 2 Ω, and the mat should present 10⁶–10⁹ Ω to ground — a mat that is a dead short is itself a hazard. 2.7 Conformal coating Automotive boards are coated in acrylic, silicone or polyurethane. You cannot solder through it. Acrylic — softens with IPA or a dedicated stripper. Most common, easiest. Silicone — will not dissolve; must be mechanically scraped or removed with a specific silicone remover. Polyurethane / parylene — hardest; mechanical removal under the microscope, carefully. After repair, recoat . An uncoated automotive board in an engine bay corrodes within a season. This is the step students skip and the reason repaired modules come back. 2.8 Bench setup and bench testing A bench setup means powering the module outside the vehicle with only the pins it needs. Minimum pins for most ECUs: 1. Battery permanent (30) 2. Ignition/switched (15) 3. Power grounds — usually several, all must be connected 4. Signal/sensor ground 5. CAN-H and CAN-L, with a 120 Ω resistor fitted across them (the ECU normally has a partner terminator on the vehicle — without it, the bus will not communicate) 6. Sometimes a wake or enable line, and sometimes a crank signal for the ECU to leave standby Current draw as a diagnostic: Current at 12 V Interpretation 0 mA No feed reaching the board, or open input protection A few mA, stable Module in standby — normal before ignition 100–500 mA on ignition Normal awake draw for most ECUs Rising then cutting out repeatedly Watchdog reset loop, or rail collapsing under load Immediate current limit at supply maximum Shorted input stage, shorted driver, or reversed supply Very low, never rises with ignition MCU not starting — check core rails and reset line Always use a current-limited bench supply set to about 2 A. A module with a shorted driver connected to a vehicle battery destroys the board and any evidence of what failed. 2.9 BDM, JTAG and boot mode These are the debug and programming interfaces built into the MCU. BDM (Background Debug Mode) — Motorola/NXP debug interface, accessed via specific pads on the board. Used to read and write internal flash on ECUs that cannot be read through OBD. JTAG (IEEE 1149.1) — general debug/boundary-scan interface. Present on many MCUs, often with pads unpopulated. Boot mode — pulling a specific MCU pin to a defined level at power-up causes the MCU to start a factory bootloader instead of the application, exposing a serial or CAN programming channel. What each grants: direct access to the MCU's memory, bypassing the application software's security layer. This is how a bricked module is recovered, how a checksum-corrupted flash is repaired, and how a read is obtained from an ECU whose OBD protocol is locked. Risks students must understand before touching: 1. Boot pins are usually held with a fine wire or a probe on a bare pad . Slip, and you short an adjacent line and destroy the MCU. 2. Writing to the wrong memory region bricks the module in a way that may not be recoverable. 3. Read before you write. Always. Twice. Two independent reads must be byte-identical before any write is attempted. A single read may be corrupt and you will not know until you have overwritten the original. 4. Some MCUs have a read-protect fuse . Attempting to defeat it can permanently lock the device. 5. Voltage matters — many boot connections require a precise voltage on a specific pin (e.g. 5 V or 12 V to a test point). Guessing damages the MCU. Legitimacy boundary for this module: BDM/boot access is taught for recovery, repair, and calibration work on vehicles the workshop has been authorised to work on . Reading and writing modules to defeat theft protection is covered — and bounded — in Module 6. 3. Tools & equipment needed Stereo microscope, 7–45× zoom, with ring light and adequate working distance Temperature-controlled soldering station with micro tips (0.2 mm conical, 1.6 mm chisel, mini-wave) Hot air rework station with 3–8 mm nozzles PCB preheater , 120–200 °C, IR or hotplate — not optional for automotive boards Bench power supply 0–30 V / 0–5 A with adjustable current limit and a readable current display Oscilloscope (from Module 2) for rail and reset-line analysis ESR meter Hot tweezers for passives Solder: Sn63/Pb37 0.3 mm and SAC305 0.3 mm; low-melt removal alloy Flux: no-clean gel and rosin liquid; solder wick 1.5 mm and 2.5 mm IPA 99%, brushes, ultrasonic bath, lint-free wipes Conformal coating (acrylic) and applicator Kapton tape, ESD mat, wrist strap, ionised air where budget allows EEPROM programmer (XPROG, UPA-USB, TL866 class) with SOIC8 clip and adapters BDM/boot tooling (Module 6 hardware doubles here) Practice boards — scrap ECUs, at least three per student, plus SMD practice kits 4. Step-by-step practical lab exercise Lab 5.1 — Recover a \"dead\" ECU on the bench Scenario: An engine ECU is reported as no-communication and the vehicle will not start. The vehicle-side wiring has already been proven good (Modules 1 and 3 methods) and the ECU's supplies and grounds at the connector are correct. Record everything before removal. Photograph connectors, note the part number, hardware number and software number from the label. Record the VIN. Remove and inspect externally. Water staining, corrosion at the connector, a swollen case, or a burnt smell each redirect the investigation immediately. Open the casing. Most are a pressed metal lid with a bead of sealant, some are riveted, some are ultrasonically welded. Use the correct method — cut the sealant bead, drill out rivets, or split the weld line with a thin blade — and expect to remake the seal at reassembly. Inspect the board under the microscope before applying power. Look for: corrosion tracks, burnt components, bulged electrolytics, cracked solder at connector pins (the highest-vibration joints on the board), and any evidence of previous repair. Bench-power with current limit set to 2 A. Apply permanent feed and grounds only. Record standby current. Measure the rails in order: input after the protection diode, pre-regulator output, 5 V logic, 5 V sensor supply, 3.3 V core. Any rail absent or low locates the failed stage immediately. Scope the reset line at power-up. It should assert low, then release cleanly once rails are stable and stay high. A reset line pulsing continuously means the watchdog is not being serviced — either a rail is marginal or the MCU is not running. Apply ignition feed. Current should rise to normal awake draw. If the supply current-limits, remove ignition and look for a shorted driver: measure each output pin to ground with the board unpowered. A driver that reads near 0 Ω to ground is shorted. Attempt communication. Fit the 120 Ω terminator across CAN-H and CAN-L, connect the tool, and attempt a read. Communication on the bench with the vehicle absent proves the module is alive and points the whole investigation back to the vehicle. Repair the identified fault. Typical findings in order of frequency: high-ESR electrolytic, cracked connector-pin solder joint, failed smart driver IC, corroded via under a water track, failed regulator. Retest all rails and the awake current after repair. Clean, recoat, reseal, refit. Verify on the vehicle, and confirm any adaptation resets required. Lab 5.2 — Read, verify and restore a serial EEPROM Identify the device under the microscope. Read the top marking; confirm the family (24Cxx / 93Cxx / 95xxx) and capacity. Confirm the pinout from the datasheet , not from memory. Pin 1 is marked by a dot or a notch — orientation errors destroy the chip. Decide in-circuit or off-board. In-circuit with a SOIC clip is faster but fails when other devices on the same bus hold lines, or when the board's regulator back-feeds. If the read is inconsistent, go off-board. For 93Cxx devices, establish the ORG pin state on the board. Reading in the wrong organisation produces a file that looks plausible and is wrong. Read the device. Then read it again. Save both files with distinct names. Compare the two files byte for byte. They must be identical. If they differ, the read is unreliable — improve the connection, lower the read speed, or remove the chip. Do not proceed on a single read. Archive the verified original with the vehicle's VIN, date, part number and technician name in the filename, to a location that is backed up. This archive is the workshop's insurance policy and, in a dispute, its evidence. Only now make the intended change. Write, then read back and verify against the intended file, not against the original. Refit, power on the bench, confirm the module boots and the change took effect before returning it to the vehicle. Lab 5.3 — SMD rework progression Students complete these in order, each signed off before moving on: Remove and refit ten 0805 resistors on a practice board. Assess: pad condition, joint shape, no bridging. Repeat at 0603, then 0402, using hot tweezers. Remove and refit a SOIC8 EEPROM using hot air with neighbours shielded by Kapton. Assess: no lifted pads, correct orientation, clean pins. Remove and refit a TSSOP20 driver IC. Drag-solder the pins, then wick the bridges. Assess under microscope at 30×. Repair a deliberately lifted pad with a jumper wire from the nearest via, secured with epoxy. Assess: mechanical strength and correct routing. Reflow a BGA joint on a scrap board with preheat, then inspect for shorts by resistance measurement. Clean and recoat the practice board to a standard the instructor accepts. 5. Common failure modes & troubleshooting trees Tree A — Module dead on the bench No response on bench ├─ Standby current 0 mA? │ ├─ YES → check input protection diode, fuse resistor, connector pin │ │ continuity to board. Often a corroded pin or a cracked joint. │ └─ NO → continue ├─ Measure rails in sequence │ ├─ Pre-regulator output missing → regulator IC or its input capacitor │ ├─ 5 V logic missing → LDO or short downstream. Isolate by lifting │ │ the rail's decoupling or by thermal imaging for the hot spot. │ ├─ Core rail missing → core regulator, or MCU shorted internally │ └─ All rails present → continue ├─ Reset line behaviour at power-up │ ├─ Held low permanently → supervisor IC or a rail below its threshold │ ├─ Pulsing → watchdog not serviced. MCU not executing, or a marginal rail. │ └─ Releases and stays high → MCU is running. Fault is comms or software. └─ MCU running but no communication ├─ 120 Ω terminator fitted on the bench? (Most common bench mistake.) ├─ CAN transceiver output levels correct? Scope both pins. └─ Transceiver dead → replaceable IC, usually killed by a bus short to battery. Repair the vehicle wiring or it dies again. Tree B — Module works but a single function is dead One output not working ├─ Measure that output pin to ground, board unpowered │ ├─ Near 0 Ω → driver shorted. Identify the driver IC serving that pin. │ └─ Normal/high → continue ├─ Bench-command the output and scope the pin │ ├─ No switching → driver failed open, or MCU not commanding │ │ (check enabling conditions — many outputs need engine data) │ └─ Switching correct → the fault is external to the module ├─ BEFORE replacing the driver: establish WHY it failed. │ A shorted harness, a failed actuator or a water-filled connector │ will kill the replacement within seconds of refitting. └─ After replacement: bench-test the output under a representative load, not open-circuit Tree C — Repaired module misbehaves after refitting Repaired module refitted, new problems ├─ Were adaptations lost? → run the required relearn procedures │ (throttle, idle, transmission, steering angle, DPF/regen counters) ├─ Was EEPROM data altered or corrupted during rework? │ → compare current EEPROM against the archived original ├─ Is the module now reporting a different VIN or failing component │ protection? → EEPROM or coding data mismatch ├─ Did conformal coating removal leave residue bridging fine pitch? │ → clean thoroughly under microscope, re-inspect at 30× └─ Did the reseal fail? → water ingress recurs within weeks; check the seal integrity and drainage path Frequently seen real-world failures Failure Symptom Confirming test High-ESR electrolytic Random resets, intermittent no-start ESR meter; rail ripple > 50 mV Cracked connector-pin solder Intermittent, vibration-related Microscope inspection; flex test while powered Failed smart driver IC One circuit dead, driver code stored Output pin near 0 Ω to ground CAN transceiver killed by bus short Module alive, silent Bench comms with terminator; scope transceiver pins Water ingress / corroded vias Progressive multi-fault deterioration Visual; green corrosion; resistance between adjacent pins Lifted pad from previous repair Fault returns after \"repair\" Microscope; continuity from pad to via Silicone coating not removed Cold joints on rework Joint refuses to wet; residue visible under flux 6. Student knowledge check Practical scenario challenges Scenario 1 — The module that works on the bench. An ECU is removed from a vehicle with an intermittent no-start. On the bench it powers up, all rails are correct, it communicates, and every output tests correctly. It has been on the bench for two days without fault. The customer has already paid for a \"tested good\" report from another workshop. Task: Explain why the bench test may be misleading, name three specific faults that pass a bench test and fail in the vehicle, and describe the tests that would find each. Scenario 2 — The scrapyard ECU. A customer supplies a used ECU from a matching vehicle, and asks the workshop to fit it. It is the same part number and the same software version. Task: Explain what will and will not work, what data determines whether the vehicle starts, what your options are, and what you would tell the customer before starting the job. 7. Answer key Scenario 1 model answer. Why the bench test misleads: a bench test applies clean, stable power at room temperature with no vibration, no harness, and no load. It exercises the module in the one environment it will never experience in service. It proves the module can work; it does not prove the module works in the vehicle. Three faults that pass a bench test and fail in the car: A cracked solder joint at a connector pin. On the bench, the module lies flat and undisturbed with light test leads. In the vehicle it is bolted to a bracket, carrying a heavy harness, at engine-bay temperature and under constant vibration. Test: inspect every connector pin joint under the microscope at 30×; then power the module on the bench and apply controlled flex and gentle tapping to the connector body while monitoring rails and communication for dropouts. A thermal cycle between a freeze spray and a heat gun while monitoring will often reproduce it. A marginal power supply component that only fails hot, or only at cranking voltage. The bench supply delivers a steady 13.8 V; the vehicle drops to 8–9 V during cranking and the engine bay reaches 90 °C+. A regulator or electrolytic that is marginal will hold at 13.8 V and 22 °C and fail at 9 V and 90 °C. Test: repeat the rail measurements with the bench supply stepped down to 9 V and again to 7 V, and with the board at 80 °C under a heat gun. Measure rail ripple with the scope at each condition, not just DC voltage. A driver stage or transceiver that fails only under real load or real bus traffic. Bench actuator tests drive open circuits or small test loads; the vehicle drives a solenoid with real inductance and inrush. A CAN transceiver may work with one terminator on a quiet bench and fail on a busy bus. Test: bench-test outputs into representative loads (an actual injector, an actual solenoid) with a current clamp, and connect the module to a live bus simulator with realistic traffic rather than a bare terminator. What to tell the customer: the previous \"tested good\" report is not wrong, it is incomplete. State plainly that the module has passed a static bench test and that the remaining work is to test it under vehicle conditions, and quote for that specifically. Scenario 2 model answer. What will work: the hardware and the operating software are correct for the vehicle, so the module will power up and communicate. Sensor inputs and output drivers will function. What will not work, and why: the used module carries the donor vehicle's EEPROM data — its immobiliser synchronisation, its VIN, its component protection status, its learned adaptations, and on some platforms its coding/variant configuration. The vehicle's immobiliser will present a challenge the module cannot answer correctly, and the engine will crank and not start, or start and cut out after a few seconds. On brands with component protection, the module will additionally refuse most functions and log a protection code. What determines whether it starts: the match between the immobiliser data held in the ECU's EEPROM (or in a dedicated security chip) and the data held by the vehicle's immobiliser module and key transponders. This is EEPROM territory, not flash territory — the software version being identical is irrelevant to it. Options, in order of preference: 1. Repair the customer's original module. If the fault is a driver, a capacitor or a joint, this is the cleanest outcome: adaptations, immobiliser data and VIN are all preserved and no synchronisation work is needed. 2. Transfer the original module's EEPROM data into the donor , where the architecture supports it and the original board's memory is readable. This is Module 5 and Module 6 work combined and requires verified reads and archives. 3. Have the donor module synchronised to the vehicle through the manufacturer's own procedure, which on most brands requires OEM online access and proof of ownership. This is the correct route and often the only lawful one on modern vehicles. 4. Virgin/new module flashed and coded to the vehicle through the OEM process — most expensive, always works, no legal ambiguity. What to tell the customer before starting: - Fitting the used module alone will almost certainly not start the vehicle, and the labour to find that out is chargeable. - Immobiliser synchronisation requires proof that they own the vehicle — logbook and identification — and the workshop will require it before any security-related work begins. This is not bureaucracy; it is the line between a repair business and handling stolen vehicles. - Give a firm estimate for the synchronisation route, and be clear that a used module with an unknown history may itself be faulty, in which case the diagnostic time is not recoverable. - If the original module is repairable, recommend that route and explain why it is cheaper and cleaner overall. ", "words": 4541}, {"id": "module-6-flashing-immobiliser", "label": "Module 6", "title": "Flashing & immobiliser", "colour": "#1F6FB2", "html": "<h1>Module 6 — ECU Reprogramming, Flashing &amp; Immobiliser Systems</h1>\n<p><strong>Hours:</strong> 70 (26 lecture / 44 bench and vehicle)\n<strong>Prerequisite:</strong> Module 5 signed off. <strong>Gated module</strong> — students must hold a signed record of understanding on the legal framework in §2.9 before any immobiliser practical.</p>\n<hr />\n<h2>1. Module overview &amp; learning objectives</h2>\n<p>This module covers two skills the trade pays well for and that carry real risk: putting new software into a module, and making a module belong to a vehicle. Get either wrong and you have a non-functional vehicle on a ramp and an angry customer.</p>\n<p>By the end of the module the student can:</p>\n<ul>\n<li><strong>6.1</strong> Distinguish OBD, bench and boot programming, and select the right one for a given module.</li>\n<li><strong>6.2</strong> Prepare a vehicle correctly for a programming event so the flash cannot be interrupted.</li>\n<li><strong>6.3</strong> Recover a module bricked by an interrupted flash.</li>\n<li><strong>6.4</strong> Ex
