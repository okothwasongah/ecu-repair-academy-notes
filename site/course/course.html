<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Master Certification in Automotive Electronics &amp; ECU Engineering</title>
<style>
:root{
  --ink:#14181C; --ink-2:#3C444C; --ink-3:#6E7781;
  --paper:#E9EBEE; --panel:#FFFFFF; --rule:#C7CBD1;
  --ground:#6B4A2F; --signal:#C4322A; --probe:#E8B33A; --live:#1F6FB2;
  --pass:#2E7D5B;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --nav:300px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.6; -webkit-text-size-adjust:100%;
}
/* ---- the signature: a measurement rail with tick marks ---- */
.rail{
  position:fixed; left:0; top:0; bottom:0; width:14px; z-index:40;
  background:
    repeating-linear-gradient(to bottom,var(--rule) 0 1px,transparent 1px 12px),
    var(--panel);
  border-right:1px solid var(--rule);
}
.rail i{
  position:absolute; left:0; width:14px; display:block;
  background:var(--probe); transition:height .5s cubic-bezier(.2,.8,.2,1);
  top:0; height:0;
}
@media (max-width:900px){ .rail{display:none} }

/* ---- shell ---- */
.shell{display:flex; min-height:100vh; padding-left:14px}
@media (max-width:900px){ .shell{padding-left:0; display:block} }

nav{
  width:var(--nav); flex:0 0 var(--nav); background:var(--panel);
  border-right:1px solid var(--rule); position:sticky; top:0; height:100vh;
  overflow-y:auto; padding:22px 0 40px;
}
.brand{padding:0 20px 18px; border-bottom:1px solid var(--rule); margin-bottom:14px}
.brand .eyebrow{
  font-family:var(--mono); font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--signal); margin-bottom:8px
}
.brand h1{
  font-size:19px; line-height:1.18; margin:0; font-weight:800;
  letter-spacing:-.02em; text-transform:uppercase;
}
.brand .sub{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-top:8px}

.searchwrap{padding:0 16px 14px}
#q{
  width:100%; padding:9px 11px; border:1px solid var(--rule); background:var(--paper);
  font-family:var(--mono); font-size:12px; color:var(--ink); border-radius:0;
}
#q:focus{outline:2px solid var(--live); outline-offset:1px}

.navlist{list-style:none; margin:0; padding:0}
.navlist a{
  display:grid; grid-template-columns:4px 1fr auto; gap:11px; align-items:center;
  padding:11px 16px 11px 12px; text-decoration:none; color:var(--ink);
  border-bottom:1px solid var(--paper);
}
.navlist a:hover{background:var(--paper)}
.navlist a.on{background:var(--paper); box-shadow:inset -3px 0 0 var(--ink)}
.wire{width:4px; height:32px; display:block}
.navlist .lab{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.navlist .ttl{font-size:14px; font-weight:600; letter-spacing:-.01em; line-height:1.25}
.tick{font-family:var(--mono); font-size:10px; color:var(--ink-3)}
.tick.done{color:var(--pass); font-weight:700}

main{flex:1; min-width:0; padding:34px 44px 100px; max-width:960px}
@media (max-width:900px){
  nav{position:static; width:auto; height:auto; border-right:0; border-bottom:1px solid var(--rule)}
  main{padding:22px 18px 80px}
}

/* ---- reading view ---- */
article h1{
  font-size:31px; line-height:1.1; letter-spacing:-.03em; font-weight:800;
  text-transform:uppercase; margin:0 0 6px; max-width:22ch;
}
article h2{
  font-size:13px; font-family:var(--mono); letter-spacing:.13em; text-transform:uppercase;
  color:var(--signal); margin:44px 0 12px; padding-bottom:7px; border-bottom:2px solid var(--ink);
}
article h3{font-size:19px; letter-spacing:-.01em; margin:30px 0 8px; font-weight:700}
article h4{font-size:15px; margin:20px 0 6px; font-weight:700; color:var(--ink-2)}
article p{margin:0 0 13px; max-width:74ch}
article ul,article ol{max-width:74ch; padding-left:22px}
article li{margin-bottom:5px}
article strong{font-weight:700}
article blockquote{
  margin:18px 0; padding:14px 18px; border-left:4px solid var(--probe);
  background:var(--panel); font-size:15px;
}
article code{font-family:var(--mono); font-size:12.5px; background:var(--panel); padding:1px 5px; border:1px solid var(--rule)}
article pre{
  background:var(--ink); color:#E4E7EA; padding:16px 18px; overflow-x:auto;
  font-family:var(--mono); font-size:12px; line-height:1.55; border-left:4px solid var(--probe);
}
article pre code{background:none; border:0; color:inherit; padding:0; font-size:12px}
article table{border-collapse:collapse; width:100%; margin:16px 0; font-size:13.5px; background:var(--panel)}
article th{
  text-align:left; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; padding:9px 11px; border-bottom:2px solid var(--ink); vertical-align:bottom;
}
article td{padding:9px 11px; border-bottom:1px solid var(--rule); vertical-align:top}
article tr:hover td{background:var(--paper)}
article hr{border:0; border-top:1px solid var(--rule); margin:34px 0}
.tablescroll{overflow-x:auto; -webkit-overflow-scrolling:touch}

.meta{
  font-family:var(--mono); font-size:11px; color:var(--ink-3);
  letter-spacing:.06em; text-transform:uppercase; margin:0 0 26px;
  padding-bottom:14px; border-bottom:1px solid var(--rule);
}

/* ---- assessment ---- */
.assess{margin:52px 0 0; border:2px solid var(--ink); background:var(--panel)}
.assess header{padding:16px 20px; border-bottom:1px solid var(--rule); display:flex; justify-content:space-between; align-items:baseline; gap:14px; flex-wrap:wrap}
.assess header h2{margin:0; border:0; padding:0; font-size:12px}
.assess .thresh{font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.qcard{padding:18px 20px; border-bottom:1px solid var(--paper)}
.qcard .n{font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--signal); text-transform:uppercase}
.qcard .stem{font-weight:600; margin:6px 0 12px; max-width:70ch}
.opt{display:flex; gap:10px; align-items:flex-start; padding:9px 11px; border:1px solid var(--rule); margin-bottom:6px; cursor:pointer; background:var(--paper); font-size:14.5px}
.opt:hover{border-color:var(--ink)}
.opt input{margin:3px 0 0}
.opt.correct{border-color:var(--pass); background:#EAF3EE}
.opt.wrong{border-color:var(--signal); background:#FAEDEC}
.why{margin-top:10px; padding:11px 13px; background:var(--paper); border-left:3px solid var(--live); font-size:13.5px; display:none}
.why.show{display:block}
.assess footer{padding:18px 20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
button{
  font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  padding:11px 18px; border:2px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer;
}
button:hover{background:var(--signal); border-color:var(--signal)}
button.ghost{background:transparent; color:var(--ink)}
button.ghost:hover{background:var(--ink); color:#fff}
button:disabled{opacity:.4; cursor:not-allowed}
.score{font-family:var(--mono); font-size:12px; letter-spacing:.06em}
.score.pass{color:var(--pass); font-weight:700}
.score.fail{color:var(--signal); font-weight:700}

/* ---- gate ---- */
/* ---- certificate ---- */
.cert{background:var(--panel); border:3px double var(--ink); padding:44px; text-align:center; margin-top:30px}
.cert .eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--signal)}
.cert h2{border:0; padding:0; color:var(--ink); font-family:var(--sans); font-size:27px; text-transform:uppercase; letter-spacing:-.02em; margin:14px 0}
.cert .name{font-size:22px; font-weight:800; border-bottom:2px solid var(--ink); display:inline-block; padding:4px 26px; margin:14px 0}
.cert .ref{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-top:22px}
.locked{opacity:.5}

.hits{list-style:none; padding:0; margin:0}
.hits li{border-bottom:1px solid var(--rule); padding:14px 0}
.hits .lab{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--signal)}
.hits a{color:var(--ink); font-weight:600; text-decoration:none; font-size:16px}
.hits a:hover{text-decoration:underline}
.hits .snip{font-size:13.5px; color:var(--ink-2); margin-top:4px}
mark{background:var(--probe); color:var(--ink); padding:0 2px}

@media print{
  nav,.rail,.assess,button,.searchwrap{display:none!important}
  .shell{padding:0} main{padding:0; max-width:none}
  body{background:#fff}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>

<main id="main"></main>
</div>

<script>
const DATA = [{"id": "programme-syllabus-standards", "label": "Programme", "title": "Syllabus & standards", "colour": "#6B4A2F", "html": "<h1>Master Certification in Automotive Electronics, ECU Engineering &amp; Advanced Diagnostics</h1>\n<p><strong>Programme code:</strong> MC-AEED-01\n<strong>Nominal duration:</strong> 480 contact hours (24 weeks full-time, or 48 weeks part-time)\n<strong>Delivery:</strong> 40% lecture / 60% workshop and bench\n<strong>Entry requirement:</strong> Level 3 motor vehicle mechanics qualification or 2 years workshop experience. No prior electronics knowledge assumed.</p>\n<hr />\n<h2>1. Programme philosophy</h2>\n<p>The trade has split into two populations: technicians who <strong>replace parts suggested by a code reader</strong>, and technicians who <strong>measure</strong>. This programme trains the second kind. Every module is built around a single discipline:</p>\n<blockquote>\n<p>A fault is not diagnosed until you have measured the difference between what the circuit <em>should</em> do and what it <em>is</em> doing, at the point where it stops doing it.</p>\n</blockquote>\n<p>A code is a symptom report from a computer that can only see through its own inputs. It tells you which circuit the ECU is unhappy about — never why.</p>\n<hr />\n<h2>2. Module map</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>Module</th>\n<th>Hours</th>\n<th>Assessment weight</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Fundamental Auto Electrics &amp; Circuit Diagnostics</td>\n<td>60</td>\n<td>12%</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Vehicle Electronics &amp; Semiconductor Components</td>\n<td>60</td>\n<td>12%</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Automotive Multiplexing &amp; Communication Networks</td>\n<td>60</td>\n<td>14%</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Advanced On-Board Diagnostics (OBD-II &amp; OEM)</td>\n<td>60</td>\n<td>14%</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Computer Architecture &amp; Micro-Soldering / Bench Repair</td>\n<td>70</td>\n<td>14%</td>\n</tr>\n<tr>\n<td>6</td>\n<td>ECU Reprogramming, Flashing &amp; Immobiliser Systems</td>\n<td>70</td>\n<td>14%</td>\n</tr>\n<tr>\n<td>7</td>\n<td>ECU Mapping, Engine Tuning &amp; Calibration</td>\n<td>60</td>\n<td>12%</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Emissions Systems: Diagnostics, Regeneration &amp; Repair</td>\n<td>40</td>\n<td>8%</td>\n</tr>\n</tbody>\n</table>\n<p>Modules must be taken in order. Modules 5 and 6 are gated: a student may not open an ECU casing until Module 2 and Module 3 practicals are signed off.</p>\n<hr />\n<h2>3. Learning outcomes (programme level)</h2>\n<p>On completion the graduate can:</p>\n<ul>\n<li><strong>LO1</strong> — Build, measure and fault-find any 12 V / 24 V vehicle circuit using a DMM and oscilloscope, and justify every reading against a calculated expectation.</li>\n<li><strong>LO2</strong> — Interpret sensor and actuator waveforms and separate a failed component from a failed circuit from a failed driver.</li>\n<li><strong>LO3</strong> — Map a vehicle's network topology, measure bus health, and decode CAN/LIN traffic from a scope capture.</li>\n<li><strong>LO4</strong> — Run a structured diagnostic strategy from symptom to confirmed root cause, using serial data, freeze frame and pinpoint testing.</li>\n<li><strong>LO5</strong> — Open, bench-power, probe and repair a control module, including surface-mount rework and memory device handling.</li>\n<li><strong>LO6</strong> — Perform OEM-approved reprogramming, module coding and key/immobiliser service work within legal and manufacturer boundaries.</li>\n<li><strong>LO7</strong> — Read and modify calibration data with checksum integrity, and explain the combustion and mechanical limits that constrain any change.</li>\n<li><strong>LO8</strong> — Diagnose, service and repair modern emissions after-treatment systems and restore them to correct operation.</li>\n</ul>\n<hr />\n<h2>4. Scope statement on Module 8 — read before delivering this module</h2>\n<p>Module 8 as taught here covers DPF, SCR/AdBlue, EGR and GPF <strong>architecture, diagnosis, forced regeneration, hardware repair and correct restoration to OEM function</strong>. It is deliberately a full-strength diagnostic and repair module.</p>\n<p>It does <strong>not</strong> cover writing EGR/DPF/AdBlue delete logic into ECU software or suppressing the resulting DTCs. That work is the manufacture and installation of a defeat device. It is a specific offence under the US Clean Air Act §203(a)(3), EU Regulation 715/2007 Art. 5(2) as enforced after <em>CJEU C-693/18</em>, UK MOT and Construction &amp; Use rules, and is caught by NEMA emissions regulations and the Kenyan inspection regime. Beyond legality, a training centre that certifies delete work carries the liability when a customer's vehicle fails inspection or when an EGR-deleted engine that still has its cooler blanked cracks a head.</p>\n<p>The commercially useful skill — the one customers actually pay repeat money for — is the opposite: correctly diagnosing <em>why</em> a DPF loaded, and fixing that, rather than removing the evidence. That is what Module 8 teaches, and it is a better business. Delete work is a one-off cash job that ends when the vehicle fails inspection; after-treatment repair is recurring trade work with warranty and fleet contracts attached.</p>\n<hr />\n<h2>5. Assessment model</h2>\n<p>Each module carries:</p>\n<ul>\n<li><strong>Knowledge check</strong> — 5 multiple-choice questions, closed book, 80% pass.</li>\n<li><strong>Practical scenario challenges</strong> — 2 real-world faults, assessed on method not on speed. A correct answer reached without measurement is marked as a fail.</li>\n<li><strong>Portfolio evidence</strong> — annotated scope captures, wiring sketches, and a written fault report per module.</li>\n</ul>\n<p><strong>Final capstone:</strong> a live vehicle presented with 3 unknown faults (one electrical, one network, one after-treatment or fuelling), diagnosed and reported inside 4 hours.</p>\n<hr />\n<h2>6. Workshop equipment schedule (whole programme)</h2>\n<h3>Measurement</h3>\n<ul>\n<li>Automotive DMM, min 10 MΩ input impedance, 0.5% DC accuracy, min/max/peak capture, duty cycle and frequency (e.g. Fluke 88V, Autel/UEi equivalents)</li>\n<li>4-channel automotive oscilloscope, min 20 MS/s, with serial decode (PicoScope 4425A, Autel MP408, Hantek 1008C for budget builds)</li>\n<li>Current clamps: 60 A / 600 A for cranking and charging; 20 A low-current clamp for injector and parasitic work</li>\n<li>Pressure transducer kit (WPS500X or equivalent) for in-cylinder and exhaust pressure</li>\n<li>Amp clamp low-range, 100 mA resolution, for parasitic draw</li>\n</ul>\n<h3>Power and bench</h3>\n<ul>\n<li>Bench power supply, 0–30 V / 0–20 A, current-limited, with over-current cut</li>\n<li>Vehicle battery support unit (min 70 A) for programming events</li>\n<li>ECU bench harness / breakout box set</li>\n<li>Breakout leads, back-probe pins, load pro/power probe</li>\n</ul>\n<h3>Rework</h3>\n<ul>\n<li>Hot-air rework station with nozzle set</li>\n<li>Temperature-controlled soldering iron with micro tips, plus microscope (min 7–45× stereo)</li>\n<li>Flux, low-melt alloy, braid, IPA, ultrasonic bath</li>\n<li>ESD mat, wrist strap, ionised bench</li>\n</ul>\n<h3>Interface</h3>\n<ul>\n<li>J2534-2 pass-thru device (Drewtech Mongoose, Autel MaxiFlash, VXDIAG)</li>\n<li>OEM-level scan platform + one full brand-native tool where possible (ISTA, XENTRY, ODIS)</li>\n<li>CAN interface for logging (PCAN-USB, Kvaser, or Komodo)</li>\n<li>Programming hardware for Module 5/6 (Autotuner, CMD, KESS/K-Tag class, plus an EEPROM programmer such as XPROG or UPA)</li>\n</ul>\n<hr />\n<h2>7. Safety framework</h2>\n<p>Applies to every module without exception.</p>\n<ol>\n<li><strong>Hybrid/EV:</strong> No student touches an orange cable. HV work is a separate certification. Any vehicle with HV present is isolated and tagged before bench work begins.</li>\n<li><strong>Airbag/SRS:</strong> Battery disconnected and 10 minutes elapsed before any work near a pyrotechnic circuit. Never apply a DMM in ohms mode across a squib.</li>\n<li><strong>Battery disconnect discipline:</strong> Negative first off, negative last on. Record radio/steering angle/throttle adaptation resets before disconnecting.</li>\n<li><strong>Programming events:</strong> Battery support connected, ignition on, all consumers off, no engine running. A flash interrupted by low voltage bricks the module.</li>\n<li><strong>ESD:</strong> Modules are handled by the case, on a grounded mat, in an ESD bag. A 500 V static discharge you cannot feel will kill a CMOS input.</li>\n<li><strong>Fuel and exhaust:</strong> DPF regeneration produces exhaust surface temperatures above 600 °C and tailpipe gas above 500 °C. Regens run outdoors or on extraction, on a clear floor.</li>\n<li><strong>Never probe by piercing.</strong> A pierced wire in a splash zone becomes a corrosion fault the customer returns with in six months.</li>\n</ol>\n<hr />\n<h2>8. Reference standards</h2>\n<table>\n<thead>\n<tr>\n<th>Standard</th>\n<th>Covers</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>SAE J1962</td>\n<td>OBD-II connector, pinout</td>\n</tr>\n<tr>\n<td>SAE J1979 / ISO 15031-5</td>\n<td>Diagnostic modes and PIDs</td>\n</tr>\n<tr>\n<td>SAE J2012 / ISO 15031-6</td>\n<td>DTC format and definitions</td>\n</tr>\n<tr>\n<td>ISO 15765-4</td>\n<td>Diagnostics over CAN (DoCAN)</td>\n</tr>\n<tr>\n<td>ISO 14229</td>\n<td>UDS — Unified Diagnostic Services</td>\n</tr>\n<tr>\n<td>ISO 11898-1/-2/-3</td>\n<td>CAN — data link, high-speed, fault-tolerant</td>\n</tr>\n<tr>\n<td>ISO 17987</td>\n<td>LIN</td>\n</tr>\n<tr>\n<td>SAE J2534</td>\n<td>Pass-thru reprogramming API</td>\n</tr>\n<tr>\n<td>SAE J1939</td>\n<td>Heavy vehicle CAN application layer</td>\n</tr>\n<tr>\n<td>ISO 13400</td>\n<td>DoIP — diagnostics over IP</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<p><em>Modules 1–4 are delivered in the accompanying files. Modules 5–8 follow the same six-part structure.</em></p>", "quiz": [], "search": " Master Certification in Automotive Electronics, ECU Engineering & Advanced Diagnostics Programme code: MC-AEED-01 Nominal duration: 480 contact hours (24 weeks full-time, or 48 weeks part-time) Delivery: 40% lecture / 60% workshop and bench Entry requirement: Level 3 motor vehicle mechanics qualification or 2 years workshop experience. No prior electronics knowledge assumed. 1. Programme philosophy The trade has split into two populations: technicians who replace parts suggested by a code reader , and technicians who measure . This programme trains the second kind. Every module is built around a single discipline: A fault is not diagnosed until you have measured the difference between what the circuit should do and what it is doing, at the point where it stops doing it. A code is a symptom report from a computer that can only see through its own inputs. It tells you which circuit the ECU is unhappy about — never why. 2. Module map # Module Hours Assessment weight 1 Fundamental Auto Electrics & Circuit Diagnostics 60 12% 2 Vehicle Electronics & Semiconductor Components 60 12% 3 Automotive Multiplexing & Communication Networks 60 14% 4 Advanced On-Board Diagnostics (OBD-II & OEM) 60 14% 5 Computer Architecture & Micro-Soldering / Bench Repair 70 14% 6 ECU Reprogramming, Flashing & Immobiliser Systems 70 14% 7 ECU Mapping, Engine Tuning & Calibration 60 12% 8 Emissions Systems: Diagnostics, Regeneration & Repair 40 8% Modules must be taken in order. Modules 5 and 6 are gated: a student may not open an ECU casing until Module 2 and Module 3 practicals are signed off. 3. Learning outcomes (programme level) On completion the graduate can: LO1 — Build, measure and fault-find any 12 V / 24 V vehicle circuit using a DMM and oscilloscope, and justify every reading against a calculated expectation. LO2 — Interpret sensor and actuator waveforms and separate a failed component from a failed circuit from a failed driver. LO3 — Map a vehicle's network topology, measure bus health, and decode CAN/LIN traffic from a scope capture. LO4 — Run a structured diagnostic strategy from symptom to confirmed root cause, using serial data, freeze frame and pinpoint testing. LO5 — Open, bench-power, probe and repair a control module, including surface-mount rework and memory device handling. LO6 — Perform OEM-approved reprogramming, module coding and key/immobiliser service work within legal and manufacturer boundaries. LO7 — Read and modify calibration data with checksum integrity, and explain the combustion and mechanical limits that constrain any change. LO8 — Diagnose, service and repair modern emissions after-treatment systems and restore them to correct operation. 4. Scope statement on Module 8 — read before delivering this module Module 8 as taught here covers DPF, SCR/AdBlue, EGR and GPF architecture, diagnosis, forced regeneration, hardware repair and correct restoration to OEM function . It is deliberately a full-strength diagnostic and repair module. It does not cover writing EGR/DPF/AdBlue delete logic into ECU software or suppressing the resulting DTCs. That work is the manufacture and installation of a defeat device. It is a specific offence under the US Clean Air Act §203(a)(3), EU Regulation 715/2007 Art. 5(2) as enforced after CJEU C-693/18 , UK MOT and Construction & Use rules, and is caught by NEMA emissions regulations and the Kenyan inspection regime. Beyond legality, a training centre that certifies delete work carries the liability when a customer's vehicle fails inspection or when an EGR-deleted engine that still has its cooler blanked cracks a head. The commercially useful skill — the one customers actually pay repeat money for — is the opposite: correctly diagnosing why a DPF loaded, and fixing that, rather than removing the evidence. That is what Module 8 teaches, and it is a better business. Delete work is a one-off cash job that ends when the vehicle fails inspection; after-treatment repair is recurring trade work with warranty and fleet contracts attached. 5. Assessment model Each module carries: Knowledge check — 5 multiple-choice questions, closed book, 80% pass. Practical scenario challenges — 2 real-world faults, assessed on method not on speed. A correct answer reached without measurement is marked as a fail. Portfolio evidence — annotated scope captures, wiring sketches, and a written fault report per module. Final capstone: a live vehicle presented with 3 unknown faults (one electrical, one network, one after-treatment or fuelling), diagnosed and reported inside 4 hours. 6. Workshop equipment schedule (whole programme) Measurement Automotive DMM, min 10 MΩ input impedance, 0.5% DC accuracy, min/max/peak capture, duty cycle and frequency (e.g. Fluke 88V, Autel/UEi equivalents) 4-channel automotive oscilloscope, min 20 MS/s, with serial decode (PicoScope 4425A, Autel MP408, Hantek 1008C for budget builds) Current clamps: 60 A / 600 A for cranking and charging; 20 A low-current clamp for injector and parasitic work Pressure transducer kit (WPS500X or equivalent) for in-cylinder and exhaust pressure Amp clamp low-range, 100 mA resolution, for parasitic draw Power and bench Bench power supply, 0–30 V / 0–20 A, current-limited, with over-current cut Vehicle battery support unit (min 70 A) for programming events ECU bench harness / breakout box set Breakout leads, back-probe pins, load pro/power probe Rework Hot-air rework station with nozzle set Temperature-controlled soldering iron with micro tips, plus microscope (min 7–45× stereo) Flux, low-melt alloy, braid, IPA, ultrasonic bath ESD mat, wrist strap, ionised bench Interface J2534-2 pass-thru device (Drewtech Mongoose, Autel MaxiFlash, VXDIAG) OEM-level scan platform + one full brand-native tool where possible (ISTA, XENTRY, ODIS) CAN interface for logging (PCAN-USB, Kvaser, or Komodo) Programming hardware for Module 5/6 (Autotuner, CMD, KESS/K-Tag class, plus an EEPROM programmer such as XPROG or UPA) 7. Safety framework Applies to every module without exception. Hybrid/EV: No student touches an orange cable. HV work is a separate certification. Any vehicle with HV present is isolated and tagged before bench work begins. Airbag/SRS: Battery disconnected and 10 minutes elapsed before any work near a pyrotechnic circuit. Never apply a DMM in ohms mode across a squib. Battery disconnect discipline: Negative first off, negative last on. Record radio/steering angle/throttle adaptation resets before disconnecting. Programming events: Battery support connected, ignition on, all consumers off, no engine running. A flash interrupted by low voltage bricks the module. ESD: Modules are handled by the case, on a grounded mat, in an ESD bag. A 500 V static discharge you cannot feel will kill a CMOS input. Fuel and exhaust: DPF regeneration produces exhaust surface temperatures above 600 °C and tailpipe gas above 500 °C. Regens run outdoors or on extraction, on a clear floor. Never probe by piercing. A pierced wire in a splash zone becomes a corrosion fault the customer returns with in six months. 8. Reference standards Standard Covers SAE J1962 OBD-II connector, pinout SAE J1979 / ISO 15031-5 Diagnostic modes and PIDs SAE J2012 / ISO 15031-6 DTC format and definitions ISO 15765-4 Diagnostics over CAN (DoCAN) ISO 14229 UDS — Unified Diagnostic Services ISO 11898-1/-2/-3 CAN — data link, high-speed, fault-tolerant ISO 17987 LIN SAE J2534 Pass-thru reprogramming API SAE J1939 Heavy vehicle CAN application layer ISO 13400 DoIP — diagnostics over IP Modules 1–4 are delivered in the accompanying files. Modules 5–8 follow the same six-part structure. ", "words": 1184}, {"id": "module-1-auto-electrics-circuits", "label": "Module 1", "title": "Auto electrics & circuits", "colour": "#8A5A2B", "html": "<h1>Module 1 — Fundamental Auto Electrics &amp; Circuit Diagnostics</h1>\n<p><strong>Hours:</strong> 60 (24 lecture / 36 workshop)</p>\n<hr />\n<h2>1. Module overview &amp; learning objectives</h2>\n<p>This module builds the measurement discipline everything else rests on. A student who leaves Module 1 without the habit of <em>predicting a reading before taking it</em> will fail every later module, because ECU diagnosis is nothing but circuit diagnosis with a computer watching.</p>\n<p>By the end of the module the student can:</p>\n<ul>\n<li><strong>1.1</strong> Calculate expected voltage, current and power in any series, parallel or mixed automotive circuit.</li>\n<li><strong>1.2</strong> Select correct wire gauge and protection for a given load and run length.</li>\n<li><strong>1.3</strong> Read and trace an OEM wiring diagram, including splice points, ground distribution and connector views.</li>\n<li><strong>1.4</strong> Perform a voltage drop test and state the pass/fail threshold for each circuit type.</li>\n<li><strong>1.5</strong> Isolate a parasitic draw to a single fuse and then to a single component.</li>\n<li><strong>1.6</strong> Diagnose a high-resistance ground, which is the single most misdiagnosed fault in the trade.</li>\n</ul>\n<hr />\n<h2>2. Comprehensive theory &amp; lecture notes</h2>\n<h3>2.1 The four quantities</h3>\n<table>\n<thead>\n<tr>\n<th>Quantity</th>\n<th>Symbol</th>\n<th>Unit</th>\n<th>Physical meaning in a vehicle</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Voltage</td>\n<td>V (E)</td>\n<td>Volt</td>\n<td>Electrical pressure difference. Does no work by itself.</td>\n</tr>\n<tr>\n<td>Current</td>\n<td>I</td>\n<td>Ampere</td>\n<td>Rate of charge flow. This is what does the work and makes the heat.</td>\n</tr>\n<tr>\n<td>Resistance</td>\n<td>R</td>\n<td>Ohm (Ω)</td>\n<td>Opposition to flow. Rises with temperature in copper.</td>\n</tr>\n<tr>\n<td>Power</td>\n<td>P</td>\n<td>Watt</td>\n<td>Rate of energy conversion.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Ohm's Law:</strong> <code>V = I × R</code>, therefore <code>I = V / R</code> and <code>R = V / I</code>\n<strong>Power:</strong> <code>P = V × I = I²R = V²/R</code></p>\n<p>The form that matters most on a vehicle is <strong>P = I²R</strong>, because it explains why a joint with 0.2 Ω resistance carrying 30 A dissipates 180 W and melts the connector, while the same joint carrying 0.5 A dissipates 0.05 W and is never noticed. <strong>A bad connection only reveals itself under load.</strong> This single fact is why static resistance checks miss most real faults.</p>\n<h3>2.2 Series and parallel behaviour</h3>\n<p><strong>Series:</strong> <code>R_total = R1 + R2 + R3…</code>  Current is the same everywhere. Voltage divides in proportion to resistance.\n<strong>Parallel:</strong> <code>1/R_total = 1/R1 + 1/R2…</code>  Voltage is the same across each branch. Current divides inversely with resistance.</p>\n<p>Vehicle relevance:\n- A <strong>switch, wire, connector and load in series</strong> form a voltage divider. Any unwanted resistance steals voltage from the load. That stolen voltage is exactly what a voltage drop test measures.\n- <strong>Lamps, injectors and heaters in parallel</strong> each draw independently. Loss of one branch raises total circuit resistance and lowers total current — which is why a failed rear lamp can change the current signature the body module uses to detect bulb outage.</p>\n<p>Worked example — a headlamp circuit:\nA 55 W H7 lamp at 13.5 V draws <code>I = P/V = 55/13.5 = 4.07 A</code>. Its hot resistance is <code>R = V/I = 3.32 Ω</code>. If the ground strap has degraded to 0.5 Ω, total resistance becomes 3.82 Ω, current falls to 3.53 A, and the lamp now sees <code>3.53 × 3.32 = 11.7 V</code>. Light output falls roughly with the <strong>3.4 power of voltage</strong> — a 13% voltage loss costs about <strong>38% of the light</strong>. The customer says \"dim headlights\". The parts-changer fits bulbs. The technician measures 1.76 V across the ground and fixes the strap.</p>\n<h3>2.3 Wire sizing</h3>\n<p>Wire is sized by <strong>current capacity</strong> and by <strong>acceptable voltage drop over length</strong>, and the second usually governs.</p>\n<table>\n<thead>\n<tr>\n<th>AWG</th>\n<th>Metric mm²</th>\n<th>Typical continuous current (chassis)</th>\n<th>Typical use</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>20</td>\n<td>0.5</td>\n<td>5 A</td>\n<td>Sensor signal, low-current switch</td>\n</tr>\n<tr>\n<td>18</td>\n<td>0.75</td>\n<td>8 A</td>\n<td>Interior lamps, small actuators</td>\n</tr>\n<tr>\n<td>16</td>\n<td>1.0–1.25</td>\n<td>13 A</td>\n<td>Lighting, fuel pump feed (short)</td>\n</tr>\n<tr>\n<td>14</td>\n<td>2.0</td>\n<td>20 A</td>\n<td>Blower, heated seat</td>\n</tr>\n<tr>\n<td>12</td>\n<td>3.0</td>\n<td>30 A</td>\n<td>Heavy accessory feed</td>\n</tr>\n<tr>\n<td>10</td>\n<td>5.0</td>\n<td>40 A</td>\n<td>Radiator fan, high-output feed</td>\n</tr>\n<tr>\n<td>8</td>\n<td>8.0</td>\n<td>55 A</td>\n<td>Alternator output (light)</td>\n</tr>\n<tr>\n<td>4</td>\n<td>20</td>\n<td>100 A+</td>\n<td>Alternator output, main feed</td>\n</tr>\n<tr>\n<td>2/0</td>\n<td>50–70</td>\n<td>200 A+</td>\n<td>Starter and battery cable</td>\n</tr>\n</tbody>\n</table>\n<p>Voltage drop budget: <strong>3% maximum for critical circuits</strong> (ignition, injection, sensors), <strong>10% for lighting and accessories</strong>, measured at full load.</p>\n<p>Length correction: <code>V_drop = I × R_per_metre × 2 × L</code> — the ×2 accounts for the return path, which on a vehicle is the chassis ground and is where most of the loss actually occurs.</p>\n<h3>2.4 Colour codes</h3>\n<p>There is no universal standard. Teach the three families the student will meet:</p>\n<ul>\n<li><strong>German (VW/Audi/BMW/Mercedes, DIN 72551):</strong> brown = ground, universally. Red = permanent battery. Black = switched. Two-colour codes are base/stripe.</li>\n<li><strong>Japanese:</strong> black = ground on Toyota, white/black stripe on some Nissan. Colour abbreviations printed as e.g. <code>L/W</code> = blue with white stripe.</li>\n<li><strong>American / GM–Ford:</strong> black = ground, but Ford historically used black/light-green for some grounds. Circuit numbers on the diagram matter more than colour.</li>\n</ul>\n<p><strong>Rule for students:</strong> never trust colour alone. Trace the circuit number on the diagram, and verify with a meter before cutting.</p>\n<h3>2.5 Relays</h3>\n<table>\n<thead>\n<tr>\n<th>Type</th>\n<th>Terminals</th>\n<th>Behaviour</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>4-pin SPST</td>\n<td>85, 86 (coil), 30 (common), 87 (NO)</td>\n<td>Simple on/off switching</td>\n</tr>\n<tr>\n<td>5-pin SPDT</td>\n<td>85, 86, 30, 87 (NO), 87a (NC)</td>\n<td>Switches a load between two paths; 87a live at rest</td>\n</tr>\n<tr>\n<td>Dual-make</td>\n<td>85, 86, 30, 87, 87b</td>\n<td>Two outputs energised together</td>\n</tr>\n<tr>\n<td>Solid-state (SSR)</td>\n<td>Varies</td>\n<td>No contacts, no click, no coil resistance to measure. MOSFET output. Cannot be tested by the classic jumper method.</td>\n</tr>\n</tbody>\n</table>\n<p>Coil resistance for a standard 12 V automotive relay: <strong>60–120 Ω</strong>, drawing 100–200 mA. A coil measuring 0 Ω is shorted; open circuit means burnt coil.</p>\n<p><strong>Coil suppression:</strong> a relay coil is an inductor. On de-energising it produces a back-EMF spike of several hundred volts (<code>V = -L × dI/dt</code>). Relays driven by an ECU output <em>must</em> have a suppression diode or resistor across the coil, and it must be fitted in the correct polarity. A relay fitted with the diode reversed will short the ECU driver the moment it is energised — a real and common cause of a repeat driver failure after a \"new\" relay is fitted.</p>\n<h3>2.6 Circuit protection</h3>\n<ul>\n<li><strong>Blade fuses</strong> (mini/standard/maxi) — thermal, fast. Rated at ~200% of expected load, and sized to protect <strong>the wire</strong>, not the device.</li>\n<li><strong>Fusible link</strong> — a length of wire four gauges smaller than the circuit, protecting main feeds.</li>\n<li><strong>PTC resettable (polyfuse)</strong> — resistance rises sharply with temperature, self-recovering. Common in door modules and USB feeds. A \"fault that clears when the car cools\" is often a PTC.</li>\n<li><strong>Circuit breakers</strong> — auto-reset or manual, used for wipers and power windows where a stall current is normal.</li>\n</ul>\n<p>A fuse never fails from age alone. <strong>A blown fuse is a report of an event.</strong> Fitting a larger fuse converts an electrical fault into a fire.</p>\n<h3>2.7 Voltage drop testing — the core skill</h3>\n<p>Measure <strong>across</strong> the component under test, while the circuit is <strong>carrying its normal load</strong>. The meter reads the voltage lost in that section.</p>\n<table>\n<thead>\n<tr>\n<th>Section tested</th>\n<th>Maximum acceptable drop</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Single connection or terminal</td>\n<td>0.1 V</td>\n</tr>\n<tr>\n<td>Any single wire</td>\n<td>0.2 V</td>\n</tr>\n<tr>\n<td>Complete ground path (load to battery −)</td>\n<td>0.2 V</td>\n</tr>\n<tr>\n<td>Complete insulated feed (battery + to load)</td>\n<td>0.5 V</td>\n</tr>\n<tr>\n<td>Starter circuit feed, cranking</td>\n<td>0.5 V</td>\n</tr>\n<tr>\n<td>Starter circuit ground, cranking</td>\n<td>0.2 V</td>\n</tr>\n<tr>\n<td>Across closed switch/relay contacts</td>\n<td>0.2 V</td>\n</tr>\n</tbody>\n</table>\n<p>Why this beats an ohmmeter: a DMM in resistance mode pushes roughly 1 mA through the circuit. A corroded joint that reads 0.3 Ω at 1 mA may behave as 3 Ω at 30 A because the contact area is a few microscopic points that heat and oxidise further under load. <strong>Resistance is measured dead; voltage drop is measured alive.</strong></p>\n<h3>2.8 Parasitic draw</h3>\n<p>Normal modern quiescent draw after full sleep: <strong>20–50 mA</strong>. Vehicles with telematics, keyless entry, alarm and always-on gateway may legitimately sit at 50–80 mA.</p>\n<p>Critical procedure point: modules take <strong>20–60 minutes</strong> to enter sleep after the last door close. Measuring before sleep produces a false 300 mA reading and a wasted afternoon. Do not open a door during the test — many vehicles restart the timer.</p>\n<p>Method options:\n1. <strong>Low-current clamp around the negative cable</strong> — no circuit interruption, no wake-up, and the only method that works reliably on a vehicle that will not re-sleep. Preferred.\n2. <strong>DMM in series</strong> with a bypass switch, so pulling the meter never breaks the circuit.\n3. <strong>Voltage-drop across fuses</strong> (millivolt drop method) — the fastest way to find <em>which</em> fuse without pulling any, using published mV/A tables per fuse rating.</p>\n<h3>2.9 Ground circuit faults</h3>\n<p>Grounds fail more than feeds because they are bolted to painted or corroded body metal, sit low in the vehicle, and are shared. Symptoms of a shared, high-resistance ground are <strong>bizarre and multi-system</strong>: the dash lights dim when the indicator flashes, the fuel gauge moves when the rear wiper runs, an ABS light appears only in rain. This is <strong>current feedback</strong> — current from one circuit is finding a return path through another circuit's ground, because the intended path has gone high-resistance.</p>\n<p>Teaching rule: <em>when two unrelated systems misbehave together, stop looking for a common component and start looking for a common ground.</em></p>\n<hr />\n<h2>3. Tools &amp; equipment needed</h2>\n<ul>\n<li>Automotive DMM (10 MΩ, min/max, duty cycle)</li>\n<li>2-channel oscilloscope</li>\n<li>Low-current clamp (mA resolution) and 600 A clamp</li>\n<li>Power probe / load pro</li>\n<li>Back-probe pin set, breakout leads, no piercing probes</li>\n<li>Test lamp — <strong>LED type only</strong> on modules; an incandescent test lamp draws enough current to destroy a low-side driver</li>\n<li>Bench trainer board with lamps, relay, switch, and switchable inserted faults</li>\n<li>Battery support unit</li>\n<li>OEM wiring diagram access</li>\n</ul>\n<hr />\n<h2>4. Step-by-step practical lab exercise</h2>\n<h3>Lab 1.1 — Fault-find a headlamp circuit with an inserted high-resistance ground</h3>\n<p><strong>Scenario:</strong> Vehicle presents with dim nearside dipped beam. Bulb has already been replaced by the customer.</p>\n<ol>\n<li><strong>Predict first.</strong> From the diagram, note the fuse, relay, feed route and ground point. Calculate expected current: 55 W ÷ 13.5 V ≈ 4.1 A. Write the prediction on the report sheet <strong>before</strong> measuring. Unwritten predictions do not count.</li>\n<li><strong>Confirm the symptom.</strong> Switch on dipped beam. Compare left and right visually.</li>\n<li><strong>Measure system voltage</strong> at the battery, engine running, 1,500 rpm: expect 13.8–14.6 V. Record.</li>\n<li><strong>Measure at the bulb connector</strong> — DMM across the bulb's feed and ground pins, bulb connected, lamp on. Expect within 0.7 V of system voltage. Suppose it reads 11.7 V. There are 2.1 V unaccounted for.</li>\n<li><strong>Split the loss.</strong> Meter red probe to battery positive, black probe to the bulb feed pin: this reads the total loss on the <strong>feed</strong> side. Then red probe to the bulb ground pin, black probe to battery negative: this reads the total loss on the <strong>ground</strong> side. In this scenario, feed reads 0.34 V (acceptable), ground reads 1.76 V (fail).</li>\n<li><strong>Halve the failing side.</strong> Move the probe progressively along the ground path: bulb ground pin → connector → eyelet → body stud. The section where the reading collapses toward zero contains the fault.</li>\n<li><strong>Confirm the fault physically.</strong> Remove the ground eyelet. Expect corrosion or paint under the ring terminal.</li>\n<li><strong>Repair:</strong> clean to bright metal, apply new eyelet, torque, protect with dielectric grease. Do not simply retighten a corroded terminal.</li>\n<li><strong>Verify.</strong> Repeat step 5. Ground drop must now be under 0.2 V. Measure current with a clamp: should now be ≈4.1 A, matching the step 1 prediction.</li>\n<li><strong>Report.</strong> Record measured before/after values, root cause, and repair. A report without numbers is not a report.</li>\n</ol>\n<h3>Lab 1.2 — Parasitic draw isolation</h3>\n<ol>\n<li>Fully charge the battery. Confirm resting voltage above 12.5 V.</li>\n<li>Fit the low-current clamp around the negative cable. Zero the clamp.</li>\n<li>Close all doors using the door latch mechanism (a screwdriver in the latch) so no door is physically opened during the test.</li>\n<li>Lock the vehicle normally, walk away with the key at least 5 m.</li>\n<li>Log current at 5-minute intervals for 60 minutes. Sketch the curve.</li>\n<li>Identify the sleep step. Record the settled value. If above 50 mA, proceed.</li>\n<li>Use the <strong>millivolt drop across each fuse</strong> to find the loaded circuit — do not pull fuses, which wakes modules and restarts the sleep timer.</li>\n<li>Once the fuse is identified, disconnect components on that circuit one at a time, watching the clamp.</li>\n<li>Confirm the fix by re-running the full sleep cycle. A draw fault confirmed in under 20 minutes has not been confirmed.</li>\n</ol>\n<hr />\n<h2>5. Common failure modes &amp; troubleshooting trees</h2>\n<h3>Tree A — Component does not operate</h3>\n<pre><code>Component dead\n├─ Fuse blown?\n│   ├─ YES → Do NOT just replace.\n│   │        Measure resistance of circuit to ground with load disconnected.\n│   │        ├─ Near 0 Ω → short to ground. Find chafe point. Common: harness\n│   │        │             through bulkhead, door hinge loom, exhaust contact.\n│   │        └─ Normal → fuse fatigued or load has developed high inrush.\n│   │                    Check load current with clamp after replacement.\n│   └─ NO → continue\n├─ Feed present at component connector under load?\n│   ├─ NO → voltage drop test feed side, section by section.\n│   │        Check relay (coil resistance 60–120 Ω, contact drop &lt;0.2 V),\n│   │        check switch, check splice.\n│   └─ YES → continue\n├─ Ground drop under load &lt; 0.2 V?\n│   ├─ NO → clean/repair ground path. This is the most likely finding.\n│   └─ YES → continue\n└─ Feed good, ground good, still dead → component itself has failed.\n   Confirm by bench-powering the component with a current-limited supply.\n</code></pre>\n<h3>Tree B — Intermittent fault</h3>\n<pre><code>Intermittent\n├─ Does it correlate with vibration? → wiggle test with scope on min/max\n│                                       or DMM recording, drive over rough road\n├─ Does it correlate with temperature? → heat gun and freeze spray on\n│                                        suspect connectors and modules\n├─ Does it correlate with moisture? → water spray test, bulkhead and\n│                                     door grommet inspection\n├─ Does it correlate with load? → high-resistance joint. Voltage drop\n│                                 under maximum load, not at rest\n└─ No correlation found → fit a data logger / min-max recording on the\n   suspect circuit and return the vehicle to the customer with the logger\n   fitted. Never guess a part.\n</code></pre>\n<h3>Tree C — Multiple unrelated systems misbehaving</h3>\n<pre><code>Multiple systems affected\n├─ Do they share a fuse? → check that fuse's feed and its downstream splice\n├─ Do they share a ground point? → THIS IS THE MOST LIKELY CAUSE.\n│   Voltage drop each system's ground independently, all loads on.\n├─ Do they share a network? → move to Module 3, bus diagnosis\n└─ Is charging voltage correct and free of AC ripple?\n    Ripple &gt;0.5 V AC = failed alternator diode = chaos across every module.\n</code></pre>\n<h3>Frequently seen real-world failures</h3>\n<table>\n<thead>\n<tr>\n<th>Failure</th>\n<th>Typical symptom</th>\n<th>Confirming measurement</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Corroded ground eyelet</td>\n<td>Multiple odd symptoms, dim lights</td>\n<td>Ground drop &gt; 0.2 V under load</td>\n</tr>\n<tr>\n<td>Alternator diode failure</td>\n<td>Radio noise, flickering lights, random module resets</td>\n<td>AC ripple &gt; 0.5 V at battery</td>\n</tr>\n<tr>\n<td>Chafed harness at bulkhead</td>\n<td>Repeat fuse failure</td>\n<td>Near-0 Ω to ground with load removed</td>\n</tr>\n<tr>\n<td>Relay contact erosion</td>\n<td>Load works intermittently, relay clicks</td>\n<td>Contact drop &gt; 0.2 V under load</td>\n</tr>\n<tr>\n<td>Water in a connector</td>\n<td>Fault after rain/washing</td>\n<td>Corrosion visible; resistance rises with time</td>\n</tr>\n<tr>\n<td>Aftermarket accessory tapped into a signal wire</td>\n<td>Bizarre new faults after \"an install\"</td>\n<td>Inspect for scotchlok/T-taps first</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>6. Student knowledge check</h2>\n<h3>Practical scenario challenges</h3>\n<p><strong>Scenario 1 — The rain fault.</strong>\nA vehicle returns for the third time. The customer reports that after heavy rain, the ABS light illuminates, the electric mirrors stop working and the reversing lamps stay on. Two previous garages fitted an ABS sensor and a mirror switch. Nothing was found wrong on the code reader in dry weather.\n<em>Task:</em> State your first three measurements, in order, and justify each. What is the single most probable root cause and why does it explain all three symptoms simultaneously?</p>\n<p><strong>Scenario 2 — The new battery that keeps going flat.</strong>\nA customer has fitted two new batteries in four months. Charging voltage measures 14.2 V at idle. Parasitic draw measured by the previous garage was 45 mA, taken 4 minutes after locking.\n<em>Task:</em> Identify what is wrong with the previous garage's test method, describe the correct procedure step by step, and name two faults that would produce this exact history but be missed by a 4-minute measurement.</p>\n<hr />\n<h2>7. Answer key</h2>\n<p><strong>Scenario 1 model answer.</strong>\nFirst three measurements:\n1. Voltage drop across the <strong>shared rear/body ground point</strong> with reversing lamps and mirrors energised — because three systems failing together points to a shared return path, not three separate components.\n2. Resistance-to-ground and continuity of the harness section that passes through the <strong>tailgate or door grommet</strong> — the rain correlation places the fault where water reaches copper.\n3. Charging system AC ripple at the battery — to eliminate alternator diode failure as a source of multi-module misbehaviour before chasing the harness.</p>\n<p>Most probable root cause: <strong>a corroded or water-ingressed common ground (or a broken conductor inside a grommet flex point) serving the rear body circuits.</strong> It explains all three symptoms because, with the intended return path degraded, current from the reversing lamp circuit backfeeds through the mirror and ABS sensor grounds, producing false states in unrelated modules. It appears only when wet because water bridges corrosion and changes the resistance of the compromised path. It never sets a useful code because no module can see the fault — each sees only implausible input.</p>\n<p><strong>Scenario 2 model answer.</strong>\nMethod fault: 45 mA was recorded <strong>4 minutes after locking</strong>, long before modules enter sleep. A reading taken during the wake period is meaningless — it may equally have been 45 mA at that moment and 400 mA once a module failed to sleep, or the modules may not have begun the shutdown sequence at all.</p>\n<p>Correct procedure: charge and confirm the battery; fit a low-current clamp on the negative cable so the circuit is never broken; secure the door latches so no door is opened during the test; lock normally and withdraw with the key; log current every 5 minutes for a minimum of 60 minutes; identify the settled floor value; if above 50 mA, locate the circuit by millivolt drop across fuses rather than by pulling them; confirm the repair with a full repeat sleep cycle.</p>\n<p>Two faults missed by a 4-minute test:\n1. <strong>A module that never enters sleep</strong> — e.g. an amplifier, telematics unit or aftermarket alarm held awake by a stuck input or a corrupted CAN wake signal. Current at 4 minutes looks normal because everything is legitimately awake; at 60 minutes it is still drawing 300 mA.\n2. <strong>A slowly developing draw</strong> — such as a glovebox or boot lamp switch that only closes as the seal relaxes, or moisture-driven leakage that rises over hours. Neither is visible in a 4-minute window.</p>\n<p>Also worth noting: 14.2 V at idle is acceptable but does not prove the alternator is healthy. AC ripple and full-load output must be tested before the charging system is cleared.</p>", "quiz": [{"q": "A 21 W indicator bulb operates at 13.8 V. What current does it draw?", "options": [{"k": "A", "t": "0.66 A"}, {"k": "B", "t": "1.52 A"}, {"k": "C", "t": "2.90 A"}, {"k": "D", "t": "290 A"}], "answer": "B", "why": "<code>I = P/V = 21/13.8 = 1.52 A</code>."}, {"q": "You measure 0.9 V across a starter motor ground strap while cranking. This means:", "options": [{"k": "A", "t": "The strap is fine, cranking loads are high"}, {"k": "B", "t": "The strap has excessive resistance and must be repaired"}, {"k": "C", "t": "The battery is undercharged"}, {"k": "D", "t": "The starter motor has an internal short"}], "answer": "B", "why": "Starter ground drop limit is 0.2 V. 0.9 V represents significant lost energy converted to heat at the joint, and will worsen. A battery fault would show as low overall voltage, not localised drop."}, {"q": "Why is a voltage drop test more reliable than an ohmmeter check on a suspect connection?", "options": [{"k": "A", "t": "The ohmmeter is less accurate"}, {"k": "B", "t": "Voltage drop tests the joint at operating current, where microscopic contact points reveal their true resistance"}, {"k": "C", "t": "The ohmmeter cannot read below 1 Ω"}, {"k": "D", "t": "Voltage drop is faster to perform"}], "answer": "B", "why": "The ohmmeter applies about 1 mA. A joint reduced to a few microscopic contact points can pass 1 mA easily while failing at 30 A, where I²R heating raises resistance further."}, {"q": "A relay coil measures 0 Ω across terminals 85 and 86. The correct conclusion is:", "options": [{"k": "A", "t": "The coil is healthy"}, {"k": "B", "t": "The coil is open circuit"}, {"k": "C", "t": "The coil is short circuited and the relay must be replaced"}, {"k": "D", "t": "The relay is a solid-state type"}], "answer": "C", "why": "A healthy 12 V automotive relay coil reads 60–120 Ω. Zero indicates a short, which will overload whatever drives it — including, on ECU-driven relays, the module's output driver."}, {"q": "During a parasitic draw test the reading has sat at 320 mA for 8 minutes. The correct next action is:", "options": [{"k": "A", "t": "Begin pulling fuses to find the circuit"}, {"k": "B", "t": "Condemn the battery"}, {"k": "C", "t": "Continue waiting — modules may take 20–60 minutes to sleep — and log the current curve"}, {"k": "D", "t": "Disconnect the alternator"}], "answer": "C", "why": "Eight minutes is far short of the sleep period on a modern vehicle. Pulling fuses at this point wakes modules and destroys the test. The current curve itself is diagnostic data."}], "search": " Module 1 — Fundamental Auto Electrics & Circuit Diagnostics Hours: 60 (24 lecture / 36 workshop) 1. Module overview & learning objectives This module builds the measurement discipline everything else rests on. A student who leaves Module 1 without the habit of predicting a reading before taking it will fail every later module, because ECU diagnosis is nothing but circuit diagnosis with a computer watching. By the end of the module the student can: 1.1 Calculate expected voltage, current and power in any series, parallel or mixed automotive circuit. 1.2 Select correct wire gauge and protection for a given load and run length. 1.3 Read and trace an OEM wiring diagram, including splice points, ground distribution and connector views. 1.4 Perform a voltage drop test and state the pass/fail threshold for each circuit type. 1.5 Isolate a parasitic draw to a single fuse and then to a single component. 1.6 Diagnose a high-resistance ground, which is the single most misdiagnosed fault in the trade. 2. Comprehensive theory & lecture notes 2.1 The four quantities Quantity Symbol Unit Physical meaning in a vehicle Voltage V (E) Volt Electrical pressure difference. Does no work by itself. Current I Ampere Rate of charge flow. This is what does the work and makes the heat. Resistance R Ohm (Ω) Opposition to flow. Rises with temperature in copper. Power P Watt Rate of energy conversion. Ohm's Law: V = I × R , therefore I = V / R and R = V / I Power: P = V × I = I²R = V²/R The form that matters most on a vehicle is P = I²R , because it explains why a joint with 0.2 Ω resistance carrying 30 A dissipates 180 W and melts the connector, while the same joint carrying 0.5 A dissipates 0.05 W and is never noticed. A bad connection only reveals itself under load. This single fact is why static resistance checks miss most real faults. 2.2 Series and parallel behaviour Series: R_total = R1 + R2 + R3… Current is the same everywhere. Voltage divides in proportion to resistance. Parallel: 1/R_total = 1/R1 + 1/R2… Voltage is the same across each branch. Current divides inversely with resistance. Vehicle relevance: - A switch, wire, connector and load in series form a voltage divider. Any unwanted resistance steals voltage from the load. That stolen voltage is exactly what a voltage drop test measures. - Lamps, injectors and heaters in parallel each draw independently. Loss of one branch raises total circuit resistance and lowers total current — which is why a failed rear lamp can change the current signature the body module uses to detect bulb outage. Worked example — a headlamp circuit: A 55 W H7 lamp at 13.5 V draws I = P/V = 55/13.5 = 4.07 A . Its hot resistance is R = V/I = 3.32 Ω . If the ground strap has degraded to 0.5 Ω, total resistance becomes 3.82 Ω, current falls to 3.53 A, and the lamp now sees 3.53 × 3.32 = 11.7 V . Light output falls roughly with the 3.4 power of voltage — a 13% voltage loss costs about 38% of the light . The customer says \"dim headlights\". The parts-changer fits bulbs. The technician measures 1.76 V across the ground and fixes the strap. 2.3 Wire sizing Wire is sized by current capacity and by acceptable voltage drop over length , and the second usually governs. AWG Metric mm² Typical continuous current (chassis) Typical use 20 0.5 5 A Sensor signal, low-current switch 18 0.75 8 A Interior lamps, small actuators 16 1.0–1.25 13 A Lighting, fuel pump feed (short) 14 2.0 20 A Blower, heated seat 12 3.0 30 A Heavy accessory feed 10 5.0 40 A Radiator fan, high-output feed 8 8.0 55 A Alternator output (light) 4 20 100 A+ Alternator output, main feed 2/0 50–70 200 A+ Starter and battery cable Voltage drop budget: 3% maximum for critical circuits (ignition, injection, sensors), 10% for lighting and accessories , measured at full load. Length correction: V_drop = I × R_per_metre × 2 × L — the ×2 accounts for the return path, which on a vehicle is the chassis ground and is where most of the loss actually occurs. 2.4 Colour codes There is no universal standard. Teach the three families the student will meet: German (VW/Audi/BMW/Mercedes, DIN 72551): brown = ground, universally. Red = permanent battery. Black = switched. Two-colour codes are base/stripe. Japanese: black = ground on Toyota, white/black stripe on some Nissan. Colour abbreviations printed as e.g. L/W = blue with white stripe. American / GM–Ford: black = ground, but Ford historically used black/light-green for some grounds. Circuit numbers on the diagram matter more than colour. Rule for students: never trust colour alone. Trace the circuit number on the diagram, and verify with a meter before cutting. 2.5 Relays Type Terminals Behaviour 4-pin SPST 85, 86 (coil), 30 (common), 87 (NO) Simple on/off switching 5-pin SPDT 85, 86, 30, 87 (NO), 87a (NC) Switches a load between two paths; 87a live at rest Dual-make 85, 86, 30, 87, 87b Two outputs energised together Solid-state (SSR) Varies No contacts, no click, no coil resistance to measure. MOSFET output. Cannot be tested by the classic jumper method. Coil resistance for a standard 12 V automotive relay: 60–120 Ω , drawing 100–200 mA. A coil measuring 0 Ω is shorted; open circuit means burnt coil. Coil suppression: a relay coil is an inductor. On de-energising it produces a back-EMF spike of several hundred volts ( V = -L × dI/dt ). Relays driven by an ECU output must have a suppression diode or resistor across the coil, and it must be fitted in the correct polarity. A relay fitted with the diode reversed will short the ECU driver the moment it is energised — a real and common cause of a repeat driver failure after a \"new\" relay is fitted. 2.6 Circuit protection Blade fuses (mini/standard/maxi) — thermal, fast. Rated at ~200% of expected load, and sized to protect the wire , not the device. Fusible link — a length of wire four gauges smaller than the circuit, protecting main feeds. PTC resettable (polyfuse) — resistance rises sharply with temperature, self-recovering. Common in door modules and USB feeds. A \"fault that clears when the car cools\" is often a PTC. Circuit breakers — auto-reset or manual, used for wipers and power windows where a stall current is normal. A fuse never fails from age alone. A blown fuse is a report of an event. Fitting a larger fuse converts an electrical fault into a fire. 2.7 Voltage drop testing — the core skill Measure across the component under test, while the circuit is carrying its normal load . The meter reads the voltage lost in that section. Section tested Maximum acceptable drop Single connection or terminal 0.1 V Any single wire 0.2 V Complete ground path (load to battery −) 0.2 V Complete insulated feed (battery + to load) 0.5 V Starter circuit feed, cranking 0.5 V Starter circuit ground, cranking 0.2 V Across closed switch/relay contacts 0.2 V Why this beats an ohmmeter: a DMM in resistance mode pushes roughly 1 mA through the circuit. A corroded joint that reads 0.3 Ω at 1 mA may behave as 3 Ω at 30 A because the contact area is a few microscopic points that heat and oxidise further under load. Resistance is measured dead; voltage drop is measured alive. 2.8 Parasitic draw Normal modern quiescent draw after full sleep: 20–50 mA . Vehicles with telematics, keyless entry, alarm and always-on gateway may legitimately sit at 50–80 mA. Critical procedure point: modules take 20–60 minutes to enter sleep after the last door close. Measuring before sleep produces a false 300 mA reading and a wasted afternoon. Do not open a door during the test — many vehicles restart the timer. Method options: 1. Low-current clamp around the negative cable — no circuit interruption, no wake-up, and the only method that works reliably on a vehicle that will not re-sleep. Preferred. 2. DMM in series with a bypass switch, so pulling the meter never breaks the circuit. 3. Voltage-drop across fuses (millivolt drop method) — the fastest way to find which fuse without pulling any, using published mV/A tables per fuse rating. 2.9 Ground circuit faults Grounds fail more than feeds because they are bolted to painted or corroded body metal, sit low in the vehicle, and are shared. Symptoms of a shared, high-resistance ground are bizarre and multi-system : the dash lights dim when the indicator flashes, the fuel gauge moves when the rear wiper runs, an ABS light appears only in rain. This is current feedback — current from one circuit is finding a return path through another circuit's ground, because the intended path has gone high-resistance. Teaching rule: when two unrelated systems misbehave together, stop looking for a common component and start looking for a common ground. 3. Tools & equipment needed Automotive DMM (10 MΩ, min/max, duty cycle) 2-channel oscilloscope Low-current clamp (mA resolution) and 600 A clamp Power probe / load pro Back-probe pin set, breakout leads, no piercing probes Test lamp — LED type only on modules; an incandescent test lamp draws enough current to destroy a low-side driver Bench trainer board with lamps, relay, switch, and switchable inserted faults Battery support unit OEM wiring diagram access 4. Step-by-step practical lab exercise Lab 1.1 — Fault-find a headlamp circuit with an inserted high-resistance ground Scenario: Vehicle presents with dim nearside dipped beam. Bulb has already been replaced by the customer. Predict first. From the diagram, note the fuse, relay, feed route and ground point. Calculate expected current: 55 W ÷ 13.5 V ≈ 4.1 A. Write the prediction on the report sheet before measuring. Unwritten predictions do not count. Confirm the symptom. Switch on dipped beam. Compare left and right visually. Measure system voltage at the battery, engine running, 1,500 rpm: expect 13.8–14.6 V. Record. Measure at the bulb connector — DMM across the bulb's feed and ground pins, bulb connected, lamp on. Expect within 0.7 V of system voltage. Suppose it reads 11.7 V. There are 2.1 V unaccounted for. Split the loss. Meter red probe to battery positive, black probe to the bulb feed pin: this reads the total loss on the feed side. Then red probe to the bulb ground pin, black probe to battery negative: this reads the total loss on the ground side. In this scenario, feed reads 0.34 V (acceptable), ground reads 1.76 V (fail). Halve the failing side. Move the probe progressively along the ground path: bulb ground pin → connector → eyelet → body stud. The section where the reading collapses toward zero contains the fault. Confirm the fault physically. Remove the ground eyelet. Expect corrosion or paint under the ring terminal. Repair: clean to bright metal, apply new eyelet, torque, protect with dielectric grease. Do not simply retighten a corroded terminal. Verify. Repeat step 5. Ground drop must now be under 0.2 V. Measure current with a clamp: should now be ≈4.1 A, matching the step 1 prediction. Report. Record measured before/after values, root cause, and repair. A report without numbers is not a report. Lab 1.2 — Parasitic draw isolation Fully charge the battery. Confirm resting voltage above 12.5 V. Fit the low-current clamp around the negative cable. Zero the clamp. Close all doors using the door latch mechanism (a screwdriver in the latch) so no door is physically opened during the test. Lock the vehicle normally, walk away with the key at least 5 m. Log current at 5-minute intervals for 60 minutes. Sketch the curve. Identify the sleep step. Record the settled value. If above 50 mA, proceed. Use the millivolt drop across each fuse to find the loaded circuit — do not pull fuses, which wakes modules and restarts the sleep timer. Once the fuse is identified, disconnect components on that circuit one at a time, watching the clamp. Confirm the fix by re-running the full sleep cycle. A draw fault confirmed in under 20 minutes has not been confirmed. 5. Common failure modes & troubleshooting trees Tree A — Component does not operate Component dead ├─ Fuse blown? │ ├─ YES → Do NOT just replace. │ │ Measure resistance of circuit to ground with load disconnected. │ │ ├─ Near 0 Ω → short to ground. Find chafe point. Common: harness │ │ │ through bulkhead, door hinge loom, exhaust contact. │ │ └─ Normal → fuse fatigued or load has developed high inrush. │ │ Check load current with clamp after replacement. │ └─ NO → continue ├─ Feed present at component connector under load? │ ├─ NO → voltage drop test feed side, section by section. │ │ Check relay (coil resistance 60–120 Ω, contact drop <0.2 V), │ │ check switch, check splice. │ └─ YES → continue ├─ Ground drop under load < 0.2 V? │ ├─ NO → clean/repair ground path. This is the most likely finding. │ └─ YES → continue └─ Feed good, ground good, still dead → component itself has failed. Confirm by bench-powering the component with a current-limited supply. Tree B — Intermittent fault Intermittent ├─ Does it correlate with vibration? → wiggle test with scope on min/max │ or DMM recording, drive over rough road ├─ Does it correlate with temperature? → heat gun and freeze spray on │ suspect connectors and modules ├─ Does it correlate with moisture? → water spray test, bulkhead and │ door grommet inspection ├─ Does it correlate with load? → high-resistance joint. Voltage drop │ under maximum load, not at rest └─ No correlation found → fit a data logger / min-max recording on the suspect circuit and return the vehicle to the customer with the logger fitted. Never guess a part. Tree C — Multiple unrelated systems misbehaving Multiple systems affected ├─ Do they share a fuse? → check that fuse's feed and its downstream splice ├─ Do they share a ground point? → THIS IS THE MOST LIKELY CAUSE. │ Voltage drop each system's ground independently, all loads on. ├─ Do they share a network? → move to Module 3, bus diagnosis └─ Is charging voltage correct and free of AC ripple? Ripple >0.5 V AC = failed alternator diode = chaos across every module. Frequently seen real-world failures Failure Typical symptom Confirming measurement Corroded ground eyelet Multiple odd symptoms, dim lights Ground drop > 0.2 V under load Alternator diode failure Radio noise, flickering lights, random module resets AC ripple > 0.5 V at battery Chafed harness at bulkhead Repeat fuse failure Near-0 Ω to ground with load removed Relay contact erosion Load works intermittently, relay clicks Contact drop > 0.2 V under load Water in a connector Fault after rain/washing Corrosion visible; resistance rises with time Aftermarket accessory tapped into a signal wire Bizarre new faults after \"an install\" Inspect for scotchlok/T-taps first 6. Student knowledge check Practical scenario challenges Scenario 1 — The rain fault. A vehicle returns for the third time. The customer reports that after heavy rain, the ABS light illuminates, the electric mirrors stop working and the reversing lamps stay on. Two previous garages fitted an ABS sensor and a mirror switch. Nothing was found wrong on the code reader in dry weather. Task: State your first three measurements, in order, and justify each. What is the single most probable root cause and why does it explain all three symptoms simultaneously? Scenario 2 — The new battery that keeps going flat. A customer has fitted two new batteries in four months. Charging voltage measures 14.2 V at idle. Parasitic draw measured by the previous garage was 45 mA, taken 4 minutes after locking. Task: Identify what is wrong with the previous garage's test method, describe the correct procedure step by step, and name two faults that would produce this exact history but be missed by a 4-minute measurement. 7. Answer key Scenario 1 model answer. First three measurements: 1. Voltage drop across the shared rear/body ground point with reversing lamps and mirrors energised — because three systems failing together points to a shared return path, not three separate components. 2. Resistance-to-ground and continuity of the harness section that passes through the tailgate or door grommet — the rain correlation places the fault where water reaches copper. 3. Charging system AC ripple at the battery — to eliminate alternator diode failure as a source of multi-module misbehaviour before chasing the harness. Most probable root cause: a corroded or water-ingressed common ground (or a broken conductor inside a grommet flex point) serving the rear body circuits. It explains all three symptoms because, with the intended return path degraded, current from the reversing lamp circuit backfeeds through the mirror and ABS sensor grounds, producing false states in unrelated modules. It appears only when wet because water bridges corrosion and changes the resistance of the compromised path. It never sets a useful code because no module can see the fault — each sees only implausible input. Scenario 2 model answer. Method fault: 45 mA was recorded 4 minutes after locking , long before modules enter sleep. A reading taken during the wake period is meaningless — it may equally have been 45 mA at that moment and 400 mA once a module failed to sleep, or the modules may not have begun the shutdown sequence at all. Correct procedure: charge and confirm the battery; fit a low-current clamp on the negative cable so the circuit is never broken; secure the door latches so no door is opened during the test; lock normally and withdraw with the key; log current every 5 minutes for a minimum of 60 minutes; identify the settled floor value; if above 50 mA, locate the circuit by millivolt drop across fuses rather than by pulling them; confirm the repair with a full repeat sleep cycle. Two faults missed by a 4-minute test: 1. A module that never enters sleep — e.g. an amplifier, telematics unit or aftermarket alarm held awake by a stuck input or a corrupted CAN wake signal. Current at 4 minutes looks normal because everything is legitimately awake; at 60 minutes it is still drawing 300 mA. 2. A slowly developing draw — such as a glovebox or boot lamp switch that only closes as the seal relaxes, or moisture-driven leakage that rises over hours. Neither is visible in a 4-minute window. Also worth noting: 14.2 V at idle is acceptable but does not prove the alternator is healthy. AC ripple and full-load output must be tested before the charging system is cleared. ", "words": 3123}, {"id": "module-2-electronics-semiconductors", "label": "Module 2", "title": "Electronics & semiconductors", "colour": "#C4322A", "html": "<h1>Module 2 — Vehicle Electronics &amp; Semiconductor Components</h1>\n<p><strong>Hours:</strong> 60 (24 lecture / 36 workshop)\n<strong>Prerequisite:</strong> Module 1 practicals signed off.</p>\n<hr />\n<h2>1. Module overview &amp; learning objectives</h2>\n<p>Module 1 taught the student to measure a circuit. Module 2 teaches what is <em>inside</em> the circuit and what its signals should look like on a screen. The central skill is <strong>waveform literacy</strong> — the ability to look at a trace and say what the mechanism producing it must be doing.</p>\n<p>By the end of the module the student can:</p>\n<ul>\n<li><strong>2.1</strong> Identify and test diodes, transistors, MOSFETs, capacitors and resistors in situ and on the bench.</li>\n<li><strong>2.2</strong> Explain the operating principle of each major sensor family and predict its output signal shape.</li>\n<li><strong>2.3</strong> Distinguish a failed sensor from a failed circuit from a failed ECU driver, using measurement rather than substitution.</li>\n<li><strong>2.4</strong> Capture and interpret crank, cam, injector, ignition and PWM waveforms, including relative compression and cam timing from a crank/cam overlay.</li>\n<li><strong>2.5</strong> Use current ramping to assess an injector or actuator's mechanical condition through its electrical signature.</li>\n</ul>\n<hr />\n<h2>2. Comprehensive theory &amp; lecture notes</h2>\n<h3>2.1 Passive components in vehicle circuits</h3>\n<p><strong>Resistors</strong> — set bias, limit current, and form voltage dividers. The most important automotive use is the <strong>pull-up resistor</strong> inside an ECU. An ECU input is typically pulled to 5 V through 1–10 kΩ. When the external sensor is disconnected, the input floats to 5 V; when it shorts to ground, the input reads 0 V. This is why a disconnected sensor and a shorted sensor set <em>different</em> codes, and why measuring 5.0 V at a disconnected signal wire proves the ECU side is alive.</p>\n<p><strong>Capacitors</strong> — store charge, block DC, pass AC. <code>Q = C × V</code>, energy <code>E = ½CV²</code>. In vehicles they appear as decoupling capacitors on module power rails, filter capacitors in ignition and radio suppression, and bulk electrolytics in module power supplies. <strong>Electrolytic capacitor failure is the single most common cause of module failure by age.</strong> They dry out, ESR rises, the rail becomes noisy, and the module resets or behaves illogically. On an opened module, a bulged or leaking can is a finding; a flat-topped can measuring high ESR is also a finding even when it looks perfect.</p>\n<p><strong>Inductors</strong> — resist changes in current. <code>V = -L × dI/dt</code>. Every coil, injector, solenoid and relay on the vehicle is an inductor, and each one produces a back-EMF spike when switched off. Reading that spike is how we diagnose them (see 2.5).</p>\n<h3>2.2 Semiconductors</h3>\n<p><strong>Diode</strong> — conducts one way. Forward voltage drop <strong>0.6–0.7 V for silicon</strong>, 0.3 V for Schottky, and 1.5–3.5 V for an LED depending on colour. Automotive roles:\n- Rectification in the alternator (six or eight diodes in a bridge)\n- Flyback/suppression across relay and solenoid coils\n- Steering diodes preventing feedback between circuits\n- Zener diodes for voltage clamping and protection at module inputs</p>\n<p>Test: DMM diode mode, expect ~0.5–0.7 V one way and OL the other. A diode reading near 0 V both ways is shorted; OL both ways is open.</p>\n<p><strong>Alternator diode failure</strong> is a classroom must. One failed diode in the bridge lets AC ripple through onto the vehicle's 12 V rail. Symptoms: whine through the radio, flickering lights, random module resets, communication errors, sometimes a battery light that never comes on. <strong>Diagnostic: DMM on AC volts at the battery, engine running with load. More than 0.5 V AC is a fail.</strong> On the scope, a healthy alternator shows small even ripple; a failed diode shows one deep notch repeating each revolution.</p>\n<p><strong>Bipolar transistor (BJT)</strong> — current-controlled. Base current controls collector current, <code>I_C = β × I_B</code>. Still found in older ignition modules and driver stages.</p>\n<p><strong>MOSFET</strong> — voltage-controlled, and the workhorse of every modern ECU output stage. Gate voltage above threshold turns on a low-resistance channel (<code>R_DS(on)</code> often under 10 mΩ). Practically all injector, coil, fan, pump and lamp drivers inside a modern module are MOSFETs, usually in <strong>smart driver ICs</strong> that include current sensing, over-temperature shutdown and open-load detection.</p>\n<p>That last point is what generates so many codes: the smart driver reports <strong>open load, short to ground, short to battery and over-current</strong> back to the microcontroller, which converts them into DTCs. So a code that says \"injector 3 circuit open\" is the driver IC's own diagnostic, and it is reported <strong>when the driver is off</strong>, using a small sensing current. An open-load code with the circuit intact usually means a wiring fault; an over-current code usually means the load itself.</p>\n<p><strong>High-side vs low-side drivers:</strong></p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Low-side driver</th>\n<th>High-side driver</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>ECU switches</td>\n<td>Ground</td>\n<td>Battery positive</td>\n</tr>\n<tr>\n<td>Component sees</td>\n<td>Permanent 12 V feed, ECU pulls the other pin low</td>\n<td>Permanent ground, ECU supplies 12 V</td>\n</tr>\n<tr>\n<td>Voltage at pin when OFF</td>\n<td>~12 V (pulled up through the load)</td>\n<td>~0 V</td>\n</tr>\n<tr>\n<td>Voltage at pin when ON</td>\n<td>~0 V</td>\n<td>~12 V</td>\n</tr>\n<tr>\n<td>Typical use</td>\n<td>Injectors, coils, most solenoids</td>\n<td>Sensor supplies, some actuators, safety-critical loads</td>\n</tr>\n</tbody>\n</table>\n<p>Students must state which type they are testing <strong>before</strong> interpreting a reading, because 12 V at a driver pin means \"off\" on a low-side circuit and \"on\" on a high-side one. Half the misdiagnoses in the trade come from getting this backwards.</p>\n<h3>2.3 Sensor families</h3>\n<h4>Inductive / variable reluctance (VR)</h4>\n<p>A coil and a magnet. A moving toothed wheel varies the flux, inducing an AC voltage. <strong>Self-generating — no supply voltage.</strong>\n- Output: <strong>AC sine-like</strong>, amplitude proportional to speed. 0.5–2 V p-p at cranking, 20–100 V p-p at high rpm.\n- Two wires (plus screen). Coil resistance typically <strong>200–1,500 Ω</strong>.\n- Failure modes: coil open/short, air gap changed by debris on the reluctor, cracked reluctor ring, screen ground lost causing interference.\n- Diagnostic advantage: it produces its own signal, so it can be tested with the ECU disconnected by spinning the engine.</p>\n<h4>Hall effect</h4>\n<p>A semiconductor element in a magnetic field produces a small transverse voltage, amplified and squared inside the sensor. <strong>Requires a supply — usually three wires (supply, ground, signal).</strong>\n- Output: <strong>digital square wave</strong>, 0 V to 5 V or 0 V to 12 V, amplitude <em>independent of speed</em>.\n- Many are open-collector, requiring the ECU's pull-up. Disconnect the ECU and the signal disappears — a fact that confuses students who expect a VR-style self-generated output.\n- Failure: internal electronics fail, often heat-related and intermittent. Supply or ground fault kills output entirely.</p>\n<h4>Magnetoresistive (MRE / AMR / GMR)</h4>\n<p>Modern replacement for Hall in wheel speed and crank/cam. Detects field direction rather than strength, so it works down to <strong>zero speed</strong> and gives direction of rotation — essential for stop/start, hill hold and cylinder identification at rest.\n- Often a <strong>two-wire current-modulated</strong> device: the sensor changes its own current draw between roughly <strong>7 mA and 14 mA</strong>, and the ECU reads the change as a voltage across a shunt.\n- Critical teaching point: <strong>you cannot properly test these with a voltmeter.</strong> You need a scope across a shunt or a low-current clamp. Many \"no wheel spe
