plain immobiliser architecture, transponder technology and the security handshake.</li>\n<li><strong>6.5</strong> Perform key programming, module pairing and VIN alignment through legitimate channels.</li>\n<li><strong>6.6</strong> Apply the ownership-verification and record-keeping discipline that separates a repair workshop from a liability.</li>\n</ul>\n<hr />\n<h2>2. Comprehensive theory &amp; lecture notes</h2>\n<h3>2.1 Why reprogram at all</h3>\n<p>Legitimate reasons, in the order they arise in a workshop:</p>\n<ol>\n<li><strong>Manufacturer software update</strong> to fix a known driveability, emissions or reliability defect — often the actual fix for a fault that has consumed hours of diagnosis. <strong>Check the calibration ID (OBD mode 09) against the manufacturer's current level before any deep diagnostic work.</strong></li>\n<li><strong>Replacement module</strong> requiring the correct software and calibration for the specific vehicle build.</li>\n<li><strong>Recovery</strong> of a module corrupted by a failed update or a voltage drop.</li>\n<li><strong>Variant coding</strong> after fitting a component with a different specification.</li>\n<li><strong>Calibration adjustment</strong> where the manufacturer provides a legitimate option (e.g. tyre size, gear ratio, PTO settings on commercial vehicles).</li>\n</ol>\n<h3>2.2 The three programming access modes</h3>\n<table>\n<thead>\n<tr>\n<th>Mode</th>\n<th>Access</th>\n<th>When used</th>\n<th>Risk</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>OBD</strong></td>\n<td>Through the diagnostic connector, vehicle assembled</td>\n<td>Most modern modules; manufacturer-supported updates</td>\n<td>Lowest. Voltage interruption is the main hazard.</td>\n</tr>\n<tr>\n<td><strong>Bench</strong></td>\n<td>Module removed, powered on a bench harness, programmed over its own connector</td>\n<td>Modules that will not respond over OBD, or are already removed</td>\n<td>Medium. Wrong pinout damages the module.</td>\n</tr>\n<tr>\n<td><strong>Boot</strong></td>\n<td>Direct MCU access via BDM/JTAG/boot pins on the board</td>\n<td>Locked modules, recovery from a bricked state, read-protected devices</td>\n<td>Highest. A slip destroys the MCU.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Selection rule:</strong> always attempt the least invasive mode that will do the job. Going straight to boot mode on a module that would have flashed over OBD is how boards get scrapped.</p>\n<h3>2.3 J2534 pass-thru programming</h3>\n<p><strong>SAE J2534</strong> defines a standard API between a PC and a vehicle interface. The OEM writes the software; any compliant interface can carry it. It exists because legislation in the US and EU requires manufacturers to make reprogramming available to independent workshops.</p>\n<p>Workflow:\n1. Obtain a <strong>subscription</strong> to the manufacturer's programming portal (usually daily, weekly or annual).\n2. Install the OEM application and the J2534 device's driver.\n3. Connect the interface, connect <strong>battery support</strong>, and start the session.\n4. The application reads the vehicle's identity, determines the current and target calibration, and downloads the file.\n5. The flash proceeds. <strong>Do not touch anything.</strong>\n6. Post-programming: the application performs the required coding, adaptations and relearns.</p>\n<p><strong>What J2534 does not give you:</strong> security-gated functions without registered credentials, and immobiliser/key functions on most brands without separate certification.</p>\n<h3>2.4 The flash process itself</h3>\n<p>Under the surface, almost all modern flashing is <strong>UDS (ISO 14229)</strong> over CAN or DoIP. The sequence:</p>\n<ol>\n<li><strong>Enter extended/programming session</strong> — service 0x10.</li>\n<li><strong>Security access</strong> — service 0x27: the module issues a seed, the tool returns a key computed by a manufacturer-specific algorithm. This is the gate.</li>\n<li><strong>Disable normal communication and DTC setting</strong> — services 0x28, 0x85, so the flash is not disturbed and the vehicle does not fill with codes.</li>\n<li><strong>Request download</strong> — service 0x34, specifying the memory address and size.</li>\n<li><strong>Transfer data</strong> — service 0x36, repeated in blocks.</li>\n<li><strong>Request transfer exit</strong> — service 0x37.</li>\n<li><strong>Routine control</strong> — service 0x31: erase, then verify checksum, then activate.</li>\n<li><strong>ECU reset</strong> — service 0x11.</li>\n<li>Re-enable communication and DTC setting; run required post-programming routines.</li>\n</ol>\n<p>The window of maximum danger is between the <strong>erase</strong> and the successful <strong>verify</strong>. During that period the module has no valid application, and a voltage interruption leaves it that way.</p>\n<h3>2.5 Voltage — the single biggest cause of bricked modules</h3>\n<table>\n<thead>\n<tr>\n<th>Requirement</th>\n<th>Value</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Minimum voltage during flash</td>\n<td>Typically <strong>12.5–13.5 V</strong>, brand-specific</td>\n</tr>\n<tr>\n<td>Battery support unit output</td>\n<td>Stable, low-ripple, <strong>minimum 70 A</strong>, ideally 100 A</td>\n</tr>\n<tr>\n<td>What a battery charger is</td>\n<td><strong>Not</strong> a battery support unit. Chargers pulse, ripple and cycle.</td>\n</tr>\n<tr>\n<td>Consumers</td>\n<td>All off — lights, HVAC blower, radio, heated screens, cooling fans</td>\n</tr>\n<tr>\n<td>Doors</td>\n<td>Closed. Opening a door can wake modules and load the system mid-flash</td>\n</tr>\n<tr>\n<td>Engine</td>\n<td>Off. Never flash with the engine running unless the OEM explicitly requires it</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Also:</strong> disable the PC's sleep, screen saver, automatic updates and Wi-Fi power management. A laptop that suspends during a flash bricks the module just as effectively as a flat battery. Use a wired connection where the interface supports it.</p>\n<h3>2.6 Checksums</h3>\n<p>A calibration file carries checksums so the module can verify integrity before running. Change one byte of calibration and the checksum no longer matches; the module either refuses the file or runs and immediately flags a corruption fault.</p>\n<p>Types encountered:\n- Simple additive checksum over a region.\n- <strong>CRC</strong> (16 or 32-bit) over defined regions.\n- Manufacturer-proprietary algorithms — <strong>Bosch EDC17/MED17, Delphi, Siemens and Denso each have their own</strong>, and the modern ones are not publicly documented.</p>\n<p><strong>Practical consequence:</strong> a calibration editor can compute standard checksums but cannot compute proprietary ones. The flashing hardware applies the correct correction on write. If a tool cannot correct the checksum for a given ECU family, that family cannot be safely written with it. Verify this before quoting the job, not after opening the file.</p>\n<h3>2.7 Recovery from a bricked module</h3>\n<p>A module bricked mid-flash typically presents as: no communication, no response to the diagnostic tool, sometimes a constant current draw, sometimes cycling.</p>\n<p>Recovery ladder:\n1. <strong>Retry the flash over OBD.</strong> Many modules retain a functioning bootloader and will accept a retry. Fix the cause first — battery support, laptop settings — or the retry fails identically.\n2. <strong>Bench flash.</strong> Remove the module, power it on a bench harness, and attempt the flash directly. Removes every vehicle-side variable.\n3. <strong>Boot mode / BDM.</strong> Direct MCU access, writing the full flash image including the bootloader.\n4. <strong>Restore from your archive.</strong> This only exists if you took a verified read before you started. This is why §2.8 is non-negotiable.</p>\n<p>If none of these succeed, the module is replaced and the vehicle programmed from new. The cost of that outcome is the argument for the pre-flash discipline.</p>\n<h3>2.8 Pre-flash discipline — mandatory in this programme</h3>\n<p>Before any write to any module, in every case:</p>\n<ol>\n<li><strong>Read the module and archive the original</strong>, verified by two identical reads. Store with VIN, date, part number and technician name.</li>\n<li><strong>Record the current calibration ID and software/hardware numbers</strong> (OBD mode 09 and the module label).</li>\n<li><strong>Record all existing DTCs</strong> across the vehicle, and all adaptation values that will be lost.</li>\n<li><strong>Photograph the label</strong> and the connector.</li>\n<li><strong>Confirm battery support is connected and holding voltage</strong> under load before starting.</li>\n<li><strong>Confirm the laptop is on mains, sleep disabled, updates deferred.</strong></li>\n<li><strong>Tell the customer the risk exists</strong> and that a module can be lost during a programming event even when everything is done correctly. Get that acknowledged before starting.</li>\n</ol>\n<p>A workshop that does all seven consistently will occasionally brick a module and always recover it. A workshop that skips step 1 will eventually buy a customer an ECU.</p>\n<h3>2.9 Immobiliser systems — architecture</h3>\n<p>The immobiliser prevents the engine running unless a valid key is present. Modern architectures share a common shape:</p>\n<pre><code>Key transponder  ◄── RF field ──►  Antenna ring / coil\n                                        │\n                                        ▼\n                              Immobiliser control unit\n                              (standalone, or inside BCM,\n                               instrument cluster, or gateway)\n                                        │\n                                  encrypted handshake\n                                  over CAN or dedicated line\n                                        │\n                                        ▼\n                                 Engine ECU\n                          (releases fuel and ignition\n                           only on a valid response)\n</code></pre>\n<p><strong>Transponder generations:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Type</th>\n<th>Description</th>\n<th>Security</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Fixed code</td>\n<td>Static ID returned to the reader</td>\n<td>Trivially cloned; obsolete</td>\n</tr>\n<tr>\n<td>Rolling / crypto (e.g. 40/42/44-bit families)</td>\n<td>Challenge-response with a shared secret</td>\n<td>Moderate; older algorithms broken</td>\n</tr>\n<tr>\n<td>AES-128 based (e.g. modern Hitag/DST80 successors)</td>\n<td>Strong cryptographic challenge-response</td>\n<td>Strong; requires OEM channel</td>\n</tr>\n<tr>\n<td>Smart key / PEPS</td>\n<td>Bidirectional RF plus rolling code, proximity based</td>\n<td>Strong; adds a body/comfort layer</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Key components of a job:</strong>\n- <strong>Transponder programming</strong> — teaching the vehicle a new key's identity.\n- <strong>Key deletion</strong> — removing lost keys so they no longer start the vehicle. Frequently the more important half of the job and frequently skipped.\n- <strong>Module pairing</strong> — synchronising an ECU, BCM, cluster and immobiliser so they accept each other.\n- <strong>VIN alignment</strong> — writing the correct VIN into a replacement module so component protection and diagnostics resolve correctly.\n- <strong>Virginising</strong> — returning a module to an unlearned state so it can be paired to a vehicle. Manufacturer-supported on some platforms, not on others.</p>\n<h3>2.10 Security access and the legitimate channel</h3>\n<p>Every manufacturer gates security functions. The legitimate routes are:</p>\n<ol>\n<li><strong>OEM online programming</strong> with a paid subscription and, in most regions, a <strong>registered technician identity</strong>. In the EU this is the <strong>SERMI</strong> scheme (accredited independent operators, verified identity, audited); in the US it operates through NASTF's <strong>Vehicle Security Professional (VSP)</strong> registry and Secure Data Release Model.</li>\n<li><strong>Locksmith accreditation</strong> through a national association with vetting and insurance.</li>\n<li><strong>Aftermarket tools operating within manufacturer-sanctioned channels</strong> for the platforms where that exists.</li>\n</ol>\n<p><strong>What this programme teaches and what it does not:</strong></p>\n<p>The programme teaches immobiliser architecture, transponder technology, the diagnostic process, the pairing and alignment procedures as performed through legitimate channels, and the workshop discipline around them. It teaches students how to obtain the accreditations above, because that is the route to doing this work as a business.</p>\n<p>It does not teach circumventing manufacturer security on a vehicle you cannot prove the customer owns, and no practical in this module is delivered on a vehicle without documentation. This is not a formality. Key programming without ownership verification is how stolen vehicles are moved, insurers refuse claims, and workshops end up in court. The verification takes four minutes.</p>\n<h3>2.11 Mandatory ownership verification procedure</h3>\n<p>Before <strong>any</strong> security-related work — key programming, key deletion, immobiliser pairing, module virginising, VIN writing:</p>\n<ol>\n<li><strong>Photographic identification</strong> of the person presenting the vehicle.</li>\n<li><strong>Proof of ownership</strong>: registration document (logbook / V5C / title) in the presenter's name, or a documented authority from the registered keeper, or a fleet/lease authorisation on company letterhead.</li>\n<li><strong>VIN check</strong>: physically read the VIN from the vehicle and confirm it matches the document and the module data. A mismatch between the vehicle's stamped VIN and the VIN in its own modules stops the job.</li>\n<li><strong>Record</strong>: photocopy or photograph of ID and ownership document, VIN, date, work performed, keys programmed, <strong>keys deleted</strong>, and technician name, retained per your jurisdiction's record-keeping period.</li>\n<li><strong>Refuse and document</strong> if anything does not reconcile — no logbook, a VIN that does not match, a \"friend's car\", urgency and cash. Record the refusal.</li>\n</ol>\n<p>A workshop that keeps these records can answer a police enquiry in ten minutes. One that does not is the enquiry.</p>\n<h3>2.12 Post-programming work</h3>\n<p>A flash is not finished when the progress bar completes.</p>\n<table>\n<thead>\n<tr>\n<th>Task</th>\n<th>Why</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Throttle body / idle relearn</td>\n<td>Adaptations reset by the flash</td>\n</tr>\n<tr>\n<td>Transmission adaptation reset and relearn</td>\n<td>Shift quality will be poor until relearned</td>\n</tr>\n<tr>\n<td>Steering angle sensor calibration</td>\n<td>ESP/ABS require it; a warning lamp otherwise</td>\n</tr>\n<tr>\n<td>Injector coding (IQA/IMA codes)</td>\n<td>Diesel injectors have individual correction codes that must be re-entered</td>\n</tr>\n<tr>\n<td>DPF / regeneration counters</td>\n<td>Must reflect the physical filter's state</td>\n</tr>\n<tr>\n<td>Variant coding / vehicle configuration</td>\n<td>Options must match the actual build</td>\n</tr>\n<tr>\n<td>Immobiliser re-pairing</td>\n<td>Where the flash cleared security data</td>\n</tr>\n<tr>\n<td>Full system scan and clear</td>\n<td>Codes set during the event are expected and must be cleared</td>\n</tr>\n<tr>\n<td>Road test</td>\n<td>The only real verification</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Injector coding deserves emphasis:</strong> on common-rail diesels, each injector carries a printed correction code (IMA on VAG, IQA/ISA on others). After a flash or an ECU change, if these are not entered correctly and against the right cylinder, the engine runs rough, smokes, and the customer returns. The codes are on the injector body — record them before the job, not after the engine is back together.</p>\n<hr />\n<h2>3. Tools &amp; equipment needed</h2>\n<ul>\n<li><strong>J2534-2 pass-thru interface</strong> (Drewtech Mongoose, Autel MaxiFlash, VXDIAG) plus at least one OEM subscription</li>\n<li><strong>Battery support unit</strong>, minimum 70 A, stable and low-ripple — not a charger</li>\n<li>Bench programming harnesses for the common ECU families</li>\n<li>Boot/BDM tooling (Autotuner, CMD, KT200, Flex or equivalent) with the correct probe adapters</li>\n<li>EEPROM programmer with SOIC clip and adapters (from Module 5)</li>\n<li>Key programming platform appropriate to the accreditation route the school operates under</li>\n<li>Transponder reader/analyser and a stock of blank transponders and key shells for practical work</li>\n<li>Antenna ring test tooling and an oscilloscope for coil signal work</li>\n<li>Laptop configured for programming: mains powered, sleep and updates disabled, wired network</li>\n<li>Practice modules — scrap ECUs of several families, at least two per student, for recovery drills</li>\n</ul>\n<hr />\n<h2>4. Step-by-step practical lab exercise</h2>\n<h3>Lab 6.1 — Perform a controlled OBD programming event</h3>\n<p><strong>Scenario:</strong> A vehicle has a manufacturer calibration update available that addresses a known driveability complaint.</p>\n<ol>\n<li><strong>Verify the update applies.</strong> Read the current calibration ID with OBD mode 09 and check it against the manufacturer's current level and the relevant bulletin. Do not flash speculatively.</li>\n<li><strong>Full system scan and record.</strong> Save the report. Note all adaptation values that will be lost.</li>\n<li><strong>Record injector codes</strong> (diesel), variant coding and any configuration data. Photograph the module label.</li>\n<li><strong>Read and archive</strong> where the platform permits a full read.</li>\n<li><strong>Battery test.</strong> The vehicle's own battery must be healthy — a support unit compensates for load, not for a failed battery.</li>\n<li><strong>Connect battery support</strong> and confirm it holds 13.2–13.8 V under a representative load before starting.</li>\n<li><strong>Prepare the vehicle:</strong> ignition on, engine off, all consumers off, doors closed, bonnet closed if the vehicle wakes modules on bonnet open.</li>\n<li><strong>Prepare the laptop:</strong> mains power, sleep and hibernation disabled, updates deferred, wired connection, all other applications closed.</li>\n<li><strong>Start the session.</strong> Follow the OEM software exactly. <strong>Do not touch the vehicle, the laptop or the interface until the process reports completion.</strong></li>\n<li><strong>On completion</strong>, run every post-programming routine the software lists, plus those in the §2.12 table that apply.</li>\n<li><strong>Full system scan</strong>, clear expected codes, rescan to confirm they do not return.</li>\n<li><strong>Road test</strong>, then rescan after a full drive cycle.</li>\n<li><strong>Document:</strong> before and after calibration IDs, all routines performed, adaptations reset and relearned.</li>\n</ol>\n<h3>Lab 6.2 — Recover a deliberately bricked practice module</h3>\n<p>The instructor interrupts a flash on a scrap module at a defined point.</p>\n<ol>\n<li><strong>Establish the state.</strong> Bench-power the module (Module 5 method). Record standby and awake current. Attempt communication.</li>\n<li><strong>Determine whether a bootloader survives.</strong> Attempt to enter a programming session over the module's own connector. Many modules answer in programming session while refusing normal session — that is a recoverable state.</li>\n<li><strong>If it answers:</strong> retry the flash on the bench with a full, verified file. Confirm checksum handling is correct for that ECU family before writing.</li>\n<li><strong>If it does not answer:</strong> identify the MCU, locate the boot/BDM pads from the board layout, and confirm the required voltages from documentation.</li>\n<li><strong>Establish the boot connection</strong> with the module unpowered, then apply power. Verify the tool identifies the MCU before attempting any write.</li>\n<li><strong>Read what is present</strong>, even from a corrupt device — it may contain recoverable EEPROM regions.</li>\n<li><strong>Write the full flash image</strong>, including the bootloader region if it was lost.</li>\n<li><strong>Verify by reading back</strong> and comparing to the written file.</li>\n<li><strong>Bench-test:</strong> rails, current draw, communication in normal session.</li>\n<li><strong>Restore EEPROM/adaptation data</strong> from archive if the write cleared it.</li>\n<li><strong>Document the failure point and the recovery path</strong> — this record is the basis of the workshop's recovery playbook.</li>\n</ol>\n<h3>Lab 6.3 — Immobiliser diagnosis without assuming the key is at fault</h3>\n<p><strong>Scenario:</strong> Engine cranks but does not start. Immobiliser lamp flashing.</p>\n<ol>\n<li><strong>Verify ownership documentation before any work begins.</strong> No documentation, no job.</li>\n<li><strong>Full system scan.</strong> Note codes in the immobiliser unit, the ECU and the cluster. An immobiliser code in the <em>ECU</em> means the ECU did not receive a valid release; a code in the <em>immobiliser unit</em> means it did not read a valid key.</li>\n<li><strong>Confirm the basics first.</strong> Fuel pressure, crank signal, and whether the ECU is commanding injection at all — a no-start with a flashing immobiliser lamp is sometimes a coincidence, and the lamp is not proof.</li>\n<li><strong>Test the key transponder.</strong> Try the spare key. If the spare works, the fault is in the first key — battery (for PEPS), transponder, or a damaged key.</li>\n<li><strong>Test the antenna ring.</strong> Scope the coil for the excitation burst when the ignition is switched. No excitation means supply, ground or the reading module; excitation with no response means the transponder or the coupling.</li>\n<li><strong>Check the reading module's supply and grounds</strong>, and its communication with the ECU. A network fault between the immobiliser unit and the ECU produces exactly this symptom — go to Module 3 methods.</li>\n<li><strong>Check for a mismatch:</strong> has the ECU, cluster or BCM been changed? Read VIN from each module and compare against the vehicle. A module carrying a different VIN is the answer.</li>\n<li><strong>Only after all of the above</strong> conclude that pairing or key programming is required, and perform it through the legitimate channel with documentation recorded.</li>\n<li><strong>Delete any keys the customer cannot account for</strong>, and record it. If a customer has lost a key, the lost key must be removed from the vehicle's memory — otherwise the vehicle remains startable by whoever holds it.</li>\n<li><strong>Verify</strong> by starting on each programmed key, then confirm no immobiliser codes remain.</li>\n</ol>\n<hr />\n<h2>5. Common failure modes &amp; troubleshooting trees</h2>\n<h3>Tree A — Flash failed or module unresponsive after programming</h3>\n<pre><code>Post-flash failure\n├─ What was the voltage during the event? Check the support unit's log\n│   or the OEM software's report. Below spec → cause identified.\n├─ Did the laptop sleep, lose network, or run an update?\n├─ Module responds in programming session but not normal session?\n│   ├─ YES → bootloader intact. Retry the flash on the bench.\n│   └─ NO → boot/BDM recovery required\n├─ Module completely silent, abnormal current draw?\n│   → suspect hardware damage as well as software; check rails first\n│     (Module 5) before assuming a software brick\n└─ Recovered but faults remain → post-programming routines not run.\n   Check injector codes, variant coding, adaptations, immobiliser pairing.\n</code></pre>\n<h3>Tree B — Engine cranks, will not start, immobiliser lamp active</h3>\n<pre><code>Immobiliser no-start\n├─ Ownership verified? → if not, STOP\n├─ Does the spare key work?\n│   ├─ YES → first key faulty. Transponder, battery, or physical damage.\n│   └─ NO → continue\n├─ Antenna ring excitation present on the scope at ignition on?\n│   ├─ NO → supply/ground to the ring, or the reading module\n│   └─ YES → transponder not responding, or not learned\n├─ Does the immobiliser unit communicate with the ECU?\n│   ├─ NO → network fault between them. Module 3 methods.\n│   └─ YES → continue\n├─ Do all modules report the same VIN?\n│   ├─ NO → a module has been changed. Alignment/pairing required.\n│   └─ YES → continue\n└─ Basics confirmed (fuel pressure, crank signal, injection commanded)?\n    → if the ECU is commanding injection and it still will not start,\n      the fault is not the immobiliser at all\n</code></pre>\n<h3>Tree C — Vehicle runs badly immediately after an ECU replacement or flash</h3>\n<pre><code>Runs poorly post-programming\n├─ Diesel? → were injector correction codes entered, and against the\n│            correct cylinders? This is the most common cause.\n├─ Were adaptations relearned (throttle, idle, transmission)?\n├─ Is the variant coding correct for the actual vehicle build?\n│   (engine variant, gearbox, market, emissions level, options)\n├─ Was the correct calibration for THIS vehicle used, or a generic\n│   one for the part number?\n├─ Are DPF/regen counters consistent with the physical filter?\n└─ Any codes set during the event that were never cleared?\n</code></pre>\n<h3>Frequently seen real-world failures</h3>\n<table>\n<thead>\n<tr>\n<th>Failure</th>\n<th>Symptom</th>\n<th>Prevention</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Battery charger used instead of support unit</td>\n<td>Flash fails mid-write</td>\n<td>Use a true support unit, verify voltage under load</td>\n</tr>\n<tr>\n<td>Laptop sleeps during flash</td>\n<td>Module bricked</td>\n<td>Disable sleep, hibernation and updates before starting</td>\n</tr>\n<tr>\n<td>Injector codes not re-entered</td>\n<td>Rough running, smoke after ECU work</td>\n<td>Record codes before removal</td>\n</tr>\n<tr>\n<td>Lost keys never deleted</td>\n<td>Vehicle remains startable by an old key</td>\n<td>Always delete unaccounted keys and record it</td>\n</tr>\n<tr>\n<td>No pre-read archive</td>\n<td>Unrecoverable brick</td>\n<td>Verified read and archive before every write</td>\n</tr>\n<tr>\n<td>Wrong checksum family</td>\n<td>Module rejects file or flags corruption</td>\n<td>Confirm tool supports that ECU family before quoting</td>\n</tr>\n<tr>\n<td>Coding not restored after module swap</td>\n<td>Multiple unrelated faults</td>\n<td>Record configuration before, restore after</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>6. Student knowledge check</h2>\n<h3>Practical scenario challenges</h3>\n<p><strong>Scenario 1 — The job that went wrong.</strong>\nA technician flashed a body module over OBD using a battery charger for support. The flash failed at 60%. The module is now silent, the vehicle will not lock, and the customer needs the car back tomorrow. No pre-read was taken. The technician has already tried the flash three more times with the same charger.\n<em>Task:</em> Explain what went wrong at each stage, describe your recovery plan in order, state what you would have done differently, and explain what you would tell the customer now.</p>\n<p><strong>Scenario 2 — The convenient customer.</strong>\nA person arrives at closing time with a high-value vehicle, no keys at all, no logbook, and offers cash plus a premium for programming a key immediately. They say the logbook is being posted by the previous owner and they have a bill of sale on their phone. They are polite, plausible and in a hurry.\n<em>Task:</em> State your decision and your reasoning. Describe exactly what you would say, what you would record, and what — if anything — would make the job acceptable at a later date.</p>\n<hr />\n<h2>7. Answer key</h2>\n<p><strong>Scenario 1 model answer.</strong></p>\n<p><strong>What went wrong, in order:</strong></p>\n<ol>\n<li><strong>A battery charger was used instead of a support unit.</strong> Chargers deliver pulsed, rippling output and cycle their output stage. During a flash the module needs an unwavering supply; the ripple alone can drop the module below its minimum programming voltage momentarily, which is enough.</li>\n<li><strong>No pre-read archive was taken.</strong> The original software and, critically, any module-specific data are now gone with no fallback. This removes the fastest recovery route.</li>\n<li><strong>The flash was retried three times with the same charger.</strong> Repeating a failed procedure without correcting the cause achieves nothing and risks further corruption of the memory, including the bootloader region that would otherwise have made recovery easy.</li>\n</ol>\n<p><strong>Recovery plan, in order:</strong></p>\n<ol>\n<li><strong>Stop retrying.</strong> Remove the charger from the equation entirely.</li>\n<li><strong>Fit a proper battery support unit</strong> and verify it holds 13.2–13.8 V under load.</li>\n<li><strong>Attempt a programming session over OBD.</strong> If the module answers, the bootloader lives — reflash with a verified file and correct support.</li>\n<li><strong>If OBD is silent, remove the module and bench it</strong> (Module 5 method). Power it on a current-limited supply, check rails and current draw to confirm the hardware is undamaged, fit the 120 Ω terminator, and attempt a programming session on the bench. This removes every vehicle-side variable.</li>\n<li><strong>If the bench is silent, go to boot/BDM.</strong> Identify the MCU, locate the pads, confirm required voltages from documentation, read whatever is present, then write the full image including the bootloader.</li>\n<li><strong>Verify by read-back</strong>, bench-test, then refit.</li>\n<li><strong>Restore configuration and coding</strong> from the records — if any were taken. If not, the configuration must be rebuilt from the vehicle's build data through the OEM portal.</li>\n<li><strong>If all recovery fails</strong>, source a replacement module and programme it from new through the OEM channel.</li>\n</ol>\n<p><strong>What I would have done differently:</strong> taken a verified pre-read and archived it; recorded all coding and configuration; used a genuine support unit; disabled laptop sleep and updates; and stopped after the first failure to diagnose the cause rather than repeating it.</p>\n<p><strong>What I would tell the customer now:</strong> the truth, promptly and without minimising it. That the module was corrupted during a programming operation, that the workshop is recovering it at the workshop's cost, that there is a realistic recovery path but it may take longer than a day, and — honestly — whether tomorrow is achievable. Offer a courtesy vehicle or a contribution to hire if the deadline matters. A customer told early and honestly usually stays; a customer who discovers it themselves does not.</p>\n<p><strong>Scenario 2 model answer.</strong></p>\n<p><strong>Decision: decline the work today.</strong> Every marker of an illegitimate job is present simultaneously — no keys at all, no registration document, high value, cash premium, urgency, closing time, and documentation that is always about to arrive. Any one of these alone might be innocent. Together they are the standard profile, and the fact that the person is polite and plausible is not evidence of anything; a person moving a stolen vehicle is not going to be rude about it.</p>\n<p><strong>What I would say:</strong> something plain, unapologetic and non-accusatory. That the workshop cannot carry out security or key work without photographic identification and a registration document or documented authority from the registered keeper, that this applies to every customer without exception, and that as soon as they have the logbook the job can be booked and done properly. Give them the workshop card and the exact list of what to bring. Do not lecture and do not accuse — a legitimate customer returns with paperwork, and treating them decently is why they return.</p>\n<p><strong>What I would record:</strong> date and time, vehicle make, model and VIN if visible, registration, a description of what was requested, the documentation offered and what was missing, and the fact that the work was refused. Retain it. If the vehicle is later reported stolen, this record is exactly what an enquiry needs, and it establishes that the workshop's procedure works.</p>\n<p><strong>What would make it acceptable later:</strong> the registered keeper's document in the presenter's name, or a signed authority from the registered keeper together with the keeper's own identification; photographic ID matching that document; and a physical VIN check on the vehicle that reconciles with both the document and the VIN stored in the vehicle's own modules. With those three in place, the job is ordinary work — and it should include deleting every key not accounted for, recorded on the invoice.</p>\n<p>A footnote worth teaching: a bill of sale on a phone is not proof of ownership anywhere. It is a photograph of a document that takes two minutes to fabricate.</p>", "quiz": [{"q": "During a UDS flash, the period of greatest risk to the module is:", "options": [{"k": "A", "t": "During security access (service 0x27)"}, {"k": "B", "t": "Between the memory erase and a successful verify"}, {"k": "C", "t": "During the ECU reset (service 0x11)"}, {"k": "D", "t": "While reading the calibration ID"}], "answer": "B", "why": "Once the memory is erased the module holds no valid application. Any interruption in that window leaves it without executable software. Security access and calibration reads are read-only or session-level operations and carry no such exposure."}, {"q": "The correct power source during an OBD programming event is:", "options": [{"k": "A", "t": "A standard battery charger set to maximum"}, {"k": "B", "t": "The vehicle's own battery, fully charged, with no external source"}, {"k": "C", "t": "A stable low-ripple battery support unit of at least 70 A"}, {"k": "D", "t": "A second vehicle connected by jump leads with its engine running"}], "answer": "C", "why": "A battery support unit delivers stable, low-ripple, high-current output. A charger pulses and cycles, which is exactly the disturbance a flash cannot tolerate. Jump leads from a running vehicle introduce alternator ripple and are worse still."}, {"q": "A common-rail diesel runs rough and smokes immediately after an ECU replacement. All coding is correct. The most likely omission is:", "options": [{"k": "A", "t": "Steering angle calibration"}, {"k": "B", "t": "Injector correction codes not entered, or entered against the wrong cylinders"}, {"k": "C", "t": "The DPF was not replaced"}, {"k": "D", "t": "The immobiliser was not paired"}], "answer": "B", "why": "Individual injector correction codes compensate for manufacturing variation in delivery. Without them, or against the wrong cylinders, fuelling is wrong per cylinder and the engine runs rough and smokes. Recording them before removal prevents the problem entirely."}, {"q": "A customer requests key programming and cannot produce a registration document, saying the vehicle belongs to a friend. The correct action is:", "options": [{"k": "A", "t": "Proceed if they pay in advance"}, {"k": "B", "t": "Proceed but note it on the invoice"}, {"k": "C", "t": "Decline the work, record the refusal, and explain what documentation would be required"}, {"k": "D", "t": "Program the key but do not delete the existing keys"}], "answer": "C", "why": "No proof of ownership, no security work. Recording the refusal protects the workshop, and explaining the requirement gives a legitimate customer a clear route to getting the job done properly."}, {"q": "A module is silent after an interrupted flash but responds when a programming session is requested on the bench. This indicates:", "options": [{"k": "A", "t": "The module is unrecoverable and must be replaced"}, {"k": "B", "t": "The bootloader is intact and a bench flash retry is the correct next step"}, {"k": "C", "t": "The MCU has failed"}, {"k": "D", "t": "The EEPROM has been erased"}], "answer": "B", "why": "Responding to a programming session request means the bootloader is executing. That is a recoverable state and a bench flash retry — after fixing whatever caused the original failure — is the correct next step, before any boot/BDM intervention."}], "search": " Module 6 — ECU Reprogramming, Flashing & Immobiliser Systems Hours: 70 (26 lecture / 44 bench and vehicle) Prerequisite: Module 5 signed off. Gated module — students must hold a signed record of understanding on the legal framework in §2.9 before any immobiliser practical. 1. Module overview & learning objectives This module covers two skills the trade pays well for and that carry real risk: putting new software into a module, and making a module belong to a vehicle. Get either wrong and you have a non-functional vehicle on a ramp and an angry customer. By the end of the module the student can: 6.1 Distinguish OBD, bench and boot programming, and select the right one for a given module. 6.2 Prepare a vehicle correctly for a programming event so the flash cannot be interrupted. 6.3 Recover a module bricked by an interrupted flash. 6.4 Explain immobiliser architecture, transponder technology and the security handshake. 6.5 Perform key programming, module pairing and VIN alignment through legitimate channels. 6.6 Apply the ownership-verification and record-keeping discipline that separates a repair workshop from a liability. 2. Comprehensive theory & lecture notes 2.1 Why reprogram at all Legitimate reasons, in the order they arise in a workshop: Manufacturer software update to fix a known driveability, emissions or reliability defect — often the actual fix for a fault that has consumed hours of diagnosis. Check the calibration ID (OBD mode 09) against the manufacturer's current level before any deep diagnostic work. Replacement module requiring the correct software and calibration for the specific vehicle build. Recovery of a module corrupted by a failed update or a voltage drop. Variant coding after fitting a component with a different specification. Calibration adjustment where the manufacturer provides a legitimate option (e.g. tyre size, gear ratio, PTO settings on commercial vehicles). 2.2 The three programming access modes Mode Access When used Risk OBD Through the diagnostic connector, vehicle assembled Most modern modules; manufacturer-supported updates Lowest. Voltage interruption is the main hazard. Bench Module removed, powered on a bench harness, programmed over its own connector Modules that will not respond over OBD, or are already removed Medium. Wrong pinout damages the module. Boot Direct MCU access via BDM/JTAG/boot pins on the board Locked modules, recovery from a bricked state, read-protected devices Highest. A slip destroys the MCU. Selection rule: always attempt the least invasive mode that will do the job. Going straight to boot mode on a module that would have flashed over OBD is how boards get scrapped. 2.3 J2534 pass-thru programming SAE J2534 defines a standard API between a PC and a vehicle interface. The OEM writes the software; any compliant interface can carry it. It exists because legislation in the US and EU requires manufacturers to make reprogramming available to independent workshops. Workflow: 1. Obtain a subscription to the manufacturer's programming portal (usually daily, weekly or annual). 2. Install the OEM application and the J2534 device's driver. 3. Connect the interface, connect battery support , and start the session. 4. The application reads the vehicle's identity, determines the current and target calibration, and downloads the file. 5. The flash proceeds. Do not touch anything. 6. Post-programming: the application performs the required coding, adaptations and relearns. What J2534 does not give you: security-gated functions without registered credentials, and immobiliser/key functions on most brands without separate certification. 2.4 The flash process itself Under the surface, almost all modern flashing is UDS (ISO 14229) over CAN or DoIP. The sequence: Enter extended/programming session — service 0x10. Security access — service 0x27: the module issues a seed, the tool returns a key computed by a manufacturer-specific algorithm. This is the gate. Disable normal communication and DTC setting — services 0x28, 0x85, so the flash is not disturbed and the vehicle does not fill with codes. Request download — service 0x34, specifying the memory address and size. Transfer data — service 0x36, repeated in blocks. Request transfer exit — service 0x37. Routine control — service 0x31: erase, then verify checksum, then activate. ECU reset — service 0x11. Re-enable communication and DTC setting; run required post-programming routines. The window of maximum danger is between the erase and the successful verify . During that period the module has no valid application, and a voltage interruption leaves it that way. 2.5 Voltage — the single biggest cause of bricked modules Requirement Value Minimum voltage during flash Typically 12.5–13.5 V , brand-specific Battery support unit output Stable, low-ripple, minimum 70 A , ideally 100 A What a battery charger is Not a battery support unit. Chargers pulse, ripple and cycle. Consumers All off — lights, HVAC blower, radio, heated screens, cooling fans Doors Closed. Opening a door can wake modules and load the system mid-flash Engine Off. Never flash with the engine running unless the OEM explicitly requires it Also: disable the PC's sleep, screen saver, automatic updates and Wi-Fi power management. A laptop that suspends during a flash bricks the module just as effectively as a flat battery. Use a wired connection where the interface supports it. 2.6 Checksums A calibration file carries checksums so the module can verify integrity before running. Change one byte of calibration and the checksum no longer matches; the module either refuses the file or runs and immediately flags a corruption fault. Types encountered: - Simple additive checksum over a region. - CRC (16 or 32-bit) over defined regions. - Manufacturer-proprietary algorithms — Bosch EDC17/MED17, Delphi, Siemens and Denso each have their own , and the modern ones are not publicly documented. Practical consequence: a calibration editor can compute standard checksums but cannot compute proprietary ones. The flashing hardware applies the correct correction on write. If a tool cannot correct the checksum for a given ECU family, that family cannot be safely written with it. Verify this before quoting the job, not after opening the file. 2.7 Recovery from a bricked module A module bricked mid-flash typically presents as: no communication, no response to the diagnostic tool, sometimes a constant current draw, sometimes cycling. Recovery ladder: 1. Retry the flash over OBD. Many modules retain a functioning bootloader and will accept a retry. Fix the cause first — battery support, laptop settings — or the retry fails identically. 2. Bench flash. Remove the module, power it on a bench harness, and attempt the flash directly. Removes every vehicle-side variable. 3. Boot mode / BDM. Direct MCU access, writing the full flash image including the bootloader. 4. Restore from your archive. This only exists if you took a verified read before you started. This is why §2.8 is non-negotiable. If none of these succeed, the module is replaced and the vehicle programmed from new. The cost of that outcome is the argument for the pre-flash discipline. 2.8 Pre-flash discipline — mandatory in this programme Before any write to any module, in every case: Read the module and archive the original , verified by two identical reads. Store with VIN, date, part number and technician name. Record the current calibration ID and software/hardware numbers (OBD mode 09 and the module label). Record all existing DTCs across the vehicle, and all adaptation values that will be lost. Photograph the label and the connector. Confirm battery support is connected and holding voltage under load before starting. Confirm the laptop is on mains, sleep disabled, updates deferred. Tell the customer the risk exists and that a module can be lost during a programming event even when everything is done correctly. Get that acknowledged before starting. A workshop that does all seven consistently will occasionally brick a module and always recover it. A workshop that skips step 1 will eventually buy a customer an ECU. 2.9 Immobiliser systems — architecture The immobiliser prevents the engine running unless a valid key is present. Modern architectures share a common shape: Key transponder ◄── RF field ──► Antenna ring / coil │ ▼ Immobiliser control unit (standalone, or inside BCM, instrument cluster, or gateway) │ encrypted handshake over CAN or dedicated line │ ▼ Engine ECU (releases fuel and ignition only on a valid response) Transponder generations: Type Description Security Fixed code Static ID returned to the reader Trivially cloned; obsolete Rolling / crypto (e.g. 40/42/44-bit families) Challenge-response with a shared secret Moderate; older algorithms broken AES-128 based (e.g. modern Hitag/DST80 successors) Strong cryptographic challenge-response Strong; requires OEM channel Smart key / PEPS Bidirectional RF plus rolling code, proximity based Strong; adds a body/comfort layer Key components of a job: - Transponder programming — teaching the vehicle a new key's identity. - Key deletion — removing lost keys so they no longer start the vehicle. Frequently the more important half of the job and frequently skipped. - Module pairing — synchronising an ECU, BCM, cluster and immobiliser so they accept each other. - VIN alignment — writing the correct VIN into a replacement module so component protection and diagnostics resolve correctly. - Virginising — returning a module to an unlearned state so it can be paired to a vehicle. Manufacturer-supported on some platforms, not on others. 2.10 Security access and the legitimate channel Every manufacturer gates security functions. The legitimate routes are: OEM online programming with a paid subscription and, in most regions, a registered technician identity . In the EU this is the SERMI scheme (accredited independent operators, verified identity, audited); in the US it operates through NASTF's Vehicle Security Professional (VSP) registry and Secure Data Release Model. Locksmith accreditation through a national association with vetting and insurance. Aftermarket tools operating within manufacturer-sanctioned channels for the platforms where that exists. What this programme teaches and what it does not: The programme teaches immobiliser architecture, transponder technology, the diagnostic process, the pairing and alignment procedures as performed through legitimate channels, and the workshop discipline around them. It teaches students how to obtain the accreditations above, because that is the route to doing this work as a business. It does not teach circumventing manufacturer security on a vehicle you cannot prove the customer owns, and no practical in this module is delivered on a vehicle without documentation. This is not a formality. Key programming without ownership verification is how stolen vehicles are moved, insurers refuse claims, and workshops end up in court. The verification takes four minutes. 2.11 Mandatory ownership verification procedure Before any security-related work — key programming, key deletion, immobiliser pairing, module virginising, VIN writing: Photographic identification of the person presenting the vehicle. Proof of ownership : registration document (logbook / V5C / title) in the presenter's name, or a documented authority from the registered keeper, or a fleet/lease authorisation on company letterhead. VIN check : physically read the VIN from the vehicle and confirm it matches the document and the module data. A mismatch between the vehicle's stamped VIN and the VIN in its own modules stops the job. Record : photocopy or photograph of ID and ownership document, VIN, date, work performed, keys programmed, keys deleted , and technician name, retained per your jurisdiction's record-keeping period. Refuse and document if anything does not reconcile — no logbook, a VIN that does not match, a \"friend's car\", urgency and cash. Record the refusal. A workshop that keeps these records can answer a police enquiry in ten minutes. One that does not is the enquiry. 2.12 Post-programming work A flash is not finished when the progress bar completes. Task Why Throttle body / idle relearn Adaptations reset by the flash Transmission adaptation reset and relearn Shift quality will be poor until relearned Steering angle sensor calibration ESP/ABS require it; a warning lamp otherwise Injector coding (IQA/IMA codes) Diesel injectors have individual correction codes that must be re-entered DPF / regeneration counters Must reflect the physical filter's state Variant coding / vehicle configuration Options must match the actual build Immobiliser re-pairing Where the flash cleared security data Full system scan and clear Codes set during the event are expected and must be cleared Road test The only real verification Injector coding deserves emphasis: on common-rail diesels, each injector carries a printed correction code (IMA on VAG, IQA/ISA on others). After a flash or an ECU change, if these are not entered correctly and against the right cylinder, the engine runs rough, smokes, and the customer returns. The codes are on the injector body — record them before the job, not after the engine is back together. 3. Tools & equipment needed J2534-2 pass-thru interface (Drewtech Mongoose, Autel MaxiFlash, VXDIAG) plus at least one OEM subscription Battery support unit , minimum 70 A, stable and low-ripple — not a charger Bench programming harnesses for the common ECU families Boot/BDM tooling (Autotuner, CMD, KT200, Flex or equivalent) with the correct probe adapters EEPROM programmer with SOIC clip and adapters (from Module 5) Key programming platform appropriate to the accreditation route the school operates under Transponder reader/analyser and a stock of blank transponders and key shells for practical work Antenna ring test tooling and an oscilloscope for coil signal work Laptop configured for programming: mains powered, sleep and updates disabled, wired network Practice modules — scrap ECUs of several families, at least two per student, for recovery drills 4. Step-by-step practical lab exercise Lab 6.1 — Perform a controlled OBD programming event Scenario: A vehicle has a manufacturer calibration update available that addresses a known driveability complaint. Verify the update applies. Read the current calibration ID with OBD mode 09 and check it against the manufacturer's current level and the relevant bulletin. Do not flash speculatively. Full system scan and record. Save the report. Note all adaptation values that will be lost. Record injector codes (diesel), variant coding and any configuration data. Photograph the module label. Read and archive where the platform permits a full read. Battery test. The vehicle's own battery must be healthy — a support unit compensates for load, not for a failed battery. Connect battery support and confirm it holds 13.2–13.8 V under a representative load before starting. Prepare the vehicle: ignition on, engine off, all consumers off, doors closed, bonnet closed if the vehicle wakes modules on bonnet open. Prepare the laptop: mains power, sleep and hibernation disabled, updates deferred, wired connection, all other applications closed. Start the session. Follow the OEM software exactly. Do not touch the vehicle, the laptop or the interface until the process reports completion. On completion , run every post-programming routine the software lists, plus those in the §2.12 table that apply. Full system scan , clear expected codes, rescan to confirm they do not return. Road test , then rescan after a full drive cycle. Document: before and after calibration IDs, all routines performed, adaptations reset and relearned. Lab 6.2 — Recover a deliberately bricked practice module The instructor interrupts a flash on a scrap module at a defined point. Establish the state. Bench-power the module (Module 5 method). Record standby and awake current. Attempt communication. Determine whether a bootloader survives. Attempt to enter a programming session over the module's own connector. Many modules answer in programming session while refusing normal session — that is a recoverable state. If it answers: retry the flash on the bench with a full, verified file. Confirm checksum handling is correct for that ECU family before writing. If it does not answer: identify the MCU, locate the boot/BDM pads from the board layout, and confirm the required voltages from documentation. Establish the boot connection with the module unpowered, then apply power. Verify the tool identifies the MCU before attempting any write. Read what is present , even from a corrupt device — it may contain recoverable EEPROM regions. Write the full flash image , including the bootloader region if it was lost. Verify by reading back and comparing to the written file. Bench-test: rails, current draw, communication in normal session. Restore EEPROM/adaptation data from archive if the write cleared it. Document the failure point and the recovery path — this record is the basis of the workshop's recovery playbook. Lab 6.3 — Immobiliser diagnosis without assuming the key is at fault Scenario: Engine cranks but does not start. Immobiliser lamp flashing. Verify ownership documentation before any work begins. No documentation, no job. Full system scan. Note codes in the immobiliser unit, the ECU and the cluster. An immobiliser code in the ECU means the ECU did not receive a valid release; a code in the immobiliser unit means it did not read a valid key. Confirm the basics first. Fuel pressure, crank signal, and whether the ECU is commanding injection at all — a no-start with a flashing immobiliser lamp is sometimes a coincidence, and the lamp is not proof. Test the key transponder. Try the spare key. If the spare works, the fault is in the first key — battery (for PEPS), transponder, or a damaged key. Test the antenna ring. Scope the coil for the excitation burst when the ignition is switched. No excitation means supply, ground or the reading module; excitation with no response means the transponder or the coupling. Check the reading module's supply and grounds , and its communication with the ECU. A network fault between the immobiliser unit and the ECU produces exactly this symptom — go to Module 3 methods. Check for a mismatch: has the ECU, cluster or BCM been changed? Read VIN from each module and compare against the vehicle. A module carrying a different VIN is the answer. Only after all of the above conclude that pairing or key programming is required, and perform it through the legitimate channel with documentation recorded. Delete any keys the customer cannot account for , and record it. If a customer has lost a key, the lost key must be removed from the vehicle's memory — otherwise the vehicle remains startable by whoever holds it. Verify by starting on each programmed key, then confirm no immobiliser codes remain. 5. Common failure modes & troubleshooting trees Tree A — Flash failed or module unresponsive after programming Post-flash failure ├─ What was the voltage during the event? Check the support unit's log │ or the OEM software's report. Below spec → cause identified. ├─ Did the laptop sleep, lose network, or run an update? ├─ Module responds in programming session but not normal session? │ ├─ YES → bootloader intact. Retry the flash on the bench. │ └─ NO → boot/BDM recovery required ├─ Module completely silent, abnormal current draw? │ → suspect hardware damage as well as software; check rails first │ (Module 5) before assuming a software brick └─ Recovered but faults remain → post-programming routines not run. Check injector codes, variant coding, adaptations, immobiliser pairing. Tree B — Engine cranks, will not start, immobiliser lamp active Immobiliser no-start ├─ Ownership verified? → if not, STOP ├─ Does the spare key work? │ ├─ YES → first key faulty. Transponder, battery, or physical damage. │ └─ NO → continue ├─ Antenna ring excitation present on the scope at ignition on? │ ├─ NO → supply/ground to the ring, or the reading module │ └─ YES → transponder not responding, or not learned ├─ Does the immobiliser unit communicate with the ECU? │ ├─ NO → network fault between them. Module 3 methods. │ └─ YES → continue ├─ Do all modules report the same VIN? │ ├─ NO → a module has been changed. Alignment/pairing required. │ └─ YES → continue └─ Basics confirmed (fuel pressure, crank signal, injection commanded)? → if the ECU is commanding injection and it still will not start, the fault is not the immobiliser at all Tree C — Vehicle runs badly immediately after an ECU replacement or flash Runs poorly post-programming ├─ Diesel? → were injector correction codes entered, and against the │ correct cylinders? This is the most common cause. ├─ Were adaptations relearned (throttle, idle, transmission)? ├─ Is the variant coding correct for the actual vehicle build? │ (engine variant, gearbox, market, emissions level, options) ├─ Was the correct calibration for THIS vehicle used, or a generic │ one for the part number? ├─ Are DPF/regen counters consistent with the physical filter? └─ Any codes set during the event that were never cleared? Frequently seen real-world failures Failure Symptom Prevention Battery charger used instead of support unit Flash fails mid-write Use a true support unit, verify voltage under load Laptop sleeps during flash Module bricked Disable sleep, hibernation and updates before starting Injector codes not re-entered Rough running, smoke after ECU work Record codes before removal Lost keys never deleted Vehicle remains startable by an old key Always delete unaccounted keys and record it No pre-read archive Unrecoverable brick Verified read and archive before every write Wrong checksum family Module rejects file or flags corruption Confirm tool supports that ECU family before quoting Coding not restored after module swap Multiple unrelated faults Record configuration before, restore after 6. Student knowledge check Practical scenario challenges Scenario 1 — The job that went wrong. A technician flashed a body module over OBD using a battery charger for support. The flash failed at 60%. The module is now silent, the vehicle will not lock, and the customer needs the car back tomorrow. No pre-read was taken. The technician has already tried the flash three more times with the same charger. Task: Explain what went wrong at each stage, describe your recovery plan in order, state what you would have done differently, and explain what you would tell the customer now. Scenario 2 — The convenient customer. A person arrives at closing time with a high-value vehicle, no keys at all, no logbook, and offers cash plus a premium for programming a key immediately. They say the logbook is being posted by the previous owner and they have a bill of sale on their phone. They are polite, plausible and in a hurry. Task: State your decision and your reasoning. Describe exactly what you would say, what you would record, and what — if anything — would make the job acceptable at a later date. 7. Answer key Scenario 1 model answer. What went wrong, in order: A battery charger was used instead of a support unit. Chargers deliver pulsed, rippling output and cycle their output stage. During a flash the module needs an unwavering supply; the ripple alone can drop the module below its minimum programming voltage momentarily, which is enough. No pre-read archive was taken. The original software and, critically, any module-specific data are now gone with no fallback. This removes the fastest recovery route. The flash was retried three times with the same charger. Repeating a failed procedure without correcting the cause achieves nothing and risks further corruption of the memory, including the bootloader region that would otherwise have made recovery easy. Recovery plan, in order: Stop retrying. Remove the charger from the equation entirely. Fit a proper battery support unit and verify it holds 13.2–13.8 V under load. Attempt a programming session over OBD. If the module answers, the bootloader lives — reflash with a verified file and correct support. If OBD is silent, remove the module and bench it (Module 5 method). Power it on a current-limited supply, check rails and current draw to confirm the hardware is undamaged, fit the 120 Ω terminator, and attempt a programming session on the bench. This removes every vehicle-side variable. If the bench is silent, go to boot/BDM. Identify the MCU, locate the pads, confirm required voltages from documentation, read whatever is present, then write the full image including the bootloader. Verify by read-back , bench-test, then refit. Restore configuration and coding from the records — if any were taken. If not, the configuration must be rebuilt from the vehicle's build data through the OEM portal. If all recovery fails , source a replacement module and programme it from new through the OEM channel. What I would have done differently: taken a verified pre-read and archived it; recorded all coding and configuration; used a genuine support unit; disabled laptop sleep and updates; and stopped after the first failure to diagnose the cause rather than repeating it. What I would tell the customer now: the truth, promptly and without minimising it. That the module was corrupted during a programming operation, that the workshop is recovering it at the workshop's cost, that there is a realistic recovery path but it may take longer than a day, and — honestly — whether tomorrow is achievable. Offer a courtesy vehicle or a contribution to hire if the deadline matters. A customer told early and honestly usually stays; a customer who discovers it themselves does not. Scenario 2 model answer. Decision: decline the work today. Every marker of an illegitimate job is present simultaneously — no keys at all, no registration document, high value, cash premium, urgency, closing time, and documentation that is always about to arrive. Any one of these alone might be innocent. Together they are the standard profile, and the fact that the person is polite and plausible is not evidence of anything; a person moving a stolen vehicle is not going to be rude about it. What I would say: something plain, unapologetic and non-accusatory. That the workshop cannot carry out security or key work without photographic identification and a registration document or documented authority from the registered keeper, that this applies to every customer without exception, and that as soon as they have the logbook the job can be booked and done properly. Give them the workshop card and the exact list of what to bring. Do not lecture and do not accuse — a legitimate customer returns with paperwork, and treating them decently is why they return. What I would record: date and time, vehicle make, model and VIN if visible, registration, a description of what was requested, the documentation offered and what was missing, and the fact that the work was refused. Retain it. If the vehicle is later reported stolen, this record is exactly what an enquiry needs, and it establishes that the workshop's procedure works. What would make it acceptable later: the registered keeper's document in the presenter's name, or a signed authority from the registered keeper together with the keeper's own identification; photographic ID matching that document; and a physical VIN check on the vehicle that reconciles with both the document and the VIN stored in the vehicle's own modules. With those three in place, the job is ordinary work — and it should include deleting every key not accounted for, recorded on the invoice. A footnote worth teaching: a bill of sale on a phone is not proof of ownership anywhere. It is a photograph of a document that takes two minutes to fabricate. ", "words": 4435}, {"id": "module-7-mapping-calibration", "label": "Module 7", "title": "Mapping & calibration", "colour": "#4B3B8F", "html": "<h1>Module 7 — ECU Mapping, Engine Tuning &amp; Calibration</h1>\n<p><strong>Hours:</strong> 60 (24 lecture / 36 bench and dyno)\n<strong>Prerequisite:</strong> Modules 5 and 6 signed off.</p>\n<hr />\n<h2>1. Module overview &amp; learning objectives</h2>\n<p>Calibration work is where the most damage is done in this trade, because the tools are cheap, the internet is confident, and the consequences arrive six months later as a failed turbo, a cracked piston or a burnt clutch. This module teaches the physics first, the file format second, and the editing last — deliberately in that order.</p>\n<p>By the end of the module the student can:</p>\n<ul>\n<li><strong>7.1</strong> State the combustion, thermal and mechanical limits that constrain every calibration change.</li>\n<li><strong>7.2</strong> Identify an ECU from a binary file and locate its map regions.</li>\n<li><strong>7.3</strong> Read 2D and 3D map structures in hex, determine axes, scaling factors and offsets.</li>\n<li><strong>7.4</strong> Calculate and correct checksums, and explain when a tool cannot.</li>\n<li><strong>7.5</strong> Plan a calibration change with a defined target, a measured baseline and a verification method.</li>\n<li><strong>7.6</strong> Recognise and refuse work that cannot be delivered safely or lawfully.</li>\n</ul>\n<hr />\n<h2>2. Comprehensive theory &amp; lecture notes</h2>\n<h3>2.1 The physics that constrains everything</h3>\n<p><strong>Air-fuel ratio and lambda.</strong>\nStoichiometric AFR for petrol is approximately <strong>14.7:1</strong> by mass. Lambda expresses the ratio to stoichiometric:</p>\n<p><code>λ = actual AFR / stoichiometric AFR</code></p>\n<table>\n<thead>\n<tr>\n<th>λ</th>\n<th>AFR (petrol)</th>\n<th>Condition</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1.00</td>\n<td>14.7:1</td>\n<td>Stoichiometric — catalyst operating window</td>\n</tr>\n<tr>\n<td>0.85–0.90</td>\n<td>12.5–13.2:1</td>\n<td>Rich — maximum power, cooling under load</td>\n</tr>\n<tr>\n<td>0.78–0.82</td>\n<td>11.5–12.1:1</td>\n<td>Very rich — turbo protection, exhaust temperature control</td>\n</tr>\n<tr>\n<td>1.05–1.10</td>\n<td>15.4–16.2:1</td>\n<td>Lean — economy cruise, raises combustion temperature</td>\n</tr>\n</tbody>\n</table>\n<p>Fuel differences matter: E85 stoichiometric is approximately <strong>9.8:1</strong>, diesel approximately <strong>14.6:1</strong> but diesels run heavily lean overall (λ 1.2–6.0 depending on load) because they are load-controlled by fuelling rather than by throttling.</p>\n<p><strong>Why lean is dangerous under load:</strong> peak combustion temperature rises as mixture approaches slightly lean of stoichiometric, then falls again. Under high load, a lean mixture raises exhaust gas temperature and piston crown temperature toward the material limits. Enrichment under load is not waste; it is cooling.</p>\n<p><strong>Knock (detonation).</strong> Normal combustion is a flame front propagating from the spark. Knock is spontaneous auto-ignition of end gas ahead of the flame front, producing a pressure spike and a characteristic ringing. It destroys pistons, ring lands and head gaskets. Its likelihood rises with:\n- Higher cylinder pressure (more boost, higher compression)\n- Higher charge temperature (hot intake air, ineffective intercooling)\n- Advanced ignition timing\n- Lower fuel octane\n- Lean mixture</p>\n<p><strong>Ignition timing</strong> exists to place peak cylinder pressure at the optimum crank angle — typically <strong>12–16° after TDC</strong>. Advancing timing moves peak pressure earlier and raises it; retarding moves it later and lowers it. <strong>MBT</strong> (minimum advance for best torque) is the point beyond which further advance produces no more torque. On most modern engines under load, the limit reached is knock, not MBT — the engine is <strong>knock-limited</strong>, and advancing timing past that point buys nothing and costs a piston.</p>\n<p><strong>Boost and airflow.</strong> Torque follows trapped air mass. Adding boost adds air mass, which requires proportional fuel and appropriate timing. Constraints:\n- <strong>Compressor surge</strong> at low flow / high pressure ratio, and <strong>choke</strong> at the map's right edge. Running a turbo outside its map produces heat instead of pressure.\n- <strong>Turbine and exhaust gas temperature</strong>, typically limited to <strong>950–1,050 °C</strong> pre-turbine on petrol.\n- <strong>Charge air temperature</strong> — every 10 °C rise reduces density and raises knock risk.</p>\n<p><strong>Diesel-specific limits:</strong>\n- <strong>Smoke limit</strong> — fuel beyond the available oxygen produces particulate, not torque. The smoke map exists for a reason.\n- <strong>Exhaust gas temperature</strong> — turbine and after-treatment limits.\n- <strong>Peak cylinder pressure</strong> — diesels run close to their mechanical limit from the factory. Adding fuel and boost moves toward rod and bearing limits quickly.\n- <strong>After-treatment loading</strong> — more fuel means more soot means faster DPF loading and more frequent regeneration.</p>\n<p><strong>Driveline limits.</strong> The gearbox, clutch, driveshafts and differential were specified for the factory torque figure with a margin. A calibration that adds 40% torque does not add 40% margin. Dual-mass flywheels, DSG clutch packs and manual clutches are the usual first casualties, and the customer is rarely told before the job.</p>\n<h3>2.2 What is actually in an ECU file</h3>\n<p>A binary flash dump contains:</p>\n<table>\n<thead>\n<tr>\n<th>Region</th>\n<th>Contents</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Bootloader</td>\n<td>Startup and programming code; usually protected</td>\n</tr>\n<tr>\n<td>Application code</td>\n<td>The compiled program — control logic</td>\n</tr>\n<tr>\n<td>Calibration data</td>\n<td>The maps and constants — <strong>the only region a calibrator touches</strong></td>\n</tr>\n<tr>\n<td>Identification</td>\n<td>Part numbers, software versions, hardware ID</td>\n</tr>\n<tr>\n<td>Checksums</td>\n<td>Integrity values over defined regions</td>\n</tr>\n<tr>\n<td>Free/fill space</td>\n<td>Typically 0xFF or 0x00 runs</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Critical distinction:</strong> calibration data is <em>data</em>; application code is <em>logic</em>. Editing calibration changes the values the program uses. Editing code changes what the program does — and is not calibration work.</p>\n<h3>2.3 Identifying the ECU from the file</h3>\n<p>Before any map can be found, the ECU must be identified. Evidence available inside the binary:</p>\n<ol>\n<li><strong>File size</strong> — narrows the flash device and processor family (512 KB, 1 MB, 2 MB, 4 MB, 8 MB).</li>\n<li><strong>ASCII identifier strings</strong> — Bosch part numbers (<code>0281...</code>, <code>0261...</code>), hardware numbers, software versions, sometimes the VIN, sometimes an ECU family string.</li>\n<li><strong>Processor markers and vector tables</strong> — TriCore, SPC5/MPC5, C167/ST10 each leave recognisable structures at known offsets.</li>\n<li><strong>Endianness</strong> — big-endian on Power Architecture, little-endian on TriCore in most automotive builds. Getting this wrong makes every 16-bit value nonsense.</li>\n<li><strong>Segment base address</strong> — the CPU address space and the file offset differ by a constant. Establishing that base is what makes an A2L's addresses resolve to file positions.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>Family</th>\n<th>Typical processor</th>\n<th>Typical application</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Bosch EDC15</td>\n<td>C167</td>\n<td>Older diesel</td>\n</tr>\n<tr>\n<td>Bosch EDC16</td>\n<td>ST10 / TriCore</td>\n<td>Mid-2000s diesel</td>\n</tr>\n<tr>\n<td>Bosch EDC17</td>\n<td>TriCore TC17xx/TC17xx</td>\n<td>Modern diesel</td>\n</tr>\n<tr>\n<td>Bosch MED17 / MEVD17</td>\n<td>TriCore</td>\n<td>Modern direct-injection petrol</td>\n</tr>\n<tr>\n<td>Bosch MD1 / MG1</td>\n<td>AURIX TC2xx/TC3xx</td>\n<td>Latest generation</td>\n</tr>\n<tr>\n<td>Continental SIMOS / PCR2.1</td>\n<td>MPC5xxx / TriCore</td>\n<td>VAG petrol and diesel</td>\n</tr>\n<tr>\n<td>Delphi DCM / CRD</td>\n<td>MPC5xxx</td>\n<td>PSA, GM, Hyundai diesel</td>\n</tr>\n<tr>\n<td>Magneti Marelli MJD / IAW</td>\n<td>ST10 / MPC</td>\n<td>FCA</td>\n</tr>\n<tr>\n<td>Denso</td>\n<td>SH / RH850</td>\n<td>Japanese OEMs</td>\n</tr>\n</tbody>\n</table>\n<h3>2.4 Map structure</h3>\n<p>A map is a lookup table. Given one or two input values, the ECU interpolates a stored output.</p>\n<p><strong>2D map (curve):</strong> one axis, one output row. Example: boost target versus engine speed; injection quantity limit versus rpm.</p>\n<p><strong>3D map (table):</strong> two axes, a grid of outputs. Example: ignition advance indexed by engine speed and load; injection quantity indexed by rpm and pedal position.</p>\n<p><strong>Anatomy in the binary:</strong></p>\n<pre><code>[X axis]  16 values, monotonically increasing  ─┐\n[Y axis]  12 values, monotonically increasing  ─┼─► often stored adjacent\n[Data]    16 × 12 = 192 values                 ─┘   to the data block\n</code></pre>\n<p><strong>Data types:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Type</th>\n<th>Size</th>\n<th>Range</th>\n<th>Note</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>uint8</td>\n<td>1 byte</td>\n<td>0–255</td>\n<td>Common in older ECUs, coarse resolution</td>\n</tr>\n<tr>\n<td>int8</td>\n<td>1 byte</td>\n<td>−128 to 127</td>\n<td>Timing corrections, trims</td>\n</tr>\n<tr>\n<td>uint16</td>\n<td>2 bytes</td>\n<td>0–65,535</td>\n<td>Most common in modern ECUs</td>\n</tr>\n<tr>\n<td>int16</td>\n<td>2 bytes</td>\n<td>−32,768 to 32,767</td>\n<td>Signed corrections</td>\n</tr>\n<tr>\n<td>float32</td>\n<td>4 bytes</td>\n<td>—</td>\n<td>Rare in flash calibration, common in RAM</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Scaling:</strong> raw values are converted to physical units by <code>physical = (raw × factor) + offset</code>.</p>\n<p>Example: a boost map storing 0.1 mbar per bit with offset 0. A raw value of 18,000 becomes 1,800 mbar absolute = 800 mbar gauge ≈ 0.8 bar boost. Get the factor wrong by a decade and you will \"reduce boost\" by a factor of ten and wonder why the car has no power.</p>\n<p>Example: a timing map with factor 0.75 and offset −48. Raw 96 becomes <code>(96 × 0.75) − 48 = 24°</code> advance.</p>\n<p><strong>How maps are found in practice, in order of reliability:</strong></p>\n<ol>\n<li><strong>A2L / ASAP2 file</strong> — the manufacturer's own description of the calibration: names, addresses, record layouts, conversion methods, axis descriptions. With an A2L, every map is named and scaled correctly. This is the only fully reliable method.</li>\n<li><strong>DAMOS</strong> — Bosch's format, containing the same information plus more; converted to A2L for most tools.</li>\n<li><strong>Map packs / definition files</strong> — third-party definitions for a known file. Reliable only if the file matches exactly.</li>\n<li><strong>Pattern recognition</strong> — searching for monotonic axis sequences and then scoring adjacent regions for table-like smoothness. This finds <em>structures</em> but never tells you what they control.</li>\n</ol>\n<p><strong>The point students must accept:</strong> without an A2L or DAMOS, <strong>no tool can name a map</strong>. A flash binary carries no symbol names. Any tool that claims to identify \"the boost map\" on an unknown file is pattern-matching and guessing, and the consequence of a wrong guess is written on a piston.</p>\n<h3>2.5 Checksums</h3>\n<p>The module verifies calibration integrity before running. Change a byte, and the stored checksum no longer matches the computed one.</p>\n<p>Common schemes:\n- <strong>Additive/sum</strong> over a region, stored as 16 or 32-bit.\n- <strong>CRC-16 / CRC-32</strong> with defined polynomial, seed and region.\n- <strong>Multiple nested checksums</strong> — modern ECUs may carry a dozen, some covering other checksums.\n- <strong>Proprietary</strong> — Bosch EDC17/MED17, Delphi, Siemens and Denso modern families use undocumented algorithms.</p>\n<p><strong>Practical consequences:</strong>\n- A calibration editor can compute standard checksums. It cannot compute undocumented proprietary ones.\n- Flashing hardware applies the correct correction on write for the families it supports.\n- <strong>Verify the tool chain supports checksum correction for that exact ECU family before opening the file.</strong> Writing a file with a wrong checksum produces a module that refuses to run, or runs and immediately flags an internal fault — and on some platforms enters a state requiring boot recovery.</p>\n<h3>2.6 Software</h3>\n<table>\n<thead>\n<tr>\n<th>Tool</th>\n<th>Role</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>WinOLS</strong></td>\n<td>Industry-standard calibration editor: hex view, map definition, 2D/3D visualisation, checksum modules, project management, A2L/DAMOS import</td>\n</tr>\n<tr>\n<td><strong>ECM Titanium</strong></td>\n<td>Editor with a driver (definition) library — convenient, but only as good as the driver for your exact file</td>\n</tr>\n<tr>\n<td><strong>TunerPro</strong></td>\n<td>Free editor using XDF definitions; strong in the older OBD-I/OBD-II and enthusiast space</td>\n</tr>\n<tr>\n<td><strong>A2L/DAMOS handling</strong></td>\n<td>Vector CANape, ETAS INCA, and the import functions in the above</td>\n</tr>\n<tr>\n<td><strong>Data logging</strong></td>\n<td>The manufacturer tool, or a J2534/CAN logger — <strong>logging is not optional</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>2.7 \"Stage\" terminology — what it actually means</h3>\n<p>The industry's Stage 1/2/3 language is marketing shorthand, not a specification. Taught honestly:</p>\n<ul>\n<li><strong>Stage 1</strong> — calibration change only, on a completely standard vehicle. Realistic gains come from the manufacturer's deliberate conservatism: emissions margin across all markets and fuel qualities, durability margin across the warranty period and worst-case duty cycles, and product positioning between model variants.</li>\n<li><strong>Stage 2</strong> — calibration change accompanying specific hardware: intake, exhaust, intercooler, sometimes a hybrid turbo. The calibration must be developed against the actual hardware fitted, not selected from a list.</li>\n<li><strong>Custom / bespoke</strong> — developed on a dynamometer against measured data for that specific vehicle, with the results logged and documented.</li>\n</ul>\n<p><strong>What must be said to every customer, in writing:</strong>\n1. A calibration change will void the powertrain warranty and is detectable by the manufacturer through calibration verification numbers and internal counters.\n2. It must be declared to the insurer. An undeclared modification is grounds for refusing a claim.\n3. Emissions-relevant changes may make the vehicle non-compliant and fail inspection.\n4. Driveline components have finite margin, and clutches, dual-mass flywheels and gearboxes are consumables under increased torque.\n5. A generic file bought online and flashed without measurement is a gamble with the customer's engine.</p>\n<h3>2.8 A defensible calibration process</h3>\n<p>The programme teaches this sequence and marks against it:</p>\n<ol>\n<li><strong>Establish the vehicle is healthy first.</strong> Compression or leak-down, full system scan with no pending codes, fu
