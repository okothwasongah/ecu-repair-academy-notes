ed signal\" misdiagnoses are technicians measuring for a voltage square wave on a current-signalling sensor.\n- Encoded ABS sensors add data pulses (AK protocol) carrying direction and standstill information.</p>\n<h4>Piezoelectric</h4>\n<p>A crystal generates charge under mechanical stress. Used for <strong>knock sensors</strong> and some pressure sensors.\n- Output: small AC, millivolts to a few volts, broadband.\n- Knock sensor torque is a specified value (typically <strong>20–25 Nm</strong>) — under- or over-torqued gives false or absent knock detection, and the engine retards timing and loses power with no code.\n- Test: scope on the sensor, tap the block near it with a small spanner. A healthy sensor produces a clear decaying oscillation.</p>\n<h4>Potentiometric</h4>\n<p>A wiper on a resistive track. Used in TPS, pedal position, some MAF and EGR position sensors.\n- Three wires: 5 V supply, ground, wiper signal.\n- Output: <strong>analogue DC</strong>, typically 0.5 V closed to 4.5 V open. The 0.5 V floor exists deliberately so that a broken wire (0 V) is distinguishable from a legitimate closed position.\n- Failure: worn track producing dropouts. <strong>A DMM will not see a dropout lasting 3 ms.</strong> Sweep the sensor slowly with the scope running to catch them. This is the classic example of why the scope exists.\n- Modern pedal and throttle sensors are <strong>dual-track with deliberately different gradients</strong> (e.g. one 0.5–4.5 V, the other 0.25–2.25 V, or one rising while the other falls). The ECU cross-checks the pair; a plausibility code means the two tracks disagreed, not that either is necessarily dead.</p>\n<h4>Thermistor (NTC)</h4>\n<p>Coolant, intake air, oil, fuel temperature. Resistance falls as temperature rises — steeply and non-linearly.</p>\n<table>\n<thead>\n<tr>\n<th>Temperature</th>\n<th>Typical NTC resistance</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>−10 °C</td>\n<td>9,000–10,000 Ω</td>\n</tr>\n<tr>\n<td>20 °C</td>\n<td>2,200–2,800 Ω</td>\n</tr>\n<tr>\n<td>40 °C</td>\n<td>1,100–1,300 Ω</td>\n</tr>\n<tr>\n<td>80 °C</td>\n<td>300–400 Ω</td>\n</tr>\n<tr>\n<td>100 °C</td>\n<td>180–200 Ω</td>\n</tr>\n</tbody>\n</table>\n<p>Read as a voltage divider against the ECU's internal pull-up: cold = high resistance = high signal voltage; hot = low resistance = low signal voltage. A signal stuck at 5 V means open circuit; stuck at 0 V means short to ground.</p>\n<h4>Oxygen sensors</h4>\n<ul>\n<li><strong>Zirconia narrowband:</strong> generates its own voltage, <strong>0.1 V (lean) to 0.9 V (rich)</strong>, switching around stoichiometric. A healthy one switches rapidly — a lazy sensor is diagnosed by switch <em>rate</em>, not by voltage range.</li>\n<li><strong>Wideband (UEGO/LSU):</strong> a pump cell and a reference cell with a control circuit. The ECU maintains the reference at 450 mV by driving pump current; that pump current is the measurement. Cannot be interpreted from a raw voltage at the connector — read the ECU's reported lambda value in serial data, plus the sensor's heater circuit separately.</li>\n<li>Heater circuits are frequently the real fault. Heater resistance typically <strong>2–15 Ω</strong> cold.</li>\n</ul>\n<h3>2.4 Actuators</h3>\n<table>\n<thead>\n<tr>\n<th>Actuator</th>\n<th>Drive</th>\n<th>What to check</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Solenoid injector</td>\n<td>Low-side, peak-and-hold or saturated</td>\n<td>Coil resistance, current ramp shape, back-EMF spike</td>\n</tr>\n<tr>\n<td>Piezo injector</td>\n<td>High-voltage stacked crystal, 100–200 V</td>\n<td>Never bench-test with 12 V; requires OEM procedure and coding after replacement</td>\n</tr>\n<tr>\n<td>Ignition coil</td>\n<td>Coil-on-plug, ECU triggers an internal igniter</td>\n<td>Primary trigger signal, secondary burn line and burn time</td>\n</tr>\n<tr>\n<td>PWM valve (turbo, EGR, canister purge)</td>\n<td>Variable duty cycle at fixed frequency</td>\n<td>Duty %, frequency, current draw, mechanical freedom</td>\n</tr>\n<tr>\n<td>Stepper motor (idle valve, some HVAC)</td>\n<td>4 or 6 wires, driven in a phase sequence</td>\n<td>Each winding's resistance, scope all phases together for a missing step</td>\n</tr>\n<tr>\n<td>Throttle body (DC motor, H-bridge)</td>\n<td>Bidirectional PWM</td>\n<td>Motor resistance, both position tracks, mechanical return spring</td>\n</tr>\n<tr>\n<td>Electric fan (BLDC + controller)</td>\n<td>PWM or LIN commanded</td>\n<td>Control signal present, module supply, current draw</td>\n</tr>\n</tbody>\n</table>\n<p><strong>PWM duty cycle</strong> — the fraction of each period the output is on. <code>Duty = t_on / T × 100%</code>. Frequency stays fixed; duty varies. Students must state both. A boost solenoid at \"50%\" means nothing unless you also know whether the frequency is 10 Hz or 300 Hz and whether the duty is measured on the ground side (in which case a low-side driver's 80% ground time may be reported by the tool as 20%).</p>\n<h3>2.5 Oscilloscope waveform analysis</h3>\n<h4>Scope setup discipline</h4>\n<ol>\n<li>Choose <strong>voltage range</strong> with headroom — ignition primary spikes reach 300–400 V.</li>\n<li>Choose <strong>timebase</strong> so at least 2–3 full cycles are visible, then zoom in.</li>\n<li>Set <strong>trigger</strong> deliberately: rising edge, level around mid-amplitude. An untriggered trace teaches nothing.</li>\n<li>Ground the scope lead <strong>at the component's own ground</strong>, not at a random body point, or you will record the ground fault as part of the signal.</li>\n<li><strong>Always capture a known-good reference</strong> on a healthy vehicle first, and keep a library. Waveform diagnosis without a reference is guesswork.</li>\n</ol>\n<h4>Crank and cam overlay — the single most valuable capture in the trade</h4>\n<p>Put crank on channel 1 and cam on channel 2, capture during cranking and idle.</p>\n<p>What it tells you:\n- <strong>Missing tooth position</strong> relative to the cam pulse gives you cam timing. A jumped tooth on the belt or a stretched chain shifts the relationship by a measurable amount. You have just diagnosed mechanical timing electrically, without removing a cover.\n- <strong>Signal integrity</strong> — dropouts, amplitude collapse, noise.\n- <strong>Cranking speed regularity</strong> — an uneven crank trace during cranking indicates a compression variation. Combined with a current clamp on the starter, this is <strong>relative compression testing</strong>: the cylinder with low compression loads the starter less, and the current waveform shows a shallower hump each time that cylinder comes up.</p>\n<h4>Injector waveform (solenoid, low-side driven)</h4>\n<p>Voltage trace stages:\n1. Rest at battery voltage (low-side driver off, pulled up through the coil).\n2. Sharp fall to near 0 V — driver turns on.\n3. Flat or stepped hold region — on peak-and-hold systems, a distinct current step down.\n4. <strong>Back-EMF spike</strong> on turn-off, typically <strong>60–80 V</strong> on a port injector.\n5. Return to battery voltage, sometimes with a small oscillation.</p>\n<p>The spike height is diagnostic: a <strong>low or absent spike</strong> indicates shorted turns in the winding. Identical injectors on the same engine should produce near-identical spikes — a side-by-side comparison finds the odd one out immediately.</p>\n<p><strong>Current ramping</strong> (clamp on the injector wire) is more revealing still. The current rise shows a small <strong>inflection or \"hump\"</strong> where the pintle actually moves, because the moving armature changes the inductance. If the inflection is missing, the injector is electrically fine but <strong>mechanically stuck</strong> — you have proved a mechanical failure with an electrical measurement, which is the whole point of this module.</p>\n<h4>Ignition secondary</h4>\n<ul>\n<li><strong>Firing (ionisation) voltage:</strong> the peak needed to jump the gap — typically 5–15 kV.</li>\n<li><strong>Burn/spark line:</strong> the flat section where the spark sustains, typically 1–2 kV. <strong>Burn time 1.0–2.0 ms</strong> at idle is the health indicator.</li>\n<li>A <strong>high firing voltage with short burn time</strong> = excessive resistance in the secondary path: worn plug gap, bad lead, poor terminal.</li>\n<li>A <strong>low firing voltage with long burn time</strong> = fouled plug or a shorted path, spark taking an easy route.</li>\n<li>Comparing cylinders is more useful than absolute numbers.</li>\n</ul>\n<h4>Charging system</h4>\n<p>Scope the battery terminal, AC coupled, engine at 2,000 rpm with headlights on. Healthy: small, even ripple. One deep notch per rotation cycle = one failed diode. Ripple exceeding <strong>0.5 V p-p</strong> condemns the alternator regardless of DC output being correct.</p>\n<hr />\n<h2>3. Tools &amp; equipment needed</h2>\n<ul>\n<li>4-channel automotive oscilloscope with attenuator leads (min 400 V capable) and a secondary ignition pickup</li>\n<li>Low-current clamp (60 A, mA resolution) for current ramping — <strong>the most under-used tool in the trade</strong></li>\n<li>600 A clamp for starter current / relative compression</li>\n<li>Bench power supply, current-limited, for sensor simulation</li>\n<li>Signal simulator / sensor simulator box (variable 0–5 V, frequency generator, resistance box)</li>\n<li>Component test board: assorted diodes, MOSFETs, capacitors, thermistors, Hall and VR sensors</li>\n<li>ESR meter for capacitor testing</li>\n<li>Known-good waveform library (institution builds this progressively — every student contributes captures)</li>\n</ul>\n<hr />\n<h2>4. Step-by-step practical lab exercise</h2>\n<h3>Lab 2.1 — Distinguish a failed sensor from a failed circuit from a failed ECU input</h3>\n<p><strong>Scenario:</strong> Engine cranks but will not start. Scan tool shows <strong>P0335 Crankshaft Position Sensor \"A\" Circuit</strong> and reports 0 rpm during cranking.</p>\n<p>The temptation is to fit a crank sensor. The instruction is to prove which of four things is at fault: the sensor, its supply, its wiring, or the ECU input.</p>\n<ol>\n<li>\n<p><strong>Identify the sensor type from the diagram</strong> — two wires = probably VR (self-generating); three wires = Hall or MRE (supplied). Everything after this depends on getting it right.</p>\n</li>\n<li>\n<p><strong>If three-wire:</strong> back-probe and confirm supply (usually 5 V or 12 V) and ground (drop under 0.1 V to battery negative) <strong>at the sensor connector</strong>, ignition on.\n   - No supply → fault is upstream. Go to the ECU connector and check whether the ECU is outputting it. If the ECU outputs 5 V but the sensor sees 0 V, the wiring is open.\n   - Supply present but ground drop high → ground fault, repair and retest.</p>\n</li>\n<li>\n<p><strong>Scope the signal line at the sensor while cranking.</strong>\n   - <strong>VR expected:</strong> AC waveform, 0.5–2 V p-p minimum at cranking speed, symmetrical, with a clear missing-tooth gap.\n   - <strong>Hall expected:</strong> clean square wave, full amplitude, sharp edges.\n   - <strong>MRE expected:</strong> you will likely see very little on a voltmeter or a voltage scope — measure current, or scope across the ECU's sense resistor.</p>\n</li>\n<li>\n<p><strong>If a good signal is present at the sensor but not at the ECU connector:</strong> the harness is at fault. Confirm with continuity <strong>and</strong> with a voltage drop under a small load, then inspect the loom at flex and heat points.</p>\n</li>\n<li>\n<p><strong>If no signal is produced at the sensor:</strong>\n   - VR type: disconnect and measure coil resistance against spec (200–1,500 Ω typical). Out of spec = sensor. In spec = check air gap and inspect the reluctor ring for damage, debris or a cracked tone wheel. <strong>A perfect sensor reading nothing is usually a damaged trigger wheel</strong> — check before condemning.\n   - Hall/MRE: with confirmed supply and ground, and no output, the sensor is faulty.</p>\n</li>\n<li>\n<p><strong>If a good signal reaches the ECU pin and the ECU still reports 0 rpm:</strong> now, and only now, the ECU input is suspect. Before condemning a module, verify the ECU's own power supplies and grounds (Module 5 material), and check for a second synchronisation input the ECU may be waiting on.</p>\n</li>\n<li>\n<p><strong>Write the fault report</strong> stating what was measured at each stage and which of the four possible fault locations was eliminated by which measurement.</p>\n</li>\n</ol>\n<h3>Lab 2.2 — Current ramp four injectors and identify the mechanically failing one</h3>\n<ol>\n<li>Warm the engine to operating temperature, then switch off.</li>\n<li>Clamp the low-current probe around <strong>one wire of injector 1</strong>. Note polarity so all four captures have the same orientation.</li>\n<li>Scope settings: 5 A/div, 1 ms/div, trigger on the rising edge of current.</li>\n<li>Capture 10 consecutive events at idle. Save.</li>\n<li>Repeat for injectors 2, 3 and 4 without changing any scope setting. <strong>Changing settings between captures makes comparison invalid.</strong></li>\n<li>Overlay the four captures.</li>\n<li>Analyse:\n   - <strong>Peak current</strong> should match within roughly 10% across all four.\n   - The <strong>pintle inflection</strong> — a small hump or kink on the rising edge — must be present on all four at the same point in time.\n   - <strong>Rise time</strong> differences indicate coil resistance or inductance differences.</li>\n<li>Interpretation:\n   - All four identical, engine misfires → the fault is not the injector's electrical or pintle behaviour. Move to fuelling, compression or ignition.\n   - One injector missing the inflection → <strong>pintle not moving.</strong> The coil is fine; the injector is mechanically stuck or heavily contaminated.\n   - One injector with markedly higher peak current and faster rise → shorted turns.\n   - One injector with much lower peak → high resistance in coil or circuit; check the circuit first with a voltage drop test.</li>\n<li>Cross-check the conclusion against cylinder contribution / misfire counters in serial data before ordering parts.</li>\n</ol>\n<hr />\n<h2>5. Common failure modes &amp; troubleshooting trees</h2>\n<h3>Tree A — Sensor signal implausible or missing</h3>\n<pre><code>Sensor signal fault\n├─ Is it self-generating (VR, piezo, narrowband O2) or supplied (Hall, MRE, potentiometric)?\n│   ├─ SELF-GENERATING → test output directly by moving/spinning the target\n│   │     ├─ No output → measure coil resistance, inspect air gap and reluctor\n│   │     └─ Output present → problem is downstream: harness or ECU input\n│   └─ SUPPLIED → verify supply voltage AND ground drop at the sensor first\n│         ├─ Supply missing → is the ECU producing it? Multiple sensors dead\n│         │                   on one 5 V rail = shorted sensor loading the rail.\n│         │                   Disconnect sensors one at a time; the rail\n│         │                   recovering identifies the culprit.\n│         ├─ Ground drop &gt; 0.1 V → repair ground\n│         └─ Supply and ground good → scope signal\n│               ├─ Signal good at sensor, absent at ECU → harness\n│               ├─ Signal absent at sensor → sensor\n│               └─ Signal good at ECU, ECU reports fault → verify ECU power\n│                                       and grounds before condemning module\n</code></pre>\n<h3>Tree B — Actuator does not respond to commanded output</h3>\n<pre><code>Actuator not responding\n├─ Command it with the scan tool's actuator test while scoping the drive wire\n│   ├─ No switching seen at the wire\n│   │     ├─ Is this a high-side or low-side driven circuit? (Establish first.)\n│   │     ├─ Check the actuator's permanent feed/ground as appropriate\n│   │     └─ No drive at ECU pin either → ECU driver or ECU not commanding.\n│   │         Check for enabling conditions the tool requires (engine off,\n│   │         temperature, gear position) before blaming the module.\n│   ├─ Switching present, actuator silent\n│   │     ├─ Measure current with clamp\n│   │     │     ├─ No current → open coil or open circuit\n│   │     │     ├─ Normal current, no movement → mechanically seized\n│   │     │     └─ Excessive current → shorted turns\n│   └─ Switching present, current normal, movement present but no effect\n│         → the actuator works; the fault is mechanical downstream\n│            (blocked passage, split hose, seized linkage)\n</code></pre>\n<h3>Tree C — Multiple sensor codes at once</h3>\n<pre><code>Several sensor codes together\n├─ Do they share the 5 V reference? → one shorted sensor drags the whole rail.\n│   Symptom set is characteristic: TPS, MAP, pedal all implausible at once.\n├─ Do they share a sensor ground? → high-resistance sensor ground offsets\n│   every reading on that rail by the same amount. Look for readings that\n│   are all wrong in the same direction by a similar margin.\n├─ Did they all set at the same timestamp/freeze frame? → single event,\n│   likely power/ground or a network dropout, not five failed sensors.\n└─ Is battery voltage in freeze frame low? → codes are a consequence of\n    a charging or battery fault, not independent faults.\n</code></pre>\n<h3>Frequently seen real-world failures</h3>\n<table>\n<thead>\n<tr>\n<th>Failure</th>\n<th>Symptom</th>\n<th>Confirming measurement</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Shorted sensor loading the 5 V rail</td>\n<td>Multiple implausible sensor codes</td>\n<td>Rail voltage low; recovers as sensors unplugged one by one</td>\n</tr>\n<tr>\n<td>Worn potentiometer track</td>\n<td>Intermittent hesitation, occasional limp</td>\n<td>Slow sweep on scope reveals millisecond dropouts</td>\n</tr>\n<tr>\n<td>Damaged reluctor / tone wheel</td>\n<td>No or erratic rpm, sensor tests good</td>\n<td>Scope shows irregular tooth spacing; visual inspection</td>\n</tr>\n<tr>\n<td>Failed alternator diode</td>\n<td>Radio whine, module resets, comms errors</td>\n<td>AC ripple &gt; 0.5 V at battery</td>\n</tr>\n<tr>\n<td>Injector stuck pintle</td>\n<td>Misfire, cylinder contribution low</td>\n<td>Current ramp missing pintle inflection</td>\n</tr>\n<tr>\n<td>Knock sensor under-torqued</td>\n<td>Power loss, no code</td>\n<td>Scope response to a tap; check torque to spec</td>\n</tr>\n<tr>\n<td>Dried-out module capacitors</td>\n<td>Age-related random module misbehaviour</td>\n<td>ESR measurement on opened module</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>6. Student knowledge check</h2>\n<h3>Practical scenario challenges</h3>\n<p><strong>Scenario 1 — The wheel speed sensor that \"has no output\".</strong>\nA 2019 vehicle has an ABS fault for the right front wheel speed sensor. A technician has back-probed the sensor and measured with a DMM on DC volts while an assistant spun the wheel. The reading sat at a steady 1.4 V and never changed. The technician has ordered a sensor. The sensor has already been replaced once by another garage and the fault returned.\n<em>Task:</em> Explain what is wrong with the test method, describe the correct measurement, and list three faults other than the sensor that would produce this complaint.</p>\n<p><strong>Scenario 2 — The intermittent hesitation with no stored code.</strong>\nA vehicle hesitates briefly under light acceleration, roughly once a minute. No DTCs are stored. Live data on the scan tool shows throttle position tracking smoothly. Fuel pressure is correct and steady. Compression is even.\n<em>Task:</em> Explain why the scan tool's live data is incapable of finding this fault, name the measurement that will find it, and describe exactly how you would perform it.</p>\n<hr />\n<h2>7. Answer key</h2>\n<p><strong>Scenario 1 model answer.</strong>\nWhat is wrong with the method: the vehicle is late enough to use an <strong>active magnetoresistive sensor</strong>, which signals by modulating its own <strong>current draw</strong> between approximately 7 mA and 14 mA. There is no voltage square wave at the sensor to find. A DMM on DC volts sitting at a steady 1.4 V is exactly what you would expect from a current-signalling sensor being measured with the wrong instrument. The technician has proved nothing, which is why the first replacement did not fix it.</p>\n<p>Correct measurement: place a <strong>low-current clamp</strong> around one sensor wire (or scope across the ECU's sense resistor) and spin the wheel by hand. A healthy sensor shows a clean current square wave alternating between roughly 7 mA and 14 mA, with frequency proportional to wheel speed and full amplitude even at very low speed. Also confirm the supply voltage and the ground drop at the sensor connector first, since a supplied sensor with a bad ground produces no valid output regardless of its own health.</p>\n<p>Three other faults producing this complaint:\n1. <strong>Damaged or contaminated tone ring / magnetic encoder ring</strong> — often built into the wheel bearing seal. Metallic debris on a magnetic encoder ring is a very common cause and the sensor tests perfectly.\n2. <strong>Harness fault at the suspension flex point</strong> — the wire breaks internally where it moves with the strut; it may test continuous at rest and open at full lock or under suspension travel.\n3. <strong>Excessive air gap or a seated-incorrectly sensor</strong> — including a sensor that has been fitted with the mounting face not fully home, or corrosion behind the sensor holding it out.</p>\n<p>Also worth checking: the ABS module's own supply and ground, and whether the code is stored as current or historic.</p>\n<p><strong>Scenario 2 model answer.</strong>\nWhy live data cannot find it: a scan tool reads values that the ECU has already sampled, processed and placed in a buffer, then transmits them over the diagnostic bus at a refresh rate typically between <strong>5 and 20 samples per second per parameter</strong> — and slower when many parameters are selected. A dropout in a throttle or pedal potentiometer track can last <strong>1–5 milliseconds</strong>. It is entirely possible for the ECU to see the glitch, react to it, and for the value never to appear in the scan tool's data stream at all. Live data is a summary; it is not a measurement.</p>\n<p>The measurement that will find it: an <strong>oscilloscope capture of the sensor signal at high sample rate</strong>, ideally with glitch capture / peak detect enabled, on both tracks of the pedal or throttle sensor simultaneously.</p>\n<p>How to perform it:\n1. Scope channel 1 on pedal/throttle track A, channel 2 on track B, ground both at the sensor's own ground pin.\n2. Verify both tracks' supply and ground first — a bad sensor ground produces the same symptom.\n3. Set the timebase long (2–5 s/div) with <strong>peak detect / glitch capture enabled</strong> so no sample is missed between screen points, and set a trigger on a falling edge below the expected minimum.\n4. Sweep the pedal slowly through its full travel by hand, several times, then repeat under vibration and with the harness gently flexed.\n5. Look for a momentary collapse in either track. A dropout on one track alone is a worn resistive element; a simultaneous collapse on both is a shared supply or ground fault.\n6. If nothing shows, leave the scope connected in recording mode during a road test that reproduces the symptom, and correlate the timestamp of the hesitation with the capture.</p>\n<p>If both tracks are clean, apply the same method to the crank and cam signals — a momentary sync loss produces the identical complaint and also leaves no code.</p>", "quiz": [{"q": "A two-wire crankshaft sensor produces a signal that grows in amplitude as cranking speed increases. This sensor is:", "options": [{"k": "A", "t": "Hall effect"}, {"k": "B", "t": "Magnetoresistive"}, {"k": "C", "t": "Variable reluctance (inductive)"}, {"k": "D", "t": "Piezoelectric"}], "answer": "C", "why": "Only a self-generating inductive (VR) sensor produces an output whose amplitude is proportional to the rate of change of flux, and therefore to speed. Hall and MRE outputs have fixed amplitude."}, {"q": "On a low-side driven injector circuit, the ECU driver is switched OFF. The voltage measured at the ECU pin should be approximately:", "options": [{"k": "A", "t": "0 V"}, {"k": "B", "t": "2.5 V"}, {"k": "C", "t": "Battery voltage"}, {"k": "D", "t": "5 V"}], "answer": "C", "why": "On a low-side circuit the load carries a permanent feed, so with the driver off the ECU pin is pulled up through the injector winding to battery voltage. Reading battery voltage here is normal, not a fault — and misreading it as a fault is a classic error."}, {"q": "During a current ramp on four injectors, one trace shows normal peak current and normal rise time but no pintle inflection. The most likely conclusion is:", "options": [{"k": "A", "t": "The injector coil has shorted turns"}, {"k": "B", "t": "The injector coil is open circuit"}, {"k": "C", "t": "The injector is electrically sound but mechanically stuck"}, {"k": "D", "t": "The ECU driver for that injector has failed"}], "answer": "C", "why": "Peak current and rise time reflect the coil's electrical properties, which are normal. The inflection is caused by the moving armature changing inductance. No inflection with normal electrical behaviour means the pintle is not moving."}, {"q": "Four sensors on the same 5 V reference all report implausible values simultaneously. The first check should be:", "options": [{"k": "A", "t": "Replace all four sensors"}, {"k": "B", "t": "Measure the 5 V reference voltage and unplug sensors one at a time to see if it recovers"}, {"k": "C", "t": "Replace the ECU"}, {"k": "D", "t": "Clear the codes and road test"}], "answer": "B", "why": "Simultaneous implausibility across one rail points to the rail, not to four coincidental failures. A single shorted sensor pulling the reference down is the common cause and is identified by disconnecting sensors  input is typically pulled to 5 V through 1–10 kΩ. When the external sensor is disconnected, the input floats to 5 V; when it shorts to ground, the input reads 0 V. This is why a disconnected sensor and a shorted sensor set different codes, and why measuring 5.0 V at a disconnected signal wire proves the ECU side is alive. Capacitors — store charge, block DC, pass AC. Q = C × V , energy E = ½CV² . In vehicles they appear as decoupling capacitors on module power rails, filter capacitors in ignition and radio suppression, and bulk electrolytics in module power supplies. Electrolytic capacitor failure is the single most common cause of module failure by age. They dry out, ESR rises, the rail becomes noisy, and the module resets or behaves illogically. On an opened module, a bulged or leaking can is a finding; a flat-topped can measuring high ESR is also a finding even when it looks perfect. Inductors — resist changes in current. V = -L × dI/dt . Every coil, injector, solenoid and relay on the vehicle is an inductor, and each one produces a back-EMF spike when switched off. Reading that spike is how we diagnose them (see 2.5). 2.2 Semiconductors Diode — conducts one way. Forward voltage drop 0.6–0.7 V for silicon , 0.3 V for Schottky, and 1.5–3.5 V for an LED depending on colour. Automotive roles: - Rectification in the alternator (six or eight diodes in a bridge) - Flyback/suppression across relay and solenoid coils - Steering diodes preventing feedback between circuits - Zener diodes for voltage clamping and protection at module inputs Test: DMM diode mode, expect ~0.5–0.7 V one way and OL the other. A diode reading near 0 V both ways is shorted; OL both ways is open. Alternator diode failure is a classroom must. One failed diode in the bridge lets AC ripple through onto the vehicle's 12 V rail. Symptoms: whine through the radio, flickering lights, random module resets, communication errors, sometimes a battery light that never comes on. Diagnostic: DMM on AC volts at the battery, engine running with load. More than 0.5 V AC is a fail. On the scope, a healthy alternator shows small even ripple; a failed diode shows one deep notch repeating each revolution. Bipolar transistor (BJT) — current-controlled. Base current controls collector current, I_C = β × I_B . Still found in older ignition modules and driver stages. MOSFET — voltage-controlled, and the workhorse of every modern ECU output stage. Gate voltage above threshold turns on a low-resistance channel ( R_DS(on) often under 10 mΩ). Practically all injector, coil, fan, pump and lamp drivers inside a modern module are MOSFETs, usually in smart driver ICs that include current sensing, over-temperature shutdown and open-load detection. That last point is what generates so many codes: the smart driver reports open load, short to ground, short to battery and over-current back to the microcontroller, which converts them into DTCs. So a code that says \"injector 3 circuit open\" is the driver IC's own diagnostic, and it is reported when the driver is off , using a small sensing current. An open-load code with the circuit intact usually means a wiring fault; an over-current code usually means the load itself. High-side vs low-side drivers: Low-side driver High-side driver ECU switches Ground Battery positive Component sees Permanent 12 V feed, ECU pulls the other pin low Permanent ground, ECU supplies 12 V Voltage at pin when OFF ~12 V (pulled up through the load) ~0 V Voltage at pin when ON ~0 V ~12 V Typical use Injectors, coils, most solenoids Sensor supplies, some actuators, safety-critical loads Students must state which type they are testing before interpreting a reading, because 12 V at a driver pin means \"off\" on a low-side circuit and \"on\" on a high-side one. Half the misdiagnoses in the trade come from getting this backwards. 2.3 Sensor families Inductive / variable reluctance (VR) A coil and a magnet. A moving toothed wheel varies the flux, inducing an AC voltage. Self-generating — no supply voltage. - Output: AC sine-like , amplitude proportional to speed. 0.5–2 V p-p at cranking, 20–100 V p-p at high rpm. - Two wires (plus screen). Coil resistance typically 200–1,500 Ω . - Failure modes: coil open/short, air gap changed by debris on the reluctor, cracked reluctor ring, screen ground lost causing interference. - Diagnostic advantage: it produces its own signal, so it can be tested with the ECU disconnected by spinning the engine. Hall effect A semiconductor element in a magnetic field produces a small transverse voltage, amplified and squared inside the sensor. Requires a supply — usually three wires (supply, ground, signal). - Output: digital square wave , 0 V to 5 V or 0 V to 12 V, amplitude independent of speed . - Many are open-collector, requiring the ECU's pull-up. Disconnect the ECU and the signal disappears — a fact that confuses students who expect a VR-style self-generated output. - Failure: internal electronics fail, often heat-related and intermittent. Supply or ground fault kills output entirely. Magnetoresistive (MRE / AMR / GMR) Modern replacement for Hall in wheel speed and crank/cam. Detects field direction rather than strength, so it works down to zero speed and gives direction of rotation — essential for stop/start, hill hold and cylinder identification at rest. - Often a two-wire current-modulated device: the sensor changes its own current draw between roughly 7 mA and 14 mA , and the ECU reads the change as a voltage across a shunt. - Critical teaching point: you cannot properly test these with a voltmeter. You need a scope across a shunt or a low-current clamp. Many \"no wheel speed signal\" misdiagnoses are technicians measuring for a voltage square wave on a current-signalling sensor. - Encoded ABS sensors add data pulses (AK protocol) carrying direction and standstill information. Piezoelectric A crystal generates charge under mechanical stress. Used for knock sensors and some pressure sensors. - Output: small AC, millivolts to a few volts, broadband. - Knock sensor torque is a specified value (typically 20–25 Nm ) — under- or over-torqued gives false or absent knock detection, and the engine retards timing and loses power with no code. - Test: scope on the sensor, tap the block near it with a small spanner. A healthy sensor produces a clear decaying oscillation. Potentiometric A wiper on a resistive track. Used in TPS, pedal position, some MAF and EGR position sensors. - Three wires: 5 V supply, ground, wiper signal. - Output: analogue DC , typically 0.5 V closed to 4.5 V open. The 0.5 V floor exists deliberately so that a broken wire (0 V) is distinguishable from a legitimate closed position. - Failure: worn track producing dropouts. A DMM will not see a dropout lasting 3 ms. Sweep the sensor slowly with the scope running to catch them. This is the classic example of why the scope exists. - Modern pedal and throttle sensors are dual-track with deliberately different gradients (e.g. one 0.5–4.5 V, the other 0.25–2.25 V, or one rising while the other falls). The ECU cross-checks the pair; a plausibility code means the two tracks disagreed, not that either is necessarily dead. Thermistor (NTC) Coolant, intake air, oil, fuel temperature. Resistance falls as temperature rises — steeply and non-linearly. Temperature Typical NTC resistance −10 °C 9,000–10,000 Ω 20 °C 2,200–2,800 Ω 40 °C 1,100–1,300 Ω 80 °C 300–400 Ω 100 °C 180–200 Ω Read as a voltage divider against the ECU's internal pull-up: cold = high resistance = high signal voltage; hot = low resistance = low signal voltage. A signal stuck at 5 V means open circuit; stuck at 0 V means short to ground. Oxygen sensors Zirconia narrowband: generates its own voltage, 0.1 V (lean) to 0.9 V (rich) , switching around stoichiometric. A healthy one switches rapidly — a lazy sensor is diagnosed by switch rate , not by voltage range. Wideband (UEGO/LSU): a pump cell and a reference cell with a control circuit. The ECU maintains the reference at 450 mV by driving pump current; that pump current is the measurement. Cannot be interpreted from a raw voltage at the connector — read the ECU's reported lambda value in serial data, plus the sensor's heater circuit separately. Heater circuits are frequently the real fault. Heater resistance typically 2–15 Ω cold. 2.4 Actuators Actuator Drive What to check Solenoid injector Low-side, peak-and-hold or saturated Coil resistance, current ramp shape, back-EMF spike Piezo injector High-voltage stacked crystal, 100–200 V Never bench-test with 12 V; requires OEM procedure and coding after replacement Ignition coil Coil-on-plug, ECU triggers an internal igniter Primary trigger signal, secondary burn line and burn time PWM valve (turbo, EGR, canister purge) Variable duty cycle at fixed frequency Duty %, frequency, current draw, mechanical freedom Stepper motor (idle valve, some HVAC) 4 or 6 wires, driven in a phase sequence Each winding's resistance, scope all phases together for a missing step Throttle body (DC motor, H-bridge) Bidirectional PWM Motor resistance, both position tracks, mechanical return spring Electric fan (BLDC + controller) PWM or LIN commanded Control signal present, module supply, current draw PWM duty cycle — the fraction of each period the output is on. Duty = t_on / T × 100% . Frequency stays fixed; duty varies. Students must state both. A boost solenoid at \"50%\" means nothing unless you also know whether the frequency is 10 Hz or 300 Hz and whether the duty is measured on the ground side (in which case a low-side driver's 80% ground time may be reported by the tool as 20%). 2.5 Oscilloscope waveform analysis Scope setup discipline Choose voltage range with headroom — ignition primary spikes reach 300–400 V. Choose timebase so at least 2–3 full cycles are visible, then zoom in. Set trigger deliberately: rising edge, level around mid-amplitude. An untriggered trace teaches nothing. Ground the scope lead at the component's own ground , not at a random body point, or you will record the ground fault as part of the signal. Always capture a known-good reference on a healthy vehicle first, and keep a library. Waveform diagnosis without a reference is guesswork. Crank and cam overlay — the single most valuable capture in the trade Put crank on channel 1 and cam on channel 2, capture during cranking and idle. What it tells you: - Missing tooth position relative to the cam pulse gives you cam timing. A jumped tooth on the belt or a stretched chain shifts the relationship by a measurable amount. You have just diagnosed mechanical timing electrically, without removing a cover. - Signal integrity — dropouts, amplitude collapse, noise. - Cranking speed regularity — an uneven crank trace during cranking indicates a compression variation. Combined with a current clamp on the starter, this is relative compression testing : the cylinder with low compression loads the starter less, and the current waveform shows a shallower hump each time that cylinder comes up. Injector waveform (solenoid, low-side driven) Voltage trace stages: 1. Rest at battery voltage (low-side driver off, pulled up through the coil). 2. Sharp fall to near 0 V — driver turns on. 3. Flat or stepped hold region — on peak-and-hold systems, a distinct current step down. 4. Back-EMF spike on turn-off, typically 60–80 V on a port injector. 5. Return to battery voltage, sometimes with a small oscillation. The spike height is diagnostic: a low or absent spike indicates shorted turns in the winding. Identical injectors on the same engine should produce near-identical spikes — a side-by-side comparison finds the odd one out immediately. Current ramping (clamp on the injector wire) is more revealing still. The current rise shows a small inflection or \"hump\" where the pintle actually moves, because the moving armature changes the inductance. If the inflection is missing, the injector is electrically fine but mechanically stuck — you have proved a mechanical failure with an electrical measurement, which is the whole point of this module. Ignition secondary Firing (ionisation) voltage: the peak needed to jump the gap — typically 5–15 kV. Burn/spark line: the flat section where the spark sustains, typically 1–2 kV. Burn time 1.0–2.0 ms at idle is the health indicator. A high firing voltage with short burn time = excessive resistance in the secondary path: worn plug gap, bad lead, poor terminal. A low firing voltage with long burn time = fouled plug or a shorted path, spark taking an easy route. Comparing cylinders is more useful than absolute numbers. Charging system Scope the battery terminal, AC coupled, engine at 2,000 rpm with headlights on. Healthy: small, even ripple. One deep notch per rotation cycle = one failed diode. Ripple exceeding 0.5 V p-p condemns the alternator regardless of DC output being correct. 3. Tools & equipment needed 4-channel automotive oscilloscope with attenuator leads (min 400 V capable) and a secondary ignition pickup Low-current clamp (60 A, mA resolution) for current ramping — the most under-used tool in the trade 600 A clamp for starter current / relative compression Bench power supply, current-limited, for sensor simulation Signal simulator / sensor simulator box (variable 0–5 V, frequency generator, resistance box) Component test board: assorted diodes, MOSFETs, capacitors, thermistors, Hall and VR sensors ESR meter for capacitor testing Known-good waveform library (institution builds this progressively — every student contributes captures) 4. Step-by-step practical lab exercise Lab 2.1 — Distinguish a failed sensor from a failed circuit from a failed ECU input Scenario: Engine cranks but will not start. Scan tool shows P0335 Crankshaft Position Sensor \"A\" Circuit and reports 0 rpm during cranking. The temptation is to fit a crank sensor. The instruction is to prove which of four things is at fault: the sensor, its supply, its wiring, or the ECU input. Identify the sensor type from the diagram — two wires = probably VR (self-generating); three wires = Hall or MRE (supplied). Everything after this depends on getting it right. If three-wire: back-probe and confirm supply (usually 5 V or 12 V) and ground (drop under 0.1 V to battery negative) at the sensor connector , ignition on. - No supply → fault is upstream. Go to the ECU connector and check whether the ECU is outputting it. If the ECU outputs 5 V but the sensor sees 0 V, the wiring is open. - Supply present but ground drop high → ground fault, repair and retest. Scope the signal line at the sensor while cranking. - VR expected: AC waveform, 0.5–2 V p-p minimum at cranking speed, symmetrical, with a clear missing-tooth gap. - Hall expected: clean square wave, full amplitude, sharp edges. - MRE expected: you will likely see very little on a voltmeter or a voltage scope — measure current, or scope across the ECU's sense resistor. If a good signal is present at the sensor but not at the ECU connector: the harness is at fault. Confirm with continuity and with a voltage drop under a small load, then inspect the loom at flex and heat points. If no signal is produced at the sensor: - VR type: disconnect and measure coil resistance against spec (200–1,500 Ω typical). Out of spec = sensor. In spec = check air gap and inspect the reluctor ring for damage, debris or a cracked tone wheel. A perfect sensor reading nothing is usually a damaged trigger wheel — check before condemning. - Hall/MRE: with confirmed supply and ground, and no output, the sensor is faulty. If a good signal reaches the ECU pin and the ECU still reports 0 rpm: now, and only now, the ECU input is suspect. Before condemning a module, verify the ECU's own power supplies and grounds (Module 5 material), and check for a second synchronisation input the ECU may be waiting on. Write the fault report stating what was measured at each stage and which of the four possible fault locations was eliminated by which measurement. Lab 2.2 — Current ramp four injectors and identify the mechanically failing one Warm the engine to operating temperature, then switch off. Clamp the low-current probe around one wire of injector 1 . Note polarity so all four captures have the same orientation. Scope settings: 5 A/div, 1 ms/div, trigger on the rising edge of current. Capture 10 consecutive events at idle. Save. Repeat for injectors 2, 3 and 4 without changing any scope setting. Changing settings between captures makes comparison invalid. Overlay the four captures. Analyse: - Peak current should match within roughly 10% across all four. - The pintle inflection — a small hump or kink on the rising edge — must be present on all four at the same point in time. - Rise time differences indicate coil resistance or inductance differences. Interpretation: - All four identical, engine misfires → the fault is not the injector's electrical or pintle behaviour. Move to fuelling, compression or ignition. - One injector missing the inflection → pintle not moving. The coil is fine; the injector is mechanically stuck or heavily contaminated. - One injector with markedly higher peak current and faster rise → shorted turns. - One injector with much lower peak → high resistance in coil or circuit; check the circuit first with a voltage drop test. Cross-check the conclusion against cylinder contribution / misfire counters in serial data before ordering parts. 5. Common failure modes & troubleshooting trees Tree A — Sensor signal implausible or missing Sensor signal fault ├─ Is it self-generating (VR, piezo, narrowband O2) or supplied (Hall, MRE, potentiometric)? │ ├─ SELF-GENERATING → test output directly by moving/spinning the target │ │ ├─ No output → measure coil resistance, inspect air gap and reluctor │ │ └─ Output present → problem is downstream: harness or ECU input │ └─ SUPPLIED → verify supply voltage AND ground drop at the sensor first │ ├─ Supply missing → is the ECU producing it? Multiple sensors dead │ │ on one 5 V t independent faults. Frequently seen real-world failures Failure Symptom Confirming measurement Shorted sensor loading the 5 V rail Multiple implausible sensor codes Rail voltage low; recovers as sensors unplugged one by one Worn potentiometer track Intermittent hesitation, occasional limp Slow sweep on scope reveals millisecond dropouts Damaged reluctor / tone wheel No or erratic rpm, sensor tests good Scope shows irregular tooth spacing; visual inspection Failed alternator diode Radio whine, module resets, comms errors AC ripple > 0.5 V at battery Injector stuck pintle Misfire, cylinder contribution low Current ramp missing pintle inflection Knock sensor under-torqued Power loss, no code Scope response to a tap; check torque to spec Dried-out module capacitors Age-related random module misbehaviour ESR measurement on opened module 6. Student knowledge check Practical scenario challenges Scenario 1 — The wheel speed sensor that \"has no output\". A 2019 vehicle has an ABS fault for the right front wheel speed sensor. A technician has back-probed the sensor and measured with a DMM on DC volts while an assistant spun the wheel. The reading sat at a steady 1.4 V and never changed. The technician has ordered a sensor. The sensor has already been replaced once by another garage and the fault returned. Task: Explain what is wrong with the test method, describe the correct measurement, and list three faults other than the sensor that would produce this complaint. Scenario 2 — The intermittent hesitation with no stored code. A vehicle hesitates briefly under light acceleration, roughly once a minute. No DTCs are stored. Live data on the scan tool shows throttle position tracking smoothly. Fuel pressure is correct and steady. Compression is even. Task: Explain why the scan tool's live data is incapable of finding this fault, name the measurement that will find it, and describe exactly how you would perform it. 7. Answer key Scenario 1 model answer. What is wrong with the method: the vehicle is late enough to use an active magnetoresistive sensor , which signals by modulating its own current draw between approximately 7 mA and 14 mA. There is no voltage square wave at the sensor to find. A DMM on DC volts sitting at a steady 1.4 V is exactly what you would expect from a current-signalling sensor being measured with the wrong instrument. The technician has proved nothing, which is why the first replacement did not fix it. Correct measurement: place a low-current clamp around one sensor wire (or scope across the ECU's sense resistor) and spin the wheel by hand. A healthy sensor shows a clean current square wave alternating between roughly 7 mA and 14 mA, with frequency proportional to wheel speed and full amplitude even at very low speed. Also confirm the supply voltage and the ground drop at the sensor connector first, since a supplied sensor with a bad ground produces no valid output regardless of its own health. Three other faults producing this complaint: 1. Damaged or contaminated tone ring / magnetic encoder ring — often built into the wheel bearing seal. Metallic debris on a magnetic encoder ring is a very common cause and the sensor tests perfectly. 2. Harness fault at the suspension flex point — the wire breaks internally where it moves with the strut; it may test continuous at rest and open at full lock or under suspension travel. 3. Excessive air gap or a seated-incorrectly sensor — including a sensor that has been fitted with the mounting face not fully home, or corrosion behind the sensor holding it out. Also worth checking: the ABS module's own supply and ground, and whether the code is stored as current or historic. Scenario 2 model answer. Why live data cannot find it: a scan tool reads values that the ECU has already sampled, processed and placed in a buffer, then transmits them over the diagnostic bus at a refresh rate typically between 5 and 20 samples per second per parameter — and slower when many parameters are selected. A dropout in a throttle or pedal potentiometer track can last 1–5 milliseconds . It is entirely possible for the ECU to see the glitch, react to it, and for the value never to appear in the scan tool's data stream at all. Live data is a summary; it is not a measurement. The measurement that will find it: an oscilloscope capture of the sensor signal at high sample rate , ideally with glitch capture / peak detect enabled, on both tracks of the pedal or throttle sensor simultaneously. How to perform it: 1. Scope channel 1 on pedal/throttle track A, channel 2 on track B, ground both at the sensor's own ground pin. 2. Verify both tracks' supply and ground first — a bad sensor ground produces the same symptom. 3. Set the timebase long (2–5 s/div) with peak detect / glitch capture enabled so no sample is missed between screen points, and set a trigger on a falling edge below the expected minimum. 4. Sweep the pedal slowly through its full travel by hand, several times, then repeat under vibration and with the harness gently flexed. 5. Look for a momentary collapse in either track. A dropout on one track alone is a worn resistive element; a simultaneous collapse on both is a shared supply or ground fault. 6. If nothing shows, leave the scope connected in recording mode during a road test that reproduces the symptom, and correlate the timestamp of the hesitation with the capture. If both tracks are clean, apply the same method to the crank and cam signals — a momentary sync loss produces the identical complaint and also leaves no code. ", "words": 4521}, {"id": "module-3-networks-multiplexing", "label": "Module 3", "title": "Networks & multiplexing", "colour": "#D98324", "html": "<h1>Module 3 — Automotive Multiplexing &amp; Communication Networks</h1>\n<p><strong>Hours:</strong> 60 (24 lecture / 36 workshop)\n<strong>Prerequisite:</strong> Modules 1 and 2 practicals signed off.</p>\n<hr />\n<h2>1. Module overview &amp; learning objectives</h2>\n<p>A modern vehicle has 20–120 control modules sharing sensor data over a handful of twisted pairs. When that sharing breaks, the fault presentation is spectacular and misleading: dozens of codes, multiple warning lamps, and no single component at fault. This module trains the student to treat the network as a measurable circuit rather than a mystery.</p>\n<p>By the end of the module the student can:</p>\n<ul>\n<li><strong>3.1</strong> Explain the physical and data-link behaviour of CAN, LIN, FlexRay, MOST and automotive Ethernet.</li>\n<li><strong>3.2</strong> Draw a vehicle's network topology from the OEM diagram, identifying every gateway, terminator and sub-bus.</li>\n<li><strong>3.3</strong> Measure bus health: termination resistance, idle voltages, signal levels and waveform quality.</li>\n<li><strong>3.4</strong> Distinguish short-to-ground, short-to-power, wire-to-wire short, open circuit and a single node babbling.</li>\n<li><strong>3.5</strong> Decode a CAN frame from a scope capture by hand, and identify a transmitting node by elimination.</li>\n</ul>\n<hr />\n<h2>2. Comprehensive theory &amp; lecture notes</h2>\n<h3>2.1 Why multiplexing exists</h3>\n<p>A 1985 vehicle with 40 loads needed 40+ wires from the dash. A modern one carries engine speed once on the bus and every module that needs it reads it there. The result: less copper, less weight, fewer connections — but a <strong>single point of failure that affects everything.</strong></p>\n<p>Key consequence for diagnosis: <strong>on a multiplexed vehicle, the number of codes is not proportional to the number of faults.</strong> A single shorted CAN wire can produce 60 codes across 15 modules. The technician's job is to find the one physical fault, not to investigate 60 codes.</p>\n<h3>2.2 CAN — Controller Area Network</h3>\n<p><strong>Fundamentals:</strong>\n- Differential signalling over a twisted pair, <strong>CAN-H</strong> and <strong>CAN-L</strong>.\n- Multi-master, message-based. There are no addresses in the classical sense — each frame carries an <strong>identifier</strong> describing the <em>content</em>, and every node decides whether it cares.\n- <strong>Non-destructive bitwise arbitration:</strong> if two nodes transmit at once, the one sending the lower identifier value wins and continues without corruption. The loser retries. Lower ID = higher priority.\n- Dominant/recessive logic: a <strong>dominant</strong> bit (logical 0) always overrides a <strong>recessive</strong> bit (logical 1). This is why arbitration works and why a node stuck sending dominant bits (\"babbling idiot\") kills the whole bus.</p>\n<p><strong>Voltage levels — high-speed CAN (ISO 11898-2):</strong></p>\n<table>\n<thead>\n<tr>\n<th>State</th>\n<th>CAN-H</th>\n<th>CAN-L</th>\n<th>Differential</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Recessive (idle, logical 1)</td>\n<td>2.5 V</td>\n<td>2.5 V</td>\n<td>~0 V</td>\n</tr>\n<tr>\n<td>Dominant (logical 0)</td>\n<td>3.5 V</td>\n<td>1.5 V</td>\n<td>~2 V</td>\n</tr>\n</tbody>\n</table>\n<p>Bit rate: typically <strong>500 kbit/s</strong> for powertrain, 250 kbit/s on some commercial/J1939, up to 1 Mbit/s.</p>\n<p><strong>Voltage levels — low-speed / fault-tolerant CAN (ISO 11898-3):</strong></p>\n<table>\n<thead>\n<tr>\n<th>State</th>\n<th>CAN-H</th>\n<th>CAN-L</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Recessive</td>\n<td>0 V</td>\n<td>5 V</td>\n</tr>\n<tr>\n<td>Dominant</td>\n<td>3.6 V</td>\n<td>1.4 V</td>\n</tr>\n</tbody>\n</table>\n<p>Bit rate up to 125 kbit/s. Used for comfort/body networks. <strong>Fault-tolerant</strong> means it deliberately continues operating single-wire if one line fails — so the vehicle still works and the customer's only clue is a warning lamp. This is why measuring a comfort bus that \"seems to work\" still finds faults.</p>\n<p><strong>Single-wire CAN (GMLAN, SAE J2411):</strong> one wire, ground return, 33.3 kbit/s normal and 83.3 kbit/s in high-speed wake mode. Idle 0 V, dominant approximately 4 V (up to ~12 V in wake mode). Used extensively on GM body electronics.</p>\n<p><strong>CAN FD</strong> — Flexible Data-rate. Same physical layer concept, but the data phase switches to a higher bit rate (2–8 Mbit/s) and the payload grows from 8 to <strong>64 bytes</strong>. Increasingly standard on vehicles from about 2019 onward. A classic CAN tool on a CAN FD bus may see nothing or may see errors — check tool capability before condemning a vehicle's bus.</p>\n<p><strong>Termination:</strong> each end of a high-speed CAN backbone carries a <strong>120 Ω</strong> resistor. Two in parallel measure <strong>60 Ω</strong> across CAN-H and CAN-L with the ignition off and battery disconnected. This is the single most useful number in the module.</p>\n<table>\n<thead>\n<tr>\n<th>Measured resistance</th>\n<th>Interpretation</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>~60 Ω</td>\n<td>Both terminators present — bus wiring likely intact</td>\n</tr>\n<tr>\n<td>~120 Ω</td>\n<td>One terminator missing or open circuit in the backbone between them</td>\n</tr>\n<tr>\n<td>~40 Ω</td>\n<td>An extra terminator present — often an incorrectly retrofitted or wrongly-specified module</td>\n</tr>\n<tr>\n<td>&lt;1 Ω</td>\n<td>CAN-H shorted to CAN-L</td>\n</tr>\n<tr>\n<td>Open / very high</td>\n<td>Break in the backbone at the measurement point, or measuring an unterminated sub-bus</td>\n</tr>\n</tbody>\n</table>\n<p>Note carefully: <strong>low-speed/fault-tolerant CAN is not terminated at 60 Ω.</strong> Each node carries its own termination (typically 1–10 kΩ), and the measured value depends on how many nodes are connected. Applying the 60 Ω rule to a comfort bus produces a false diagnosis. Always establish which bus you are on first.</p>\n<p><strong>CAN frame structure (standard 11-bit):</strong></p>\n<table>\n<thead>\n<tr>\n<th>Field</th>\n<th>Bits</th>\n<th>Purpose</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>SOF</td>\n<td>1</td>\n<td>Start of frame, dominant</td>\n</tr>\n<tr>\n<td>Identifier</td>\n<td>11 (or 29 extended)</td>\n<td>Message ID and priority</td>\n</tr>\n<tr>\n<td>RTR</td>\n<td>1</td>\n<td>Remote transmission request</td>\n</tr>\n<tr>\n<td>IDE</td>\n<td>1</td>\n<td>Standard or extended identifier</td>\n</tr>\n<tr>\n<td>r0</td>\n<td>1</td>\n<td>Reserved</td>\n</tr>\n<tr>\n<td>DLC</td>\n<td>4</td>\n<td>Data length code, 0–8 bytes</td>\n</tr>\n<tr>\n<td>Data</td>\n<td>0–64</td>\n<td>Payload</td>\n</tr>\n<tr>\n<td>CRC</td>\n<td>15 + delimiter</td>\n<td>Error checking</td>\n</tr>\n<tr>\n<td>ACK</td>\n<td>2</td>\n<td>Acknowledge slot and delimiter</td>\n</tr>\n<tr>\n<td>EOF</td>\n<td>7</td>\n<td>End of frame, recessive</td>\n</tr>\n<tr>\n<td>IFS</td>\n<td>3</td>\n<td>Inter-frame space</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Bit stuffing:</strong> after five identical consecutive bits, the transmitter inserts one opposite bit to maintain synchronisation. When decoding a capture by hand, students must remove stuffed bits — forgetting this is the usual reason a hand-decode fails.</p>\n<p><strong>Error handling and bus-off:</strong> each node keeps transmit and receive error counters. At an error count of 128 the node goes <strong>error passive</strong>; at 256 it goes <strong>bus-off</strong> and stops transmitting entirely. This is important in the workshop: a node that has taken itself off the bus is silent, appears dead, and may be perfectly healthy — it has protected itself from a wiring fault. <strong>Repair the wiring, clear the counters by cycling power, and the \"dead\" module returns.</strong> Replacing it changes nothing.</p>\n<h3>2.3 LIN — Local Interconnect Network (ISO 17987)</h3>\n<ul>\n<li><strong>Single wire</strong>, ground return, 12 V logic. Recessive ≈ battery voltage, dominant ≈ 0 V.</li>\n<li><strong>1–20 kbit/s</strong>, typically 9,600 or 19,200 bit/s.</li>\n<li><strong>Master–slave with no arbitration.</strong> One master polls; slaves answer only when addressed. Up to 16 slaves typically.</li>\n<li>Used for cheap, slow devices: mirrors, seat modules, rain/light sensors, HVAC flap motors, alternator regulators, some smart fan controllers, trailer modules.</li>\n<li>A LIN sub-bus normally hangs off a module that is itself a CAN node — so a LIN fault appears as a CAN-visible code from the master module.</li>\n<li><strong>Diagnostic reality:</strong> most LIN faults are supply, ground, or the slave itself. Scope the single wire — you should see the master's break/sync field followed by the slave's response. <strong>A response frame that is missing tells you the slave did not answer</strong>; a frame present but with implausible data tells you the slave answered wrongly. These are different faults.</li>\n</ul>\n<h3>2.4 FlexRay</h3>\n<ul>\n<li><strong>Time-triggered, deterministic</strong> — every message has a guaranteed slot in a repeating cycle. Unlike CAN, timing is not priority-dependent.</li>\n<li>Up to <strong>10 Mbit/s per channel</strong>, typically dual-channel for redundancy.</li>\n<li>Used for chassis-critical systems: active suspension, active steering, some brake and driver-assist systems, primarily on premium German platforms.</li>\n<li>Levels are differential around a 2.5 V idle, but the signalling is faster and lower-amplitude than CAN — <strong>a standard CAN decode setting will not read it.</strong></li>\n<li><strong>Practical teaching point:</strong> FlexRay nodes are time-synchronised. Replacing a node usually requires coding and network re-synchronisation, and the network will not simply \"start working\" after a swap. Follow the OEM procedure.</li>\n</ul>\n<h3>2.5 MOST — Media Oriented Systems Transport</h3>\n<ul>\n<li><strong>Ring topology</strong>, historically <strong>plastic optical fibre</strong> (MOST25/50), later coax (MOST150).</li>\n<li>Carries infotainment audio/video: head unit, amplifier, changer, telephone, navigation.</li>\n<li>Critical property: <strong>a ring. One broken link stops the entire ring.</strong> One failed amplifier, one disconnected fibre, or one module that fails to wake and the whole infotainment system is dead with no obvious culprit.</li>\n<li>Diagnosis: OEM tools provide a <strong>ring break diagnosis</strong> that reports which node last passed light. Manually, the fibre can be checked with an optical test — but never look into the end of a fibre, and never bend a plastic fibre beyond its minimum radius (typically 25 mm), because a kinked fibre attenuates and produces an intermittent that returns after refitting trim.</li>\n<li>Common real cause: a module removed for another repair and refitted with the fibre connector's two halves reversed, or a fibre pinched under a seat rail.</li>\n</ul>\n<h3>2.6 Automotive Ethernet</h3>\n<ul>\n<li><strong>100BASE-T1 / 1000BASE-T1</strong> — a single unshielded twisted pair, full duplex, differential.</li>\n<li>Used for camera systems, ADAS, high-bandwidth backbones and <strong>DoIP (ISO 13400)</strong> diagnostics.</li>\n<li>OBD pins 3 and 11 are commonly used for DoIP on vehicles that support it.</li>\n<li>Cannot be measured meaningfully with a DMM or an ordinary scope decode; requires a media converter or the OEM tool.</li>\n<li><strong>Practical point for the workshop:</strong> on a DoIP vehicle, a generic OBD tool that only speaks CAN may reach the gateway but be unable to reach modules that sit behind an Ethernet backbone. The vehicle is not faulty; the tool is inadequate.</li>\n</ul>\n<h3>2.7 Gateways and topology</h3>\n<p>A <strong>gateway module</strong> joins networks running at different speeds and protocols, translating and filtering traffic. It is typically the busiest and most heat-stressed module in the vehicle and it usually also hosts the diagnostic connection.</p>\n<p>Consequences for diagnosis:\n- If the gateway fails, <strong>no module is reachable</strong> through the OBD port, and the vehicle appears to have lost every module simultaneously. Before condemning a gateway, verify its supply, its grounds, and its wake input.\n- A gateway can be reachable while a sub-bus behind it is dead. The tool reports \"no communication with module X\" while all other modules answer — that pattern points at the sub-bus, not at X.\n- Many vehicles have a <strong>security gateway</strong> (SGW) that blocks bidirectional functions from unauthorised tools. Not a fault. It requires registered tool credentials.</p>\n<p><strong>Topology mapping exercise — every student must do this on a real vehicle:</strong>\n1. Obtain the OEM network diagram.\n2. Draw each bus as a line, with its speed and type labelled.\n3. Place every module on its bus.\n4. Mark both terminating resistors on each high-speed bus and note which modules physically contain them.\n5. Mark the gateway(s) and which OBD pins reach which bus.\n6. Mark connector and splice locations physically on the vehicle.</p>\n<p>Once this drawing exists, \"which modules are missing from the scan report\" becomes a map-reading exercise, and the fault location is usually obvious.</p>\n<h3>2.8 Bus fault types and their signatures</h3>\n<table>\n<thead>\n<tr>\n<th>Fault</th>\n<th>CAN-H idle</th>\n<th>CAN-L idle</th>\n<th>Termination reading</th>\n<th>Communication</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Healthy</td>\n<td>2.5 V</td>\n<td>2.5 V</td>\n<td>60 Ω</td>\n<td>Normal</td>\n</tr>\n<tr>\n<td>CAN-H short to ground</td>\n<td>0 V</td>\n<td>2.5 V (or 0 V)</td>\n<td>Varies</td>\n<td>Total loss on HS-CAN</td>\n</tr>\n<tr>\n<td>CAN-L short to ground</td>\n<td>2.5 V</td>\n<td>0 V</td>\n<td>Varies</td>\n<td>May limp on some transceivers</td>\n</tr>\n<tr>\n<td>CAN-H short to battery</td>\n<td>12 V</td>\n<td>2.5 V</td>\n<td>Varies</td>\n<td>Total loss; risk of transceiver damage</td>\n</tr>\n<tr>\n<td>CAN-H shorted to CAN-L</td>\n<td>~2.5 V both, no separation</td>\n<td></td>\n<td>&lt;1 Ω</td>\n<td>Total loss</td>\n</tr>\n<tr>\n<td>One terminator open</td>\n<td>2.5 V</td>\n<td>2.5 V</td>\n<td>120 Ω</td>\n<td>Often works, with reflections and intermittent errors</td>\n</tr>\n<tr>\n<td>Break in backbone</td>\n<td>Normal one side</td>\n<td>Normal one side</td>\n<td>120 Ω each side</td>\n<td>Modules on one side missing</td>\n</tr>\n<tr>\n<td>Babbling node</td>\n<td>Waveform continuously dominant or malformed</td>\n<td></td>\n<td>60 Ω</td>\n<td>Total loss; bus busy with garbage</td>\n</tr>\n<tr>\n<td>Node bus-off</td>\n<td>Normal</td>\n<td>Normal</td>\n<td>60 Ω</td>\n<td>Only that node missing</td>\n</tr>\n</tbody>\n</table>\n<p><strong>The reflection point matters.</strong> An open terminator often produces a bus that works most of the time and throws intermittent communication errors under temperature or vibration. On the scope, look for <strong>ringing on the edges</strong> — overshoot and oscillation after each transition. A properly terminated bus has clean, damped edges.</p>\n<hr />\n<h2>3. Tools &amp; equipment needed</h2>\n<ul>\n<li>4-channel oscilloscope with <strong>CAN and LIN serial decode</strong></li>\n<li>Breakout box for the OBD-II connector, with individual pin access</li>\n<li>DMM for termination resistance and idle voltages</li>\n<li>CAN logging interface (PCAN-USB, Kvaser, Komodo) with logging software</li>\n<li>OEM wiring and topology diagrams</li>\n<li>Bus fault simulator trainer board (switchable short-to-ground, short-to-power, open, missing terminator, babbling node)</li>\n<li>120 Ω precision resistor and test leads for substitution testing</li>\n<li>LIN-capable scope leads and a known-good LIN slave for comparison</li>\n</ul>\n<hr />\n<h2>4. Step-by-step practical lab exercise</h2>\n<h3>Lab 3.1 — Locate a CAN backbone fault by halving</h3>\n<p><strong>Scenario:</strong> Multiple warning lamps illuminated. Scan tool reports no communication with four modules; six others respond. Dozens of U-codes stored.</p>\n<ol>\n<li><strong>Do not clear the codes.</strong> The pattern of which modules are missing is the primary evidence.</li>\n<li><strong>Draw the topology</strong> from the OEM diagram and mark the four missing modules on it. Ask: do they share a bus? Do they sit on the same side of a splice or connector? This alone frequently identifies the section.</li>\n<li><strong>Measure termination resistance</strong> at the OBD connector, ignition off, battery <strong>disconnected</strong> (an energised bus gives a meaningless reading and can damage the meter). Pins 6 (CAN-H) and 14 (CAN-L) on a standard J1962 connector.\n   - 60 Ω → both terminators present; suspect an open in a branch, not the backbone.\n   - 120 Ω → open backbone between terminators, or one terminator lost.\n   - &lt;1 Ω → wire-to-wire short.</li>\n<li><strong>Reconnect the battery, ignition on, scope both lines</strong> referenced to battery negative.\n   - Confirm idle levels (2.5 V / 2.5 V) and dominant excursion (3.5 V / 1.5 V).\n   - Look at edge quality. Ringing indicates a termination or stub-length problem.\n   - A line pinned at 0 V or 12 V identifies the fault type immediately.</li>\n<li><strong>Halve the network.</strong> Disconnect the connector nearest the physical midpoint of the suspect section. Re-measure termination on each half.\n   - The half that now reads 120 Ω contains a terminator and is intact to it.\n   - The half reading open contains the break.</li>\n<li><strong>Repeat halving</strong> within the failing half until you are between two adjacent connectors, then inspect that harness section physically — flex points, chafe against brackets, water at bulkhead grommets, and rodent damage are the four common findings.</li>\n<li><strong>If resistance is correct but a module is still missing:</strong> disconnect that module and re-measure. If the bus recovers fully and other modules return, that node was pulling the bus down. If nothing changes, the module's own supply, ground and wake line are the next checks (Module 5 territory).</li>\n<li><strong>Verify.</strong> With the repair made, confirm 60 Ω, confirm clean waveform edges, confirm all modules present, clear codes, and re-scan after a full sleep/wake cycle. Codes that return after a sleep cycle indicate the fault is not fully resolved.</li>\n</ol>\n<h3>Lab 3.2 — Hand-decode a CAN frame from a scope capture</h3>\n<ol>\n<li>Scope CAN-H, single-shot trigger on the falling edge, timebase set so one frame fills the screen.</li>\n<li>Capture a frame at a known 500 kbit/s. Confirm bit time: <code>1 / 500,000 = 2 µs per bit</code>.</li>\n<li>Using cursors, mark each 2 µs interval across the frame and write the bit sequence.</li>\n<li>Identify the <strong>SOF</strong> — the first dominant bit after idle.</li>\n<li>Read the next <strong>11 bits</strong> as the identifier, MSB first. Convert to hex.</li>\n<li>Read <strong>RTR, IDE, r0</strong>, then the <strong>4-bit DLC</strong>. Convert DLC to the number of data bytes.</li>\n<li>Read that number of bytes of data.</li>\n<li><strong>Remove stuffed bits</strong> — after any five consecutive identical bits, discard the following bit before continuing to interpret. Students who skip this get a corrupted DLC and give up.</li>\n<li>Cross-check the decoded identifier against the scope's automatic serial decode. They must agree. If they do not, find your error — the exercise is complete only when the hand-decode matches.</li>\n<li><strong>Identify the transmitting node by elimination:</strong> with a logger running and filtering on that identifier, disconnect modules one at a time. The identifier that disappears when module X is unplugged is transmitted by module X. Record it. Over time the class builds a per-vehicle identifier map, which is real diagnostic capital.</li>\n</ol>\n<hr />\n<h2>5. Common failure modes &amp; troubleshooting trees</h2>\n<h3>Tree A — No communication with any module</h3>\n<pre><code>Tool cannot reach anything\n├─ Is the OBD connector itself powered? Pin 16 = battery +, pins 4 and 5 = grounds\n│   ├─ No power → check the OBD connector fuse. Extremely common and often\n│   │              caused by an aftermarket accessory or tracker on that circuit.\n│   └─ Power good → continue\n├─ Termination resistance across pins 6 and 14, battery disconnected\n│   ├─ &lt;1 Ω → CAN-H/CAN-L short. Halve the harness.\n│   ├─ Open → backbone break near the connector, or this vehicle\n│   │          does not route CAN to those pins (check the protocol —\n│   │          could be K-line, J1850, or DoIP on pins 3/11)\n│   ├─ 120 Ω → one terminator or one section lost\n│   └─ 60 Ω → wiring likely fine; suspect gateway\n├─ Gateway module supply, grounds and wake input verified?\n│   ├─ Any fault → repair and retest before condemning\n│   └─ All good, still nothing → gateway failure is now a supported conclusion\n└─ Does another tool reach it? A DoIP or CAN-FD vehicle with a legacy tool\n   is a tool limitation, not a vehicle fault. Confirm before further work.\n</code></pre>\n<h3>Tree B — Some modules missing, others present</h3>\n<pre><code>Partial communication loss\n├─ Plot the missing modules on the topology drawing FIRST\n├─ Are all missing modules on one sub-bus?\n│   ├─ YES → the sub-bus or its gateway branch is the fault.\n│   │        Measure that bus directly at a module connector, not at OBD.\n│   └─ NO → continue\n├─ Are all missing modules downstream of one connector or splice?\n│   ├─ YES → inspect that connector. Water and corrosion are the usual finding.\n│   └─ NO → continue\n├─ Is only ONE module missing?\n│   ├─ Check its power feeds and grounds (there are usually several)\n│   ├─ Check its wake/ignition input\n│   ├─ Measure the CAN pair at ITS connector — signal present?\n│   │     ├─ Signal present, module silent → module bus-off or failed.\n│   │     │   Cycle power to reset error counters before condemning.\n│   │     └─ No signal at the module → branch wiring open\n└─ Do missing modules return after a sleep/wake cycle? → intermittent;\n    suspect marginal termination, reflection, or a partially broken conductor\n</code></pre>\n<h3>Tree C — Intermittent communication errors, no permanent loss</h3>\n<pre><code>Intermittent U-codes\n├─ Termination reading exactly 60 Ω? → if 120 Ω, a terminator has been lost\n│   and the bus is running on reflections. This is THE classic cause.\n├─ Scope edge quality → ringing/overshoot = termination or excessive stub length\n├─ Charging system AC ripple &gt; 0.5 V? → alternator diode failure upsets\n│   every transceiver on the vehicle\n├─ Aftermarket device fitted? → trackers, alarms, dashcams and\n│   parking sensors spliced into CAN are a leading cause. Remove and retest.\n├─ Correlates with temperature or vibration? → partially broken conductor\n│   or a cracked solder joint at a module's bus connector\n└─ Correlates with one function being used? → the node performing that\n    function is likely the disturber. Log the bus during the trigger event.\n</code></pre>\n<h3>Frequently seen real-world failures</h3>\n<table>\n<thead>\n<tr>\n<th>Failure</th>\n<th>Symptom</th>\n<th>Confirming measurement</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Aftermarket tracker/alarm spliced into CAN</td>\n<td>Random U-codes after \"an install\"</td>\n<td>Remove device, retest; inspect for T-taps</td>\n</tr>\n<tr>\n<td>Water in a bulkhead or door connector</td>\n<td>Multiple modules missing, worse in rain</td>\n<td>Visual + termination halving</td>\n</tr>\n<tr>\n<td>Lost terminator</td>\n<td>Intermittent comms, works most of the time</td>\n<td>120 Ω instead of 60 Ω; ringing edges</td>\n</tr>\n<tr>\n<td>Module bus-off after a wiring fault</td>\n<td>One module dead, tests fine on the bench</td>\n<td>Recovers after wiring repair + power cycle</td>\n</tr>\n<tr>\n<td>MOST fibre pinched or reversed</td>\n<td>Total infotainment loss after trim removal</td>\n<td>Ring break diagnosis; visual fibre inspection</td>\n</tr>\n<tr>\n<td>Gateway supply fuse blown</td>\n<td>No comms at all, vehicle otherwise runs</td>\n<td>Power at gateway feed</td>\n</tr>\n<tr>\n<td>Tool cannot speak CAN FD / DoIP</td>\n<td>\"No communication\" on a healthy vehicle</td>\n<td>Try a second, current tool before diagnosing</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>6. Student knowledge check</h2>\n<h3>Practical scenario challenges</h3>\n<p><strong>Scenario 1 — Sixty codes, one fault.</strong>\nA vehicle arrives with the ABS, traction control, airbag and power steering lamps illuminated. The scan tool reports no communication with the ABS module, the steering angle sensor and the electric power steering module, and stores 63 U-codes across the modules that do respond. The customer says a tracking device was fitted by an insurance company two weeks ago.\n<em>Task:</em> State the order of your first four actions and justify each. Explain why clearing the codes at the start would be a mistake, and explain the significance of exactly which three modules are missing.</p>\n<p><strong>Scenario 2 — The intermittent that returns after a road test.</strong>\nA vehicle throws intermittent communication faults. All modules are present at the time of inspection. Termination resistance measures 120 Ω. The previous garage found no fault because \"everything communicates\".\n<em>Task:</em> Explain what the 120 Ω reading means and why the vehicle still communicates despite it. Describe how you would locate the missing terminator, and explain what you would expect to see on the oscilloscope that confirms the diagnosis.</p>\n<hr />\n<h2>7. Answer key</h2>\n<p><strong>Scenario 1 model answer.</strong></p>\n<p><strong>Action 1 — Record and preserve the fault pattern.</strong> Save a full system scan report listing precisely which modules respond and which do not, before touching anything. The pattern is the primary diagnostic evidence and it is destroyed by clearing.</p>\n<p><strong>Action 2 — Plot the three missing modules on the vehicle's topology drawing.</strong> ABS, steering angle sensor and EPS are chassis-domain modules. If all three share one sub-bus or all three sit beyond one splice or connector, the physical fault location is already narrowed to a single harness section. If they are spread across different buses, the answer is a gateway or a power/ground distribution shared by all three.</p>\n<p><strong>Action 3 — Inspect the tracker installation.</strong> A device fitted two weeks before the fault appeared, spliced into a vehicle harness, is the highest-probability cause on the vehicle. Look specifically for T-taps or scotchlok connectors on CAN pairs, for a power tap into a chassis-domain feed, and for the harness being pinched or rerouted during the install. Disconnect the device entirely and retest.</p>\n<p><strong>Action 4 — Measure termination resistance and scope the bus</strong> at a module connector in the affected domain, battery disconnected for the resistance measurement. This tells you whether the fault is a short, an open, or a node problem, and separates a wiring fault from a module fault.</p>\n<p><strong>Why clearing codes first is a mistake:</strong> the U-code set and the freeze-frame timestamps show which modules lost which partners and when. Clearing throws away the map of the fault. It also produces a false sense of resolution if the fault is intermittent — the lamps go out and the vehicle is returned to the customer unrepaired.</p>\n<p><strong>Significance of those three modules:</strong> they are functionally related and almost certainly share a chassis sub-bus or a common feed. Three related modules missing while ten unrelated ones respond points to a single physical fault on one branch — not to three failed modules. The airbag and traction lamps are consequences: those systems illuminate because they have lost the data they depend on, not because they are faulty.</p>\n<p><strong>Scenario 2 model answer.</strong></p>\n<p><strong>What 120 Ω means:</strong> the meter is seeing one terminating resistor instead of two in parallel. Either one terminator has gone open circuit, or the backbone is broken between the two terminators so only one is reachable from the measuring point.</p>\n<p><strong>Why the vehicle still communicates:</strong> termination exists to absorb the signal at the ends of the line. With one terminator, the differential signalling still produces valid dominant and recessive levels most of the time, so frames are usually decoded correctly. The bus is running on marginal signal integrity — it works until temperature, vibration or heavy bus load pushes a marginal frame past the error threshold, at which point nodes log errors and, occasionally, go bus-off. That is exactly the \"intermittent with nothing found\" presentation.</p>\n<p><strong>How to locate the missing terminator:</strong>\n1. From the OEM diagram, identify <strong>which two modules physically contain the terminating resistors</strong> — on most vehicles these are named, commonly the ECM at one end and a body or gateway module at the other.\n2. Measure resistance across the CAN pair <strong>at each of those two modules' own connectors, module unplugged</strong>. A healthy terminator reads 120 Ω across the module's own CAN pins. The one that reads open has failed internally.\n3. If both terminators read 120 Ω individually but the bus reads 120 Ω overall, the backbone between them is open. Halve the harness between the two terminating modules, re-measuring from one end, until the break is between two adjacent connectors.\n4. Substitution test: temporarily fit a known 120 Ω resistor across the pair at the far end. If the bus reading returns to 60 Ω and the errors stop, the diagnosis is confirmed — but this is a test, not a repair.</p>\n<p><strong>What the scope confirms it:</strong> an under-terminated bus shows <strong>reflections</strong> — overshoot and ringing after each dominant-to-recessive transition, with the edges failing to settle cleanly before the next bit. Compare against a known-good capture: a correctly terminated bus at 500 kbit/s shows square, damped transitions with flat tops. The ringing is the physical evidence that the signal is bouncing off an unterminated end, and it is present even while co
