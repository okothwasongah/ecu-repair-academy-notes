el trims within ±5%, no boost leaks, correct service history, healthy DPF where fitted. <strong>A calibration change on a marginal engine converts a marginal engine into a broken one.</strong> Refuse the job otherwise.</li>\n<li><strong>Define the target.</strong> \"More power\" is not a target. \"Peak torque raised by 15% between 2,000 and 3,500 rpm while keeping EGT below 850 °C and lambda under load at 0.85\" is.</li>\n<li><strong>Baseline on the dynamometer with full logging</strong> — rpm, load, boost actual and target, ignition advance, knock retard per cylinder, lambda, intake air temperature, EGT, fuel rail pressure, injection timing and quantity.</li>\n<li><strong>Read and archive the original file</strong>, verified by two identical reads (Module 5 discipline).</li>\n<li><strong>Identify the ECU and load a proper definition</strong> — A2L or DAMOS if obtainable.</li>\n<li><strong>Make one coherent change at a time.</strong> Change fuelling and timing and boost simultaneously and you have no idea which one produced the result or the problem.</li>\n<li><strong>Write with correct checksum correction</strong>, using battery support (Module 6 discipline).</li>\n<li><strong>Re-log under identical conditions.</strong> Compare against baseline. Check specifically: knock retard, EGT, lambda under load, boost overshoot and recovery, and turbo speed if available.</li>\n<li><strong>Iterate</strong> — small steps, logged each time.</li>\n<li><strong>Heat-soak and durability testing</strong> — repeated full-load runs, not one clean pull. Faults appear on the third run, not the first.</li>\n<li><strong>Document and hand over:</strong> the before and after logs, the file archive, the changes made, the fuel grade required, and the maintenance implications.</li>\n</ol>\n<h3>2.9 Boundaries this module enforces</h3>\n<p>The following are not taught and not delivered on this programme:</p>\n<ul>\n<li><strong>Emissions-control defeat</strong> — EGR, DPF, SCR/AdBlue, lambda or OPF/GPF removal in software, and suppression of the resulting DTCs. This is defeat-device work: an offence under the US Clean Air Act §203, EU Regulation 715/2007 Art. 5(2), UK Construction &amp; Use and MOT rules, and caught by NEMA and inspection regimes elsewhere. It also destroys the commercial value of a calibration business, because payment processors, insurers and fleet customers will not work with a provider who does it.</li>\n<li><strong>Speed limiter removal on vehicles where the limiter is a legal requirement</strong> — heavy goods vehicles, buses and coaches under EU/UNECE and equivalent national rules.</li>\n<li><strong>Odometer alteration</strong> — a criminal offence essentially everywhere.</li>\n<li><strong>AdBlue emulators</strong> and equivalent hardware.</li>\n<li><strong>Calibration on an engine that has not passed a mechanical health check.</strong></li>\n</ul>\n<p>Students are taught to recognise these requests and to decline them plainly, and to explain the legitimate alternative — which for after-treatment complaints is Module 8, and is a better-paid, repeatable job.</p>\n<hr />\n<h2>3. Tools &amp; equipment needed</h2>\n<ul>\n<li><strong>Chassis dynamometer</strong> with load control, or a documented and repeatable road-load test route</li>\n<li>Wideband lambda measurement independent of the vehicle's own sensor</li>\n<li>EGT thermocouple and gauge</li>\n<li>Boost pressure and intake air temperature logging</li>\n<li>Data logging capable of at least 20 Hz on key channels</li>\n<li>WinOLS (or equivalent) with checksum modules for the families taught</li>\n<li>A2L/DAMOS files for the teaching vehicles — the institution must obtain these legitimately</li>\n<li>Flashing hardware from Module 6 with verified checksum support</li>\n<li>Battery support unit</li>\n<li>Compression and leak-down test equipment (health check is part of the process)</li>\n<li>Boost leak tester</li>\n</ul>\n<hr />\n<h2>4. Step-by-step practical lab exercise</h2>\n<h3>Lab 7.1 — Locate and read a map by hand</h3>\n<p><strong>Goal:</strong> find a 3D map in an unfamiliar binary without a definition file, and prove what you have found is a table.</p>\n<ol>\n<li>Open the binary in the hex editor. Record file size, and look for ASCII strings identifying the ECU.</li>\n<li>Determine the likely processor family and set the correct <strong>endianness</strong>. Verify by checking whether 16-bit values in candidate regions look plausible in both byte orders — one will look like data, one like noise.</li>\n<li>Search for <strong>monotonic sequences</strong> of 8–20 uint16 values that increase steadily. These are candidate axes. Engine speed axes often run from a few hundred to 6,000–7,000 in recognisable steps.</li>\n<li>Immediately after a candidate axis pair, examine the region for a block whose size equals <code>X count × Y count × data width</code>.</li>\n<li>View that block as a grid. A real map is <strong>smooth</strong> — values change gradually across both dimensions with no random jumps. Noise is not smooth. This smoothness test is the actual discriminator.</li>\n<li>Render as a 3D surface. A calibration map has recognisable shape: a torque or fuel map rises with load and has a plateau; a timing map peaks in the mid-load region and falls away at high load.</li>\n<li><strong>Record what you found and what you do NOT know.</strong> You have found a table. You do not know what it controls. Write both statements in the report.</li>\n<li>Now load the A2L for the same file and check your work. Note which candidates were real maps, which were something else entirely, and how confident your guess had been. <strong>This step is the whole point of the exercise.</strong></li>\n</ol>\n<h3>Lab 7.2 — Checksum verification and correction</h3>\n<ol>\n<li>Open a known file and compute the checksum over the defined region with the tool's standard module.</li>\n<li>Compare against the stored value. They should match on an unmodified file.</li>\n<li>Alter a single byte in the calibration region.</li>\n<li>Recompute. Observe the mismatch and note by how much.</li>\n<li>Apply the tool's correction and confirm the stored value updates.</li>\n<li>Repeat with an ECU family whose checksum is proprietary. Observe that the tool <strong>cannot</strong> compute it, and document that fact.</li>\n<li>Write a one-page reference for the workshop: for each ECU family the school works with, whether checksum correction is available in the editor, in the flash tool, or not at all. <strong>This document prevents the most expensive mistake in the discipline.</strong></li>\n</ol>\n<h3>Lab 7.3 — A documented calibration change on a dynamometer</h3>\n<ol>\n<li><strong>Health check.</strong> Compression or leak-down, boost leak test, full system scan, fuel trims, service history. Any failure ends the exercise — and that outcome is a pass, not a fail.</li>\n<li><strong>Define the written target</strong> with numeric limits for EGT, lambda under load and permitted knock retard.</li>\n<li><strong>Baseline runs:</strong> three consecutive full-load pulls with complete logging. Record ambient temperature and pressure. Discard the first run if the vehicle was not fully heat-soaked.</li>\n<li><strong>Read and archive</strong> the original file, two verified reads.</li>\n<li><strong>Load the definition</strong>, identify the maps to be changed, and record their current values.</li>\n<li><strong>Make one change.</strong> For example, raise boost target by a defined margin in a defined rpm window — nothing else.</li>\n<li><strong>Write with checksum correction</strong> and battery support.</li>\n<li><strong>Re-log under matched conditions.</strong> Compare against baseline, examining specifically:\n   - <strong>Knock retard per cylinder</strong> — any sustained retard means the change is beyond the fuel or the engine, and must be reversed.\n   - <strong>EGT</strong> against the written limit.\n   - <strong>Lambda under load</strong> — enrichment must track the added air.\n   - <strong>Boost overshoot and settling</strong> — a spike above target then recovery indicates the controller is not calibrated for the new target.</li>\n<li><strong>Iterate in small steps</strong>, logging every time. Reverse anything that produces knock.</li>\n<li><strong>Durability:</strong> five consecutive full-load runs with a heat soak, monitoring EGT and knock. Faults appear late.</li>\n<li><strong>Document and hand over</strong> the full record: baseline logs, final logs, changes made, archived original file, fuel grade required, and the written warnings from §2.7.</li>\n</ol>\n<hr />\n<h2>5. Common failure modes &amp; troubleshooting trees</h2>\n<h3>Tree A — Vehicle runs poorly after a calibration change</h3>\n<pre><code>Poor running post-flash\n├─ Did the file write completely and verify?\n│   → re-read the module and compare to what you intended to write\n├─ Was checksum correction applied correctly for this ECU family?\n│   → an accepted-but-wrong checksum can produce erratic behaviour\n├─ Are there knock retard events in the log?\n│   ├─ YES → the change exceeds the fuel grade or the engine's limit.\n│   │        REVERSE IT. Do not compensate by removing knock sensing.\n│   └─ NO → continue\n├─ Lambda under load leaner than target?\n│   → fuelling not keeping pace with added air. Check injector duty\n│     headroom and fuel pressure under load before adding boost.\n├─ Boost overshooting then dropping?\n│   → boost controller (PID/duty) not calibrated for the new target\n├─ Were adaptations reset after the flash?\n└─ Was the vehicle actually healthy before the change?\n    → this is the question that should have been answered first\n</code></pre>\n<h3>Tree B — Module rejects the written file</h3>\n<pre><code>Write rejected or module non-functional\n├─ Checksum: does the tool support this ECU family?\n│   → if not, the file cannot be safely written with it. Stop.\n├─ Was the correct file written to the correct address range?\n├─ Was the write interrupted? → Module 6 recovery ladder\n├─ Was the file for the right hardware AND software version?\n│   → a matching part number does not guarantee a matching build\n└─ Restore the archived original and verify the module returns to\n   normal before attempting anything else\n</code></pre>\n<h3>Tree C — Repeat mechanical failures on a modified vehicle</h3>\n<pre><code>Modified vehicle failing components\n├─ Clutch / DMF / gearbox → torque exceeds driveline margin.\n│   The calibration must be reduced, not the symptom ignored.\n├─ Turbo failure → check for overspeed (boost target vs compressor map),\n│   oil supply condition and service interval compliance\n├─ Piston/ring land damage → knock. Review logs for retard events\n│   and fuel grade actually used by the customer.\n├─ DPF loading rapidly → added fuelling increases soot. If the\n│   calibration raised smoke limits, that is the cause.\n├─ EGT-related failures → the limit was exceeded. Reduce fuelling\n│   at the top end.\n└─ In every case: the correct response is a calibration that respects\n   the limit, never the removal of the protection that reported it\n</code></pre>\n<h3>Frequently seen real-world failures</h3>\n<table>\n<thead>\n<tr>\n<th>Failure</th>\n<th>Cause</th>\n<th>Prevention</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Piston damage</td>\n<td>Knock ignored or knock protection weakened</td>\n<td>Log knock retard; reverse changes that produce it</td>\n</tr>\n<tr>\n<td>Turbo failure shortly after tuning</td>\n<td>Overspeed outside the compressor map</td>\n<td>Check the map; limit boost at low flow</td>\n</tr>\n<tr>\n<td>Clutch/DMF failure</td>\n<td>Torque beyond driveline margin</td>\n<td>Warn in writing; limit torque in low gears</td>\n</tr>\n<tr>\n<td>Melted piston crown / valve damage</td>\n<td>Lean under load, EGT unmanaged</td>\n<td>Independent wideband and EGT logging</td>\n</tr>\n<tr>\n<td>Module refuses to run</td>\n<td>Wrong or uncorrected checksum</td>\n<td>Verify family support before opening the file</td>\n</tr>\n<tr>\n<td>Generic file, wrong hardware</td>\n<td>File bought online, not matched</td>\n<td>Match hardware and software numbers, never part number alone</td>\n</tr>\n<tr>\n<td>Vehicle fails inspection</td>\n<td>Emissions-relevant change</td>\n<td>Do not make emissions-defeat changes</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>6. Student knowledge check</h2>\n<h3>Practical scenario challenges</h3>\n<p><strong>Scenario 1 — The file from the internet.</strong>\nA customer has purchased a \"Stage 2\" file online for £60 for their turbo diesel and asks the workshop to flash it. They supply the file. The part number in the filename matches their ECU. They are impatient and say another garage will do it if you will not.\n<em>Task:</em> State your decision and the technical reasons behind it. List everything you cannot know about that file, and describe what a defensible alternative offer would look like.</p>\n<p><strong>Scenario 2 — The fleet operator.</strong>\nA haulage operator with 18 light commercial vehicles asks for calibrations to improve fuel economy. They mention that a competitor offered to \"turn off the AdBlue and EGR\" to cut running costs and reduce breakdowns, and asks what you would do instead.\n<em>Task:</em> Give the answer you would give the operator. Explain what you would decline and why in commercial terms they will care about, and set out a legitimate programme that addresses their actual problem — running costs and downtime.</p>\n<hr />\n<h2>7. Answer key</h2>\n<p><strong>Scenario 1 model answer.</strong></p>\n<p><strong>Decision: decline to flash the supplied file.</strong> Offer a defensible alternative instead.</p>\n<p><strong>What you cannot know about that file:</strong>\n1. <strong>Whether it matches this exact vehicle's hardware and software build.</strong> A part number match is not a build match — the same ECU part number is used across engine variants, gearbox combinations, market emissions levels and multiple software revisions. Writing a file developed against a different build produces mismatched behaviour that may take months to surface.\n2. <strong>What was actually changed in it.</strong> Without a definition and a comparison against the original, the file's contents are unknown. It may include raised smoke limits, disabled protections, altered torque limiters, or emissions-defeat changes the customer has not been told about — which would make the vehicle non-compliant and put your workshop's name on the work.\n3. <strong>Whether any of it was validated on a vehicle at all.</strong> Many files sold at that price are generic offsets applied to a base map, never run on an engine.\n4. <strong>Whether the checksums are correct</strong> for this ECU family, and whether your flash tool can correct them if not.\n5. <strong>Whether the engine can take it</strong> — nothing about the file accounts for this vehicle's compression, turbo condition, injector wear, DPF loading or driveline state.\n6. <strong>Who is liable when it fails.</strong> You are, because you wrote it. The seller is anonymous and offshore; the customer will come to the workshop that flashed the file.</p>\n<p><strong>A defensible alternative offer:</strong>\n- Charge for a <strong>health check first</strong>: compression or leak-down, boost leak test, full scan, trim analysis, DPF status. Give the customer the result regardless of whether they proceed.\n- If healthy, offer a <strong>calibration developed on the dynamometer</strong> against measured data for their vehicle, with baseline and final logs supplied, the original file archived, and written documentation of what was changed.\n- Price it honestly against the £60 file and explain the difference is measurement and liability, not markup.\n- Provide the written warnings: warranty, insurance declaration, driveline consumables, fuel grade.\n- If the customer still wants the £60 file, let them go to the other garage — politely, and note the conversation. Say plainly that you would rather lose the job than put your name on an unknown file. That sentence wins as many customers as it loses.</p>\n<p><strong>Scenario 2 model answer.</strong></p>\n<p><strong>What I would decline, and why in commercial terms:</strong></p>\n<p>Turning off AdBlue and EGR is defeat-device work. Beyond being unlawful in every market these vehicles operate in, the operator should care about it for reasons that hit their balance sheet:</p>\n<ul>\n<li><strong>Roadside enforcement and inspection.</strong> Emissions-defeat modifications are detectable at inspection and increasingly at the roadside. A prohibition notice takes a vehicle off the road immediately — the downtime they are trying to avoid, arriving all at once and at the worst moment.</li>\n<li><strong>Insurance and O-licence exposure.</strong> An undeclared modification to an emissions system gives an insurer grounds to dispute a claim, and puts operator licensing at risk.</li>\n<li><strong>Resale value.</strong> A fleet of vehicles with tampered emissions systems is difficult to sell to any buyer who checks, and returning them to compliance costs more than the components ever saved.</li>\n<li><strong>Contract eligibility.</strong> Increasing numbers of shippers, councils and prime contractors require emissions compliance from their subcontractors. A modified fleet quietly loses tenders.</li>\n<li><strong>It does not fix the cause.</strong> If AdBlue and EGR systems keep failing, something is producing the failure — and removing the warning does not remove the underlying condition, which usually keeps degrading.</li>\n</ul>\n<p><strong>The legitimate programme that addresses their real problem:</strong></p>\n<ol>\n<li><strong>Diagnose why the after-treatment is failing</strong> (Module 8 work). Repeated DPF loading and SCR faults on a light commercial fleet almost always trace back to duty cycle — short journeys, heavy idling, never reaching the temperature a passive regeneration needs — plus specific correctable faults: leaking injectors, a failing turbo seal, a stuck EGR cooler, poor-quality DEF, or a differential pressure sensor reading wrong.</li>\n<li><strong>Fleet duty-cycle analysis.</strong> Log the vehicles. If they are doing 6 km urban runs, the answer is route and vehicle allocation, not calibration. Moving the two worst-affected vehicles to the longest routes can eliminate the problem outright at no cost.</li>\n<li><strong>Scheduled forced regeneration and DEF quality management</strong> rather than reactive breakdowns — a planned 45-minute service event beats an unplanned recovery.</li>\n<li><strong>Driver training</strong> — idle discipline, gear selection and route behaviour move fleet fuel consumption by 5–12%, which is usually more than any calibration would have delivered.</li>\n<li><strong>Preventive after-treatment servicing</strong> — filter cleaning on a schedule, differential pressure sensor line checks, DEF injector servicing, at a fixed cost per vehicle per year.</li>\n<li><strong>Where calibration genuinely helps:</strong> road speed limiting, torque limiting in low gears, PTO and idle shutdown settings — all manufacturer-supported parameters on most commercial platforms, all lawful, and all with a measurable fuel effect.</li>\n<li><strong>Offer a fleet contract</strong> covering items 3–6 at a fixed annual price per vehicle. This is recurring revenue for the workshop and predictable cost for the operator — which is what they actually want, since their complaint is not really about emissions systems, it is about unpredictable downtime.</li>\n</ol>\n<p>Put in one sentence to the operator: the competitor is offering to remove the warning light, and you are offering to remove the cause, on a contract that makes the cost predictable.</p>", "quiz": [{"q": "Peak cylinder pressure should occur at approximately:", "options": [{"k": "A", "t": "TDC exactly"}, {"k": "B", "t": "12–16° after TDC"}, {"k": "C", "t": "40° after TDC"}, {"k": "D", "t": "20° before TDC"}], "answer": "B", "why": "Peak pressure at roughly 12–16° after TDC gives the best leverage on the crank. Earlier peaks fight the rising piston and raise knock risk; later peaks waste expansion work."}, {"q": "A flash binary contains no A2L or DAMOS. A tool reports it has located \"the boost map\". The correct interpretation is:", "options": [{"k": "A", "t": "The tool has read the map's name from the file"}, {"k": "B", "t": "The tool has found a table-shaped structure and guessed its function; the name is not in the file"}, {"k": "C", "t": "The file must be corrupt"}, {"k": "D", "t": "The map is confirmed and safe to edit"}], "answer": "B", "why": "A flash binary carries no symbol names. Only an A2L or DAMOS names maps. Anything else is structural pattern-matching plus a guess, and the guess can be wrong."}, {"q": "Logs after a boost increase show sustained knock retard on cylinder 3 at full load. The correct action is:", "options": [{"k": "A", "t": "Advance timing further to compensate"}, {"k": "B", "t": "Reduce the change until knock retard disappears"}, {"k": "C", "t": "Reduce the knock sensor sensitivity in the calibration"}, {"k": "D", "t": "Enrich the mixture and leave the boost as it is"}], "answer": "B", "why": "Knock retard is the engine's protection reporting that combustion is beyond its limit for the current fuel and conditions. Reducing the change is the only correct response. Advancing timing or desensitising knock detection removes the protection while leaving the cause, which is how pistons are destroyed."}, {"q": "A calibration editor cannot compute the checksum for a modern EDC17 file. This means:", "options": [{"k": "A", "t": "The file is corrupt"}, {"k": "B", "t": "The algorithm is proprietary and undocumented; the flashing hardware must apply correction on write, and if it cannot, the file must not be written"}, {"k": "C", "t": "The ECU does not use checksums"}, {"k": "D", "t": "The endianness is wrong"}], "answer": "B", "why": "Modern Bosch, Delphi, Siemens and Denso checksums are undocumented. Correction must come from the flashing hardware. If neither editor nor flash tool supports that family, the file cannot be written safely and the job must be declined."}, {"q": "Before any calibration change, the mandatory first step is:", "options": [{"k": "A", "t": "Read the file"}, {"k": "B", "t": "Book the dynamometer"}, {"k": "C", "t": "Confirm the engine is mechanically healthy — compression/leak-down, no codes, trims within tolerance, no boost leaks"}, {"k": "D", "t": "Agree the price"}], "answer": "C", "why": "A calibration change increases the stress on every component. An engine that is marginal — low compression, a boost leak, worn injectors, a loaded DPF — will fail under it. Confirming mechanical health first is what separates a calibration business from a liability."}], "search": " Module 7 — ECU Mapping, Engine Tuning & Calibration Hours: 60 (24 lecture / 36 bench and dyno) Prerequisite: Modules 5 and 6 signed off. 1. Module overview & learning objectives Calibration work is where the most damage is done in this trade, because the tools are cheap, the internet is confident, and the consequences arrive six months later as a failed turbo, a cracked piston or a burnt clutch. This module teaches the physics first, the file format second, and the editing last — deliberately in that order. By the end of the module the student can: 7.1 State the combustion, thermal and mechanical limits that constrain every calibration change. 7.2 Identify an ECU from a binary file and locate its map regions. 7.3 Read 2D and 3D map structures in hex, determine axes, scaling factors and offsets. 7.4 Calculate and correct checksums, and explain when a tool cannot. 7.5 Plan a calibration change with a defined target, a measured baseline and a verification method. 7.6 Recognise and refuse work that cannot be delivered safely or lawfully. 2. Comprehensive theory & lecture notes 2.1 The physics that constrains everything Air-fuel ratio and lambda. Stoichiometric AFR for petrol is approximately 14.7:1 by mass. Lambda expresses the ratio to stoichiometric: λ = actual AFR / stoichiometric AFR λ AFR (petrol) Condition 1.00 14.7:1 Stoichiometric — catalyst operating window 0.85–0.90 12.5–13.2:1 Rich — maximum power, cooling under load 0.78–0.82 11.5–12.1:1 Very rich — turbo protection, exhaust temperature control 1.05–1.10 15.4–16.2:1 Lean — economy cruise, raises combustion temperature Fuel differences matter: E85 stoichiometric is approximately 9.8:1 , diesel approximately 14.6:1 but diesels run heavily lean overall (λ 1.2–6.0 depending on load) because they are load-controlled by fuelling rather than by throttling. Why lean is dangerous under load: peak combustion temperature rises as mixture approaches slightly lean of stoichiometric, then falls again. Under high load, a lean mixture raises exhaust gas temperature and piston crown temperature toward the material limits. Enrichment under load is not waste; it is cooling. Knock (detonation). Normal combustion is a flame front propagating from the spark. Knock is spontaneous auto-ignition of end gas ahead of the flame front, producing a pressure spike and a characteristic ringing. It destroys pistons, ring lands and head gaskets. Its likelihood rises with: - Higher cylinder pressure (more boost, higher compression) - Higher charge temperature (hot intake air, ineffective intercooling) - Advanced ignition timing - Lower fuel octane - Lean mixture Ignition timing exists to place peak cylinder pressure at the optimum crank angle — typically 12–16° after TDC . Advancing timing moves peak pressure earlier and raises it; retarding moves it later and lowers it. MBT (minimum advance for best torque) is the point beyond which further advance produces no more torque. On most modern engines under load, the limit reached is knock, not MBT — the engine is knock-limited , and advancing timing past that point buys nothing and costs a piston. Boost and airflow. Torque follows trapped air mass. Adding boost adds air mass, which requires proportional fuel and appropriate timing. Constraints: - Compressor surge at low flow / high pressure ratio, and choke at the map's right edge. Running a turbo outside its map produces heat instead of pressure. - Turbine and exhaust gas temperature , typically limited to 950–1,050 °C pre-turbine on petrol. - Charge air temperature — every 10 °C rise reduces density and raises knock risk. Diesel-specific limits: - Smoke limit — fuel beyond the available oxygen produces particulate, not torque. The smoke map exists for a reason. - Exhaust gas temperature — turbine and after-treatment limits. - Peak cylinder pressure — diesels run close to their mechanical limit from the factory. Adding fuel and boost moves toward rod and bearing limits quickly. - After-treatment loading — more fuel means more soot means faster DPF loading and more frequent regeneration. Driveline limits. The gearbox, clutch, driveshafts and differential were specified for the factory torque figure with a margin. A calibration that adds 40% torque does not add 40% margin. Dual-mass flywheels, DSG clutch packs and manual clutches are the usual first casualties, and the customer is rarely told before the job. 2.2 What is actually in an ECU file A binary flash dump contains: Region Contents Bootloader Startup and programming code; usually protected Application code The compiled program — control logic Calibration data The maps and constants — the only region a calibrator touches Identification Part numbers, software versions, hardware ID Checksums Integrity values over defined regions Free/fill space Typically 0xFF or 0x00 runs Critical distinction: calibration data is data ; application code is logic . Editing calibration changes the values the program uses. Editing code changes what the program does — and is not calibration work. 2.3 Identifying the ECU from the file Before any map can be found, the ECU must be identified. Evidence available inside the binary: File size — narrows the flash device and processor family (512 KB, 1 MB, 2 MB, 4 MB, 8 MB). ASCII identifier strings — Bosch part numbers ( 0281... , 0261... ), hardware numbers, software versions, sometimes the VIN, sometimes an ECU family string. Processor markers and vector tables — TriCore, SPC5/MPC5, C167/ST10 each leave recognisable structures at known offsets. Endianness — big-endian on Power Architecture, little-endian on TriCore in most automotive builds. Getting this wrong makes every 16-bit value nonsense. Segment base address — the CPU address space and the file offset differ by a constant. Establishing that base is what makes an A2L's addresses resolve to file positions. Family Typical processor Typical application Bosch EDC15 C167 Older diesel Bosch EDC16 ST10 / TriCore Mid-2000s diesel Bosch EDC17 TriCore TC17xx/TC17xx Modern diesel Bosch MED17 / MEVD17 TriCore Modern direct-injection petrol Bosch MD1 / MG1 AURIX TC2xx/TC3xx Latest generation Continental SIMOS / PCR2.1 MPC5xxx / TriCore VAG petrol and diesel Delphi DCM / CRD MPC5xxx PSA, GM, Hyundai diesel Magneti Marelli MJD / IAW ST10 / MPC FCA Denso SH / RH850 Japanese OEMs 2.4 Map structure A map is a lookup table. Given one or two input values, the ECU interpolates a stored output. 2D map (curve): one axis, one output row. Example: boost target versus engine speed; injection quantity limit versus rpm. 3D map (table): two axes, a grid of outputs. Example: ignition advance indexed by engine speed and load; injection quantity indexed by rpm and pedal position. Anatomy in the binary: [X axis] 16 values, monotonically increasing ─┐ [Y axis] 12 values, monotonically increasing ─┼─► often stored adjacent [Data] 16 × 12 = 192 values ─┘ to the data block Data types: Type Size Range Note uint8 1 byte 0–255 Common in older ECUs, coarse resolution int8 1 byte −128 to 127 Timing corrections, trims uint16 2 bytes 0–65,535 Most common in modern ECUs int16 2 bytes −32,768 to 32,767 Signed corrections float32 4 bytes — Rare in flash calibration, common in RAM Scaling: raw values are converted to physical units by physical = (raw × factor) + offset . Example: a boost map storing 0.1 mbar per bit with offset 0. A raw value of 18,000 becomes 1,800 mbar absolute = 800 mbar gauge ≈ 0.8 bar boost. Get the factor wrong by a decade and you will \"reduce boost\" by a factor of ten and wonder why the car has no power. Example: a timing map with factor 0.75 and offset −48. Raw 96 becomes (96 × 0.75) − 48 = 24° advance. How maps are found in practice, in order of reliability: A2L / ASAP2 file — the manufacturer's own description of the calibration: names, addresses, record layouts, conversion methods, axis descriptions. With an A2L, every map is named and scaled correctly. This is the only fully reliable method. DAMOS — Bosch's format, containing the same information plus more; converted to A2L for most tools. Map packs / definition files — third-party definitions for a known file. Reliable only if the file matches exactly. Pattern recognition — searching for monotonic axis sequences and then scoring adjacent regions for table-like smoothness. This finds structures but never tells you what they control. The point students must accept: without an A2L or DAMOS, no tool can name a map . A flash binary carries no symbol names. Any tool that claims to identify \"the boost map\" on an unknown file is pattern-matching and guessing, and the consequence of a wrong guess is written on a piston. 2.5 Checksums The module verifies calibration integrity before running. Change a byte, and the stored checksum no longer matches the computed one. Common schemes: - Additive/sum over a region, stored as 16 or 32-bit. - CRC-16 / CRC-32 with defined polynomial, seed and region. - Multiple nested checksums — modern ECUs may carry a dozen, some covering other checksums. - Proprietary — Bosch EDC17/MED17, Delphi, Siemens and Denso modern families use undocumented algorithms. Practical consequences: - A calibration editor can compute standard checksums. It cannot compute undocumented proprietary ones. - Flashing hardware applies the correct correction on write for the families it supports. - Verify the tool chain supports checksum correction for that exact ECU family before opening the file. Writing a file with a wrong checksum produces a module that refuses to run, or runs and immediately flags an internal fault — and on some platforms enters a state requiring boot recovery. 2.6 Software Tool Role WinOLS Industry-standard calibration editor: hex view, map definition, 2D/3D visualisation, checksum modules, project management, A2L/DAMOS import ECM Titanium Editor with a driver (definition) library — convenient, but only as good as the driver for your exact file TunerPro Free editor using XDF definitions; strong in the older OBD-I/OBD-II and enthusiast space A2L/DAMOS handling Vector CANape, ETAS INCA, and the import functions in the above Data logging The manufacturer tool, or a J2534/CAN logger — logging is not optional 2.7 \"Stage\" terminology — what it actually means The industry's Stage 1/2/3 language is marketing shorthand, not a specification. Taught honestly: Stage 1 — calibration change only, on a completely standard vehicle. Realistic gains come from the manufacturer's deliberate conservatism: emissions margin across all markets and fuel qualities, durability margin across the warranty period and worst-case duty cycles, and product positioning between model variants. Stage 2 — calibration change accompanying specific hardware: intake, exhaust, intercooler, sometimes a hybrid turbo. The calibration must be developed against the actual hardware fitted, not selected from a list. Custom / bespoke — developed on a dynamometer against measured data for that specific vehicle, with the results logged and documented. What must be said to every customer, in writing: 1. A calibration change will void the powertrain warranty and is detectable by the manufacturer through calibration verification numbers and internal counters. 2. It must be declared to the insurer. An undeclared modification is grounds for refusing a claim. 3. Emissions-relevant changes may make the vehicle non-compliant and fail inspection. 4. Driveline components have finite margin, and clutches, dual-mass flywheels and gearboxes are consumables under increased torque. 5. A generic file bought online and flashed without measurement is a gamble with the customer's engine. 2.8 A defensible calibration process The programme teaches this sequence and marks against it: Establish the vehicle is healthy first. Compression or leak-down, full system scan with no pending codes, fuel trims within ±5%, no boost leaks, correct service history, healthy DPF where fitted. A calibration change on a marginal engine converts a marginal engine into a broken one. Refuse the job otherwise. Define the target. \"More power\" is not a target. \"Peak torque raised by 15% between 2,000 and 3,500 rpm while keeping EGT below 850 °C and lambda under load at 0.85\" is. Baseline on the dynamometer with full logging — rpm, load, boost actual and target, ignition advance, knock retard per cylinder, lambda, intake air temperature, EGT, fuel rail pressure, injection timing and quantity. Read and archive the original file , verified by two identical reads (Module 5 discipline). Identify the ECU and load a proper definition — A2L or DAMOS if obtainable. Make one coherent change at a time. Change fuelling and timing and boost simultaneously and you have no idea which one produced the result or the problem. Write with correct checksum correction , using battery support (Module 6 discipline). Re-log under identical conditions. Compare against baseline. Check specifically: knock retard, EGT, lambda under load, boost overshoot and recovery, and turbo speed if available. Iterate — small steps, logged each time. Heat-soak and durability testing — repeated full-load runs, not one clean pull. Faults appear on the third run, not the first. Document and hand over: the before and after logs, the file archive, the changes made, the fuel grade required, and the maintenance implications. 2.9 Boundaries this module enforces The following are not taught and not delivered on this programme: Emissions-control defeat — EGR, DPF, SCR/AdBlue, lambda or OPF/GPF removal in software, and suppression of the resulting DTCs. This is defeat-device work: an offence under the US Clean Air Act §203, EU Regulation 715/2007 Art. 5(2), UK Construction & Use and MOT rules, and caught by NEMA and inspection regimes elsewhere. It also destroys the commercial value of a calibration business, because payment processors, insurers and fleet customers will not work with a provider who does it. Speed limiter removal on vehicles where the limiter is a legal requirement — heavy goods vehicles, buses and coaches under EU/UNECE and equivalent national rules. Odometer alteration — a criminal offence essentially everywhere. AdBlue emulators and equivalent hardware. Calibration on an engine that has not passed a mechanical health check. Students are taught to recognise these requests and to decline them plainly, and to explain the legitimate alternative — which for after-treatment complaints is Module 8, and is a better-paid, repeatable job. 3. Tools & equipment needed Chassis dynamometer with load control, or a documented and repeatable road-load test route Wideband lambda measurement independent of the vehicle's own sensor EGT thermocouple and gauge Boost pressure and intake air temperature logging Data logging capable of at least 20 Hz on key channels WinOLS (or equivalent) with checksum modules for the families taught A2L/DAMOS files for the teaching vehicles — the institution must obtain these legitimately Flashing hardware from Module 6 with verified checksum support Battery support unit Compression and leak-down test equipment (health check is part of the process) Boost leak tester 4. Step-by-step practical lab exercise Lab 7.1 — Locate and read a map by hand Goal: find a 3D map in an unfamiliar binary without a definition file, and prove what you have found is a table. Open the binary in the hex editor. Record file size, and look for ASCII strings identifying the ECU. Determine the likely processor family and set the correct endianness . Verify by checking whether 16-bit values in candidate regions look plausible in both byte orders — one will look like data, one like noise. Search for monotonic sequences of 8–20 uint16 values that increase steadily. These are candidate axes. Engine speed axes often run from a few hundred to 6,000–7,000 in recognisable steps. Immediately after a candidate axis pair, examine the region for a block whose size equals X count × Y count × data width . View that block as a grid. A real map is smooth — values change gradually across both dimensions with no random jumps. Noise is not smooth. This smoothness test is the actual discriminator. Render as a 3D surface. A calibration map has recognisable shape: a torque or fuel map rises with load and has a plateau; a timing map peaks in the mid-load region and falls away at high load. Record what you found and what you do NOT know. You have found a table. You do not know what it controls. Write both statements in the report. Now load the A2L for the same file and check your work. Note which candidates were real maps, which were something else entirely, and how confident your guess had been. This step is the whole point of the exercise. Lab 7.2 — Checksum verification and correction Open a known file and compute the checksum over the defined region with the tool's standard module. Compare against the stored value. They should match on an unmodified file. Alter a single byte in the calibration region. Recompute. Observe the mismatch and note by how much. Apply the tool's correction and confirm the stored value updates. Repeat with an ECU family whose checksum is proprietary. Observe that the tool cannot compute it, and document that fact. Write a one-page reference for the workshop: for each ECU family the school works with, whether checksum correction is available in the editor, in the flash tool, or not at all. This document prevents the most expensive mistake in the discipline. Lab 7.3 — A documented calibration change on a dynamometer Health check. Compression or leak-down, boost leak test, full system scan, fuel trims, service history. Any failure ends the exercise — and that outcome is a pass, not a fail. Define the written target with numeric limits for EGT, lambda under load and permitted knock retard. Baseline runs: three consecutive full-load pulls with complete logging. Record ambient temperature and pressure. Discard the first run if the vehicle was not fully heat-soaked. Read and archive the original file, two verified reads. Load the definition , identify the maps to be changed, and record their current values. Make one change. For example, raise boost target by a defined margin in a defined rpm window — nothing else. Write with checksum correction and battery support. Re-log under matched conditions. Compare against baseline, examining specifically: - Knock retard per cylinder — any sustained retard means the change is beyond the fuel or the engine, and must be reversed. - EGT against the written limit. - Lambda under load — enrichment must track the added air. - Boost overshoot and settling — a spike above target then recovery indicates the controller is not calibrated for the new target. Iterate in small steps , logging every time. Reverse anything that produces knock. Durability: five consecutive full-load runs with a heat soak, monitoring EGT and knock. Faults appear late. Document and hand over the full record: baseline logs, final logs, changes made, archived original file, fuel grade required, and the written warnings from §2.7. 5. Common failure modes & troubleshooting trees Tree A — Vehicle runs poorly after a calibration change Poor running post-flash ├─ Did the file write completely and verify? │ → re-read the module and compare to what you intended to write ├─ Was checksum correction applied correctly for this ECU family? │ → an accepted-but-wrong checksum can produce erratic behaviour ├─ Are there knock retard events in the log? │ ├─ YES → the change exceeds the fuel grade or the engine's limit. │ │ REVERSE IT. Do not compensate by removing knock sensing. │ └─ NO → continue ├─ Lambda under load leaner than target? │ → fuelling not keeping pace with added air. Check injector duty │ headroom and fuel pressure under load before adding boost. ├─ Boost overshooting then dropping? │ → boost controller (PID/duty) not calibrated for the new target ├─ Were adaptations reset after the flash? └─ Was the vehicle actually healthy before the change? → this is the question that should have been answered first Tree B — Module rejects the written file Write rejected or module non-functional ├─ Checksum: does the tool support this ECU family? │ → if not, the file cannot be safely written with it. Stop. ├─ Was the correct file written to the correct address range? ├─ Was the write interrupted? → Module 6 recovery ladder ├─ Was the file for the right hardware AND software version? │ → a matching part number does not guarantee a matching build └─ Restore the archived original and verify the module returns to normal before attempting anything else Tree C — Repeat mechanical failures on a modified vehicle Modified vehicle failing components ├─ Clutch / DMF / gearbox → torque exceeds driveline margin. │ The calibration must be reduced, not the symptom ignored. ├─ Turbo failure → check for overspeed (boost target vs compressor map), │ oil supply condition and service interval compliance ├─ Piston/ring land damage → knock. Review logs for retard events │ and fuel grade actually used by the customer. ├─ DPF loading rapidly → added fuelling increases soot. If the │ calibration raised smoke limits, that is the cause. ├─ EGT-related failures → the limit was exceeded. Reduce fuelling │ at the top end. └─ In every case: the correct response is a calibration that respects the limit, never the removal of the protection that reported it Frequently seen real-world failures Failure Cause Prevention Piston damage Knock ignored or knock protection weakened Log knock retard; reverse changes that produce it Turbo failure shortly after tuning Overspeed outside the compressor map Check the map; limit boost at low flow Clutch/DMF failure Torque beyond driveline margin Warn in writing; limit torque in low gears Melted piston crown / valve damage Lean under load, EGT unmanaged Independent wideband and EGT logging Module refuses to run Wrong or uncorrected checksum Verify family support before opening the file Generic file, wrong hardware File bought online, not matched Match hardware and software numbers, never part number alone Vehicle fails inspection Emissions-relevant change Do not make emissions-defeat changes 6. Student knowledge check Practical scenario challenges Scenario 1 — The file from the internet. A customer has purchased a \"Stage 2\" file online for £60 for their turbo diesel and asks the workshop to flash it. They supply the file. The part number in the filename matches their ECU. They are impatient and say another garage will do it if you will not. Task: State your decision and the technical reasons behind it. List everything you cannot know about that file, and describe what a defensible alternative offer would look like. Scenario 2 — The fleet operator. A haulage operator with 18 light commercial vehicles asks for calibrations to improve fuel economy. They mention that a competitor offered to \"turn off the AdBlue and EGR\" to cut running costs and reduce breakdowns, and asks what you would do instead. Task: Give the answer you would give the operator. Explain what you would decline and why in commercial terms they will care about, and set out a legitimate programme that addresses their actual problem — running costs and downtime. 7. Answer key Scenario 1 model answer. Decision: decline to flash the supplied file. Offer a defensible alternative instead. What you cannot know about that file: 1. Whether it matches this exact vehicle's hardware and software build. A part number match is not a build match — the same ECU part number is used across engine variants, gearbox combinations, market emissions levels and multiple software revisions. Writing a file developed against a different build produces mismatched behaviour that may take months to surface. 2. What was actually changed in it. Without a definition and a comparison against the original, the file's contents are unknown. It may include raised smoke limits, disabled protections, altered torque limiters, or emissions-defeat changes the customer has not been told about — which would make the vehicle non-compliant and put your workshop's name on the work. 3. Whether any of it was validated on a vehicle at all. Many files sold at that price are generic offsets applied to a base map, never run on an engine. 4. Whether the checksums are correct for this ECU family, and whether your flash tool can correct them if not. 5. Whether the engine can take it — nothing about the file accounts for this vehicle's compression, turbo condition, injector wear, DPF loading or driveline state. 6. Who is liable when it fails. You are, because you wrote it. The seller is anonymous and offshore; the customer will come to the workshop that flashed the file. A defensible alternative offer: - Charge for a health check first : compression or leak-down, boost leak test, full scan, trim analysis, DPF status. Give the customer the result regardless of whether they proceed. - If healthy, offer a calibration developed on the dynamometer against measured data for their vehicle, with baseline and final logs supplied, the original file archived, and written documentation of what was changed. - Price it honestly against the £60 file and explain the difference is measurement and liability, not markup. - Provide the written warnings: warranty, insurance declaration, driveline consumables, fuel grade. - If the customer still wants the £60 file, let them go to the other garage — politely, and note the conversation. Say plainly that you would rather lose the job than put your name on an unknown file. That sentence wins as many customers as it loses. Scenario 2 model answer. What I would decline, and why in commercial terms: Turning off AdBlue and EGR is defeat-device work. Beyond being unlawful in every market these vehicles operate in, the operator should care about it for reasons that hit their balance sheet: Roadside enforcement and inspection. Emissions-defeat modifications are detectable at inspection and increasingly at the roadside. A prohibition notice takes a vehicle off the road immediately — the downtime they are trying to avoid, arriving all at once and at the worst moment. Insurance and O-licence exposure. An undeclared modification to an emissions system gives an insurer grounds to dispute a claim, and puts operator licensing at risk. Resale value. A fleet of vehicles with tampered emissions systems is difficult to sell to any buyer who checks, and returning them to compliance costs more than the components ever saved. Contract eligibility. Increasing numbers of shippers, councils and prime contractors require emissions compliance from their subcontractors. A modified fleet quietly loses tenders. It does not fix the cause. If AdBlue and EGR systems keep failing, something is producing the failure — and removing the warning does not remove the underlying condition, which usually keeps degrading. The legitimate programme that addresses their real problem: Diagnose why the after-treatment is failing (Module 8 work). Repeated DPF loading and SCR faults on a light commercial fleet almost always trace back to duty cycle — short journeys, heavy idling, never reaching the temperature a passive regeneration needs — plus specific correctable faults: leaking injectors, a failing turbo seal, a stuck EGR cooler, poor-quality DEF, or a differential pressure sensor reading wrong. Fleet duty-cycle analysis. Log the vehicles. If they are doing 6 km urban runs, the answer is route and vehicle allocation, not calibration. Moving the two worst-affected vehicles to the longest routes can eliminate the problem outright at no cost. Scheduled forced regeneration and DEF quality management rather than reactive breakdowns — a planned 45-minute service event beats an unplanned recovery. Driver training — idle discipline, gear selection and route behaviour move fleet fuel consumption by 5–12%, which is usually more than any calibration would have delivered. Preventive after-treatment servicing — filter cleaning on a schedule, differential pressure sensor line checks, DEF injector servicing, at a fixed cost per vehicle per year. Where calibration genuinely helps: road speed limiting, torque limiting in low gears, PTO and idle shutdown settings — all manufacturer-supported parameters on most commercial platforms, all lawful, and all with a measurable fuel effect. Offer a fleet contract covering items 3–6 at a fixed annual price per vehicle. This is recurring revenue for the workshop and predictable cost for the operator — which is what they actually want, since their complaint is not really about emissions systems, it is about unpredictable downtime. Put in one sentence to the operator: the competitor is offering to remove the warning light, and you are offering to remove the cause, on a contract that makes the cost predictable. ", "words": 4629}, {"id": "module-8-emissions-after-treatment", "label": "Module 8", "title": "Emissions & after-treatment", "colour": "#5C5F66", "html": "<h1>Module 8 — Exhaust Emissions Systems: Diagnostics, Regeneration &amp; Repair</h1>\n<p><strong>Hours:</strong> 40 (16 lecture / 24 workshop)\n<strong>Prerequisite:</strong> Modules 1–4 signed off.</p>\n<hr />\n<h2>1. Module overview &amp; learning objectives</h2>\n<p>After-treatment is the highest-volume diagnostic work in most commercial workshops, and the most badly handled. The default trade response to a DPF light is to remove the filter or delete it in software. This module teaches the opposite discipline: <strong>a loaded DPF is a symptom, and the cause is almost always findable and fixable.</strong> A workshop that can find the cause has repeat fleet business; one that deletes has a one-off cash job and a vehicle that fails its next inspection.</p>\n<p>By the end of the module the student can:</p>\n<ul>\n<li><strong>8.1</strong> Describe DPF, SCR, EGR and GPF/OPF architecture and control strategy.</li>\n<li><strong>8.2</strong> Interpret soot and ash loading, differential pressure and regeneration counters.</li>\n<li><strong>8.3</strong> Perform static and dynamic forced regeneration safely, and know when not to.</li>\n<li><strong>8.4</strong> Diagnose the <strong>underlying cause</strong> of repeat loading rather than treating the filter.</li>\n<li><strong>8.5</strong> Test differential pressure sensors, EGT sensors, NOx sensors, EGR valves and SCR dosing systems.</li>\n<li><strong>8.6</strong> Advise a customer or fleet correctly on repair options, cost and legal position.</li>\n</ul>\n<h3>Scope boundary</h3>\n<p>This module covers diagnosis, regeneration, hardware repair, filter cleaning and restoration to correct OEM function. It does <strong>not</strong> cover writing EGR/DPF/AdBlue/lambda delete logic into ECU software or suppressing the resulting DTCs. That is defeat-device work — an offence under US Clean Air Act §203(a)(3), EU Regulation 715/2007 Art. 5(2), UK Construction &amp; Use and MOT rules, and caught by NEMA and equivalent inspection regimes. A training centre that certified it would carry the liability for every vehicle its graduates modified. See §2.9 for the commercial case, which is the argument that actually persuades workshop owners.</p>\n<hr />\n<h2>2. Comprehensive theory &amp; lecture notes</h2>\n<h3>2.1 What comes out of an engine, and why</h3>\n<table>\n<thead>\n<tr>\n<th>Emission</th>\n<th>Formed by</th>\n<th>Controlled by</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>CO</td>\n<td>Incomplete combustion, rich mixture</td>\n<td>Fuelling control, oxidation catalyst</td>\n</tr>\n<tr>\n<td>HC</td>\n<td>Unburnt fuel</td>\n<td>Fuelling, oxidation catalyst</td>\n</tr>\n<tr>\n<td>NOx</td>\n<td>High combustion temperature and available oxygen</td>\n<td>EGR (prevention), SCR / LNT (after-treatment)</td>\n</tr>\n<tr>\n<td>PM / soot</td>\n<td>Locally rich zones in diffusion combustion</td>\n<td>Injection strategy, DPF</td>\n</tr>\n<tr>\n<td>CO₂</td>\n<td>Complete combustion — unavoidable</td>\n<td>Efficiency only</td>\n</tr>\n</tbody>\n</table>\n<p><strong>The central tension:</strong> NOx and PM trade off. Lowering combustion temperature (more EGR) cuts NOx but raises soot. Raising temperature cuts soot but raises NOx. Every diesel calibration lives on this curve, which is why EGR and DPF exist together and why removing one destabilises the other.</p>\n<h3>2.2 Diesel after-treatment chain</h3>\n<p>Typical modern layout, in order:</p>\n<pre><code>Engine ─► DOC ─► DPF ─► SCR mixer + DEF injector ─► SCR catalyst ─► ASC ─► Tailpipe\n          │       │           │                        │            │\n      oxidises  traps    injects urea             converts NOx   cleans up\n      CO/HC,    soot     (AdBlue/DEF)             to N2 + H2O    excess NH3\n      raises    and ash\n      NO→NO2\n</code></pre>\n<p>Some layouts combine DPF and SCR coating (SDPF/SCRF). Some older vehicles use a <strong>Lean NOx Trap (LNT)</strong> instead of SCR, which stores NOx and periodically purges it with a rich event.</p>\n<p><strong>DOC — Diesel Oxidation Catalyst.</strong> Oxidises CO and HC, and converts NO to NO₂, which is what enables <strong>passive regeneration</strong> of the DPF at moderate temperatures. A failed DOC means passive regeneration stops working and the DPF loads faster — a very commonly missed root cause.</p>\n<p><strong>DPF — Diesel Particulate Filter.</strong> A wall-flow monolith, usually cordierite or silicon carbide, with alternate channels plugged so exhaust must pass through the porous walls. Traps 85–99% of particulates.</p>\n<p>Two kinds of loading, and students must never confuse them:</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Soot</th>\n<th>Ash</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Source</td>\n<td>Incomplete combustion</td>\n<td>Oil additives (calcium, zinc), engine wear, fuel additives</td>\n</tr>\n<tr>\n<td>Removable by regeneration</td>\n<td><strong>Yes</strong> — burns to CO₂</td>\n<td><strong>No</strong> — it is incombustible mineral residue</td>\n</tr>\n<tr>\n<td>Accumulates</td>\n<td>Cyclically</td>\n<td>Permanently, over the filter's life</td>\n</tr>\n<tr>\n<td>Remedy</td>\n<td>Regeneration</td>\n<td>Filter cleaning or replacement</td>\n</tr>\n</tbody>\n</table>\n<p><strong>A filter at high ash loading cannot be fixed by regeneration.</strong> Forcing repeated regenerations on an ash-loaded filter overheats and cracks it. Read the ECU's ash loading value, not just soot, before deciding.</p>\n<h3>2.3 Regeneration strategies</h3>\n<table>\n<thead>\n<tr>\n<th>Type</th>\n<th>Trigger</th>\n<th>Temperature</th>\n<th>Mechanism</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Passive</strong></td>\n<td>Normal driving at sustained load</td>\n<td>250–500 °C</td>\n<td>NO₂ from the DOC oxidises soot continuously; driver never notices</td>\n</tr>\n<tr>\n<td><strong>Active</strong></td>\n<td>ECU-initiated at a soot threshold</td>\n<td>550–650 °C</td>\n<td>Post-injection raises exhaust temperature to burn soot</td>\n</tr>\n<tr>\n<td><strong>Forced/service</strong></td>\n<td>Technician-initiated with a tool</td>\n<td>550–650 °C</td>\n<td>Same as active, commanded manually</td>\n</tr>\n<tr>\n<td><strong>Manual/parked</strong></td>\n<td>Some commercial vehicles have a dash switch</td>\n<td>550–650 °C</td>\n<td>Driver-initiated while stationary</td>\n</tr>\n</tbody>\n</table>\n<p><strong>How an active regeneration is achieved:</strong> the ECU uses late post-injection, throttling on the intake, EGR closure, and turbo vane position to raise exhaust temperature. Some vehicles use a <strong>fuel dosing injector</strong> in the exhaust upstream of the DOC (common on PSA, Ford and some commercial applications) — a separate component with its own faults.</p>\n<p><strong>Consequence of interrupted regenerations:</strong> post-injection fuel that does not fully burn washes past the rings into the sump. <strong>Oil level rising</strong> on a diesel with a DPF is a classic and dangerous sign — fuel dilution reduces viscosity, and in the worst case a diesel can run away on its own diluted sump oil. Always check oil level and condition on a vehicle with regeneration complaints, and tell the customer why.</p>\n<p><strong>When NOT to force a regeneration:</strong>\n- Soot loading is extremely high (typically above the manufacturer's stated limit — often around 100% or a stated gram figure). The burn becomes uncontrolled and cracks or melts the substrate.\n- Ash loading is at or near the filter's life limit.\n- Oil level is above maximum or oil is fuel-diluted.\n- There is an unresolved fault causing the loading — the regeneration will succeed and the vehicle will return in a week.\n- Coolant, oil or fuel is entering the exhaust (failed turbo seal, injector, head gasket) — you will burn the evidence and possibly the filter.\n- Any active engine fault code that could compromise combustion during a high-temperature event.</p>\n<h3>2.4 Differential pressure and how the ECU estimates loading</h3>\n<p>The ECU determines soot loading two ways and cross-checks them:</p>\n<ol>\n<li><strong>Differential pressure model.</strong> A sensor measures pressure drop across the filter. Loading correlates with restriction, corrected for exhaust volume flow and temperature.</li>\n<li><strong>Soot accumulation model.</strong> A calculation based on engine operating history — fuelling, load, rpm, temperature — estimating how much soot should have been produced.</li>\n</ol>\n<p>When the two disagree, a plausibility code sets. <strong>This is diagnostically valuable:</strong> a differential pressure reading that says \"clean\" while the model says \"loaded\" points at the sensor or its lines, not at the filter.</p>\n<p><strong>Differential pressure sensor testing:</strong>\n- With the engine off, both lines disconnected and open to atmosphere, the sensor must read approximately <strong>0 kPa / 0 mbar</strong>. An offset here invalidates every subsequent reading.\n- At idle, expect a small value — typically <strong>5–15 mbar</strong> on a healthy system.\n- At 3,000 rpm free revving, expect a significant rise. A loaded filter shows markedly higher; the manufacturer's figure governs.\n- <strong>The lines fail more often than the sensor.</strong> They are small-bore steel or rubber, run hot, and block with soot or split. Remove and check both are clear by blowing through them. A blocked line makes a clean filter read blocked, or vice versa.\n- Apply a hand vacuum/pressure pump to the sensor ports and confirm the reported value tracks the applied pressure. This is the definitive test.</p>\n<h3>2.5 EGR — Exhaust Gas Recirculation</h3>\n<p>Recirculates inert exhaust gas into the intake, lowering peak combustion temperature and cutting NOx formation at source.</p>\n<p>Types:\n- <strong>High-pressure EGR</strong> — taken before the turbine, fed after the compressor. Fast-acting, dirtier.\n- <strong>Low-pressure EGR</strong> — taken after the DPF, fed before the compressor. Cleaner gas, slower response, common on modern Euro 6.\n- <strong>Cooled EGR</strong> — with a heat exchanger, standard on modern engines.</p>\n<p>Failure modes:\n| Failure | Symptom | Test |\n|---|---|---|\n| Valve carbon-seized | Flow fault code, poor running, smoke | Actuate with tool while watching position feedback; remove and inspect |\n| Position sensor fault | Implausible position code | Scope the feedback signal through a commanded sweep |\n| Cooler internally leaking (coolant) | Coolant loss with no external leak, white smoke, pressurised expansion tank | Pressure-test the cooler off the vehicle |\n| Cooler blocked | Insufficient flow code, high NOx | Flow test; visual on removal |\n| Stuck open | Rough idle, poor low-speed running, black smoke | Position feedback vs command at idle |\n| Stuck closed | High NOx, DPF loading faster than expected | Position feedback vs command; MAF/MAP cross-check |</p>\n<p><strong>Diagnostic technique:</strong> at steady idle, command the valve through its range with the tool while watching <strong>MAF</strong>. Opening the EGR valve displaces fresh air, so MAF should fall measurably. No change in MAF means no flow, regardless of what the position sensor claims.</p>\n<h3>2.6 SCR / AdBlue / DEF</h3>\n<p><strong>DEF (Diesel Exhaust Fluid, AdBlue)</strong> is 32.5% urea in demineralised water. In the hot exhaust it decomposes to ammonia, which reduces NOx over the SCR catalyst to nitrogen and water.</p>\n<p><strong>System components:</strong> DEF tank with level, temperature and <strong>quality sensor</strong>; heated lines and tank heater (DEF freezes at <strong>−11 °C</strong>); pump module; dosing injector; mixer; SCR catalyst; upstream and downstream <strong>NOx sensors</strong>; ammonia slip catalyst.</p>\n<p><strong>Critical properties students must know:</strong>\n- DEF has a <strong>shelf life</strong> of roughly 12–18 months and degrades faster in heat. Old DEF fails the quality sensor.\n- DEF <strong>crystallises</strong> into a hard white deposit when it dries — around the injector, in the mixer and on the dosing nozzle. This is the single most common physical fault. It is removable with warm water; solvents are not required and can damage components.\n- DEF is <strong>corrosive to some metals</strong> and must never be contaminated with fuel, oil or tap water. A tank contaminated with diesel requires complete system flushing and often component replacement.\n- Legislation requires an <strong>escalating inducement strategy</strong>: warnings, then torque reduction, then a speed limit (commonly 20 km/h), then a no-restart condition. This is deliberate, is required by regulation, and cannot be resolved by clearing codes.</p>\n<p><strong>Common faults:</strong>\n| Fault | Cause |\n|---|---|\n| Dosing injector blocked | Crystallisation |\n| Quality sensor fault | Degraded, diluted or contaminated DEF |\n| Pump pressure low | Filter blocked, pump wear, line restriction |\n| Line frozen / heater fault | Heater circuit, relay or coolant valve fault in cold conditions |\n| NOx sensor fault | Sensor failure (they are consumables), or a genuine conversion failure |\n| Conversion efficiency below threshold | Aged catalyst, insufficient dosing, upstream engine fault, or a <strong>NOx sensor reading wrongly</strong> |</p>\n<p><strong>Key teaching point:</strong> a conversion-efficiency code compares two NOx sensors. Either sensor reading wrongly produces the code with a perfectly good catalyst. Verify both sensors before condemning an SCR catalyst — the same logic as P0420 and the catalytic converter in Module 4.</p>\n<h3>2.7 GPF / OPF — petrol particulate filters</h3>\n<p>Direct-injection petrol engines produce measurable particulates, so Euro 6d and equivalent standards brought filters to petrol vehicles.</p>\n<p>Differences from a DPF:\n- Petrol exhaust runs much hotter, so <strong>regeneration is largely passive</strong> and happens during normal driving, particularly on overrun where oxygen is available.\n- Loading problems appear on vehicles that only do short, cold, low-load journeys.\n- Oil consumption is a significant ash source, so an engine consuming oil loads its GPF permanently.\n- Diagnosis follows the same differential-pressure logic as a DPF.</p>\n<h3>2.8 Root cause analysis — the actual skill</h3>\n<p>A DPF does not load without a reason. Before any regeneration, establish which of these applies:</p>\n<table>\n<thead>\n<tr>\n<th>Root cause</th>\n<th>Evidence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Duty cycle</strong> — short, cold, urban journeys</td>\n<td>Regeneration history: many aborted or interrupted regenerations; low average speed in the ECU's data</td>\n</tr>\n<tr>\n<td><strong>Leaking or worn injector</strong></td>\n<td>Fuel trims/correction values, injector back-leak test, black smoke, fuel in oil</td>\n</tr>\n<tr>\n<td><strong>Turbo seal failure</strong></td>\n<td>Oil consumption, blue smoke, oil in intercooler and intake pipework</td>\n</tr>\n<tr>\n<td><strong>EGR stuck open</strong></td>\n<td>Position feedback vs command, MAF response test</td>\n</tr>\n<tr>\n<td><strong>Failed DOC</strong></td>\n<td>Regeneration cannot reach temperature; EGT sensors show insufficient rise</td>\n</tr>\n<tr>\n<td><strong>Failed glow system</strong></td>\n<td>Extended cold-start smoke, especially in cold climates</td>\n</tr>\n<tr>\n<td><strong>Boost leak / low boost</strong></td>\n<td>Poor combustion, smoke, boost actual vs target</td>\n</tr>\n<tr>\n<td><strong>Air filter blocked / MAF fault</strong></td>\n<td>Airflow low against calculated expectation</td>\n</tr>\n<tr>\n<td><strong>Wrong oil specification</strong></td>\n<td>Non low-SAPS oil in a DPF vehicle produces ash rapidly — check the service record</td>\n</tr>\n<tr>\n<td><strong>Aborted regenerations</strong></td>\n<td>Driver switching off mid-regen; check regeneration counters and distance-since-last</td>\n</tr>\n</tbody>\n</table>\n<p><strong>The three data points to read first on any DPF vehicle:</strong>\n1. <strong>Soot loading and ash loading</strong> (separately).\n2. <strong>Distance since last successful regeneration</strong>, and the count of aborted regenerations.\n3. <strong>Differential pressure at idle and at raised rpm</strong>, plus the sensor's zero offset.</p>\n<p>These three tell you whether you are dealing with a driving pattern, a sensor, a mechanical fault or an end-of-life filter — before anything is removed.</p>\n<h3>2.9 The commercial case against delete work</h3>\n<p>Workshop owners are persuaded by numbers, not by lectures. The honest comparison:</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Delete</th>\n<th>Diagnose and repair</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Revenue per job</td>\n<td>One payment</td>\n<td>Diagnostic + repair + follow-up</td>\n</tr>\n<tr>\n<td>Repeat business</td>\n<td>None — the customer has no further need</td>\n<td>Servicing, cleaning, fleet contract</td>\n</tr>\n<tr>\n<td>Liability</td>\n<td>Workshop named on unlawful modification</td>\n<td>None</td>\n</tr>\n<tr>\n<td>Fleet and contract work</td>\n<td>Excluded — operators cannot use you</td>\n<td>Available</td>\n</tr>\n<tr>\n<td>Payment processing</td>\n<td>At risk if the provider notices</td>\n<td>Unaffected</td>\n</tr>\n<tr>\n<td>Vehicle outcome</td>\n<td>Fails its next inspection</td>\n<td>Passes</td>\n</tr>\n<tr>\n<td>Skill built</td>\n<td>None transferable</td>\n<td>Diagnostic reputation</td>\n</tr>\n</tbody>\n</table>\n<p>Add to this the practical point: <strong>the underlying fault is still there.</strong> A turbo leaking oil into the exhaust does not stop leaking because the filter was removed; it carries on until it fails completely. The delete converted a repairable fault into a bigger one and removed the warning.</p>\n<p>The workshop's line to a customer asking for a delete: <em>\"I can't do that — it's illegal and it'll fail your next inspection. What I can do is find out why it's loading, because something is causing it, and that's usually fixable for less than you think.\"</em> Deliver that with the diagnostic data on screen and the majority of customers proceed.</p>\n<hr />\n<h2>3. Tools &amp; equipment needed</h2>\n<ul>\n<li>OEM-level or enhanced scan tool with <strong>forced regeneration</strong> capability and access to soot/ash loading, regeneration counters and dosing system tests</li>\n<li>Hand vacuum/pressure pump for differential pressure sensor testing</li>\n<li>Infrared thermometer and thermocouple set for EGT verification across the after-treatment</li>\n<li>Exhaust back-pressure gauge with an adapter for the pre-DPF port or an O2 sensor bung</li>\n<li><strong>Extraction, or an outdoor regeneration bay</strong> — surface temperatures exceed 600 °C</li>\n<li>Fire extinguisher rated for the bay, and a clear floor</li>\n<li>Smoke machine for intake and EGR leak testing</li>\n<li>Injector back-leak test kit</li>\n<li>DEF refractometer or quality tester</li>\n<li>Filter cleaning equipment, or a relationship with a professional cleaning service</li>\n<li>Borescope for filter inspection</li>\n<li>PPE: heat-resistant gloves, eye protection, respirator for handling soot and ash — <strong>DPF ash is a respiratory hazard and must be handled wet or with extraction</strong></li>\n</ul>\n<hr />\n<h2>4. Step-by-step practical lab exercise</h2>\n<h3>Lab 8.1 — Full DPF diagnosis and forced regeneration</h3>\n<p><strong>Scenario:</strong> DPF warning illuminated, vehicle in reduced power. Customer wants it \"sorted today\".</p>\n<ol>\n<li><strong>Read and record before anything else:</strong> soot loading, ash loading, distance since last successful regeneration, count of aborted regenerations, differential pressure at idle, and all DTCs across all systems.</li>\n<li><strong>Check oil level and condition.</strong> Above maximum, or smelling of fuel, means diluted oil from interrupted regenerations. <strong>If the oil is over-full with fuel dilution, change the oil before any regeneration</strong> and explain to the customer why — a runaway on diluted sump oil destroys the engine.</li>\n<li><strong>Assess whether regeneration is safe.</strong> Against the manufacturer's stated limits: is soot loading below the maximum permitted for a service regeneration? Is ash loading within life? Any active fault that would compromise combustion? If any answer fails, <strong>do not regenerate</strong> — proceed to root cause and repair, or to filter removal and cleaning.</li>\n<li><strong>Test the differential pressure sensor before trusting its data.</strong> Engine off, lines disconnected, confirm the zero reading. Then apply pressure with the hand pump and confirm the reported value tracks. Check both lines are clear.</li>\n<li><strong>Verify the EGT sensors</strong> by comparing their readings at a cold start — all should read close to ambient. Any sensor significantly offset invalidates the regeneration temperature control.</li>\n<li><strong>Hunt the root cause before regenerating.</strong> Working through §2.8: injector back-leak, turbo shaft play and oil in the intake, EGR position vs command with the MAF response test, boost actual vs target, glow system operation, air filter condition, and the service record for correct oil specification.</li>\n<li><strong>Repair whatever is found.</strong> This step is the job. The regeneration is the finishing touch.</li>\n<li><strong>Prepare for regeneration:</strong> outdoors or on extraction, clear floor, nothing combustible within range, fuel level above the manufacturer's minimum (usually a quarter tank), coolant level correct, extinguisher present.</li>\n<li><strong>Run the forced regeneration</strong> following the tool's procedure. Monitor throughout: EGT before and after the DPF, engine speed, soot loading, and coolant temperature. <strong>Do not leave the vehicle.</strong></li>\n<li><strong>Abort immediately</strong> if EGT exceeds the manufacturer's limit, if coolant temperature rises abnormally, or if any new fault appears.</li>\n<li><strong>On completion</strong>, confirm soot loading has fallen to near zero and the regeneration counter has incremented as a success.</li>\n<li><strong>Road test</strong> to confirm the vehicle completes a passive or active regeneration in normal use, then rescan.</li>\n<li><strong>Advise the customer honestly:</strong> what caused the loading, what was repaired, and — where the cause is duty cycle — what driving pattern the vehicle needs. A vehicle doing 5 km school runs will load again regardless of what the workshop does, and the customer needs to hear that as a vehicle-choice conversation, not as a repair.</li>\n</ol>\n<h3>Lab 8.2 — SCR/AdBlue system diagnosis</h3>\n<ol>\n<li><strong>Record all DTCs</strong> in the engine and after-treatment systems, plus the inducement status and remaining distance/time before the next escalation step.</li>\n<li><strong>Inspect the DEF physically.</strong> Level, colour, clarity, and smell. Test with a refractometer — it must be <strong>32.5% urea</strong>. Check the fill date if known; DEF older than about 18 months is suspect.</li>\n<li><strong>Inspect the tank for contamination.</strong> Any sign of diesel, oil or debris means the system requires full flushing, and the customer must be told before further work.</li>\n<li><strong>Test the dosing injector.</strong> Command a dosing test with the tool and observe: does the pump build pressure, does the injector deliver, does pressure hold? Remove the injector and inspect for <strong>crystallisation</strong> — the most common single fault. Clean with warm water only.</li>\n<li><strong>Check the pump module</strong> — pressure build, pressure hold, filter condition, and the reversion/purge cycle at shutdown that prevents freezing damage.</li>\n<li><strong>Check the heating circuits.</strong> Tank heater, line heaters, coolant valve. In cold climates this is a leading cause of winter-only faults.</li>\n<li><strong>Test both NOx sensors.</strong> Compare their readings at cold start — both should read close to zero, and close to each other. Then compare their behaviour under load. A sensor that is offset or slow explains a conversion-efficiency code with a healthy catalyst.</li>\n<li><strong>Check the mixer for crystalline deposits</strong> — a partially blocked mixer prevents proper distribution and causes low conversion with everything else testing correct.</li>\n<li><strong>Only after all of the above</strong> consider the SCR catalyst itself. It is the most expensive component and the least frequent fault.</li>\n<li><strong>After repair</strong>, reset the inducement through the correct procedure, verify dosing occurs, and road test until conversion efficiency is confirmed.</li>\n</ol>\n<h3>Lab 8.3 — EGR flow verification</h3>\n<ol>\n<li>At warm idle, log MAF, EGR position command and EGR position feedback.</li>\n<li>Command the EGR valve closed. Record MAF.</li>\n<li>Command it progressively open in steps. <strong>MAF should fall measurably at each step</strong> as recirculated gas displaces fresh air.</li>\n<li>No MAF change with commanded movement = <strong>no flow</strong>, regardless of what the position feedback reports. The valve, cooler or passages are blocked.</li>\n<li>Feedback not tracking command = valve seized or position sensor faulty. Scope the feedback signal directly to separate the two.</li>\n<li>Remove and inspect. Photograph the carbon condition for the customer's record.</li>\n<li>If the cooler is suspect, pressure-test it off the vehicle for internal coolant leakage — a common cause of unexplained coolant loss and white smoke.</li>\n<li>Refit, repeat the MAF response test, and confirm normal behaviour.</li>\n</ol>\n<hr />\n<h2>5. Common failure modes &amp; troubleshooting trees</h2>\n<h3>Tree A — DPF loading repeatedly</h3>\n<pre><code>Repeat DPF loading\n├─ Read ash loading FIRST\n│   ├─ At or near life limit → filter needs cleaning or replacement.\n│   │   Regeneration cannot remove ash. Stop regenerating.\n│   └─ Within life → continue\n├─ Regeneration history: many aborted regenerations?\n│   ├─ YES → why? Driver switching off mid-cycle, short journeys,\n│   │        or a fault aborting the cycle. Check the abort reason.\n│   └─ NO → continue\n├─ Is excess soot actually being produced?\n│   ├─ Injector back-leak / leaking injector → test and quantify\n│   ├─ Turbo seal leaking oil → check intake and intercooler for oil\n│   ├─ EGR stuck open → MAF response test\n│   ├─ Boost low / boost leak → actual vs target, smoke test\n│   ├─ Glow system faulty → cold start smoke, glow circuit test\n│   └─ Wrong oil specification → check service record for low-SAPS\n├─ Is regeneration failing to reach temperature?\n│   ├─ Failed DOC → EGT rise across the DOC insufficient\n│   ├─ Fuel dosing injector blocked (where fitted)\n│   └─ EGT sensor offset → compare all at cold start\n└─ None of the above → duty cycle. This is a vehicle-choice\n   conversation with the customer, not a repair.\n</code></pre>\n<h3>Tree B — Differential pressure implausible</h3>\n<pre><code>DP plausibility code\n├─ Zero-offset check: engine off, lines off, reads ~0?\n│   ├─ NO → sensor faulty\n│   └─ YES → continue\n├─ Are both lines clear and intact? (Blow through each.)\n│   → blocked or split lines are more common than sensor failure\n├─ Apply known pressure with a hand pump — does the reported\n│   value track correctly?\n│   ├─ NO → sensor faulty\n│   └─ YES → sensor and lines good; the reading is real\n└─ Reading real but disagrees with the soot model\n    → the model's inputs are wrong (fuelling, EGT, airflow),\n      or there is a physical restriction downstream of the DPF\n</code></pre>\n<h3>Tree C — AdBlue inducement active</h3>\n<pre><code>SCR inducement\n├─ Record the inducement stage and remaining allowance BEFORE\n│   attempting anything — the escalation continues while you work\n├─ DEF quality: refractometer test, contamination check\n│   ├─ Fail → drain, flush, refill with fresh certified DEF\n│   └─ Pass → continue\n├─ Dosing test: pump pressure builds and holds? Injector delivers?\n│   ├─ Fail → crystallisation (clean with w
